<script>
  function stripMetaLine(str) {
  if (!str) return '';
  // Remove meta info lines like "Q4: Level 1, 1 Mark [Descriptive]"
  return str.replace(/^Q\d+:\s*[^A-Za-z0-9]*[\[\]A-Za-z0-9, ]*\s*/i, '').trim();
}
  function stripMetaTags(str) {
  if (!str) return '';
  // Remove tags anywhere in the text, not only at the beginning
  return str.replace(/\s*\[(?:Descriptive|MCQ|Multiple|Single)\]\s*/gi, '').trim();
}
  function getExamPaper() {
    try {
      return JSON.parse(sessionStorage.getItem("examPaper") || "null");
    } catch {
      return null;
    }
  }
   function setExamPaper(paper) {
    sessionStorage.setItem("examPaper", JSON.stringify(paper));
  }

function __erIsParagraphBasedQuestion(q = {}) {
  const type = String(q.mcqType || q.type || '').trim().toLowerCase();

  return (
    type === 'paragraph-based mcq (single correct)' ||
    type === 'comprehensive' ||
    (Array.isArray(q.mcqs) && q.mcqs.length > 0 && String(q.passage || '').trim())
  );
}

function __erGetParagraphMcqs(q = {}) {
  return Array.isArray(q.mcqs) ? q.mcqs : [];
}

function __erGetParagraphSubQuestionText(mcq = {}) {
  return String(
    mcq.question ||
    mcq.text ||
    String(mcq.body || '').split('\n')[0] ||
    ''
  ).trim();
}

function __erCleanParagraphOption(option) {
  return String(option || '')
    .replace(/^[A-D][).:\-]\s*/i, '')
    .trim();
}

function __erCleanParagraphAnswer(answer) {
  return String(answer || '')
    .replace(/^\s*(?:Ans|Answer)\s*:\s*/i, '')
    .trim();
}

function __erGetEditableValue(el) {
  if (!el) return '';

  if (el.getAttribute('contenteditable') === 'false') {
    return String(el.dataset.raw || el.innerHTML || '').trim();
  }

  return String(el.innerHTML || el.innerText || '').trim();
}

function __erNormalizeMcqAnswer(answer) {
  let raw = String(answer || '').trim().toUpperCase();

  const named = raw.match(/\b(?:ANS?|ANSWER)\s*[:\-]?\s*(.+)$/);
  if (named) raw = named[1].trim();

  const seen = new Set();
  const letters = [];

  (raw.match(/[A-D]/g) || []).forEach(letter => {
    if (!seen.has(letter)) {
      seen.add(letter);
      letters.push(letter);
    }
  });

  return letters.join(',');
}

function __erBuildParagraphPlainText(q = {}) {
  const blocks = [
    'Read the following passage and answer the questions:',
    'Passage:',
    String(q.passage || '').trim()
  ];

  __erGetParagraphMcqs(q).forEach((mcq, index) => {
    const question = __erGetParagraphSubQuestionText(mcq);
    const options = Array.isArray(mcq.options) ? mcq.options.slice(0, 4) : [];

    blocks.push('');
    blocks.push(`(${index + 1}) ${question}`);

    options.forEach((option, optionIndex) => {
      blocks.push(`${String.fromCharCode(65 + optionIndex)}) ${__erCleanParagraphOption(option)}`);
    });
  });

  return blocks.join('\n').trim();
}

function __erBuildParagraphReviewHtml(q = {}) {
  const passage = String(q.passage || '').trim();
  const mcqs = __erGetParagraphMcqs(q);

  const subQuestionsHtml = mcqs.map((mcq, subIndex) => {
    const question = __erGetParagraphSubQuestionText(mcq);
    const options = Array.isArray(mcq.options) ? mcq.options.slice(0, 4) : [];
    const answer = __erCleanParagraphAnswer(mcq.answer || mcq.parsedAnswer || mcq.finalAnswer || '');
    const explanation = String(mcq.explanation || '').trim();

    return `
      <div class="paragraph-subquestion" data-subquestion="${subIndex}" style="
        margin-top:14px;
        border-top:1px solid #d9e8f7;
        padding-top:12px;
      ">
        <div style="
          display:grid;
          grid-template-columns:2.2em 1fr;
          column-gap:8px;
          align-items:start;
          margin-bottom:7px;
        ">
          <span style="font-weight:700;color:#185496;">(${subIndex + 1})</span>
          <span class="paragraph-sub-text no-mjx" contenteditable="true" style="
            border:1px dashed #bcd6ef;
            border-radius:6px;
            padding:3px 8px;
            white-space:pre-wrap;
          ">${question}</span>
        </div>

        <div class="paragraph-mcq-block" style="
          display:flex;
          flex-direction:column;
          gap:6px;
          margin-left:2.2em;
        ">
          ${['A', 'B', 'C', 'D'].map((letter, optionIndex) => `
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="font-weight:700;color:#185496;min-width:18px;">${letter})</span>
              <span class="paragraph-mcq-opt no-mjx" contenteditable="plaintext-only" tabindex="0" style="
                flex:1 1 auto;
                border:1px dashed #bcd6ef;
                border-radius:6px;
                padding:3px 8px;
              ">${__erCleanParagraphOption(options[optionIndex] || '')}</span>
            </div>
          `).join('')}

          <div style="display:flex;align-items:center;gap:8px;margin-top:4px;">
            <span class="marks-label" style="min-width:62px;">Answer</span>
            <span class="paragraph-answer-box no-mjx" contenteditable="plaintext-only" tabindex="0" style="
              border:1px solid #bcd6ef;
              border-radius:6px;
              padding:3px 8px;
              min-width:80px;
            ">${answer}</span>
            <span class="marks-label" style="opacity:.8;">(use letters like A or A,C)</span>
          </div>

          <div style="display:flex;align-items:flex-start;gap:8px;margin-top:8px;">
            <span class="marks-label" style="min-width:62px;">Explanation</span>
            <div class="paragraph-explanation-box no-mjx" contenteditable="true" style="
              flex:1 1 auto;
              border:1px dashed #bcd6ef;
              border-radius:6px;
              padding:6px 8px;
              min-height:26px;
            ">${explanation}</div>
          </div>
        </div>
      </div>
    `;
  }).join('');

  return `
    <div class="paragraph-review-set">
      <div style="font-weight:700;color:#185496;margin-bottom:8px;">
        Read the following passage and answer the questions:
      </div>

      <div style="font-weight:700;color:#185496;margin-bottom:5px;">
        Passage:
      </div>

      <div class="paragraph-passage-text no-mjx" contenteditable="true" style="
        border:1px dashed #bcd6ef;
        border-radius:6px;
        padding:6px 8px;
        min-height:30px;
        white-space:pre-wrap;
      ">${passage}</div>

      ${subQuestionsHtml}
    </div>
  `;
}

function __erEscapeReviewHtml(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function __erIsMatchingMatrixQuestion(q = {}) {
  const type = String(q.mcqType || q.type || '').trim().toLowerCase();
  const rawText = String(q.text || q.body || q.question || '');

  return (
    (type.includes('matching') && type.includes('matrix')) ||
    (/Column\s*I/i.test(rawText) && /Column\s*II/i.test(rawText))
  );
}

function __erGetMatchingMatrixRawText(q = {}) {
  return stripMetaTags(stripMetaLine(q.text || q.body || q.question || ''))
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/div\s*>/gi, '\n')
    .replace(/<div[^>]*>/gi, '')
    .replace(/<[^>]+>/g, ' ')
    .replace(/\r/g, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function __erParseMatchingMatrix(q = {}) {
  const raw = __erGetMatchingMatrixRawText(q)
    .replace(/\n?\s*Options\s*:?\s*$/i, '')
    .trim();

  const lines = raw
    .split(/\n+/)
    .map(line => line.trim())
    .filter(Boolean);

  const headingIndex = lines.findIndex(line =>
    /Column\s*I/i.test(line) && /Column\s*II/i.test(line)
  );

  const rowPattern = /^\s*([A-D])[\)\.]\s*(.*?)\s+([P-S])[\)\.]\s*(.*?)\s*$/i;

  const possibleRows = headingIndex >= 0
    ? lines.slice(headingIndex + 1)
    : lines;

  let rows = possibleRows
    .map(line => {
      const match = line.match(rowPattern);

      return match
        ? {
            leftLabel: match[1].toUpperCase(),
            leftText: match[2].trim(),
            rightLabel: match[3].toUpperCase(),
            rightText: match[4].trim()
          }
        : null;
    })
    .filter(Boolean);

  let introLines = headingIndex > 0
    ? lines.slice(0, headingIndex)
    : lines.filter(line => !rowPattern.test(line) && !(/Column\s*I/i.test(line) && /Column\s*II/i.test(line)));

  if (!rows.length) {
    const oneLine = raw
      .replace(/Column\s*I\s+Column\s*II/i, '')
      .trim();

    const rowMatches = Array.from(
      oneLine.matchAll(/([A-D])[\)\.]\s*(.*?)\s+([P-S])[\)\.]\s*(.*?)(?=\s+[A-D][\)\.]|$)/gi)
    );

    rows = rowMatches.map(match => ({
      leftLabel: match[1].toUpperCase(),
      leftText: match[2].trim(),
      rightLabel: match[3].toUpperCase(),
      rightText: match[4].trim()
    }));
  }

  return {
    raw,
    intro: introLines.join('\n').trim(),
    rows
  };
}

function __erBuildMatchingMatrixReviewHtml(q = {}) {
  const parsed = __erParseMatchingMatrix(q);

  if (!parsed.rows.length) {
    return `
      <span class="question-text" contenteditable="true">
        ${__erEscapeReviewHtml(parsed.raw)}
      </span>
    `;
  }

  return `
    <div class="matching-matrix-review">
      <div class="matching-intro-text no-mjx" contenteditable="true" style="
        border:1px dashed #bcd6ef;
        border-radius:6px;
        padding:5px 8px;
        margin-bottom:10px;
        white-space:pre-wrap;
        color:#12416c;
        font-weight:600;
      ">${__erEscapeReviewHtml(parsed.intro)}</div>

      <table style="
        width:100%;
        border-collapse:collapse;
        table-layout:fixed;
        margin:4px 0 12px 0;
        color:#12416c;
      ">
        <thead>
          <tr>
            <th style="
              width:50%;
              text-align:left;
              padding:6px 10px 7px 6px;
              border-bottom:1.5px solid #bcd6ef;
              color:#0f3d6b;
            ">Column I</th>

            <th style="
              width:50%;
              text-align:left;
              padding:6px 6px 7px 10px;
              border-bottom:1.5px solid #bcd6ef;
              color:#0f3d6b;
            ">Column II</th>
          </tr>
        </thead>

        <tbody>
          ${parsed.rows.map((row, index) => `
            <tr class="matching-matrix-row" data-row="${index}">
              <td style="vertical-align:top;padding:7px 10px 7px 6px;">
                <div style="display:flex;align-items:flex-start;gap:6px;">
                  <span style="font-weight:700;color:#185496;min-width:20px;">
                    ${row.leftLabel})
                  </span>
                  <span class="matching-col-i no-mjx" contenteditable="true" style="
                    flex:1;
                    border:1px dashed #bcd6ef;
                    border-radius:6px;
                    padding:3px 6px;
                    min-height:22px;
                  ">${__erEscapeReviewHtml(row.leftText)}</span>
                </div>
              </td>

              <td style="vertical-align:top;padding:7px 6px 7px 10px;">
                <div style="display:flex;align-items:flex-start;gap:6px;">
                  <span style="font-weight:700;color:#185496;min-width:20px;">
                    ${row.rightLabel})
                  </span>
                  <span class="matching-col-ii no-mjx" contenteditable="true" style="
                    flex:1;
                    border:1px dashed #bcd6ef;
                    border-radius:6px;
                    padding:3px 6px;
                    min-height:22px;
                  ">${__erEscapeReviewHtml(row.rightText)}</span>
                </div>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function __erReadMatchingValue(el) {
  if (!el) return '';

  return String(
    el.dataset?.raw ||
    el.innerHTML ||
    el.innerText ||
    ''
  ).trim();
}

function __erBuildMatchingMatrixTextFromEditor(questionRow) {
  const intro = __erReadMatchingValue(
    questionRow.querySelector('.matching-intro-text')
  );

  const rows = Array.from(
    questionRow.querySelectorAll('.matching-matrix-row')
  ).map((row, index) => {
    const leftLabel = String.fromCharCode(65 + index);
    const rightLabel = String.fromCharCode(80 + index);

    const leftText = __erReadMatchingValue(
      row.querySelector('.matching-col-i')
    );

    const rightText = __erReadMatchingValue(
      row.querySelector('.matching-col-ii')
    );

    return `${leftLabel}) ${leftText}    ${rightLabel}) ${rightText}`;
  });

  return [
    intro,
    'Column I    Column II',
    ...rows
  ].filter(Boolean).join('\n').trim();
}

// --------- Robust parser for AI output ---------
function parseAIBlocks(text, expectedCount) {
  if (!text) return [];
  // normalize
  let t = String(text)
  .replace(/\r/g,'')
  .replace(/&nbsp;/gi,' ')
  .replace(/<br\s*\/?>/gi,'\n')
  .replace(/<\/p>/gi,'\n')
  .replace(/<p[^>]*>/gi,'')          // strip opening <p> so A/B are detected
  .replace(/<div[^>]*>/gi,'\n')
  .replace(/<\/div>/gi,'')
  .replace(/<li[^>]*>/gi,'\n')
  .replace(/<\/li>/gi,'')
  .replace(/<ol[^>]*>|<ul[^>]*>|<\/ol>|<\/ul>/gi,'')
  .trim();
  // strip code fences if present
  t = t.replace(/```(?:\w+)?\n([\s\S]*?)```/g, '$1');

  // 1) Primary: "Q<number> ... :"  (allow ANY chars, including nested parens, until the colon)
  //    No newline before the colon to avoid over-greedy spans.
  let matches = [...t.matchAll(/Q\s*\d+[^\n:]*:/gi)];

  // 2) Fallback: plain numbered lists like "1. " or "2) "
  if (matches.length === 0) {
    matches = [...t.matchAll(/(^|\n)\s*\d+\s*[\.\)]\s+/g)];
  }

  if (matches.length === 0) return [];

  // Build block slices
  const starts = matches.map(m => m.index + (t[m.index] === '\n' ? 1 : 0)).sort((a,b)=>a-b);
  const blocks = [];
  for (let i = 0; i < starts.length; i++) {
    const start = starts[i];
    const end = i + 1 < starts.length ? starts[i + 1] : t.length;
    const chunk = t.slice(start, end).trim();
    if (chunk) blocks.push(chunk);
  }

  // Trim extras if AI returned more than asked
  if (blocks.length > expectedCount) return blocks.slice(0, expectedCount);
  return blocks;
}
  // --- NEW: parse pasted questions (order preserved) ---
function parsePastedQuestions(rawText) {
  if (!rawText) return [];
  const text = String(rawText).replace(/\r/g, '').trim();

  // Split into blocks by: blank lines OR numbered/Q-lines
  const blocks = text.split(/\n{2,}|\n(?=\d+\s*[\.\)]\s)|\n(?=Q\s*\d+[:\.])/i)
                     .map(b => b.trim())
                     .filter(Boolean);

  const items = [];
  for (const block of blocks) {
    // Extract MCQ options A/B/C/D and optional Ans:
    const lines = block.split('\n').map(s => s.trim()).filter(Boolean);

    // Detect options
    const opts = [];
    const optRegex = /^[A-D][\)\.\:]?\s+(.+)$/i;
    lines.forEach(l => {
      const m = l.match(optRegex);
      if (m) opts.push(m[1].trim());
    });

    // Extract answer letters if present anywhere
   let ans = '';
const am = block.match(/\b(?:ANS?|ANSWER)\s*[:\-]?\s*(.+)$/im);
if (am) {
  const seen = new Set();
  ans = (am[1].toUpperCase().match(/[A-D]/g) || [])
    .filter(L => !seen.has(L) && (seen.add(L), true))
    .join(',');
}

    // Stem: remove leading "Qx:" or "1)." etc and strip option/answer lines
    let stem = block
  .replace(/^Q\s*\d+\s*[:\.\)]\s*/i, '')
  .replace(/^\d+\s*[\.\)]\s*/, '')
  .replace(/\n?Ans?\s*:.+$/i, '')
  .replace(/\n?[A-D][\)\.\:]?\s+.+$/gmi, '')
  .replace(/\n\s*\(?OR\)?\s*\n/gi, '\n')
  .replace(/\(\s*OR\s*\)/gi, '')
  .trim();

    // Keep LaTeX intact in stem
    if (opts.length === 4) {
      items.push({ text: stem, options: opts, answer: ans });
    } else {
      items.push({ text: stem });
    }
  }
  return items;
}

function getUniqueAnswerLetters(answer) {
  const seen = new Set();
  return (String(answer || '').toUpperCase().match(/[A-D]/g) || [])
    .filter(ch => !seen.has(ch) && (seen.add(ch), true));
}

function shuffledIndexMap(size) {
  const arr = Array.from({ length: size }, (_, i) => i);
  if (size <= 1) return arr;

  let attempts = 0;
  do {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    attempts++;
  } while (attempts < 6 && arr.every((v, i) => v === i));

  return arr;
}

async function shuffleMcqOptionsInExamPaper() {
  const ok = await sciMentraConfirm('Do you want to Shuffle Options?');
  if (!ok) return;

  saveEdits(false);

  const paper = getExamPaper();
  if (!paper) {
    alert('No exam paper found!');
    return;
  }

   let changed = 0;

  function shuffleOneMcqTarget(target) {
    if (!target || !Array.isArray(target.options) || target.options.length !== 4) {
      return false;
    }

    const originalOptions = target.options.map(opt => String(opt ?? ''));
    const map = shuffledIndexMap(originalOptions.length);
    const shuffledOptions = map.map(oldIdx => originalOptions[oldIdx]);

    const correctOldIndexes = getUniqueAnswerLetters(target.answer || target.parsedAnswer)
      .map(letter => letter.charCodeAt(0) - 65)
      .filter(idx => idx >= 0 && idx < originalOptions.length);

    if (correctOldIndexes.length) {
      const newLetters = [];

      map.forEach((oldIdx, newIdx) => {
        if (correctOldIndexes.includes(oldIdx)) {
          newLetters.push(String.fromCharCode(65 + newIdx));
        }
      });

      target.answer = newLetters.join(',');
      target.parsedAnswer = target.answer;
    }

    target.options = shuffledOptions;
    target.body = [
      __erGetParagraphSubQuestionText(target),
      ...shuffledOptions.map((option, optionIndex) =>
        `${String.fromCharCode(65 + optionIndex)}) ${option}`
      )
    ].join('\n');

    changed++;
    return true;
  }

  (paper.subjects || []).forEach(subjectBlock => {
    (subjectBlock.sections || []).forEach(section => {
      (section.questions || []).forEach(q => {
        if (__erIsParagraphBasedQuestion(q)) {
          __erGetParagraphMcqs(q).forEach(mcq => {
            shuffleOneMcqTarget(mcq);
          });

          q.text = __erBuildParagraphPlainText(q);
          q.body = q.text;
          return;
        }

        shuffleOneMcqTarget(q);
      });
    });
  });
  setExamPaper(paper);
  renderExam();

  if (changed === 0) {
    alert('No 4-option MCQ questions found to shuffle.');
    return;
  }

  alert(`Shuffled options for ${changed} MCQ question${changed === 1 ? '' : 's'}.`);
}

function __bpCleanChapterName(chapter) {
  return String(chapter || '')
    .replace(/\s*\(\s*Subtopics?\s*:[\s\S]*?\)\s*$/i, '')
    .replace(/\s*(?:[-–—]\s*)?Subtopics?\s*:[\s\S]*$/i, '')
    .trim();
}

function __bpFormatDate(value) {
  const raw = String(value || '').trim();
  const match = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);

  if (match) {
    return `${match[3]}/${match[2]}/${match[1]}`;
  }

  return raw || '-';
}

function __bpSafeText(value) {
  return String(value == null ? '' : value).trim();
}

function __bpFileSafe(value) {
  return String(value || 'Question Paper')
    .replace(/[\\/:*?"<>|]+/g, '')
    .replace(/\s+/g, '_')
    .trim() || 'Question_Paper';
}

function __bpSectionLetter(label) {
  const raw = String(label || '').trim();
  const match = raw.match(/Section\s+([A-Z])/i);

  if (match) return match[1].toUpperCase();

  return raw || '-';
}

function __bpQuestionType(section) {
  const raw = String(section.mcqType || '').trim();
  const low = raw.toLowerCase();
  const marks = Number(section.marksPerQuestion || 0);

  if (low.includes('paragraph')) return 'Paragraph-Based MCQ';
  if (low.includes('assertion') && low.includes('reason')) return 'Assertion and Reason';
  if (low.includes('matching') && low.includes('matrix')) return 'Matching Matrix';
  if (low.includes('fill') && low.includes('blank')) return 'Fill in the Blanks';
  if (low.includes('multiple')) return 'MCQ (Multiple Correct)';
  if (low.includes('single')) return 'MCQ (Single Correct)';

  if (low.includes('descriptive') || !raw) {
    return marks >= 4
      ? 'Descriptive - Long Answer'
      : 'Descriptive - Short Answer';
  }

  return raw;
}

function __bpSectionAttemptCount(section) {
  if (section.type === 'internal') {
    return Number(section.numPairs || 0);
  }

  if (section.type === 'any') {
    return Number(section.attemptAny || section.numQuestions || 0);
  }

  return Number(section.numQuestions || 0);
}

function __bpSectionPattern(section) {
  const count = __bpSectionAttemptCount(section);
  const availableCount = Number(section.numQuestions || 0);
  const marks = Number(section.marksPerQuestion || 0);
  const type = String(section.mcqType || '').toLowerCase();

  if (type.includes('paragraph')) {
    return `${count} set x ${marks}`;
  }

  if (section.type === 'internal') {
    return `${count} x ${marks}`;
  }

  if (section.type === 'any' && availableCount > count) {
    return `${count} of ${availableCount} x ${marks}`;
  }

  return `${count} x ${marks}`;
}

function __bpSectionMarks(section) {
  return __bpSectionAttemptCount(section) * Number(section.marksPerQuestion || 0);
}

function __bpLevelKey(question) {
  const raw = String(
    question?._assignedLevel ||
    question?.difficulty ||
    question?.level ||
    ''
  ).replace(/\s+/g, '').toUpperCase();

  if (raw === 'L1' || raw === 'LEVEL1' || raw === '1') return 'L1';
  if (raw === 'L2' || raw === 'LEVEL2' || raw === '2') return 'L2';
  if (raw === 'L3' || raw === 'LEVEL3' || raw === '3') return 'L3';

  return '';
}

function __bpSectionLevelMarks(section) {
  const result = { L1: 0, L2: 0, L3: 0, known: false };
  const questions = Array.isArray(section.questions) ? section.questions : [];

  questions.forEach(question => {
    const key = __bpLevelKey(question);

    if (!key) return;

    result[key] += Number(question.marks || section.marksPerQuestion || 0);
    result.known = true;
  });

  return result;
}

function __bpGetChapters(paper) {
  const subjectBlocks = Array.isArray(paper.subjects) ? paper.subjects : [];
  const multipleSubjects = subjectBlocks.length > 1;
  const lines = [];
  let chapterNumber = 1;

  subjectBlocks.forEach(subjectBlock => {
    const chapters = Array.from(
      new Set(
        (Array.isArray(subjectBlock.chapters) ? subjectBlock.chapters : [])
          .map(__bpCleanChapterName)
          .filter(Boolean)
      )
    );

    if (!chapters.length) return;

    if (multipleSubjects) {
      lines.push({
        text: __bpSafeText(subjectBlock.subject),
        isSubject: true
      });
    }

    chapters.forEach(chapter => {
      lines.push({
        text: `${chapterNumber}. ${chapter}`,
        isSubject: false
      });
      chapterNumber++;
    });
  });

  return lines;
}

function __bpGetOverallLevelSummary(paper, totalMarks, actualLevels, hasActualLevels) {
  if (hasActualLevels) {
    return {
      L1: actualLevels.L1,
      L2: actualLevels.L2,
      L3: actualLevels.L3
    };
  }

  const distribution = paper.difficultyDistribution || {};
  const hasStoredDistribution = ['L1', 'L2', 'L3'].some(level =>
    Number.isFinite(Number(distribution[level]))
  );

  if (!hasStoredDistribution) {
    return null;
  }

  return {
    L1: totalMarks * (Number(distribution.L1 || 0) / 100),
    L2: totalMarks * (Number(distribution.L2 || 0) / 100),
    L3: totalMarks * (Number(distribution.L3 || 0) / 100)
  };
}

function __bpNumber(value) {
  const number = Number(value || 0);

  return Number.isInteger(number)
    ? String(number)
    : number.toFixed(1);
}

document.getElementById('randomize-numbers-btn').onclick = async function() {
  // --- stateful auto-batch controller: prepares batches or advances to next prompt ---
  const btn = document.getElementById('randomize-numbers-btn');

  // Helper: small guidance/status banner
  function ensureGuide() {
    let g = document.getElementById('rand-guide');
    if (!g) {
      g = document.createElement('div');
      g.id = 'rand-guide';
      g.style.cssText = 'margin-top:10px;padding:10px 12px;border:1px solid #bcd6ef;background:#f7fafd;border-radius:8px;color:#0f3d6b;font-size:.98em;';
      btn.parentElement.insertBefore(g, btn.nextSibling);
    }
    return g;
  }
  function setGuide(html) {
    const g = ensureGuide();
    g.innerHTML = html;
  }

  // If a session already exists, just re-copy/open the current batch prompt
  if (window.__randState && Array.isArray(window.__randState.batches)) {
    const st = window.__randState;
    const total = st.batches.length;
    const i = st.idx + 1;
    const promptText = buildRandomizePrompt(st.batches[st.idx]);
    try {
      await navigator.clipboard.writeText(promptText);
      setGuide(`<b>Batch ${i}/${total}</b> prompt copied again. Opened ChatGPT. Paste → run → copy JSON → click <i>Paste JSON from ChatGPT</i>.`);
      window.open('https://chat.openai.com/', '_blank', 'noopener');
    } catch (e) {
      alert('Copy failed. A window will open with the prompt for manual copy.');
      const w = window.open('', '_blank', 'noopener,width=900,height=650,scrollbars=yes');
      if (w) { w.document.write(`<pre style="white-space:pre-wrap;font-family:monospace;padding:16px;">${promptText.replace(/[<>&]/g, m => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[m]))}</pre>`); w.document.close(); }
    }
    btn.innerHTML = `<i class="fas fa-random"></i> Copy Batch ${i}/${total} Prompt (again)`;
    return;
  }

  // Fresh session
  saveEdits();
  const paper = getExamPaper();
  if (!paper) { alert('No exam paper found!'); return; }

  // Gather eligible questions (Math/Physics/Chemistry + contains a number)
  const all = [];
  paper.subjects.forEach((subjectBlock, subjIdx) => {
    (subjectBlock.sections || []).forEach((section, sIdx) => {
            (section.questions || []).forEach((q, qIdx) => {
               if (__erIsParagraphBasedQuestion(q) || __erIsMatchingMatrixQuestion(q)) return;

        const isProbSubject = ["math", "math 1", "math 2", "physics", "chemistry"].some(
          s => (subjectBlock.subject || '').toLowerCase().includes(s)
        );
        if (!isProbSubject) return;
        const text = (q.text || q.body || q.question || '');
        if (!/\d/.test(text)) return;
        all.push({ subjIdx, sIdx, qIdx, subject: subjectBlock.subject, sectionLabel: section.label, stem: text, options: Array.isArray(q.options) ? q.options : [] });
      });
    });
  });

  if (all.length === 0) {
    alert('No numerical problem-solving questions found in Math/Physics/Chemistry.');
    return;
  }

  // --- Make batches of size 15, but ensure last batch >= 12 if possible ---
  function makeBatches(items, maxSize = 15, minSize = 12) {
    const chunks = [];
    for (let i = 0; i < items.length; i += maxSize) chunks.push(items.slice(i, i + maxSize));
    if (chunks.length >= 2) {
      const last = chunks[chunks.length - 1];
      const prev = chunks[chunks.length - 2];
      if (last.length < minSize && prev.length > minSize) {
        const need = minSize - last.length;
        const take = Math.min(need, prev.length - minSize);
        if (take > 0) {
          last.unshift(...prev.splice(prev.length - take, take));
        }
      }
    }
    return chunks;
  }

  const batches = makeBatches(all, 15, 12);
  // Save session state
  window.__randState = {
    batches,                // array of arrays of question-maps
    idx: 0,                 // current batch index
    appliedCount: 0,        // total questions updated so far
    paperBackup: JSON.parse(JSON.stringify(paper)) // full backup
  };

  const total = batches.length;
  const promptText = buildRandomizePrompt(batches[0]);
  try {
    await navigator.clipboard.writeText(promptText);
    setGuide(`<b>Batch 1/${total}</b> prompt copied. I opened ChatGPT. Steps:<br>1) Paste & run<br>2) Copy STRICT JSON array<br>3) Return here → click <i>Paste JSON from ChatGPT</i>`);
    window.open('https://chat.openai.com/', '_blank', 'noopener');
  } catch (e) {
    alert('Copy failed. A window will open with the prompt for manual copy.');
    const w = window.open('', '_blank', 'noopener,width=900,height=650,scrollbars=yes');
    if (w) { w.document.write(`<pre style="white-space:pre-wrap;font-family:monospace;padding:16px;">${promptText.replace(/[<>&]/g, m => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[m]))}</pre>`); w.document.close(); }
  }
  btn.innerHTML = `<i class="fas fa-random"></i> Copy Batch 1/${total} Prompt (again)`;
};
// --- END ---

function buildRandomizePrompt(batchQuestions) {
  const header = `
You will receive a batch of questions (mostly numerical). For EACH question:
- Keep the SAME wording/structure; only change numeric values to new reasonable integers (avoid 0/1 unless appropriate).
- Recompute all options so they match the new numbers.
- MCQ (Single): exactly one correct option.
- MCQ (Multiple): 1–4 correct options (you choose per question).
- Randomize intended correct-count distribution across the batch approximately as:
  • 20%: 1 correct option
  • 30%: 2 correct options
  • 30%: 3 correct options
  • 20%: 4 correct options (all correct)
- Never return a question where none of the options are correct.
- Shuffle options AND ensure the answer letters match the shuffled options.
- Preserve any TeX/Math formatting already present (e.g., \\( ... \\)).
- Return STRICT JSON only (no prose, no markdown fences). Each item must be ONE of:
  • MCQ:
    { "stem":"<updated question text>", "options":["A","B","C","D"], "answer":["A"] }  // or ["A","C"] for multiple
  • Descriptive:
    { "stem":"<updated question text>" }  // no options, no answer
- Do not include any extra fields.
[
  { ... }, { ... }, ...
]

Input items (JSON per line):
`.trim();

  const lines = batchQuestions.map((q, idx) => JSON.stringify({
    index: idx + 1,
    subject: q.subject,
    section: q.sectionLabel,
    stem: q.stem,
    options: q.options
  })).join('\n');

  return `${header}\n${lines}\n`;
}

document.getElementById('apply-json-btn').onclick = async function() {
  const paper = getExamPaper();
  if (!paper) { alert('No exam paper found!'); return; }

  if (!window.__randState || !Array.isArray(window.__randState.batches)) {
    alert('No active randomize session. Click “Randomize Numbers (Copy Prompt → Open ChatGPT)” first.');
    return;
  }

  const st = window.__randState;
  const totalBatches = st.batches.length;
  const currentIdx = st.idx;
  const currentMap = st.batches[currentIdx]; // this batch’s mapping

  const raw = await sciMentraPrompt(`Paste the STRICT JSON array returned by ChatGPT for Batch ${currentIdx + 1}/${totalBatches}:`, '');
  if (raw === null || !String(raw).trim()) return;

function extractJsonArray(raw) {
  let s = String(raw || '').trim();

  // remove markdown fences
  s = s.replace(/```(?:json)?/gi, '').replace(/```/g, '').trim();

  // normalize curly quotes / nbsp
  s = s.replace(/[\u2018\u2019]/g, "'")
       .replace(/[\u201C\u201D]/g, '"')
       .replace(/\u00A0/g, ' ');

  // if user pasted multiple objects without outer array, wrap them
  const firstBracket = s.indexOf('[');
  const firstBrace = s.indexOf('{');

  if (firstBracket === -1 && firstBrace !== -1) {
    s = `[${s}]`;
  }

  const first = s.indexOf('[');
  const last = s.lastIndexOf(']');
  if (first === -1 || last === -1 || last <= first) {
    throw new Error('No JSON array found');
  }

  let sub = s.slice(first, last + 1);

  // remove trailing commas before } or ]
  sub = sub.replace(/,(\s*[}\]])/g, '$1');

  let out = '';
  let inString = false;
  let quoteEscaped = false;

  for (let i = 0; i < sub.length; i++) {
    const ch = sub[i];

    if (!inString) {
      out += ch;
      if (ch === '"') {
        inString = true;
        quoteEscaped = false;
      }
      continue;
    }

    // inside string
    if (quoteEscaped) {
      // preserve escaped quote like \"
      out += ch;
      quoteEscaped = false;
      continue;
    }

    if (ch === '\\') {
      const next = sub[i + 1] || '';

      // keep only escaped quote as-is
      if (next === '"') {
        out += '\\"';
        i++;
        continue;
      }

      // for EVERYTHING ELSE in strings, double the slash
      // this safely repairs \begin, \end, \(, \), \times, \\ etc.
      out += '\\\\';
      continue;
    }

    if (ch === '"') {
      inString = false;
      out += ch;
      continue;
    }

    if (ch === '\n') {
      out += '\\n';
      continue;
    }

    if (ch === '\r') {
      continue;
    }

    out += ch;
  }

  return JSON.parse(out);
}

let items;
try {
  items = extractJsonArray(raw);
} catch (e) {
  console.error('JSON parse failed:', e, raw);
  alert('Invalid JSON. Please paste only the JSON array.');
  return;
}

  if (!Array.isArray(items) || items.length !== currentMap.length) {
    alert(`JSON length mismatch. Expected ${currentMap.length} items, got ${Array.isArray(items) ? items.length : 0}.`);
    return;
  }

  const backup = JSON.parse(JSON.stringify(paper));
  let applied = 0;

  for (let i = 0; i < items.length; i++) {
    const { subjIdx, sIdx, qIdx } = currentMap[i];
    const out = items[i] || {};
    const stem = (out.stem || '').trim();
const isMCQ = Array.isArray(out.options) && out.options.length === 4;
const opts = isMCQ ? out.options.map(x => String(x || '').trim()) : [];
let ans = Array.isArray(out.answer) ? out.answer.map(x => String(x || '').trim().toUpperCase()) : [];

const qObj = paper.subjects[subjIdx].sections[sIdx].questions[qIdx];

// Basic stem check
const validStem = stem.replace(/<[^>]+>/g, '').length >= 3;
if (validStem) qObj.text = stem;

if (isMCQ) {
  // MCQ path
  const validOpts = opts.every(s => s.length > 0);
  if (validOpts) qObj.options = opts;

  // Normalize answers (A–D, unique, original order)
  const seen = new Set();
  ans = ans.filter(L => /^[A-D]$/.test(L) && !seen.has(L) && (seen.add(L), true));
  if (ans.length >= 1) qObj.answer = ans.join(ans.length > 1 ? ',' : '');

  // Guard: if options exist but answer missing, keep previous answer if any
  if (Array.isArray(qObj.options) && qObj.options.length === 4 && !qObj.answer) {
    const orig = backup.subjects[subjIdx].sections[sIdx].questions[qIdx];
    if (orig?.answer) qObj.answer = orig.answer;
  }
} else {
  // Descriptive path: keep existing answer unless AI gives a new one
  delete qObj.options;

  if (typeof out.answer === 'string' && out.answer.trim()) {
    qObj.answer = out.answer.trim();
  }
}

// Guard: if stem was emptied by accident, restore original
if (!qObj.text || !qObj.text.trim()) {
  const orig = backup.subjects[subjIdx].sections[sIdx].questions[qIdx];
  if (orig?.text || orig?.question) qObj.text = (orig.text || orig.question);
}
    if (Array.isArray(qObj.options) && qObj.options.length === 4 && !qObj.answer) {
      const orig = backup.subjects[subjIdx].sections[sIdx].questions[qIdx];
      if (orig?.answer) qObj.answer = orig.answer;
    }
    if (!qObj.text || !qObj.text.trim()) {
      const orig = backup.subjects[subjIdx].sections[sIdx].questions[qIdx];
      if (orig?.text || orig?.question) qObj.text = (orig.text || orig.question);
    }

    applied++;
  }

  setExamPaper(paper);
  renderExam();

  // Update session progress
  st.appliedCount += applied;
  st.idx++;

  // Guidance & next step
  const btn = document.getElementById('randomize-numbers-btn');
  const guide = document.getElementById('rand-guide');
  if (st.idx >= totalBatches) {
    alert(`All batches applied. Total updates: ${st.appliedCount}.`);
    if (guide) guide.innerHTML = `<b>Done.</b> Applied ${st.appliedCount} updates across ${totalBatches} batches.`;
    btn.innerHTML = '<i class="fas fa-random"></i> Randomize Numbers (Copy Prompt → Open ChatGPT)';
    // Clear session
    delete window.__randState;
    return;
  }

  const nextIdx = st.idx;
  const nextPrompt = buildRandomizePrompt(st.batches[nextIdx]);
  try {
    await navigator.clipboard.writeText(nextPrompt);
    if (guide) guide.innerHTML = `<b>Batch ${nextIdx + 1}/${totalBatches}</b> prompt copied. I opened ChatGPT. Steps:<br>1) Paste & run<br>2) Copy STRICT JSON<br>3) Return → click <i>Paste JSON from ChatGPT</i>`;
    window.open('https://chat.openai.com/', '_blank', 'noopener');
  } catch (e) {
    alert('Copy failed. A window will open with the next prompt for manual copy.');
    const w = window.open('', '_blank', 'noopener,width=900,height=650,scrollbars=yes');
    if (w) { w.document.write(`<pre style="white-space:pre-wrap;font-family:monospace;padding:16px;">${nextPrompt.replace(/[<>&]/g, m => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[m]))}</pre>`); w.document.close(); }
  }
  btn.innerHTML = `<i class="fas fa-random"></i> Copy Batch ${nextIdx + 1}/${totalBatches} Prompt (again)`;
};
