<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PDF Page Number Editor | SciMentra</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f8fc;
      color: #123;
    }

    .header {
      background: linear-gradient(90deg, #1762a7, #0f3d6b);
      color: #fff;
      text-align: center;
      padding: 22px 12px;
      border-bottom-left-radius: 26px;
      border-bottom-right-radius: 26px;
    }

    .header h1 {
      margin: 0;
      font-size: 1.8rem;
    }

    .header p {
      margin: 5px 0 0;
      opacity: 0.95;
      font-weight: 600;
    }

    .container {
      max-width: 760px;
      margin: 24px auto;
      background: #fff;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 6px 22px rgba(0, 27, 68, 0.12);
      box-sizing: border-box;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 700;
      color: #0f3d6b;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 11px 12px;
      border: 1.4px solid #bcd6ef;
      border-radius: 10px;
      font-size: 1rem;
      background: #f9fcff;
      color: #123;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media (max-width: 620px) {
      .row {
        grid-template-columns: 1fr;
      }
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 13px 14px;
      background: #1762a7;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn:hover {
      background: #0f3d6b;
    }

    .btn.secondary {
      background: #0f8b6d;
    }

    .note {
      background: #eef6ff;
      border-left: 5px solid #1762a7;
      padding: 12px 14px;
      border-radius: 10px;
      line-height: 1.5;
      color: #234;
      margin-bottom: 18px;
    }

    #status {
      margin-top: 14px;
      font-weight: 700;
      color: #0f3d6b;
      text-align: center;
    }

    iframe {
      width: 100%;
      height: 520px;
      border: 1.5px solid #d6e6f5;
      border-radius: 12px;
      margin-top: 18px;
      background: #fff;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>SciMentra</h1>
    <p>PDF Page Number Editor</p>
  </div>

  <div class="container">
    <div class="note">
  Upload your already aligned clean PDF here. This tool will add final page numbers
  and running headers based on the final starting page number. It will not disturb your worksheet alignment.
</div>
<div class="form-group">
  <label>Select PDF</label>
  <input type="file" id="pdfFile" accept="application/pdf">
</div>

<div class="row">
  <div class="form-group">
    <label>Subject Colour Theme</label>
    <select id="subjectTheme">
      <option value="default">Default Blue</option>
      <option value="math">Mathematics - Deep Purple</option>
      <option value="physics">Physics IIT & NEET - Deep Maroon</option>
      <option value="chemistry">Chemistry IIT & NEET - Deep Cobalt Blue</option>
      <option value="biology">Biology NEET - Deep Leaf Green</option>
    </select>
  </div>

  <div class="form-group">
    <label>Right Header Text for Odd Pages</label>
    <select id="rightHeaderText">
  <option value="WORKSHEET">WORKSHEET</option>
  <option value="QUESTIONS & ANSWERS">QUESTIONS & ANSWERS</option>
  <option value="PINNACLE PAPER">PINNACLE PAPER</option>
  <option value="CORE PAPER">CORE PAPER</option>
</select>
  </div>
</div>

<div class="form-group">
  <label>Chapter / Lesson Name for Even Pages</label>
  <input type="text" id="chapterHeaderText" placeholder="Example: Number System">
</div>

<div class="form-group">
  <label>Page Header Style</label>
  <select id="pageHeaderStyle">
    <option value="fadeBar" selected>Fading Colour Bar Header</option>
    <option value="plainText">Plain Text Header</option>
    <option value="noHeader">No Header</option>
  </select>
</div>

<div class="row">
  <div class="form-group">
    <label>Header Font Size</label>
    <input type="number" id="headerFontSize" value="10" min="7" max="18">
  </div>

  <div class="form-group">
    <label>Header Top Margin</label>
    <input type="number" id="headerTopMargin" value="24" min="10" max="80">
  </div>
</div>

    <div class="row">
      <div class="form-group">
        <label>Starting Page Number</label>
        <input type="number" id="startPage" value="1" min="1">
      </div>

      <div class="form-group">
        <label>Page Number Style</label>
        <select id="numberStyle">
          <option value="pageText">1 | P a g e</option>
          <option value="simple">1</option>
          <option value="pageWord">Page 1</option>
          <option value="dash">- 1 -</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Position</label>
        <select id="position">
          <option value="mirrorBottom">Mirror Bottom: odd right, even left</option>
          <option value="bottomCenter">Bottom Center</option>
          <option value="bottomRight">Bottom Right</option>
          <option value="bottomLeft">Bottom Left</option>
          <option value="topRight">Top Right</option>
          <option value="topCenter">Top Center</option>
        </select>
      </div>

      <div class="form-group">
        <label>Font Size</label>
        <input type="number" id="fontSize" value="11" min="8" max="24">
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Bottom Margin</label>
        <input type="number" id="bottomMargin" value="22" min="5" max="80">
      </div>

      <div class="form-group">
        <label>Side Margin</label>
        <input type="number" id="sideMargin" value="42" min="10" max="100">
      </div>
    </div>

    <button class="btn" onclick="addPageNumbers()">Add Page Numbers & Preview</button>
    <button class="btn secondary" onclick="downloadPdf()">Download Numbered PDF</button>

    <div id="status"></div>

    <iframe id="preview" style="display:none;"></iframe>
  </div>

  <script>
  let finalPdfBytes = null;
  let originalFileName = "numbered-pdf.pdf";

  function formatPageNumber(num, style) {
    if (style === "simple") return String(num);
    if (style === "pageWord") return "Page " + num;
    if (style === "dash") return "- " + num + " -";
    return num + " | P a g e";
  }

   function hexToRgb(hex) {
    const clean = String(hex || "#0f3d6b").replace("#", "");
    const bigint = parseInt(clean, 16);

    return PDFLib.rgb(
      ((bigint >> 16) & 255) / 255,
      ((bigint >> 8) & 255) / 255,
      (bigint & 255) / 255
    );
  }

  function hexToRgbParts(hex) {
    const clean = String(hex || "#0f3d6b").replace("#", "");
    const bigint = parseInt(clean, 16);

    return {
      r: ((bigint >> 16) & 255) / 255,
      g: ((bigint >> 8) & 255) / 255,
      b: (bigint & 255) / 255
    };
  }

  function mixWithWhite(rgbParts, strength) {
    return PDFLib.rgb(
      1 - ((1 - rgbParts.r) * strength),
      1 - ((1 - rgbParts.g) * strength),
      1 - ((1 - rgbParts.b) * strength)
    );
  }

   function drawFadingHeaderBar(page, x, y, barWidth, barHeight, themeRgbParts, direction) {
    const steps = 160;
    const stepWidth = barWidth / steps;
    const radius = Math.min(10, barHeight / 2);

    for (let i = 0; i < steps; i++) {
      let strength;

      if (direction === "leftToRight") {
        strength = 1 - (i / (steps - 1));
      } else {
        strength = i / (steps - 1);
      }

      const stripX = x + (i * stepWidth);
      const centerX = (i * stepWidth) + (stepWidth / 2);

      let inset = 0;

      if (centerX < radius) {
        const dx = radius - centerX;
        inset = radius - Math.sqrt(Math.max(0, (radius * radius) - (dx * dx)));
      } else if (centerX > (barWidth - radius)) {
        const dx = centerX - (barWidth - radius);
        inset = radius - Math.sqrt(Math.max(0, (radius * radius) - (dx * dx)));
      }

      const stripY = y + inset;
      const stripHeight = Math.max(0, barHeight - (2 * inset));

      if (stripHeight > 0) {
        page.drawRectangle({
          x: stripX,
          y: stripY,
          width: stepWidth + 0.6,
          height: stripHeight,
          color: mixWithWhite(themeRgbParts, strength),
          opacity: 1
        });
      }
    }
  }
  function getSubjectThemeColor(themeKey) {
  if (themeKey === "math") return "#4B3F72";
  if (themeKey === "physics") return "#7A2230";
  if (themeKey === "chemistry") return "#1F3A5F";
  if (themeKey === "biology") return "#1B5E20";
  return "#0f3d6b";
}

  function getXPosition(position, pageWidth, textWidth, sideMargin, actualPageNo) {
    if (position === "bottomCenter" || position === "topCenter") {
      return (pageWidth - textWidth) / 2;
    }

    if (position === "bottomLeft") {
      return sideMargin;
    }

    if (position === "bottomRight" || position === "topRight") {
      return pageWidth - sideMargin - textWidth;
    }

    if (position === "mirrorBottom") {
      if (actualPageNo % 2 === 1) {
        return pageWidth - sideMargin - textWidth;
      } else {
        return sideMargin;
      }
    }

    return pageWidth - sideMargin - textWidth;
  }

  function getYPosition(position, pageHeight, fontSize, bottomMargin) {
    if (position === "topRight" || position === "topCenter") {
      return pageHeight - 32;
    }

    return bottomMargin;
  }

  function fitTextToWidth(text, font, startSize, maxWidth, minSize = 7) {
    let size = startSize;
    let cleanText = String(text || "").trim();

    while (size > minSize && font.widthOfTextAtSize(cleanText, size) > maxWidth) {
      size -= 0.5;
    }

    return {
      text: cleanText,
      size: size,
      width: font.widthOfTextAtSize(cleanText, size)
    };
  }

    function drawRunningHeader(page, actualPageNo, font, boldFont, options) {
         const {
      chapterHeaderText,
      rightHeaderText,
      headerFontSize,
      headerTopMargin,
      sideMargin,
      themeColor,
      themeRgbParts,
      pageHeaderStyle,
      isFirstPdfPage
    } = options;

       if (pageHeaderStyle === "noHeader") return;
    if (isFirstPdfPage) return;

    const { width, height } = page.getSize();

        const textY = height - headerTopMargin;
    const maxWidth = width - (sideMargin * 2);

    if (pageHeaderStyle === "plainText") {
           if (actualPageNo % 2 === 0) {
        if (isFirstPdfPage) return;

        const chapterText = String(chapterHeaderText || "").trim();
        if (!chapterText) return;

        const fitted = fitTextToWidth(chapterText, font, headerFontSize, maxWidth, 7);

        page.drawText(fitted.text, {
          x: sideMargin,
          y: textY,
          size: fitted.size,
          font,
          color: themeColor
        });
      } else {
        const rightText = String(rightHeaderText || "").trim();
        if (!rightText) return;

        const fitted = fitTextToWidth(rightText, boldFont, headerFontSize, maxWidth, 7);

        page.drawText(fitted.text, {
          x: width - sideMargin - fitted.width,
          y: textY,
          size: fitted.size,
          font: boldFont,
          color: themeColor
        });
      }

      return;
    }

          const barHeight = Math.max(24, headerFontSize + 12);
    const barWidth = Math.min(width * 0.66, 430);
    const headerDownShift = 16;
    const barY = height - headerTopMargin - barHeight - headerDownShift;

       if (actualPageNo % 2 === 0) {
      if (isFirstPdfPage) return;

      const chapterText = String(chapterHeaderText || "").trim();
      if (!chapterText) return;

          const barX = sideMargin;
      const textMaxWidth = barWidth - 24;
      const fitted = fitTextToWidth(chapterText, boldFont, headerFontSize, textMaxWidth, 7);

      drawFadingHeaderBar(page, barX, barY, barWidth, barHeight, themeRgbParts, "leftToRight");

      page.drawText(fitted.text, {
        x: barX + 14,
               y: barY + ((barHeight - fitted.size) / 2) + 2,
        size: fitted.size,
        font: boldFont,
        color: PDFLib.rgb(1, 1, 1)
      });
    } else {
      const rightText = String(rightHeaderText || "").trim();
      if (!rightText) return;

            const barX = width - sideMargin - barWidth;
      const textMaxWidth = barWidth - 24;
      const fitted = fitTextToWidth(rightText, boldFont, headerFontSize, textMaxWidth, 7);

      drawFadingHeaderBar(page, barX, barY, barWidth, barHeight, themeRgbParts, "rightToLeft");

      page.drawText(fitted.text, {
        x: barX + barWidth - fitted.width - 14,
                y: barY + ((barHeight - fitted.size) / 2) + 2,
        size: fitted.size,
        font: boldFont,
        color: PDFLib.rgb(1, 1, 1)
      });
    }
  }
  async function addPageNumbers() {
    const fileInput = document.getElementById("pdfFile");
    const file = fileInput.files[0];

    if (!file) {
      alert("Please select a PDF first.");
      return;
    }

    originalFileName = file.name.replace(/\.pdf$/i, "") + "_numbered.pdf";

    const startPage = Math.max(1, parseInt(document.getElementById("startPage").value, 10) || 1);
    const style = document.getElementById("numberStyle").value;
    const position = document.getElementById("position").value;
    const fontSize = Math.max(8, parseInt(document.getElementById("fontSize").value, 10) || 11);
    const bottomMargin = Math.max(5, parseInt(document.getElementById("bottomMargin").value, 10) || 22);
    const sideMargin = Math.max(10, parseInt(document.getElementById("sideMargin").value, 10) || 42);

       const subjectTheme = document.getElementById("subjectTheme").value;
    const chapterHeaderText = document.getElementById("chapterHeaderText").value || "";
    const rightHeaderText = document.getElementById("rightHeaderText").value || "WORKSHEET";
    const pageHeaderStyle = document.getElementById("pageHeaderStyle").value || "fadeBar";
    const headerFontSize = Math.max(7, parseInt(document.getElementById("headerFontSize").value, 10) || 10);
    const headerTopMargin = Math.max(10, parseInt(document.getElementById("headerTopMargin").value, 10) || 24);

    document.getElementById("status").textContent = "Adding headers and page numbers...";

    const arrayBuffer = await file.arrayBuffer();
    const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);

    const font = await pdfDoc.embedFont(PDFLib.StandardFonts.TimesRoman);
    const boldFont = await pdfDoc.embedFont(PDFLib.StandardFonts.TimesRomanBold);

        const themeHex = getSubjectThemeColor(subjectTheme);
    const themeColor = hexToRgb(themeHex);
    const themeRgbParts = hexToRgbParts(themeHex);
    const pageNumberColor = themeColor;

    const pages = pdfDoc.getPages();

    pages.forEach((page, index) => {
      const actualPageNo = startPage + index;
      const pageText = formatPageNumber(actualPageNo, style);

      const { width, height } = page.getSize();
      const textWidth = font.widthOfTextAtSize(pageText, fontSize);

      // Add running header based on final actual page number
            drawRunningHeader(page, actualPageNo, font, boldFont, {
        chapterHeaderText,
        rightHeaderText,
        headerFontSize,
        headerTopMargin,
        sideMargin,
                themeColor,
        themeRgbParts,
        pageHeaderStyle,
        isFirstPdfPage: index === 0
      });

      // Add page number
      const x = getXPosition(position, width, textWidth, sideMargin, actualPageNo);
      const y = getYPosition(position, height, fontSize, bottomMargin);

      page.drawText(pageText, {
        x,
        y,
        size: fontSize,
        font,
        color: pageNumberColor
      });
    });

    finalPdfBytes = await pdfDoc.save();

    const blob = new Blob([finalPdfBytes], { type: "application/pdf" });
    const url = URL.createObjectURL(blob);

    const preview = document.getElementById("preview");
    preview.src = url;
    preview.style.display = "block";

    document.getElementById("status").textContent = "Headers and page numbers added. Check preview and download.";
  }

  function downloadPdf() {
    if (!finalPdfBytes) {
      alert("Please add page numbers first.");
      return;
    }

    const blob = new Blob([finalPdfBytes], { type: "application/pdf" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = originalFileName;
    document.body.appendChild(link);
    link.click();

    setTimeout(() => {
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    }, 100);
  }
</script>

</body>
</html>
