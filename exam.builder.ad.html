        .page-wrapper { display: flex; flex-direction: column; height: 100vh; }
        #main-header {

        main {
            flex: 1 1 0%;
            min-height: 0;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            box-sizing: border-box;
        }
        .setup-form-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto 20px auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0, 27, 68, 0.1);

        .setup-form-container h2 { text-align: center; color: var(--primary-blue); margin-top: 0; margin-bottom: 25px; }
        #exam-setup-form h3 {
            margin-top: 25px; margin-bottom: 15px;
            color: var(--secondary-blue); border-bottom: 2px solid #e0eaff; padding-bottom: 10px;
            font-size: 1.2em; display: flex; align-items: center; gap: 10px;

        #exam-setup-form h3:first-of-type { margin-top: 0; }
        .form-grid-1-col, .form-grid-2-col { display: grid; gap: 15px; }
        .form-grid-1-col { grid-template-columns: 1fr; }

            main { padding-top: 20px; }
            .form-grid-2-col { grid-template-columns: 1fr; }

        .form-group { margin-bottom: 0; }
        .form-group label {
            font-weight: 600; margin-bottom: 5px;
            color: #185496; display: block;
        }
        .form-group input[type="text"], .form-group input[type="number"], .form-group input[type="date"],

            width: 100%; padding: 10px 12px; border-radius: 6px;

<script>
(function () {
  'use strict';

  const copy = value => JSON.parse(JSON.stringify(value));

  const esc = value => String(value ?? '').replace(
    /[&<>"']/g,
    character => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[character])
  );

  const imageURL = value =>
    /^(https?:\/\/|data:image\/(png|jpeg|jpg|gif|webp);base64,|blob:)/i
      .test(String(value || ''))
      ? String(value)
      : '';

  function rich(value) {
    const text = String(value || '');

    if (!/<[a-z][^>]*>/i.test(text)) {
      return esc(text).replace(/\n/g, '<br>');
    }

    const doc = new DOMParser().parseFromString(text, 'text/html');

    const allowed = new Set(
      'P BR DIV SPAN B STRONG I EM U SUP SUB UL OL LI TABLE THEAD TBODY TR TD TH IMG PRE CODE'
        .split(' ')
    );

    [...doc.body.querySelectorAll('*')].reverse().forEach(el => {
      if (/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|SVG|MATH|FORM)$/.test(el.tagName)) {
        el.remove();
        return;
      }

      if (!allowed.has(el.tagName)) {
        el.replaceWith(...el.childNodes);
        return;
      }

      [...el.attributes].forEach(attribute => {
        if (!['src', 'alt', 'colspan', 'rowspan', 'type'].includes(attribute.name)) {
          el.removeAttribute(attribute.name);
        }
      });

      if (el.hasAttribute('src') && !imageURL(el.getAttribute('src'))) {
        el.removeAttribute('src');
      }
    });

    return doc.body.innerHTML;
  }

  function questionTree(question, includeImage = true) {
    if (question.alternatives?.length) {
      return question.alternatives.map((alternative, index) => `
        ${index ? '<p style="text-align:center"><b>OR</b></p>' : ''}
        <p>
          <b>(${String.fromCharCode(65 + index)})</b>
          ${questionTree(alternative)}
        </p>
      `).join('');
    }

    let html = rich(
      question.passage ||
      question.text ||
      question.question ||
      question.body
    );

    if (question.options?.length) {
      html += '<ol type="A">' +
        question.options.map(option => `<li>${rich(option)}</li>`).join('') +
        '</ol>';
    }

    if (question.parts?.length) {
      if (question.choice === 'any') {
        html += `
          <p>
            Attempt any ${question.attempt}
            of the following ${question.parts.length}.
          </p>
        `;
      }

      html += question.parts.map((part, index) => `
        <p>
          <b>(${index + 1})</b>
          ${questionTree(part)}
          <b>[${esc(part.marks)}]</b>
        </p>
      `).join('');
    }

    if (includeImage && imageURL(question.image)) {
      html += `
        <p>
          <img
            class="question-img"
            style="max-width:100%"
            src="${esc(question.image)}"
            alt="Question figure">
        </p>
      `;
    }

    return html;
  }

  function answerTree(question) {
    const children =
      question.alternatives ||
      question.parts ||
      question.mcqs;

    if (children?.length) {
      return children.map((part, index) => `
        <p>
          <b>(${question.alternatives
            ? String.fromCharCode(65 + index)
            : index + 1})</b>
          ${answerTree(part)}
        </p>
      `).join('');
    }

    return rich(
      question.answer ||
      question.parsedAnswer ||
      question.finalAnswer ||
      ''
    ) + (
      question.explanation
        ? `<p>${rich(question.explanation)}</p>`
        : ''
    );
  }

  function toReviewPaper(source) {
    const paper = copy(source);

    // Preserve chapter and OR metadata when a CBSE paper is saved in Exam Review.
    if (paper.subjects?.some(subject => Array.isArray(subject.rows))) {
      paper._cbseBlueprintSource = copy(source);
    }

    /* Foundation papers already use the Review-page structure. */
    if (!paper.subjects?.some(subject => Array.isArray(subject.rows))) {
      return paper;
    }

    let number = 0;

    paper.subjects = paper.subjects.map(subject => ({
      subject: subject.subject,
      chapters: subject.chapters,
      marks: subject.marks,

      sections: subject.rows.map(row => {
        const grouped = row.grouped || row.attempt < row.count;

        const items = grouped
          ? [{
              text: row.title,
              marks: row.attempt * row.marks,
              parts: row.items,
              choice: row.attempt < row.count ? 'any' : 'all',
              attempt: row.attempt
            }]
          : row.items;

        return {
          label: `${row.section} — ${row.title}`,
          type: 'all',
          orCount: row.orCount || 0,
          mcqType: grouped ? 'Descriptive' : row.type,
          numQuestions: items.length,

          marksPerQuestion: grouped
            ? row.attempt * row.marks
            : row.marks,

          instructions: grouped
            ? 'Answer the following question as instructed.'
            : `Answer all ${row.count} questions.${
                row.orCount
                  ? ' Where OR is given, answer only one alternative.'
                  : ''
              }`,

          questions: items.map(question => {
            const composite = !!(
              question.parts?.length ||
              question.alternatives?.length
            );

            const text = composite
              ? questionTree({ ...question, image: '' })
              : rich(question.text || question.question);

            return {
              _cbseBridge: true,
              number: ++number,
              text,
              question: text,
              body: text,
              marks: question.marks || row.marks,
              type: composite ? 'Descriptive' : row.type,
              mcqType: composite ? 'Descriptive' : row.type,
              options: composite ? [] : (question.options || []),
              image: imageURL(question.image),

              answer: composite
                ? answerTree(question)
                : (question.answer || ''),

              explanation: composite
                ? ''
                : (question.explanation || ''),

              chapter: question.chapter || '',
              modelType: question.modelType || ''
            };
          })
        };
      })
    }));

    paper.schema = 'scimentra-review-paper-v1';
    paper.schoolName = paper.schoolName || paper.school || 'SciMentra';
    paper.paperType = paper.paperType || 'CBSE Assessment';

    delete paper.setup;

    return paper;
  }

  function openPaper(source, preview = false) {
    const paper = toReviewPaper(source);

    sessionStorage.setItem('examPaper', JSON.stringify(paper));
    sessionStorage.setItem('finalExamData', JSON.stringify(paper));

    location.href = preview
      ? 'exam-preview.html'
      : 'exam-review.html';
  }

    async function store(mode, action) {

    // Use the same Firebase project as the administrator login.
    const app = firebase.app();
    const user = app.auth().currentUser;

    if (!user) {
      throw new Error(
        'Administrator login required. Please sign in again.'
      );
    }

    const papers = app.firestore()
      .collection('adminExamPapers')
      .doc(user.uid)
      .collection('papers');

    const cloud = {

      async getAll() {
        const snapshot = await papers.get();

        return snapshot.docs.map(doc => ({
          ...doc.data(),
          id: doc.id
        }));
      },

      async put(paper) {
        if (!paper?.id) {
          throw new Error('Paper ID is missing.');
        }

        await papers.doc(String(paper.id)).set(
          JSON.parse(JSON.stringify(paper))
        );

        return paper.id;
      },

      async delete(id) {
        if (!id) {
          throw new Error('Paper ID is missing.');
        }

        await papers.doc(String(id)).delete();
      }
    };

    return action(cloud);
  }

  function __ebBlueprintHtml(input) {
    const paper = input?._cbseBlueprintSource || input;

    }
    const escape = v => String(v ?? '').replace(/[&<>"']/g,
      c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const num = n => Number(n || 0);
    const fmt = n => String(Math.round((num(n) + Number.EPSILON) * 100) / 100);
    const range = (low, high) => low === high ? fmt(low) : `${fmt(low)}–${fmt(high)}`;
    const roman = n => {
      let out = '';
      for (const [value, symbol] of [[100,'c'],[90,'xc'],[50,'l'],[40,'xl'],[10,'x'],[9,'ix'],[5,'v'],[4,'iv'],[1,'i']]) {
        while (n >= value) { out += symbol; n -= value; }
      }

    };
    const typeLabel = row => {
      const name = String(row.type || row.title || 'Question').trim();
      const m = fmt(row.marks);
      if (/^MCQ \(Single\)$/i.test(name)) return `MCQ (${m}M)`;
      if (/^Assertion and Reason/i.test(name)) return `A–R (${m}M)`;
      if (/^Descriptive$/i.test(name)) return `${m}-mark`;
      if (/^Case Based$/i.test(name)) return `Case-Based (${m}M)`;
      return `${name} (${m}M)`;
    };
    const totalExpected = num(paper.maxMarks);
    let actualTotal = 0;
    const blocks = paper.subjects.map(sub => {
      const selected = [...new Set((sub.chapters || []).map(c => String(c).trim()).filter(Boolean))];
      const cells = new Map();

      const warnings = [];
      const typeTotals = new Map();
      const markRange = new Map();
      const countRange = new Map();
      const allChapters = new Set(selected);
      let number = 0;
      let attempted = 0;
      let subjectTotal = 0;
      const putCell = (chapter, type, value) => {
        const key = `${chapter}\u0000${type}`;
        if (!cells.has(key)) cells.set(key, []);

      };
      const chapterOf = (q, parent) => {
        const chapter = String(q?.chapter || parent?.chapter || '').trim();
        return chapter || 'Unassigned chapter';
      };
      for (const row of sub.rows) {
        const type = typeLabel(row);
        if (!types.includes(type)) types.push(type);
        const marks = num(row.marks);
        const items = Array.isArray(row.items) ? row.items : [];
        const count = num(row.count);
        const take = num(row.attempt);
        const grouped = !!row.grouped || take < count;
        const rowSlots = [];
        subjectTotal += take * marks;
        attempted += take;
        typeTotals.set(type, (typeTotals.get(type) || 0) + take * marks);
        if (items.length !== count) warnings.push(`${row.section || 'Section'}: expected ${count} question records but found ${items.length}.`);
        if (take > items.length) warnings.push(`${row.section || 'Section'}: fewer question records than required attempts.`);
        if (grouped) number++;

          const options = Array.isArray(item?.alternatives) && item.alternatives.length

            else if (selected.length && !selected.includes(ch)) warnings.push(`${ref}: lesson “${ch}” is outside the selected lessons.`);
          });
          const choiceRefs = options.map((_, i) => options.length > 1 ? `${ref}(${String.fromCharCode(65 + i)})` : ref);
          if (distinct.length === 1) {

          }));

          const lowWeights = rowSlots.map(slot => slot.chapters.every(ch => ch === chapter) ? marks : 0);
          const highWeights = rowSlots.map(slot => slot.chapters.includes(chapter) ? marks : 0);
          const lowCount = lowWeights.map(v => v ? 1 : 0);
          const highCount = highWeights.map(v => v ? 1 : 0);
          const chooseMin = arr => arr.slice().sort((a, b) => a - b).slice(0, take).reduce((a, b) => a + b, 0);

          const mr = markRange.get(chapter) || [0, 0];
          const cr = countRange.get(chapter) || [0, 0];
          markRange.set(chapter, [mr[0] + chooseMin(lowWeights), mr[1] + chooseMax(highWeights)]);

            return `<section class="subject">

            </thead>
            <tbody>${questionRows}</tbody>

        </div>

    return `<!doctype html><html lang="en"><head><meta charset="utf-8">
      <meta name="viewport" content="width=device-width,initial-scale=1">

            /* A4 PORTRAIT BLUEPRINT */

      .summary-table {

              <th>OR slots</th>

            </tr>
          </thead>
          <tbody>
      `;

      subject.sections.forEach(section => {
        const count = Number(
          section.numQuestions ||
          section.numPairs ||
          section.questions.length
        );

        const attempt = section.type === 'any'
          ? Number(section.attemptAny || count)
          : count;

        const orCount = Number(
          section.orCount ||
          (section.type === 'internal' ? section.numPairs : 0) ||
          0
        );

        body += `
          <tr>
            <td>${esc(section.label)}</td>
            <td>${esc(section.mcqType || '')}</td>
            <td>${count}</td>
            <td>${attempt}</td>
            <td>${esc(section.marksPerQuestion)}</td>
            <td>${orCount}</td>
            <td>${attempt * Number(section.marksPerQuestion)}</td>
          </tr>
          <tr>
            <td colspan="7">${esc(section.instructions || '')}</td>
          </tr>
        `;
      });

      body += '</tbody></table>';
    });

    const math =
      '<script>window.MathJax={tex:{inlineMath:[["\\\\(","\\\\)"]]}};</scr' +
      'ipt><script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></scr' +
      'ipt>';

    const html = `
      <!doctype html>
      <html>
      <head>
        <meta charset="utf-8">
        <title>${esc(paper.examName)}</title>
        <style>
          body {
            font: 16px Georgia, serif;
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
          }
          table { border-collapse: collapse; width: 100%; }
          td, th { border: 1px solid #aaa; padding: 9px; }
          article { border-bottom: 1px solid #ddd; padding: 12px 0; }
                    img { max-width: 100%; }
          ${__scNeutralStyles}
          @media print {
            button { display: none; }
            tr { break-inside: avoid; }
          }
        </style>
        ${math}
      </head>
      <body>
        <button onclick="window.print()">Print / Save as PDF</button>
        ${body}
      </body>
      </html>
    `;

    const url = URL.createObjectURL(
      new Blob([html], { type: 'text/html;charset=utf-8' })
    );

    const link = document.createElement('a');
    link.href = url;

    link.download =
      String(paper.examName || 'Paper')
        .replace(/[^\p{L}\p{N}._-]+/gu, '-') +
      (answers ? '-Answer-Key.html' : '-Blueprint.html');

    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  }

  async function showMyPapers() {
    try {
      const papers = (
        await store('readonly', records => records.getAll()) || []
      ).sort((a, b) =>
        String(b.updatedAt || b.createdAt)
          .localeCompare(String(a.updatedAt || a.createdAt))
      );

      const dialog = document.createElement('dialog');

           dialog.className = 'sc-papers-modal';

      dialog.style.cssText = `
        width:min(720px,calc(100vw - 28px));
        max-height:min(85vh,800px);
        border:0;
        border-radius:20px;
        padding:0;
        overflow-y:auto;
        box-shadow:0 24px 70px rgba(15,40,70,.23);
        color:#19334b;
      `;

      dialog.innerHTML = `
        <style>
          .sc-papers-modal::backdrop {
            background:rgba(12,30,50,.5);
          }

          .sc-papers-modal * {
            box-sizing:border-box;
          }

          .sc-papers-head {
            display:flex;
            align-items:flex-start;
            justify-content:space-between;
            gap:14px;
            padding:24px 26px 14px;
          }

          .sc-papers-head h2 {
            margin:0;
            color:#123b63;
            font-size:24px;
          }

          .sc-papers-head p {
            margin:6px 0 0;
            color:#718096;
            font-size:13px;
          }

          .sc-papers-close {
            display:grid;
            place-items:center;
            width:36px;
            height:36px;
            flex-shrink:0;
            border:0;
            border-radius:50%;
            background:#f0f4f9;
            color:#43576c;
            cursor:pointer;
            font-size:17px;
          }

          .sc-papers-list {
            padding:6px 24px 22px;
            display:grid;
            gap:12px;
          }

          .sc-paper-card {
            border:1px solid #e0e8f0;
            border-radius:14px;
            padding:16px 18px;
            background:#fff;
          }

          .sc-paper-top {
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:12px;
            flex-wrap:wrap;
          }

          .sc-paper-name {
            font-size:16px;
            font-weight:700;
            color:#173a5e;
            overflow-wrap:anywhere;
            line-height:1.4;
          }

          .sc-paper-name span {
            font-weight:500;
            color:#556a7f;
          }

          .sc-paper-meta {
            margin:7px 0 0;
            font-size:13px;
            color:#687c8e;
            line-height:1.5;
          }

          .sc-paper-toggle {
            border:0;
            border-radius:999px;
            padding:10px 17px;
            min-height:39px;
            background:#195995;
            color:#fff;
            font-size:13px;
            font-weight:700;
            cursor:pointer;
            display:inline-flex;
            align-items:center;
            gap:9px;
          }

          .sc-paper-toggle:hover {
            background:#10446f;
          }

          .sc-paper-toggle[aria-expanded="true"] .fa-chevron-down {
            transform:rotate(180deg);
          }

          .sc-paper-toggle .fa-chevron-down {
            transition:transform .15s;
          }

          .sc-paper-menu {
            display:grid;
            gap:3px;
            margin-top:13px;
            padding:6px;
            border-radius:12px;
            border:1px solid #e3ebf2;
            background:#f8fbfe;
          }

          .sc-paper-menu[hidden] {
            display:none!important;
          }

          .sc-paper-menu button {
            width:100%;
            display:flex;
            align-items:center;
            gap:12px;
            text-align:left;
            padding:12px 13px;
            border:0;
            border-radius:8px;
            background:transparent;
            color:#294a66;
            font-size:14px;
            cursor:pointer;
          }

          .sc-paper-menu button:hover {
            background:#eaf2fb;
          }

          .sc-paper-menu button i {
            width:18px;
            text-align:center;
          }

          .sc-paper-menu button.sc-delete {
            color:#b33131;
            border-top:1px solid #e1e7ec;
            border-radius:0 0 8px 8px;
            margin-top:4px;
          }

          .sc-paper-menu button.sc-delete:hover {
            background:#fff0f0;
          }

          .sc-papers-empty {
            padding:26px;
            text-align:center;
            color:#66798b;
          }

          @media(max-width:540px) {
            .sc-papers-head {
              padding:18px 16px 12px;
            }

            .sc-papers-list {
              padding:6px 14px 18px;
            }

            .sc-paper-card {
              padding:14px;
            }

            .sc-paper-top {
              align-items:flex-start;
            }

            .sc-paper-toggle {
              margin-left:auto;
            }
          }
        </style>

        <div class="sc-papers-head">
          <div>
            <h2>My Papers</h2>
            <p>Saved papers in your administrator cloud account</p>
          </div>

          <button
            type="button"
            class="sc-papers-close"
            data-close
            aria-label="Close My Papers"
            title="Close">
            <i class="fas fa-times"></i>
          </button>
        </div>

        <div class="sc-papers-list">
          ${
            papers.length
              ? papers.map((paper, index) => {

                  const subjects = [...new Set(
                    (Array.isArray(paper.subjects) ? paper.subjects : [])
                      .map(s =>
                        typeof s === 'string'
                          ? s
                          : (s?.subject || s?.name || '')
                      )
                      .map(s => String(s).trim())
                      .filter(Boolean)
                  )];

                  const savedValue =
                    paper.updatedAt || paper.createdAt;

                  const savedDate = savedValue
                    ? new Date(savedValue)
                    : null;

                  const savedLabel =
                    savedDate && !Number.isNaN(savedDate.getTime())
                      ? savedDate.toLocaleDateString('en-IN', {
                          day:'2-digit',
                          month:'short',
                          year:'numeric'
                        })
                      : '';

                  const details = [
                    paper.class || '',
                    paper.maxMarks != null
                      ? `${paper.maxMarks} marks`
                      : '',
                    savedLabel ? `Saved ${savedLabel}` : ''
                  ].filter(Boolean).map(esc).join(' &nbsp;·&nbsp; ');

                  return `
                    <article class="sc-paper-card">

                      <div class="sc-paper-top">
                        <div>
                          <div class="sc-paper-name">
                            ${esc(paper.examName || 'Untitled Exam')}
                            ${subjects.length
                              ? `<span>(${esc(subjects.join(', '))})</span>`
                              : ''}
                          </div>

                          <p class="sc-paper-meta">
                            ${details}
                          </p>
                        </div>

                        <button
                          type="button"
                          class="sc-paper-toggle"
                          data-menu-toggle="${index}"
                          aria-expanded="false"
                          aria-controls="sc-paper-menu-${index}">
                          Actions
                          <i class="fas fa-chevron-down"
                             aria-hidden="true"></i>
                        </button>
                      </div>

                      <div
                        class="sc-paper-menu"
                        id="sc-paper-menu-${index}"
                        hidden>

                        ${
                          [
                            ['open','Open Paper','fa-file-alt'],
                            ['review','Exam Review','fa-edit'],
                            ['answers','Download Answer Key','fa-file-download'],
                            ['blueprint','Download Blueprint','fa-list-alt'],
                            ['delete','Delete Paper','fa-trash-alt']
                          ].map(([action,label,icon]) => `
                            <button
                              type="button"
                              data-action="${action}"
                              data-index="${index}"
                              class="${action === 'delete'
                                ? 'sc-delete'
                                : ''}">
                              <i class="fas ${icon}"
                                 aria-hidden="true"></i>
                              ${label}
                            </button>
                          `).join('')
                        }

                      </div>
                    </article>
                  `;
                }).join('')
              : '<p class="sc-papers-empty">No saved papers yet. Save a paper from Exam Preview.</p>'
          }
        </div>
      `;
      dialog.addEventListener('close', () => dialog.remove());

      dialog.onclick = async event => {
        const button = event.target.closest('button');
        if (!button) return;

        if (button.hasAttribute('data-close')) {
          dialog.close();
          return;
        }

               if (button.hasAttribute('data-menu-toggle')) {

          const index = button.dataset.menuToggle;

          const menu = dialog.querySelector(
            `#sc-paper-menu-${index}`
          );

          if (!menu) return;

          const shouldOpen = menu.hidden;

          dialog.querySelectorAll('.sc-paper-menu')
            .forEach(item => {
              item.hidden = true;
            });

          dialog.querySelectorAll('[data-menu-toggle]')
            .forEach(toggle => {
              toggle.setAttribute(
                'aria-expanded',
                'false'
              );
            });

          menu.hidden = !shouldOpen;

          button.setAttribute(
            'aria-expanded',
            String(shouldOpen)
          );

          return;
        }

        if (!button.hasAttribute('data-action')) return;

        const paper = papers[Number(button.dataset.index)];

        if (!paper) return;

        try {
          switch (button.dataset.action) {
            case 'open':
              openPaper(paper, true);
              break;

            case 'review':
              openPaper(paper);
              break;

            case 'answers':
              downloadReport(paper, true);
              break;

            case 'blueprint':
              downloadReport(paper, false);
              break;

            case 'delete':
              if (confirm(`Delete saved paper "${paper.examName}"?`)) {
                await store('readwrite', records => records.delete(paper.id));
                dialog.close();
                await showMyPapers();
              }
              break;
          }
        } catch (error) {
          alert(error.message);
        }
      };

      document.body.append(dialog);
      dialog.showModal();
    } catch (error) {
      alert('Could not load My Papers: ' + error.message);
    }
  }

  function previewQuestion(question, number) {
    const optionLines = (question.options || []).map(
      (option, index) => `${String.fromCharCode(65 + index)}) ${option}`
    );

    const optionsHTML = optionLines.length
      ? (
          typeof renderOptionsLayout === 'function'
            ? renderOptionsLayout(optionLines)
            : '<ol type="A">' +
              question.options.map(option => `<li>${rich(option)}</li>`).join('') +
              '</ol>'
        )
      : '';

    return `
      <div class="question-container">
        <div class="question-number">${number}.</div>

        <div class="question-body">
          <div style="display:flex;gap:12px">
            <div class="question-text" style="flex:1">
              ${rich(question.text || question.question)}
            </div>

            <b style="white-space:nowrap">
              [${esc(question.marks)}]
            </b>
          </div>

          ${
            imageURL(question.image)
              ? `
                <div class="question-img-block">
                  <img
                    class="question-img"
                    src="${esc(question.image)}"
                    alt="Question figure">
                </div>
              `
              : ''
          }

          <div
            class="options-block"
            data-options="${encodeURIComponent(JSON.stringify(optionLines))}">
            ${optionsHTML}
          </div>
        </div>
      </div>
    `;
  }

  window.SciMentraPapers = {
    openReview: paper => openPaper(paper),
    previewQuestion,
    showMyPapers
  };

  document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('exam-setup-form');

    if (form) {
      const button = document.createElement('button');

      button.type = 'button';
      button.textContent = 'My Papers';
      button.style.cssText = `
        padding:12px 22px;
        margin:12px 0;
        border:0;
        border-radius:10px;
        background:#174e80;
        color:white;
        cursor:pointer;
      `;

      button.onclick = showMyPapers;
      form.before(button);
    }

    const review = document.getElementById('exam-review-area');

    if (
      review &&
      typeof getExamPaper === 'function' &&
      getExamPaper()?.board === 'CBSE'
    ) {
      const subtitle = document.querySelector('#main-header .subtitle');
      if (subtitle) subtitle.textContent = 'CBSE';

      document.getElementById('download-blueprint-btn')
        ?.addEventListener('click', event => {
          event.preventDefault();
          event.stopImmediatePropagation();
          saveEdits(false);
          downloadReport(getExamPaper(), false);
        }, true);
    }

    const toolbar = document.querySelector('.toolbar');

    if (toolbar && document.getElementById('print-preview')) {
      const button = document.createElement('button');

      button.type = 'button';
      button.textContent = 'Save Paper';
      toolbar.append(button);

      button.onclick = async () => {
        button.disabled = true;

        try {
          if (typeof exam === 'undefined' || !exam.subjects?.length) {
            throw new Error('No paper to save.');
          }

          const name = String(exam.examName || '').trim();

          if (!name) {
            throw new Error('Enter an exam name before saving.');
          }

          exam.id = exam.id || (
            'paper-' + (
              crypto.randomUUID
                ? crypto.randomUUID()
                : Date.now()
            )
          );

          exam.examName = name;
          exam.updatedAt = new Date().toISOString();

          await store('readwrite', records => records.put(copy(exam)));

          sessionStorage.setItem('examPaper', JSON.stringify(exam));
          sessionStorage.setItem('finalExamData', JSON.stringify(exam));

         alert('Paper saved to Firestore. Open My Papers in Exam Builder.');
        } catch (error) {
          alert('Could not save paper: ' + error.message);
        } finally {
          button.disabled = false;
        }
      };
    }
  });
})();
</script>

 <div id="subjects-sections-area">

function extractMCQOptions(q) {
  if (Array.isArray(q?.options) && q.options.length === 4) return q.options;

  let s = String(q?.question || q?.text || q?.body || '');
  s = s.replace(/\r/g, '');

  const labelRe = /(^|\s)([ABCD])[\)\.]\s/gi;
  const hits = [];
  let m;
  while ((m = labelRe.exec(s)) !== null) {
    hits.push({ letter: m[2].toUpperCase(), i: m.index + m[0].length });
  }

  const need = ['A', 'B', 'C', 'D'];
  const map = {};
  for (const h of hits) {
    if (!(h.letter in map)) map[h.letter] = h.i;
  }
  if (!need.every(L => map[L] != null)) return null;

  const endA = map['B'];
  const endB = map['C'];
  const endC = map['D'];
  const ansIdx = (s.match(/\bAns?\s*:/i)?.index) ?? s.length;
  const endD = ansIdx;

  const A = s.slice(map['A'], endA).trim();
  const B = s.slice(map['B'], endB).trim();
  const C = s.slice(map['C'], endC).trim();
  const D = s.slice(map['D'], endD).trim();

  return [A, B, C, D];
}
function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}
function shuffleMCQQuestion(questionObj) {
    if (!questionObj.options || !questionObj.options.length) return questionObj;

    let { options, answer } = questionObj;
    let correctIndices = [];

    if (Array.isArray(answer)) {
        if (answer.length && typeof answer[0] === 'number') {
            correctIndices = answer.filter(i => Number.isInteger(i) && i >= 0 && i < 4);
        } else {
            correctIndices = extractAnswerLetters(answer)
                .map(l => "ABCD".indexOf(l))
                .filter(i => i >= 0);
        }
    } else {
        correctIndices = extractAnswerLetters(answer)
            .map(l => "ABCD".indexOf(l))
            .filter(i => i >= 0);
    }

    const optPairs = options.map((opt, idx) => ({ opt, idx }));
    shuffleArray(optPairs);

    const newOptions = optPairs.map(p => p.opt);
    const newCorrectIndices = [];

    optPairs.forEach((p, newIdx) => {
        if (correctIndices.includes(p.idx)) newCorrectIndices.push(newIdx);
    });

    const ansLetters = Array.from(new Set(newCorrectIndices.map(i => "ABCD"[i])));
    return { ...questionObj, options: newOptions, answer: ansLetters.join(',') };
}
function splitCounts(total, percents) {
    let result = percents.map(p => Math.floor(total * p / 100));
    let sum = result.reduce((a, b) => a + b, 0);
    let diff = total - sum;
    for (let i = 0; diff > 0; i++, diff--) result[i % result.length]++;
    return result;
}

function htmlToPlainText(html) {
  if (!html) return '';
  let s = String(html);
  s = s.replace(/<\/p\s*>/gi, '\n')
       .replace(/<br\s*\/?>/gi, '\n')
       .replace(/<\/li\s*>/gi, '\n')
       .replace(/<\/h[1-6]\s*>/gi, '\n');
  s = s.replace(/<[^>]+>/g, ' ');
  s = s.replace(/&nbsp;/gi, ' ')
       .replace(/&amp;/gi, '&')
       .replace(/&lt;/gi, '<')
       .replace(/&gt;/gi, '>')
       .replace(/&#39;/gi, "'")
       .replace(/&quot;/gi, '"');
  s = s.replace(/\r/g, '')
     .replace(/\u00A0/g, ' ')
     .replace(/[ \t]+\n/g, '\n')
     .replace(/[ \t]{2,}/g, ' ')
     .replace(/\n{2,}/g, '\n\n')
     .trim();
  s = s.replace(/\n/g, '\n');
  return s;
}

function parsePastedQuestionsToPool(raw) {
  if (!raw) return [];
  let text = String(raw);

  if (/<[a-z][\s\S]*>/i.test(text)) {
    text = htmlToPlainText(text);
  } else {
    text = text.replace(/\r/g, '').trim();
  }

  // Remove Markdown copy-code fences without touching LaTeX.
  text = text
    .replace(/```(?:text|plaintext|latex|tex)?\s*/gi, '')
    .replace(/```/g, '')
    .trim();

  if (!text) return [];
  const lines = text.split('\n');
  const merged = [];
  for (let i = 0; i < lines.length; i++) {
    const cur = lines[i].trim();
    if (/^(?:Q\.?\s*)?\d+\s*[\.\)]?$/.test(cur) && i + 1 < lines.length) {
      lines[i + 1] = `${cur} ${lines[i + 1]}`;
      continue;
    }
    merged.push(lines[i]);
  }
  const norm = merged.join('\n');

  const headerRe = /^[ \t]*(?:Q\.?\s*)?(\d+)(?:[.:)]|\s)\s*/gmi;
  const starts = [];
  let m;
  while ((m = headerRe.exec(norm)) !== null) {
    starts.push(m.index);
  }
  if (!starts.length) {
    const byLines = norm.split(/\n{2,}/).map(s => s.trim()).filter(Boolean);
    return byLines.length ? byLines : [norm.trim()];
  }

  const blocks = [];
  for (let i = 0; i < starts.length; i++) {
    const start = starts[i];
    const end = i + 1 < starts.length ? starts[i + 1] : norm.length;
    const slice = norm.slice(start, end);
    const cleaned = slice.replace(/^[ \t]*(?:Q\.?\s*)?\d+(?:[.:)]|\s)\s*/, '').trim();
    if (cleaned) blocks.push(cleaned);
  }
  return blocks;
}

function allocateSequentiallyAcrossSections(
  subjectsData,
  pool,
  {
    shuffleQuestions = true,
    shuffleOptions = true
  } = {}
) {

  const errors = [];
  let index = 0;

  const stripLead = s =>
    String(s || '')
      .replace(/^\s*(?:Q\.?\s*)?\d+(?:[.:)]|\s)\s*/, '')
      .trim();


  function toReviewHtml(value) {
    return String(value || '')
      .replace(/\r/g, '')
      .replace(/```(?:text|plaintext|latex|tex)?/gi, '')
      .replace(/```/g, '')
      .split('\n')
      .map(line => line.trim())
      .filter(Boolean)
      .join('<br>');
  }


  function cleanOption(option) {
    return String(option || '')
      .replace(/^[A-D][)\.]\s*/i, '')
      .replace(/\s+[A-D][)\.]?\s*$/i, '')
      .replace(/\s{2,}/g, ' ')
      .trim();
  }


   function parseFinalQuestionBlock(input) {

    let raw = stripLead(input)
      .replace(/```(?:text|plaintext|latex|tex)?/gi, '')
      .replace(/```/g, '')
      .replace(/\r/g, '')
      .trim();

    let explanation = '';
    let answerText = '';
    let answerLetters = [];
    let rawAnswer = '';


    /* ==========================================
       READ ANSWER + EXPLANATION LINES ROBUSTLY
       ========================================== */

    const lines = raw.split('\n');

    function cleanMetaLine(line) {
      return String(line || '')
        .replace(/^\s*[-•]\s*/, '')
        .replace(/\*\*/g, '')
        .replace(/__/g, '')
        .trim();
    }


    const answerLineIndex = lines.findIndex(line => {
      const cleaned = cleanMetaLine(line);

      return /^(?:Ans(?:wer)?|Correct\s+Answer)\s*[:\-]/i.test(
        cleaned
      );
    });


    const explanationLineIndex = lines.findIndex(line => {
      const cleaned = cleanMetaLine(line);

      return /^Explanation\s*:/i.test(
        cleaned
      );
    });


    /* ==========================================
       ANSWER
       ========================================== */

    if (answerLineIndex !== -1) {

      const cleanedAnswerLine =
        cleanMetaLine(
          lines[answerLineIndex]
        );

      rawAnswer =
        cleanedAnswerLine
          .replace(
            /^(?:Ans(?:wer)?|Correct\s+Answer)\s*[:\-]\s*/i,
            ''
          )
          .trim();


      const answerEnd =
        (
          explanationLineIndex > answerLineIndex
        )
          ? explanationLineIndex
          : lines.length;


      const extraAnswerLines =
        lines
          .slice(
            answerLineIndex + 1,
            answerEnd
          )
          .join('\n')
          .trim();


      if (extraAnswerLines) {
        rawAnswer =
          [rawAnswer, extraAnswerLines]
            .filter(Boolean)
            .join('\n');
      }
    }


    /* ==========================================
       EXPLANATION
       ========================================== */

    if (explanationLineIndex !== -1) {

      const cleanedExplanationLine =
        cleanMetaLine(
          lines[explanationLineIndex]
        );

      explanation =
        cleanedExplanationLine
          .replace(
            /^Explanation\s*:\s*/i,
            ''
          )
          .trim();


      const explanationEnd =
        (
          answerLineIndex > explanationLineIndex
        )
          ? answerLineIndex
          : lines.length;


      const extraExplanationLines =
        lines
          .slice(
            explanationLineIndex + 1,
            explanationEnd
          )
          .join('\n')
          .trim();


      if (extraExplanationLines) {
        explanation =
          [explanation, extraExplanationLines]
            .filter(Boolean)
            .join('\n');
      }
    }


    /* ==========================================
       REMOVE ANSWER / EXPLANATION FROM QUESTION
       ========================================== */

    const metaIndexes = [
      answerLineIndex,
      explanationLineIndex
    ].filter(index => index >= 0);


    if (metaIndexes.length) {

      const firstMetaIndex =
        Math.min(...metaIndexes);

      raw =
        lines
          .slice(0, firstMetaIndex)
          .join('\n')
          .trim();
    }


    /* ==========================================
       OPTIONS
       ========================================== */

    const extracted = extractMCQOptions({
      question: raw
    });

    let stem = raw;
    let options = [];


    if (
      Array.isArray(extracted) &&
      extracted.length === 4
    ) {

      options =
        extracted.map(cleanOption);

      const optionStart =
        stem.search(
          /(^|\s)A[)\.]\s/i
        );

      if (optionStart !== -1) {

        stem =
          stem
            .slice(0, optionStart)
            .trim();
      }
    }


    /* ==========================================
       DECIDE MCQ ANSWER OR TEXT ANSWER
       ========================================== */

    if (options.length === 4) {

      const cleanedRawAnswer =
        String(rawAnswer || '')
          .replace(/\*\*/g, '')
          .replace(/__/g, '')
          .trim();


      /*
        Accept:
        C
        C)
        C.
        Option C
        A,C
        A, C
        A/C
        A & C
        C) option text
      */

      const answerPrefix =
        cleanedRawAnswer.match(
          /^\s*(?:Option\s*)?[\[(]?\s*([A-D](?:\s*[,/&+]\s*[A-D])*)/i
        );


      if (answerPrefix) {

        const seen =
          new Set();

        answerLetters =
          (
            answerPrefix[1]
              .toUpperCase()
              .match(/[A-D]/g) || []
          )
            .filter(letter => {

              if (seen.has(letter)) {
                return false;
              }

              seen.add(letter);
              return true;
            });

      } else {

        answerLetters =
          extractAnswerLetters(
            cleanedRawAnswer
          );
      }

    } else {

      answerText =
        rawAnswer;
    }


    return {
      stem,
      options,
      answerLetters,
      answerText: toReviewHtml(answerText),
      explanation: toReviewHtml(explanation)
    };
  }

   /* =====================================================
     PARAGRAPH-BASED MCQ PARSER
     ===================================================== */

  function parseParagraphFinalBlock(
    input,
    marks,
    shouldShuffleOptions
  ) {

    let raw = stripLead(input)
      .replace(/```(?:text|plaintext|latex|tex)?/gi, '')
      .replace(/```/g, '')
      .replace(/\r/g, '')
      .trim();


    /* -----------------------------------------
       FIND SUB-QUESTION MARKERS
       ----------------------------------------- */

    let markerRegex =
      /^\s*Sub-question\s*\(([ivx]+|\d+)\)\s*:\s*/gmi;

    let markers =
      Array.from(
        raw.matchAll(markerRegex)
      );


    /* Fallback: allow plain (i), (ii), etc. */

    if (!markers.length) {

      markerRegex =
        /^\s*\(([ivx]+|\d+)\)\s*/gmi;

      markers =
        Array.from(
          raw.matchAll(markerRegex)
        );
    }


    if (!markers.length) {
      return null;
    }


    /* -----------------------------------------
       PASSAGE
       ----------------------------------------- */

    let passage =
      raw
        .slice(
          0,
          markers[0].index
        )
        .trim();


    passage = passage
      .replace(
        /^\s*Read\s+the\s+following\s+passage\s+and\s+answer\s+the\s+questions\s*:?\s*/i,
        ''
      )
      .replace(
        /^\s*Passage\s*:\s*/i,
        ''
      )
      .trim();


    if (!passage) {
      return null;
    }


    /* -----------------------------------------
       SUB-QUESTIONS
       ----------------------------------------- */

    const mcqs = [];


    markers.forEach(
      (marker, subIndex) => {

        const start =
          marker.index +
          marker[0].length;

        const end =
          subIndex + 1 < markers.length
            ? markers[subIndex + 1].index
            : raw.length;


        const block =
          raw
            .slice(start, end)
            .trim();


        if (!block) {
          return;
        }


        const parsed =
          parseFinalQuestionBlock(
            block
          );


        if (
          !parsed ||
          !parsed.stem ||
          !Array.isArray(parsed.options) ||
          parsed.options.length !== 4
        ) {
          return;
        }


        let subOptions =
          parsed.options.slice();

        let subAnswerLetters =
          parsed.answerLetters.slice();


        /* -------------------------------------
           SHUFFLE EACH SUB-QUESTION'S OPTIONS
           ------------------------------------- */

        if (shouldShuffleOptions) {

          const shuffled =
            shuffleMCQQuestion({
              question: parsed.stem,
              options: subOptions,
              answer: subAnswerLetters
            });


          if (
            Array.isArray(shuffled.options) &&
            shuffled.options.length === 4
          ) {
            subOptions =
              shuffled.options;
          }


          subAnswerLetters =
            extractAnswerLetters(
              shuffled.answer
            );
        }


        const subAnswer =
          (subAnswerLetters || [])
            .join(',');


        mcqs.push({

          question:
            parsed.stem,

          text:
            parsed.stem,

          body: [
            parsed.stem,
            ...subOptions.map(
              (option, optionIndex) =>
                `${String.fromCharCode(65 + optionIndex)}) ${option}`
            )
          ].join('\n'),

          options:
            subOptions,

          answer:
            subAnswer,

          parsedAnswer:
            subAnswer,

          finalAnswer:
            subAnswer,

          explanation:
            parsed.explanation,

          solution:
            parsed.explanation
        });
      }
    );


    if (
      !mcqs.length ||
      mcqs.length !== markers.length
    ) {
      return null;
    }


    const paragraphRecord = {
      passage,
      mcqs
    };


    const plainText =
      typeof __ebBuildParagraphPlainText === 'function'
        ? __ebBuildParagraphPlainText(
            paragraphRecord
          )
        : [
            'Read the following passage and answer the questions:',
            'Passage:',
            passage,
            '',
            ...mcqs.flatMap(
              (mcq, subIndex) => [
                `(${subIndex + 1}) ${mcq.question}`,
                ...mcq.options.map(
                  (option, optionIndex) =>
                    `${String.fromCharCode(65 + optionIndex)}) ${option}`
                ),
                ''
              ]
            )
          ].join('\n').trim();


    return {

      number: 0,

      text:
        plainText,

      question:
        plainText,

      body:
        plainText,

      passage,

      mcqs,

      marks:
        marks,

      options:
        [],

      answer:
        '',

      parsedAnswer:
        '',

      finalAnswer:
        '',

      explanation:
        '',

      solution:
        '',

      type:
        'Paragraph-Based MCQ (Single Correct)',

      mcqType:
        'Paragraph-Based MCQ (Single Correct)'
    };
  }


  /* =====================================================
     MATCHING MATRIX / MATCHING LIST PARSER
     ===================================================== */

  function parseMatchingFinalBlock(
    input,
    matchingType,
    marks,
    shouldShuffleOptions
  ) {

    let raw = stripLead(input)
      .replace(/```(?:text|plaintext|latex|tex)?/gi, '')
      .replace(/```/g, '')
      .replace(/\r/g, '')
      .trim();


    let explanation = '';
    let answerLetters = [];


    /* -----------------------------------------
       EXPLANATION
       ----------------------------------------- */

    const explanationMatch =
      raw.match(
        /(?:^|\n)\s*Explanation\s*:\s*([\s\S]*)$/i
      );


    if (explanationMatch) {

      explanation =
        explanationMatch[1]
          .trim();


      raw =
        raw
          .slice(
            0,
            explanationMatch.index
          )
          .trim();
    }


    /* -----------------------------------------
       ANSWER
       ----------------------------------------- */

    const answerMatch =
      raw.match(
        /(?:^|\n)\s*Ans(?:wer)?\s*:\s*([A-D](?:\s*,\s*[A-D])*)\s*$/i
      );


    if (answerMatch) {

      answerLetters =
        extractAnswerLetters(
          answerMatch[1]
        );


      raw =
        raw
          .slice(
            0,
            answerMatch.index
          )
          .trim();
    }


    /* -----------------------------------------
       OPTIONS MARKER
       ----------------------------------------- */

    const optionsMarker =
      raw.match(
        /(?:^|\n)\s*Options\s*:\s*/i
      );


    if (!optionsMarker) {
      return null;
    }


    const stem =
      raw
        .slice(
          0,
          optionsMarker.index
        )
        .trim();


    const optionsRegion =
      raw
        .slice(
          optionsMarker.index +
          optionsMarker[0].length
        )
        .trim();


    if (!stem || !optionsRegion) {
      return null;
    }


    /* -----------------------------------------
       IMPORTANT:
       Extract A-D ONLY from the Options region.

       This prevents Column-I A-D labels from
       being mistaken for answer choices.
       ----------------------------------------- */

    const extracted =
      extractMCQOptions({
        question:
          optionsRegion
      });


    if (
      !Array.isArray(extracted) ||
      extracted.length !== 4
    ) {
      return null;
    }


    let options =
      extracted.map(
        cleanOption
      );


    let outAnswerLetters =
      answerLetters.slice();


    /* -----------------------------------------
       SHUFFLE ANSWER CHOICES SAFELY
       ----------------------------------------- */

    if (shouldShuffleOptions) {

      const shuffled =
        shuffleMCQQuestion({
          question:
            stem,

          options:
            options,

          answer:
            outAnswerLetters
        });


      if (
        Array.isArray(shuffled.options) &&
        shuffled.options.length === 4
      ) {
        options =
          shuffled.options;
      }


      outAnswerLetters =
        extractAnswerLetters(
          shuffled.answer
        );
    }


    const answer =
      (outAnswerLetters || [])
        .join(',');


    return {

      number: 0,

      text:
        stem,

      question:
        stem,

      body: [
        stem,
        'Options:',
        ...options.map(
          (option, optionIndex) =>
            `${String.fromCharCode(65 + optionIndex)}) ${option}`
        )
      ].join('\n'),

      marks:
        marks,

      options:
        options,

      answer:
        answer,

      parsedAnswer:
        answer,

      finalAnswer:
        answer,

      explanation:
        toReviewHtml(
          explanation
        ),

      solution:
        toReviewHtml(
          explanation
        ),

      type:
        matchingType,

      mcqType:
        matchingType
    };
  }


  /* =====================================================
     INTERNAL CHOICE DISPLAY
     ===================================================== */

  function buildInternalAlternativeText(parsed) {

    if (
      !Array.isArray(parsed.options) ||
      parsed.options.length !== 4
    ) {
      return parsed.stem;
    }

    return [
      parsed.stem,
      `A) ${parsed.options[0]}`,
      `B) ${parsed.options[1]}`,
      `C) ${parsed.options[2]}`,
      `D) ${parsed.options[3]}`
    ].join('<br>');
  }


  for (const subj of subjectsData) {

    for (const sec of subj.sections) {


      /* ==========================================
         INTERNAL CHOICE
         ========================================== */

      if (sec.type === 'internal') {

        const needPairs = Number(
          sec.numPairs || 0
        );

        const marks = Number(
          sec.marksPerQuestion || 0
        );

        const pairs = [];


        const takeParsedBlock = () => {

          if (index >= pool.length) {
            return null;
          }

          return parseFinalQuestionBlock(
            pool[index++]
          );
        };


        for (
          let p = 0;
          p < needPairs;
          p++
        ) {

          const a = takeParsedBlock();
          const b = takeParsedBlock();

          if (!a || !b) {
            break;
          }


          const aQuestion =
            buildInternalAlternativeText(a);

          const bQuestion =
            buildInternalAlternativeText(b);


          const aAnswer =
            a.answerLetters.length
              ? a.answerLetters.join(',')
              : a.answerText;

          const bAnswer =
            b.answerLetters.length
              ? b.answerLetters.join(',')
              : b.answerText;


          const questionHtml =
            `(A) ${aQuestion}<br>` +
            `<div style="text-align:center;"><b>(OR)</b></div>` +
            `(B) ${bQuestion}`;


          const answerHtml =
            `(A) ${aAnswer || ''}<br>` +
            `<div style="text-align:center;"><b>(OR)</b></div>` +
            `(B) ${bAnswer || ''}`;


          const explanationHtml =
            `(A) ${a.explanation || ''}<br>` +
            `<div style="text-align:center;"><b>(OR)</b></div>` +
            `(B) ${b.explanation || ''}`;


          pairs.push({
            number: p + 1,
            text: questionHtml,
            marks: marks,
            options: [],
            answer: answerHtml,
            parsedAnswer: answerHtml,
            finalAnswer: answerHtml,
            explanation: explanationHtml,
            solution: explanationHtml
          });
        }


        if (pairs.length < needPairs) {
          errors.push(
            `${subj.subject} - ${sec.label}: ` +
            `Only ${pairs.length} of ${needPairs} pairs available from source.`
          );
        }


        sec.questions = pairs;
        continue;
      }


      /* ==========================================
         NORMAL SECTION
         ========================================== */

      const need = Number(
        sec.numQuestions || 0
      );

      const marks = Number(
        sec.marksPerQuestion || 0
      );

      const pick = [];


      for (
        let i = 0;
        i < need;
        i++
      ) {

        if (index >= pool.length) {
          break;
        }


               const rawSourceBlock =
          pool[index++];


        /* ========================================
           PARAGRAPH-BASED MCQ
           ======================================== */

        if (
          sec.mcqType ===
          'Paragraph-Based MCQ (Single Correct)'
        ) {

          const paragraphQuestion =
            parseParagraphFinalBlock(
              rawSourceBlock,
              marks,
              shuffleOptions
            );


          if (!paragraphQuestion) {

            errors.push(
              `${subj.subject} - ${sec.label}: ` +
              `Paragraph-Based MCQ could not be parsed. ` +
              `Use Passage:, Sub-question (i):, A-D, Ans: and Explanation:.`
            );

            continue;
          }


          paragraphQuestion.number =
            i + 1;


          pick.push(
            paragraphQuestion
          );

          continue;
        }


        /* ========================================
           MATCHING MATRIX / MATCHING LIST
           ======================================== */

        if (
          sec.mcqType === 'Matching Matrix' ||
          sec.mcqType === 'Matching List'
        ) {

          const matchingQuestion =
            parseMatchingFinalBlock(
              rawSourceBlock,
              sec.mcqType,
              marks,
              shuffleOptions
            );


          if (!matchingQuestion) {

            errors.push(
              `${subj.subject} - ${sec.label}: ` +
              `${sec.mcqType} could not be parsed. ` +
              `The final set must contain an Options: line followed by four A-D choices.`
            );

            continue;
          }


          matchingQuestion.number =
            i + 1;


          pick.push(
            matchingQuestion
          );

          continue;
        }


        /* ========================================
           ALL NORMAL QUESTION TYPES
           ======================================== */

        const parsed =
          parseFinalQuestionBlock(
            rawSourceBlock
          );

        /* ========================================
           MCQ
           ======================================== */

        if (
          Array.isArray(parsed.options) &&
          parsed.options.length === 4
        ) {

          let outOptions =
            parsed.options.slice();

          let outAnswerLetters =
            parsed.answerLetters.slice();


          if (shuffleOptions) {

            const shuffled = shuffleMCQQuestion({
              question: parsed.stem,
              options: outOptions,
              answer: outAnswerLetters
            });


            outOptions =
              Array.isArray(shuffled.options)
                ? shuffled.options
                : outOptions;


            outAnswerLetters =
              extractAnswerLetters(
                shuffled.answer
              );
          }


          const answer =
            (outAnswerLetters || [])
              .join(',');


          pick.push({
            number: i + 1,
            text: parsed.stem,
            question: parsed.stem,
            body: [
              parsed.stem,
              ...outOptions.map(
                (option, optionIndex) =>
                  `${String.fromCharCode(65 + optionIndex)}) ${option}`
              )
            ].join('\n'),
            marks: marks,
            options: outOptions,
            answer: answer,
            parsedAnswer: answer,
            finalAnswer: answer,
            explanation: parsed.explanation,
            solution: parsed.explanation,
            mcqType: sec.mcqType || ''
          });


        /* ========================================
           DESCRIPTIVE / NUMERICAL / FILL BLANK
           ======================================== */

        } else {

          pick.push({
            number: i + 1,
            text: parsed.stem,
            question: parsed.stem,
            body: parsed.stem,
            marks: marks,
            options: [],
            answer: parsed.answerText,
            parsedAnswer: parsed.answerText,
            finalAnswer: parsed.answerText,
            explanation: parsed.explanation,
            solution: parsed.explanation,
            mcqType: sec.mcqType || ''
          });
        }
      }


      if (pick.length < need) {
        errors.push(
          `${subj.subject} - ${sec.label}: ` +
          `Only ${pick.length} of ${need} questions available from source.`
        );
      }


      if (
        shuffleQuestions &&
        pick.length > 1
      ) {
        shuffleArray(pick);
      }


      sec.questions = pick;
    }
  }


  return {
    errors
  };
}

function normalizeText(s) {
  if (!s) return '';
  let t = String(s);
  t = t.replace(/<[^>]+>/g, ' ');
  t = t.replace(/&nbsp;/gi, ' ').replace(/\u00A0/g, ' ');
  try { t = t.normalize('NFKC'); } catch (e) {}
  t = t.replace(/[\u200B-\u200D\uFEFF]/g, '');
  t = t.replace(/[\u2010-\u2015\u2212]/g, '-');
  t = t.replace(/[\u2018\u2019\u201A\u2032]/g, "'")
       .replace(/[\u201C\u201D\u2033]/g, '"');
  t = t.replace(/\u00D7/g, 'x');
  t = t.replace(/\s+/g, ' ').trim().toLowerCase();
  t = t.replace(/[.,;:!?]+$/g, '');
  return t;
}

function stripRealOptionBlockForKey(rawText) {
  let s = String(rawText || '');

  const aMatch = s.match(/(?:^|\n|\s)A[\)\.]\s+/i);
  if (!aMatch) return s;

  const start = aMatch.index;
  const tail = s.slice(start);

  const hasFullOptions =
    /(?:^|\n|\s)A[\)\.]\s+[\s\S]*?(?:^|\n|\s)B[\)\.]\s+[\s\S]*?(?:^|\n|\s)C[\)\.]\s+[\s\S]*?(?:^|\n|\s)D[\)\.]\s+/i.test(tail);

  if (!hasFullOptions) return s;

  return s.slice(0, start).trim();
}

function prepareQuestionStemForKey(q) {
  let raw = String(q?.question || q?.text || q?.body || '');

  const normalizedType = normalizeMcqType(getRawQuestionType(q));

  const isMatchingStyle =
    normalizedType === 'Matching Matrix' ||
    normalizedType === 'Matching List' ||
    (/Column\s*I/i.test(raw) && /Column\s*II/i.test(raw)) ||

    normalizedType === 'Assertion and Reason (MCQ Single)' ||
    looksLikeAssertionReasonQuestion(q);

  raw = raw.replace(/<[^>]+>/g, ' ');
  raw = raw.replace(/^Q\d+:\s*[^A-Za-z0-9]*[\[\]A-Za-z0-9, ]*\s*/i, '');
  raw = raw.replace(/\bAns?\s*:\s*.*$/i, '');

  if (isMatchingStyle) {
    raw = raw.replace(
      /\s*\bOptions\s*:\s*[\s\S]*$/i,
      ''

    raw = stripRealOptionBlockForKey(raw);
  }

  return raw;
}

function makeStemKey(q) {

function normalizeChoice(s) {
  if (!s) return '';
  let t = String(s);
  t = t.replace(/^[A-D][\)\.]\s*/i, '');
  t = t.replace(/<[^>]+>/g, ' ').replace(/&nbsp;/gi, ' ').replace(/\u00A0/g, ' ');

  t = t.replace(/[\u200B-\u200D\uFEFF]/g, '');
  t = t.replace(/[\u2010-\u2015\u2212]/g, '-');
  t = t.replace(/[\u2018\u2019\u201A\u2032]/g, "'").replace(/[\u201C\u201D\u2033]/g, '"');

function extractAnswerLetters(ans) {
  function parseLetters(raw) {
    let s = String(raw || '').trim().toUpperCase();
    if (!s) return [];

    const named = s.match(/\b(?:ANS?|ANSWER)\s*[:\-]?\s*(.+)$/);
    if (named) s = named[1].trim();

    if (!/^(?:[A-D][\)\.]?)(?:\s*,\s*[A-D][\)\.]?)*$/.test(s)) return [];

    const letters = s.match(/[A-D]/g) || [];
    const out = [];
    const seen = new Set();

    for (const ch of letters) {
      if (!seen.has(ch)) {
        seen.add(ch);
        out.push(ch);
      }
    }
    return out;
  }

  if (ans == null) return [];

  if (Array.isArray(ans)) {
    const out = [];
    const seen = new Set();

    for (const item of ans) {
      for (const ch of parseLetters(item)) {
        if (!seen.has(ch)) {
          seen.add(ch);
          out.push(ch);
        }
      }
    }
    return out;
  }

  return parseLetters(ans);
}
function getRawQuestionType(d) {
  if (typeof d === 'string') return d;

  const candidates = [
    d?.mcqType,

function normalizeMcqType(s) {
  let t = String(s || '')
    .replace(/<[^>]+>/g, ' ')
    .replace(/\u00A0/g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .toLowerCase();

  if (!t) return '';

  if (
    t === 'comprehensive' ||
    t.includes('comprehension') ||
    t.includes('paragraph based') ||
    (t.includes('paragraph') && t.includes('mcq'))
  ) {
    return 'Paragraph-Based MCQ (Single Correct)';
  }

  if (
    (t.includes('assertion') && t.includes('reason')) ||
    t.includes('assertion-reason') ||
    t.includes('assertion reason') ||
    t.includes('assertion & reason') ||
    t.includes('assertion and reason') ||
    t.includes('a & r') ||
    t.includes('a/r')
  ) {
    return 'Assertion and Reason (MCQ Single)';
  }

   if (t.includes('numerical') && t.includes('value')) {
    return 'Numerical Value';
  }

  if (t.includes('matching') && t.includes('list')) {
    return 'Matching List';
  }

  if (t.includes('matching') && t.includes('matrix')) {
    return 'Matching Matrix';
  }

  if ((t.includes('fill') && t.includes('blank')) || t === 'fib') {
    return 'Fill in the Blanks';
  }

  if (t.includes('multiple')) return 'MCQ (Multiple)';

  if (
    t.includes('single correct') ||
    t.includes('single') ||
    t === 'mcq' ||
    t.includes('mcq single') ||
    t.includes('objective')
  ) {
    return 'MCQ (Single)';
  }

  if (t.includes('desc') || t.includes('descriptive')) return 'Descriptive';

  return String(s || '').trim();
}
function looksLikeAssertionReasonQuestion(d) {
  const raw = [
    getRawQuestionType(d),
    d?.metaLine,
    d?.parsedMeta,
    d?.metadata,
    d?.question,
    d?.text,
    d?.body
  ].map(v => String(v || '')).join(' ');

  const text = raw
    .replace(/<[^>]+>/g, ' ')
    .replace(/&nbsp;/gi, ' ')
    .replace(/\u00A0/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();

  if (normalizeMcqType(getRawQuestionType(d)) === 'Assertion and Reason (MCQ Single)') return true;

  if (/\[\s*assertion\s*(?:and|&|-)?\s*reason/i.test(text)) return true;
  if (/\bassertion\s*(?:and|&|-)\s*reason\b/i.test(text)) return true;

  const hasAssertion = /\bassertion\b/i.test(text);
  const hasReason = /\breason\b/i.test(text);

  const hasAssertionLabel =
    /\bassertion\s*\(\s*a\s*\)\s*[:.)-]?/i.test(text) ||
    /\bassertion\s+a\s*[:.)-]/i.test(text) ||
    /\bassertion\s*[:.)-]/i.test(text);

  const hasReasonLabel =
    /\breason\s*\(\s*r\s*\)\s*[:.)-]?/i.test(text) ||
    /\breason\s+r\s*[:.)-]/i.test(text) ||
    /\breason\s*[:.)-]/i.test(text);

  return hasAssertion && hasReason && hasAssertionLabel && hasReasonLabel;

function inferMcqType(d) {
  const norm = normalizeMcqType(getRawQuestionType(d));

  if (
    norm === 'Assertion and Reason (MCQ Single)' ||
    (
           looksLikeAssertionReasonQuestion(d) &&
      norm !== 'MCQ (Multiple)' &&
      norm !== 'Numerical Value' &&
      norm !== 'Matching Matrix' &&
      norm !== 'Matching List' &&
      norm !== 'Paragraph-Based MCQ (Single Correct)' &&
      norm !== 'Fill in the Blanks'
    )
  ) {
    return 'Assertion and Reason (MCQ Single)';
  }

  if (
        norm === 'MCQ (Single)' ||
    norm === 'MCQ (Multiple)' ||
    norm === 'Numerical Value' ||
    norm === 'Fill in the Blanks' ||
    norm === 'Matching Matrix' ||
    norm === 'Matching List' ||
    norm === 'Paragraph-Based MCQ (Single Correct)' ||
    norm === 'Descriptive'
  ) {
    return norm;
  }

  if (
    Array.isArray(d?.mcqs) &&
    d.mcqs.length > 0 &&
    String(d?.passage || '').trim()
  ) {
    return 'Paragraph-Based MCQ (Single Correct)';
  }

  const answerValue =
    d?.parsedAnswer ||
    d?.answer ||
    d?.parsedAns ||
    d?.correctAnswer ||
    d?.correct_option ||
    d?.correctOption ||
    '';

  const letters = extractAnswerLetters(answerValue);

  if (letters.length > 1) return 'MCQ (Multiple)';
  if (Array.isArray(d?.options) && d.options.length === 4) return 'MCQ (Single)';
  if (extractMCQOptions(d)?.length === 4) return 'MCQ (Single)';

function makeDeDupeKey(q) {
  const stemNorm = normalizeText(prepareQuestionStemForKey(q));

  const typeNorm = inferMcqType(q);
  const rawOpts = Array.isArray(q?.options) ? q.options.slice(0, 4) : (extractMCQOptions(q) || []);
  const optNormsInOrder = rawOpts.map(o => normalizeChoice(o)).filter(Boolean);

  const answerValue =
    q?.parsedAnswer ||
    q?.answer ||
    q?.parsedAns ||
    q?.correctAnswer ||
    q?.correct_option ||
    q?.correctOption ||
    '';

  const ansLetters = extractAnswerLetters(answerValue);
  const ansTexts = ansLetters.length && optNormsInOrder.length === 4
    ? ansLetters.map(L => {
        const idx = "ABCD".indexOf(L);
        return idx >= 0 ? optNormsInOrder[idx] : '';

    : [];

  const optionSet = Array.from(new Set(optNormsInOrder)).sort();

  const key =
    stemNorm +
    '||t=' + (typeNorm || '') +
    '||opts=' + optionSet.join('|') +
    '||ans=' + ansTexts.join('|');

  return key;
}
function uniqueByIdOrText(arr) {

    if (id) seenIds.add(id);

function chunk(arr, size) {

}
function buildMarksFallbackOrder(wanted) {
  const w = parseFloat(wanted || 0);
  const universe = [0.5,1,2,3,4,5,6,8,10];
  if (!w || !universe.includes(w)) return universe;
  const rest = universe.filter(m => m !== w).sort((a,b) => Math.abs(a-w) - Math.abs(b-w));
  return [w, ...rest];
}
function splitEvenAcrossChapters(total, chapters) {
  const n = Math.max(1, (chapters || []).length);
  const base = Math.floor(total / n);
  const rem = total - base * n;
  const out = Array(n).fill(base);
  for (let i = 0; i < rem; i++) out[i] += 1;

const _subjectQuestionCache = new Map();

function _normDifficultyValue(s) {
  let t = String(s || "")
    .replace(/<[^>]+>/g, " ")
    .replace(/\u00A0/g, " ")
    .replace(/\s+/g, "")
    .trim()
    .toLowerCase();
  t = t.replace(/^level[-_]?(\d)$/, 'level$1');

function getQuestionDifficultyLevelKey(d) {
  if (__ebIsEntranceExamBoard(d?.board)) {
    return 'L1';
  }

  const directCandidates = [
    d?.difficulty,
    d?.level,
    d?.difficultyLevel,
    d?.levelKey
  ];

  for (const val of directCandidates) {
    const norm = _normDifficultyValue(val);
    if (norm === 'level1') return 'L1';
    if (norm === 'level2') return 'L2';
    if (norm === 'level3') return 'L3';
  }

  const textCandidates = [
    d?.metaLine,
    d?.parsedMeta,
    d?.metadata,
    d?.question,
    d?.text,
    d?.body
  ];

  for (const val of textCandidates) {
    const raw = String(val || '');
    const compact = raw.replace(/<[^>]+>/g, ' ').replace(/\u00A0/g, ' ');
    const match = compact.match(/\b(?:level|lvl|l)\s*[-:]?\s*([123])\b/i);
    if (match) return `L${match[1]}`;
  }

  return '';
}

function getQuestionDifficultyLabel(d) {

function _isAllowedMcqType(doc, mcqType) {

    if (mcqType === "Numerical Value") {

  if (mcqType === "Matching Matrix") {

async function getSubjectQuestionPool(selectedClass, selectedBoard, selectedSubject) {
  const cacheKey = [currentUser?.uid || '', selectedClass, selectedBoard, selectedSubject].join('|');

  if (_subjectQuestionCache.has(cacheKey)) {
    return _subjectQuestionCache.get(cacheKey).slice();
  }

  const snapshot = await firestore.collection("questions")
    .where("class", "==", selectedClass)
    .where("board", "==", selectedBoard)
    .where("subject", "==", selectedSubject)
    .get();

  const allQuestions = [];
  snapshot.forEach(doc => {
    allQuestions.push({ id: doc.id, ...doc.data() });
  });

  allQuestions.sort((a, b) => Number(a.questionNumber || 0) - Number(b.questionNumber || 0));

  const unique = uniqueByIdOrText(allQuestions);
  _subjectQuestionCache.set(cacheKey, unique.slice());
  return unique.slice();
}

function filterQuestionsFromPool(pool, {
  chapters,
  marksPerQuestion,
  mcqType,
  forceDifficulty,
  allowedDifficulties
}) {
  let rows = Array.isArray(pool) ? pool.slice() : [];

  if (chapters && chapters.length) {
    const chapterSet = new Set(chapters.map(x => String(x || '').trim()));
    rows = rows.filter(d => chapterSet.has(String(d.chapter || '').trim()));
  }

    const entrancePool =
    rows.some(d => __ebIsEntranceExamBoard(d?.board));

  // School/Foundation:
  // use marks and difficulty stored with the question.
  //
  // Entrance Exam Mode:
  // marks come from this Exam Builder section;
  // questions have no stored L1/L2/L3.
  if (
    !entrancePool &&
    marksPerQuestion != null &&
    marksPerQuestion !== ''
  ) {
    const wantedMarks = Number(marksPerQuestion);

    rows = rows.filter(
      d => Number(d.marks) === wantedMarks
    );
  }

  rows = rows.filter(
    d => _isAllowedMcqType(d, mcqType)
  );

  if (!entrancePool) {
    if (forceDifficulty) {
      const want =
        _normDifficultyValue(forceDifficulty);

      rows = rows.filter(
        d =>
          _normDifficultyValue(
            getQuestionDifficultyLabel(d)
          ) === want
      );

    } else if (
      Array.isArray(allowedDifficulties) &&
      allowedDifficulties.length
    ) {
      const wants =
        allowedDifficulties.map(
          _normDifficultyValue
        );

      rows = rows.filter(
        d =>
          wants.includes(
            _normDifficultyValue(
              getQuestionDifficultyLabel(d)
            )
          )
      );
    }
  }
  return uniqueByIdOrText(rows);
}

async function fetchQuestions({
  selectedClass,
  selectedBoard,
  selectedSubject,
  chapters,
  marksPerQuestion,
  mcqType,
  count,
  forceDifficulty,
  allowedDifficulties
}) {
  const pool = await getSubjectQuestionPool(selectedClass, selectedBoard, selectedSubject);

  let rows = filterQuestionsFromPool(pool, {
    chapters,
    marksPerQuestion,
    mcqType,
    forceDifficulty,
    allowedDifficulties
  });

  shuffleArray(rows);
  return rows.slice(0, count);
}

async function fetchQuestionsWithMarksFallback({
  selectedClass,
  selectedBoard,
  selectedSubject,
  chapters,
  marksPerQuestion,
  mcqType,
  count,
  forceDifficulty,
  allowedDifficulties
}) {
  const pool = await getSubjectQuestionPool(selectedClass, selectedBoard, selectedSubject);

  const wantedMarks = parseFloat(marksPerQuestion);
  const marksOrder = buildMarksFallbackOrder(wantedMarks);

  const picked = [];
  const usedIds = new Set();
  const usedKeys = new Set();

  for (const marks of marksOrder) {
    let rows = filterQuestionsFromPool(pool, {
      chapters,
      marksPerQuestion: marks,
      mcqType,
      forceDifficulty,
      allowedDifficulties
    });

    shuffleArray(rows);

    for (const d of rows) {
      const id = d && d.id;
      const key = makeStemKey({ text: getQuestionTextFromDoc(d), marks: Number(d.marks || marks || 0) });

      if ((id && usedIds.has(id)) || (key && usedKeys.has(key))) continue;

      if (id) usedIds.add(id);
      if (key) usedKeys.add(key);

      picked.push(d);
      if (picked.length >= count) return picked.slice(0, count);
    }
  }

  return picked.slice(0, count);
}
async function fetchBalancedAcrossChapters({
  selectedClass,
  selectedBoard,
  subject,
  chapters,
  marksPerQuestion,
  mcqType,
  requestedCount,
  difficultyValue,
  subjectSeenKeys,
  globalMixBudget,
  allowedDifficulties
}) {
  const errors = [];
  const items = [];
  const usedIds = new Set();
  const usedKeys = new Set();

  const chs = Array.isArray(chapters) ? chapters.slice() : [];

  async function fetchFor(chapterList, count, forceDifficulty) {
    if (!count) return [];
    let docs = await fetchQuestionsWithMarksFallback({
  selectedClass,
  selectedBoard,
  selectedSubject: subject,
  chapters: chapterList && chapterList.length ? chapterList : undefined,
  marksPerQuestion,
  mcqType,
  count: Math.max(count * 2, count + 2),
  forceDifficulty: forceDifficulty || undefined,
  allowedDifficulties
