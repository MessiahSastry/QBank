          node.alternatives = [original, { text: '', marks: C.effectiveMarks(node), answer: '', options: [] }]; node.parts = []; node.text = ''; node.passage = '';
        }
        if (action === 'remove') {
          const bits = btn.dataset.path.split('.'), n = Number(bits.pop()), arrayName = bits.pop(), parent = nodeAt(draft, bits.join('.'));
          parent[arrayName].splice(n, 1);
          if (arrayName === 'alternatives' && parent.alternatives.length === 1) { const one = parent.alternatives[0]; delete parent.alternatives; Object.assign(parent, one); }
        }
        draw();
      });
    }
    $('.cb-image-file', dlg).onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      if (!/^image\/(png|jpeg|webp|gif)$/.test(f.type)) { $('.cb-edit-error', dlg).textContent = 'Choose a PNG, JPEG, WebP or GIF.'; return; }
      if (f.size > 6 * 1024 * 1024) { $('.cb-edit-error', dlg).textContent = 'Use an image smaller than 6 MB.'; return; }
      const reader = new FileReader(); reader.onload = () => { draft.image = reader.result; draft.images = [reader.result]; $('.cb-edit-error', dlg).textContent = 'Picture loaded. Save the question to apply it.'; }; reader.readAsDataURL(f);
    };
    draw();
  }
  function nodeEditorHTML(q, path, depth) {
    return `<fieldset class="cb-node"><legend>${depth ? 'Subquestion / alternative' : 'Question content'}</legend>
      <label>${q.parts?.length ? 'Heading / instruction' : 'Question text'}<textarea data-node="${path}" data-field="text" rows="3">${escape(q.text || '')}</textarea></label>
      ${!depth ? `<label>Common passage / case (for a question set)<textarea data-node="${path}" data-field="passage" rows="3">${escape(q.passage || '')}</textarea></label>` : ''}
      <div class="cb-edit-grid"><label>Effective marks<input data-node="${path}" data-field="marks" type="number" min="0.5" step="0.5" value="${Number(q.marks) || 1}"></label>
      <label>Options, one per line<textarea data-node="${path}" data-field="options" rows="3">${escape((q.options || []).join('\n'))}</textarea></label></div>
      <label>Answer / marking guidance<textarea data-node="${path}" data-field="answer" rows="3">${escape(q.answer || '')}</textarea></label><label>Explanation<textarea data-node="${path}" data-field="explanation" rows="2">${escape(q.explanation || '')}</textarea></label>
      ${q.parts?.length ? `<div class="cb-flex"><label>Subpart rule<select data-node="${path}" data-field="choice">${option('all', 'Answer all subparts', q.choice || 'all')}${option('any', 'Attempt Any subparts', q.choice)}</select></label><label>Attempt (for Any)<input data-node="${path}" data-field="attempt" type="number" min="1" value="${q.attempt || q.parts.length}"></label></div>` : ''}
      ${(q.parts || []).map((p, i) => nodeEditorHTML(p, `${path}.parts.${i}`, depth + 1)).join('')}
      ${(q.alternatives || []).map((p, i) => `${i ? '<b>OR</b>' : ''}${nodeEditorHTML(p, `${path}.alternatives.${i}`, depth + 1)}`).join('')}
      <div class="cb-flex">${!q.alternatives?.length ? `<button type="button" class="cb-button" data-node-action="part" data-path="${path}">+ Subquestion</button>${depth ? `<button type="button" class="cb-button" data-node-action="or" data-path="${path}">Add OR alternative</button>` : ''}` : ''}${depth ? `<button type="button" class="cb-link" data-node-action="remove" data-path="${path}">Remove this part</button>` : ''}</div></fieldset>`;
  }
  function nodeAt(q, path) { return path.split('.').slice(1).reduce((v, k) => v[k], q); }
  function readNodes(el, q) {
    $$('[data-node][data-field]', el).forEach(input => { const n = nodeAt(q, input.dataset.node), f = input.dataset.field; n[f] = ['marks', 'attempt'].includes(f) ? Number(input.value) : f === 'options' ? input.value.split('\n').map(x => x.trim()).filter(Boolean) : input.value; });
  }
  async function replaceQuestion(path) {
    const loc = locate(path), cfg = state.paper.setup.subjects.find(s => s.subject === loc.sub.subject);
    if (state.paper.source !== 'Question Bank') { errorDialog('Question replacement', ['For an imported paper, use Edit question / answer, or import an expanded inventory and rebuild.']); return; }
    const raw = await rawPool(loc.sub.subject, true, state.paper.class);
    const pool = preparedPool(raw, cfg, loc.sub.chapters);
    const used = new Set(state.paper.subjects.flatMap(s => s.rows.flatMap(r => flatten(r.items))).filter(q => q !== loc.q).map(C.fingerprint));
    const eligible = pool.filter(q => !used.has(C.fingerprint(q)) && !C.nodeErrors(q).length && C.compatible(q, loc.r, loc.q._targetFamily || 'Any'));
    const dlg = openDialog('Choose a replacement question', `<p>${eligible.length} eligible questions. Matches ${marksText(loc.r.marks)} marks, type, area and required model family.</p><label>Search<input class="cb-replace-search" type="search"></label><div class="cb-replacements"></div>`);
    function draw() {
      const term = C.key($('.cb-replace-search', dlg).value), list = eligible.filter(q => C.key(`${q.chapter} ${q.text} ${q.modelType}`).includes(term));
      $('.cb-replacements', dlg).innerHTML = list.slice(0, 60).map(q => `<article class="cb-bank-record"><p><b>${escape(q.chapter)} · ${escape(q.modelType)}</b><button type="button" class="cb-button" data-pick="${escape(q.id)}">Use this question</button></p>${questionHTML(q, true)}</article>`).join('');
      $$('[data-pick]', dlg).forEach(btn => btn.onclick = () => {
        const next = C.clone(eligible.find(q => q.id === btn.dataset.pick)); next._targetFamily = loc.q._targetFamily;
        const old = C.clone(loc.q); setLocated(loc, next); const errors = paperErrors(state.paper);
        if (errors.length) { setLocated(loc, old); errorDialog('Replacement cannot be used', errors); return; }
        dlg.close(); showReview();
      }); math($('.cb-replacements', dlg));
    }
    $('.cb-replace-search', dlg).oninput = draw; draw();
  }
  async function printPaper(answers = false) {
    if (state.paper.selectionMode === 'Manual Select' && !state.paper.manualSelectionConfirmed) { errorDialog('Confirm manual selection', ['Review the suggested questions, use Choose another where needed, and click Confirm question selection.']); return; }
    const errors = paperErrors(state.paper); if (errors.length) { errorDialog('Resolve these issues before printing', errors); return; }
    let el = $('#cb-print-root'); if (!el) { el = document.createElement('div'); el.id = 'cb-print-root'; document.body.append(el); }
    el.innerHTML = paperHTML(state.paper, answers, false); el.classList.add('cb-measuring');
    try {
      await math(el);
      const results = await Promise.all($$('img', el).map(img => new Promise(resolve => {
        if (img.complete) { resolve(img.naturalWidth > 0); return; }
        const timeout = setTimeout(() => resolve(false), 12000);
        img.onload = () => { clearTimeout(timeout); resolve(true); }; img.onerror = () => { clearTimeout(timeout); resolve(false); };
      })));
      if (results.some(x => !x)) { errorDialog('A picture did not load', ['Upload a working copy of the missing picture before printing.']); return; }
      document.body.classList.add('cb-printing'); window.print();
    } finally { el.classList.remove('cb-measuring'); }
  }
  window.addEventListener('afterprint', () => document.body.classList.remove('cb-printing'));
   async function draftStore(mode, fn) {

    if (
      typeof window.SciMentraCloudPaperStore !== 'function'
    ) {
      throw new Error(
        'Firestore paper storage is not ready.'
      );
    }

    return window.SciMentraCloudPaperStore(mode, fn);
  }
  async function saveDraft() {
    try {
      const errors = paperErrors(state.paper); if (errors.length) { errorDialog('Draft validation', errors); return; }
      state.paper.updatedAt = new Date().toISOString();
      await draftStore('readwrite', store => store.put(C.clone(state.paper)));
      openDialog('Paper saved', '<p>Your paper and answers are saved in Firestore under your administrator account. Use Download draft for an additional backup.</p>');
    } catch (e) { errorDialog('Could not save to Firestore', [`${e.message}. Use Download draft to save a portable copy.`]); }
  }
  async function savedDrafts() {
    try {
      const drafts = (await draftStore('readonly', store => store.getAll())) || [];
      const dlg = openDialog('Your Papers', drafts.length ? drafts.sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt))).map((p, i) => `<div class="cb-bank-record"><b>${escape(p.examName)}</b><p>${escape(p.class)} · ${p.maxMarks} marks · ${escape(p.date || '')}</p><button type="button" class="cb-button" data-open="${i}">Open Exam Review</button><button type="button" class="cb-button" data-blueprint="${i}">Download Blueprint</button></div>`).join('') : '<p>No papers are saved in Firestore yet. You can also import a downloaded draft.</p>');
      $$('[data-open]', dlg).forEach(btn => btn.onclick = () => { const p = drafts[Number(btn.dataset.open)]; restoreDraft(p); dlg.close(); });
      $$('[data-blueprint]', dlg).forEach(btn => btn.onclick = () => downloadBlueprint(drafts[Number(btn.dataset.blueprint)]));
    } catch (e) { errorDialog('Could not load drafts', [e.message]); }
  }
  function restoreDraft(p) {
    if (p?.schema !== 'scimentra-cbse-paper-v2' || !Array.isArray(p.subjects) || !p.setup) throw new Error('This is not a supported CBSE draft file.');
    const errs = paperErrors(p); if (errs.length) { errorDialog('Saved draft needs correction', errs); return; }
    state.paper = p; state.reviewTab = 'review';
    state.overrides = new Map(p.setup.overrides || []);
    // Rehydrate setup controls as well as the review so a reopened draft can be revised.
    state.context = `${p.class}|CBSE`;
    state.subjects = new Map(p.setup.subjects.map(cfg => [cfg.subject, C.clone(cfg)]));
    for (const [id, val] of [['class-dropdown', p.class], ['board-dropdown', 'CBSE'], ['exam-source-dropdown', p.source]]) {
      const el = document.getElementById(id); el.dataset.value = val; const label = $('.selected-option', el); if (label) label.textContent = val;
    }
    updateSubjectsForBoardAndClass();
    $$('#subjects-multiselect input[type="checkbox"]').forEach(el => el.checked = p.subjects.some(s => s.subject === el.value));
    const display = $('#subjects-multiselect .selected-chapters-display'); if (display) display.textContent = p.subjects.map(s => s.subject).join(', ');
    updateSubjectsSectionsArea();
    for (const [id, val] of [['exam-name-input', p.examName], ['cb-school', p.school], ['date-input', p.date], ['time-input', p.time], ['instructions-input', p.instructions]]) if (document.getElementById(id)) document.getElementById(id).value = val || '';
    // Chapter menus load asynchronously. Restore exact values, without inventing bank records.
    p.setup.subjects.forEach((cfg, i) => {
      const host = document.getElementById(`chapters-multiselect-${i}`); if (!host) return;
      const restore = () => { const boxes = $$('input[type="checkbox"]', host); if (!boxes.length) return false; boxes.forEach(box => box.checked = cfg.chapters.includes(box.value)); updateSelectedChaptersDisplay(host); updateChapterMap(i); return true; };
      if (!restore()) { const observer = new MutationObserver(() => { if (restore()) observer.disconnect(); }); observer.observe(host, { childList: true, subtree: true }); setTimeout(() => observer.disconnect(), 15000); }
      const input = $('.ai-manual-chapters-input', $$('.subject-block')[i]); if (input) input.value = cfg.chapters.join(', ');
    });
    syncBoard();
    showReview();
  }
  function filename(s) { return String(s || 'cbse-paper').replace(/[^\p{L}\p{N}._-]+/gu, '-').slice(0, 90); }
  function download(name, text, mime) { const url = URL.createObjectURL(new Blob([text], { type: mime + ';charset=utf-8' })); const a = document.createElement('a'); a.href = url; a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); }
  function syncTotal() {
    if (!cbse()) return;
    const subjects = getSelectedSubjects(); if (!subjects.length) return;
    $('#max-marks-input').value = subjects.reduce((s, subject) => s + getConfig(subject).marks, 0); $('#max-marks-input').readOnly = true;
    $('#max-marks-input').title = 'Total of the subject blueprint marks. Change marks in each subject card.';
  }
  function syncSource() {
    if (!cbse()) return;
    $('#difficulty-config-group').style.display = 'none';
    const source = getSourceTypeGlobal();
    $$('.subject-block').forEach((block, i) => {
      const dropdown = $(`#chapters-multiselect-${i}`, block); if (dropdown) dropdown.closest('.form-group').style.display = '';
      const manual = $('.ai-manual-chapters-group', block); if (manual) manual.style.display = source === 'Question Bank' ? 'none' : 'block';
    });
    if (source === 'AI Generate' || source === 'Paste') {
      $('#global-paste-label').textContent = 'Paste the Complete FINAL SET from ChatGPT';
      $('#global-paste-area').placeholder = 'Get Questions → review and recheck in ChatGPT → ask for the final set → paste its complete inline-LaTeX copy-code block here → Build Exam Draft → Exam Review.';
    }
    $('#paste-docx-shuffle').style.display = 'none'; // Exact slot order and answer labels are retained.
  }
  function initPanel() {
    if ($('#cb-panel')) return;
    const panel = document.createElement('div'); panel.id = 'cb-panel'; panel.className = 'cb-panel'; panel.hidden = true;
    panel.innerHTML = `<span class="cb-kicker">SUBJECT-WISE CBSE BUILDER</span><h3>Chapter-based papers · Classes 6–12</h3><div class="cb-flex"><label>Default size for new subjects<select id="cb-default-size">${[20, 40, 80].map(n => option(n, `${n} marks`, 80)).join('')}</select></label><label>School / organisation<input id="cb-school" value="SciMentra"></label><button type="button" class="cb-button" id="cb-saved">Your Papers</button><button type="button" class="cb-button" id="cb-prompt-btn">Get Questions in ChatGPT</button><details class="cb-more-tools"><summary class="cb-button"><i class="fas fa-ellipsis-h" aria-hidden="true" style="margin-right:8px"></i>More Tools</summary><div class="cb-more-tools-menu"><label class="cb-button cb-file-label">Import draft / questions<input type="file" id="cb-import-file" accept=".json,application/json"></label><button type="button" class="cb-button" id="cb-copy-prompt-btn">Copy / download request</button></div></details></div><div id="cb-status" class="cb-notice" hidden></div>`;
    $('#subjects-sections-area').before(panel);
    $('#cb-default-size').onchange = e => { state.defaultMarks = Number(e.target.value); status('Default size updated. Existing subjects keep their selected sizes; change those in their own cards.'); };
    $('#cb-saved').onclick = savedDrafts; $('#cb-prompt-btn').onclick = openCBSEInChatGPT; $('#cb-copy-prompt-btn').onclick = aiPromptDialog;
    $('#cb-import-file').onchange = async e => {
      const file = e.target.files[0]; if (!file) return;
      try {
        const text = await file.text(), parsed = JSON.parse(text);
        if (parsed.schema === 'scimentra-cbse-paper-v2') restoreDraft(parsed);
        else {
          $('#global-paste-area').value = text;
          const source = $('#exam-source-dropdown'); source.dataset.value = 'Paste'; $('.selected-option', source).textContent = 'Paste'; source.dispatchEvent(new Event('change', { bubbles: true }));
          status('Question inventory imported. Select the matching class, subjects and chapters, then build.');
        }
      } catch (e) { errorDialog('Could not import JSON', [e.message]); }
      e.target.value = '';
    };
    $('#exam-setup-form').addEventListener('submit', event => { if (!cbse()) return; event.preventDefault(); event.stopImmediatePropagation(); build(); }, true);
    $('#ai-get-questions-btn')?.addEventListener('click', event => { if (!cbse()) return; event.preventDefault(); event.stopImmediatePropagation(); openCBSEInChatGPT(); }, true);
    $('#subjects-sections-area').addEventListener('change', e => { if (cbse() && e.target.closest('[id^="chapters-multiselect-"]')) { const block = e.target.closest('.subject-block'); updateChapterMap(Number(block.dataset.cbIndex)); } });
    $('#subjects-sections-area').addEventListener('input', e => { if (cbse() && e.target.matches('.ai-manual-chapters-input')) updateChapterMap(Number(e.target.closest('.subject-block').dataset.cbIndex)); });
  }
  function syncBoard() {
    initPanel(); const is = cbse(), board = getSelectedBoard(); document.body.classList.toggle('cb-mode', is); $('#cb-panel').hidden = !is;
    const paperGroup = $('#paper-type-dropdown').closest('.form-group'); if (is) paperGroup.style.display = 'none'; else if (previousBoard === 'CBSE') { paperGroup.style.display = ''; $('#max-marks-input').readOnly = false; }
    const subtitle = $('#main-header .subtitle'); if (subtitle) subtitle.textContent = is ? 'CBSE QUESTION PAPER BUILDER' : 'IIT & NEET FOUNDATION';
    if (is) {
      const nextContext = `${getSelectedClass()}|CBSE`;
      if (state.context !== nextContext) { state.subjects.clear(); state.pools.clear(); state.context = nextContext; }
      syncSource();
    }
    previousBoard = board;
  }
  document.addEventListener('DOMContentLoaded', () => {
    initPanel();
    ['board-dropdown', 'class-dropdown', 'exam-source-dropdown'].forEach(id => document.getElementById(id).addEventListener('change', () => setTimeout(syncBoard, 0)));
    syncBoard();
  });
  window.CBSEBuilder = { renderSubject, syncBoard, syncSource, build, state, paperErrors, paperHTML, auditHTML, restoreDraft, promptText, showReview };
})();
