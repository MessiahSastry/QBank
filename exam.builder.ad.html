function __ebCollectAIBlueprint() {

    const errors = [];

    const selectedClass = getSelectedClass();
    const selectedBoard = getSelectedBoard();
    const selectedSubjects = getSelectedSubjects();

    const examName =
        (document.getElementById('exam-name-input')?.value || '').trim();

    const maxMarks =
        Number(document.getElementById('max-marks-input')?.value || 0);

    const time =
        Number(document.getElementById('time-input')?.value || 0);

    const date =
        document.getElementById('date-input')?.value || '';

    const instructions =
        (document.getElementById('instructions-input')?.value || '').trim();

    const paperType = getPaperType();

    const difficultyDistribution =
        getDifficultyDistribution();

    if (!selectedClass) {
        errors.push('Please select Class.');
    }

    if (!selectedBoard) {
        errors.push('Please select Board.');
    }

    if (!selectedSubjects.length) {
        errors.push('Please select at least one Subject.');
    }

    if (!__ebIsEntranceExamBoard(selectedBoard)) {

        const totalDifficulty =
            Number(difficultyDistribution.L1 || 0) +
            Number(difficultyDistribution.L2 || 0) +
            Number(difficultyDistribution.L3 || 0);

        const checkedLevels =
            getAllowedDifficultyLevels();

        if (!checkedLevels.length) {
            errors.push(
                'Please select at least one difficulty level.'
            );
        }

        if (totalDifficulty !== 100) {
            errors.push(
                'Difficulty percentages must total 100%.'
            );
        }
    }

    const subjects = [];

    document
        .querySelectorAll('.subject-block')
        .forEach((subjectBlock) => {

            const subject =
                subjectBlock.dataset.subject || '';

            const chapterDropdown =
                subjectBlock.querySelector(
                    '[id^="chapters-multiselect-"]'
                );

            const allChapters =
                !!chapterDropdown?.querySelector(
                    'input[value="__ALL__"]:checked'
                );

            const chapters =
                allChapters
                    ? []
                    : Array.from(
                        chapterDropdown?.querySelectorAll(
                            'input[type="checkbox"]:checked:not([value="__ALL__"])'
                        ) || []
                    ).map(cb => cb.value);

            if (!allChapters && chapters.length === 0) {
                errors.push(
                    `Please select at least one chapter for ${subject}.`
                );
            }

            const sections = [];

            subjectBlock
                .querySelectorAll('.section-item')
                .forEach((sectionItem) => {

                    const label =
                        sectionItem
                            .querySelector(
                                '.section-label-dropdown'
                            )
                            ?.dataset?.value || '';

                    const mcqType =
                        sectionItem
                            .querySelector(
                                '.mcq-type-dropdown'
                            )
                            ?.dataset?.value || '';

                    const typeLabel =
                        sectionItem
                            .querySelector(
                                '.section-type-dropdown'
                            )
                            ?.dataset?.value || '';

                    const typeIndex =
                        config.sectionTypes.indexOf(
                            typeLabel
                        );

                    const type =
                        config.sectionTypeKeys[
                            typeIndex
                        ] || '';

                    const section = {
                        label,
                        mcqType,
                        type
                    };

                    if (!label) {
                        errors.push(
                            `${subject}: Select section label.`
                        );
                    }

                    if (!mcqType) {
                        errors.push(
                            `${subject} - ${label || 'Section'}: Select question type.`
                        );
                    }

                    if (type === 'all') {

                        section.numQuestions =
                            Number(
                                sectionItem
                                    .querySelector(
                                        '.num-questions-input'
                                    )
                                    ?.value || 0
                            );

                        section.marksPerQuestion =
                            Number(
                                sectionItem
                                    .querySelector(
                                        '.marks-per-question-input'
                                    )
                                    ?.value || 0
                            );

                        if (section.numQuestions < 1) {
                            errors.push(
                                `${subject} - ${label}: Number of questions must be at least 1.`
                            );
                        }

                        if (section.marksPerQuestion < 1) {
                            errors.push(
                                `${subject} - ${label}: Marks per question must be at least 1.`
                            );
                        }

                    } else if (type === 'any') {

                        section.numQuestions =
                            Number(
                                sectionItem
                                    .querySelector(
                                        '.num-questions-input'
                                    )
                                    ?.value || 0
                            );

                        section.attemptAny =
                            Number(
                                sectionItem
                                    .querySelector(
                                        '.attempt-any-input'
                                    )
                                    ?.value || 0
                            );

                        section.marksPerQuestion =
                            Number(
                                sectionItem
                                    .querySelector(
                                        '.marks-per-question-input'
                                    )
                                    ?.value || 0
                            );

                        if (section.numQuestions < 1) {
                            errors.push(
                                `${subject} - ${label}: Number of questions must be at least 1.`
                            );
                        }

                        if (
                            section.attemptAny < 1 ||
                            section.attemptAny >
                            section.numQuestions
                        ) {
                            errors.push(
                                `${subject} - ${label}: Check the "Attempt any" value.`
                            );
                        }

                        if (section.marksPerQuestion < 1) {
                            errors.push(
                                `${subject} - ${label}: Marks per question must be at least 1.`
                            );
                        }

                    } else if (type === 'internal') {

                        section.numPairs =
                            Number(
                                sectionItem
                                    .querySelector(
                                        '.num-pairs-input'
                                    )
                                    ?.value || 0
                            );

                        section.marksPerQuestion =
                            Number(
                                sectionItem
                                    .querySelector(
                                        '.marks-per-question-input'
                                    )
                                    ?.value || 0
                            );

                        section.pairs = [];

                        sectionItem
                            .querySelectorAll(
                                '.internal-choice-pairs > div'
                            )
                            .forEach((pairDiv) => {

                                const chapterA =
                                    (
                                        pairDiv
                                            .querySelector(
                                                '.pair-chapter-a'
                                            )
                                            ?.value || ''
                                    ).trim();

                                const chapterB =
                                    (
                                        pairDiv
                                            .querySelector(
                                                '.pair-chapter-b'
                                            )
                                            ?.value || ''
                                    ).trim();

                                section.pairs.push({
                                    chapterA,
                                    chapterB
                                });
                            });

                        if (section.numPairs < 1) {
                            errors.push(
                                `${subject} - ${label}: Number of internal-choice pairs must be at least 1.`
                            );
                        }

                        if (section.marksPerQuestion < 1) {
                            errors.push(
                                `${subject} - ${label}: Marks per pair must be at least 1.`
                            );
                        }
                    }

                    sections.push(section);
                });

            if (!sections.length) {
                errors.push(
                    `Please add at least one section for ${subject}.`
                );
            }

            subjects.push({
                subject,
                chapters,
                allChapters,
                sections
            });
        });

    return {
        errors,

        blueprint: {
            className: selectedClass,
            board: selectedBoard,
            subjects,
            examName,
            maxMarks,
            time,
            date,
            paperType,
            instructions,
            difficultyDistribution
        }
    };
}

or gives another instruction clearly asking for the final set.

=========================================================
STAGE 2 — FINAL SET
=========================================================

Only when the teacher asks for the FINAL SET:

- Give ONLY the final question set.
- Put the complete final set inside ONE copy-code block.
- Do NOT write anything before the code block.
- Do NOT write anything after the code block.
- Do NOT write subject headings.
- Do NOT write section headings.
- Do NOT write chapter headings.
- Keep exactly the same order required by the original blueprint.

Number all MAIN question blocks continuously:

Q1:
Q2:
Q3:
...

Do not restart numbering between sections or subjects.

Every final question MUST contain:

1. Question
2. Answer
3. Explanation

The Exam Builder will separate these and store them in Exam Review.

=========================================================
FINAL SET LATEX RULES
=========================================================

For all mathematical expressions:

- Use ONLY inline LaTeX delimiters: \\( ... \\).
- Do NOT use \\[ ... \\].
- Do NOT use $ ... $.
- Do NOT use $$ ... $$.
- Do NOT use display mathematics.
- Preserve every LaTeX backslash exactly.
- Keep ordinary words and sentences outside LaTeX.
- Do not replace proper mathematical notation with Unicode approximations.

Examples:

\\(x^2+5x+6=0\\)

\\(\\frac{3}{4}\\)

\\(\\sqrt{72}\\)

\\(2^{n+1}\\)

\\(\\frac{x+3}{x-2}\\)

Matrices must use proper LaTeX.

Example:

\\(\\begin{bmatrix}1 & 2 \\\\ 3 & 4\\end{bmatrix}\\)

Use:
- & between matrix columns
- \\\\ between matrix rows

=========================================================
MCQ SINGLE
=========================================================

Use exactly:

Q<num>:
<Question>
A) ...
B) ...
C) ...
D) ...
Ans: <one correct letter>
Explanation:
<Explanation>

Exactly ONE option must be correct.

=========================================================
MCQ MULTIPLE
=========================================================

Use exactly:

Q<num>:
<Question>
A) ...
B) ...
C) ...
D) ...
Ans: <correct letters separated by commas>
Explanation:
<Explanation>

Example:

Ans: A,C

At least one option must be correct.

=========================================================
ASSERTION AND REASON
=========================================================

Use exactly:

Q<num>:
Assertion: ...
Reason: ...
A) ...
B) ...
C) ...
D) ...
Ans: <one correct letter>
Explanation:
<Explanation>

=========================================================
MATCHING MATRIX
=========================================================

Matching Matrix is the Foundation / normal 4 × 4 matching format.

Use exactly:

Q<num>:
Match the following:
Column I                    Column II
A) <Item A>                 P) <Item P>
B) <Item B>                 Q) <Item Q>
C) <Item C>                 R) <Item R>
D) <Item D>                 S) <Item S>

Options:
A) A-P, B-Q, C-R, D-S
B) A-<letter>, B-<letter>, C-<letter>, D-<letter>
C) A-<letter>, B-<letter>, C-<letter>, D-<letter>
D) A-<letter>, B-<letter>, C-<letter>, D-<letter>

Ans: <one correct option letter>
Explanation:
<Explanation>

MATCHING MATRIX RULES:

- Column I must contain exactly A), B), C), D).
- Column II must contain exactly P), Q), R), S).
- This is a 4 × 4 matching structure.
- Do NOT add a fifth item to Column II.
- The line "Options:" is compulsory.
- Put "Options:" on its own line.
- The A), B), C), D) before Options: are Column-I row labels.
- The A), B), C), D) after Options: are answer-choice labels.
- Give exactly four complete answer choices.
- Exactly ONE answer choice must be correct.
- Ans: must contain only the correct option letter.
- Explanation: must explain the correct relationships.

=========================================================
MATCHING LIST — JEE ADVANCED
=========================================================

Matching List is DIFFERENT from Matching Matrix.

It uses FOUR items in List-I and FIVE items in List-II.

Use exactly:

Q<num>:
Match the following:
List-I                      List-II
P) <Item P>                 1) <Item 1>
Q) <Item Q>                 2) <Item 2>
R) <Item R>                 3) <Item 3>
S) <Item S>                 4) <Item 4>
                            5) <Item 5>

Options:
A) P-<number>, Q-<number>, R-<number>, S-<number>
B) P-<number>, Q-<number>, R-<number>, S-<number>
C) P-<number>, Q-<number>, R-<number>, S-<number>
D) P-<number>, Q-<number>, R-<number>, S-<number>

Ans: <one correct option letter>
Explanation:
<Explanation>

MATCHING LIST RULES:

- Use this format for JEE Advanced Matching List.
- List-I must contain exactly:
  P), Q), R), S).
- List-II must contain exactly:
  1), 2), 3), 4), 5).
- List-II must have FIVE entries.
- The fifth entry 5) is compulsory.
- Do NOT reduce List-II to four entries.
- Do NOT use A), B), C), D) as List-I labels.
- Do NOT use P), Q), R), S) as List-II labels.
- A), B), C), D) must be used ONLY for the four answer choices after "Options:".
- Every answer choice must contain a complete mapping of P, Q, R and S.
- A mapping may use any appropriate item from 1), 2), 3), 4), 5).
- Exactly ONE complete answer combination must be correct.
- Distractor combinations must be plausible.
- Verify every P/Q/R/S relationship independently.
- Ans: must contain only the correct answer-choice letter.
- Explanation: must explain the correct matching relationships.

IMPORTANT FOR BOTH FORMATS:

- "Options:" must always appear on its own line.
- Do not mix the matching data with the answer choices.
- Do not omit Ans:.
- Do not omit Explanation:.

=========================================================
NUMERICAL VALUE
=========================================================

Use exactly:

Q<num>:
<Question>
Answer:
<Final answer>
Explanation:
<Complete solution>

=========================================================
FILL IN THE BLANKS
=========================================================

Use exactly:

Q<num>:
<Question>
Answer:
<Correct answer>
Explanation:
<Short explanation>

=========================================================
DESCRIPTIVE
=========================================================

Use exactly:

Q<num>:
<Question>
Answer:
<Final answer>
Explanation:
<Complete explanation / solution>

=========================================================
PARAGRAPH-BASED MCQ
=========================================================

Treat each complete passage set as ONE main Q<num> block.

Use exactly this structure:

Q<num>:
Passage:
<complete passage>

Sub-question (i):
<question>
A) ...
B) ...
C) ...
D) ...
Ans: <one correct letter>
Explanation:
<Explanation>

Sub-question (ii):
<question>
A) ...
B) ...
C) ...
D) ...
Ans: <one correct letter>
Explanation:
<Explanation>

If more sub-questions are required, continue with:

Sub-question (iii):
Sub-question (iv):

and so on.

IMPORTANT:

- Use only ONE main Q<num>: for the entire passage set.
- Do NOT give Q numbers to the sub-questions.
- "Passage:" must appear on its own line.
- Write "Sub-question (i):", "Sub-question (ii):", etc. exactly.
- Every sub-question must have exactly four options A), B), C), D).
- Every sub-question must have its own Ans:.
- Every sub-question must have its own Explanation:.
- Do NOT give one common Answer or Explanation for the whole passage.
- Each paragraph MCQ sub-question is single-correct unless the blueprint says otherwise.

=========================================================
EXPLANATION RULES
=========================================================

For Mathematics and calculation-based Physics / Chemistry:

- Give complete working.
- Put ONE calculation or reasoning statement on each separate line.
- Do NOT write "Step 1", "Step 2", "Step 3", etc.
- Do NOT combine all working into one paragraph.
- Keep the final answer separately under Ans: or Answer:.
- Use inline LaTeX \\( ... \\).
- Do NOT use display mathematics.

Example:

Answer:
\\(x=5\\)

Explanation:
\\(3x+7=22\\)
\\(3x=15\\)
\\(x=5\\)

For non-mathematical / conceptual questions:

- Give the explanation point-wise.
- Put ONE point on each separate line.
- Start each point with a hyphen.
- Do NOT number explanation points as 1., 2., 3., etc.
- Do NOT use Q1, Q2, Q3 inside explanations.

Example:

Explanation:
- Photosynthesis enables plants to prepare food.
- It converts light energy into chemical energy.
- It releases oxygen into the atmosphere.

IMPORTANT:

Never use numbered explanation points such as:

1. ...
2. ...
3. ...

because numbered lines are reserved for question parsing.

=========================================================
FINAL CHECK
=========================================================

Before giving the FINAL SET, silently verify:

- Total number of questions is correct.
- Question order is correct.
- Question types are correct.
- Every question belongs to the selected chapter(s).
- Every MCQ has exactly four options.
- Every MCQ answer agrees with its options.
- Every question has an Answer or Ans:.
- Every question has an Explanation:.
- Mathematical calculations are correct.
- Answer and explanation agree.
- Inline LaTeX is used correctly.
- No display mathematics is used.
- No extra headings or commentary are inside the final set.
`;
}


/* =========================================================
   BUILD COMPLETE EXAM-BLUEPRINT PROMPT
   ========================================================= */

function __ebBuildAIExamPrompt(blueprint) {

    const {
        className,
        board,
        subjects,
        examName,
        maxMarks,
        time,
        date,
        paperType,
        instructions,
        difficultyDistribution
    } = blueprint;

    const entranceMode =
        __ebIsEntranceExamBoard(board);

    let prompt = `
You are generating QUESTIONS ONLY for an examination.

Do NOT create the visual question-paper layout.
Do NOT add school headers, decorative formatting or paper styling.

The generated questions will be pasted back into an Exam Builder.
The Exam Builder will handle:
- sections,
- numbering in the final paper,
- instructions,
- Exam Review,
- Preview,
- paper layout and styling.

EXAM DETAILS

Class: ${className}
Board: ${board}
Exam Name: ${examName || 'Not specified'}
Paper Type: ${paperType || 'Custom Paper'}
Maximum Marks: ${maxMarks || 'Not specified'}
Time: ${time ? `${time} minutes` : 'Not specified'}
Date: ${date || 'Not specified'}

${__ebBuildAIBoardRules(board)}
`;

    if (!entranceMode) {

        prompt += `

OVERALL DIFFICULTY DISTRIBUTION:

Level 1: ${Number(difficultyDistribution.L1 || 0)}%
Level 2: ${Number(difficultyDistribution.L2 || 0)}%
Level 3: ${Number(difficultyDistribution.L3 || 0)}%

Use this distribution across the generated questions unless an exact section-level plan is given below.
`;
    }

    prompt += `

QUESTION BLUEPRINT — FOLLOW THIS ORDER EXACTLY
`;

    let sequenceNumber = 1;

    subjects.forEach((subjectData) => {

        const chapterText =
            subjectData.allChapters
                ? 'All Chapters'
                : subjectData.chapters.join(', ');

        subjectData.sections.forEach((section) => {

            const generatedCount =
                section.type === 'internal'
                    ? Number(section.numPairs || 0) * 2
                    : Number(section.numQuestions || 0);

            let attemptInstruction = '';

            if (section.type === 'all') {

                attemptInstruction =
                    `Generate ${section.numQuestions} question(s).`;

            } else if (section.type === 'any') {

                attemptInstruction =
                    `Generate ${section.numQuestions} question(s). Students will attempt any ${section.attemptAny}.`;

            } else if (section.type === 'internal') {

                attemptInstruction =
                    `Generate ${section.numPairs} internal-choice pair(s). ` +
                    `Each pair requires TWO separate question blocks: Alternative A followed immediately by Alternative B. ` +
                    `Therefore generate ${generatedCount} question blocks for this section.`;
            }

            let levelPlanText = '';

            if (!entranceMode) {

                try {

                    const planCount =
                        section.type === 'internal'
                            ? generatedCount
                            : Number(
                                section.numQuestions || 0
                            );

                    const fixedPlan =
                        getFixedSectionLevelPlan({
                            paperType,
                            maxMarks,
                            mcqType: section.mcqType,
                            numQuestions: planCount,
                            marksPerQuestion:
                                section.marksPerQuestion
                        });

                    if (
                        Array.isArray(fixedPlan) &&
                        fixedPlan.length === planCount
                    ) {

                        levelPlanText =
                            `\nExact difficulty order for this section: ` +
                            fixedPlan
                                .map(x =>
                                    x === 'L1'
                                        ? 'Level 1'
                                        : x === 'L2'
                                            ? 'Level 2'
                                            : 'Level 3'
                                )
                                .join(', ') +
                            '.';
                    }

                } catch (err) {
                    console.warn(
                        'Could not build fixed level plan',
                        err
                    );
                }
            }

            let internalPairText = '';

            if (
                section.type === 'internal' &&
                Array.isArray(section.pairs) &&
                section.pairs.length
            ) {

                const pairLines =
                    section.pairs
                        .map((pair, index) => {

                            const a =
                                pair.chapterA ||
                                'selected chapter(s)';

                            const b =
                                pair.chapterB ||
                                'selected chapter(s)';

                            return (
                                `Pair ${index + 1}: ` +
                                `Alternative A from "${a}"; ` +
                                `Alternative B from "${b}".`
                            );
                        })
                        .join('\n');

                internalPairText =
                    `\nInternal-choice chapter guidance:\n${pairLines}`;
            }

            let paragraphNote = '';

            if (
                section.mcqType ===
                'Paragraph-Based MCQ (Single Correct)'
            ) {

                paragraphNote =
                    `\nFor each required question, generate one passage set with 2 single-correct MCQ sub-questions.`;
            }

            prompt += `

${sequenceNumber}. SUBJECT: ${subjectData.subject}
SECTION: ${section.label}
CHAPTERS: ${chapterText}
QUESTION TYPE: ${section.mcqType}
SECTION RULE: ${attemptInstruction}
MARKS: ${section.marksPerQuestion} mark(s) per ${
    section.type === 'internal'
        ? 'internal-choice pair'
        : 'question'
}.${levelPlanText}${internalPairText}${paragraphNote}
`;

            sequenceNumber++;
        });
    });


    if (instructions) {

        prompt += `

ADDITIONAL TEACHER INSTRUCTIONS:

${instructions}
`;
    }


    prompt += `

STRICT QUALITY CHECK:

- Every question must be academically correct.
- Verify calculations, facts, options and answers before output.
- Do not create ambiguous questions.
- Do not repeat the same question.
- Do not generate questions outside the selected chapters.
- Keep the standard appropriate to the selected board.
- Follow the requested question type exactly.
- For MCQ (Single), exactly one option must be correct.
- For MCQ (Multiple), at least one option must be correct.
- Keep distractors plausible.
- Preserve mathematical notation clearly.

${__ebBuildAIFormatRules()}

Before finalising, silently verify that the TOTAL NUMBER and ORDER of generated question blocks exactly match the blueprint.

Now generate the DRAFT question set for teacher review.

Do not give the FINAL SET until the teacher explicitly asks for it.
`;

    return prompt.trim();
}

function __ebOpenAIQuestionGenerator(prompt) {

    try {
        navigator.clipboard
            ?.writeText(prompt)
            .catch(() => {});
    } catch (_) {
        // Clipboard is optional.
    }

    const url =
        new URL('https://chatgpt.com/?');

    url.searchParams.set(
        'q',
        prompt
    );

    const opened =
        window.open(
            url.toString(),
            '_blank',
            'noopener'
        );

    if (!opened) {
        showToast(
            'Popup blocked. Please allow popups and click Get Questions again.',
            'error'
        );

        return;
    }

    showToast(
        'AI question request opened. Generate the questions and paste them back here.',
        'success'
    );
}

    selectedSubject: subjData.subject,
    chapters: pairAChapter,
    marksPerQuestion: sec.marksPerQuestion,
    mcqType: "Descriptive",
    count: 1,
    allowedDifficulties: allowedDifficultyLevels.map(k => k === 'L1' ? 'Level 1' : k === 'L2' ? 'Level 2' : 'Level 3')
});

const qB = await fetchQuestions({
    selectedClass,
    selectedBoard,
    selectedSubject: subjData.subject,
    chapters: pairBChapter,
    marksPerQuestion: sec.marksPerQuestion,
    mcqType: "Descriptive",
    count: 1,
    allowedDifficulties: allowedDifficultyLevels.map(k => k === 'L1' ? 'Level 1' : k === 'L2' ? 'Level 2' : 'Level 3')
});

                                    if (!qA.length || !qB.length) {
                                        missingPairs++;
                                        continue;
                                    }

                                    const qAText = getQuestionTextFromDoc(qA[0]);
                                    const qBText = getQuestionTextFromDoc(qB[0]);

                                   const qAAnswer = getQuestionAnswerFromDoc(qA[0]);
const qBAnswer = getQuestionAnswerFromDoc(qB[0]);

questions.push({
    number: p + 1,
    text: `(A) ${qAText}<br><div style="text-align:center;"><b>(OR)</b></div>(B) ${qBText}`,
    marks: sec.marksPerQuestion,
    options: [],
    answer: `(A) ${qAAnswer || ''}<br><div style="text-align:center;"><b>(OR)</b></div>(B) ${qBAnswer || ''}`,
    image: qA[0].image || qB[0].image || null
});
                                }

                                if (missingPairs > 0 || questions.length < sec.numPairs) {
                                    sectionErrors.push(`${subjData.subject} - ${sec.label}: Only ${questions.length} of ${sec.numPairs} pairs found.`);
                                }
                            }

                            const patchedSec = { ...sec };
                            if (sec.type === "all" || sec.type === "any") patchedSec.numQuestions = (questions || []).length;
                            if (sec.type === "internal") patchedSec.numPairs = (questions || []).length;

                            subjectBlock.sections.push({
                                ...patchedSec,
                                questions,
                                instructions: buildSectionInstructions(patchedSec)
                            });

                            if (sectionErrors.length) {
                                allSectionErrors = allSectionErrors.concat(sectionErrors);
                            }
                        }

                        finalPaper.subjects.push(subjectBlock);
                    }
                } else {
                    let rawText = '';

const pasteText =
    (
        document.getElementById('global-paste-area')
            ?.value || ''
    ).trim();

const hasPaste =
    pasteText.length > 0;

const hasDocx =
    !!window._globalDocxArrayBuffer;

let effective =
    sourceTypeGlobal;


/* ============================================
   AI GENERATE
   Uses exactly the same parser as Paste,
   but must come from the AI paste box.
   ============================================ */

if (effective === 'AI Generate') {

    if (!hasPaste) {

        allSectionErrors.push(
            'Please generate the questions and paste the AI-generated questions before building the exam.'
        );

    } else {

        rawText = pasteText;
    }


/* ============================================
   NORMAL PASTE / DOCX
   ============================================ */

} else {

    if (
        effective === 'Upload .docx' &&
        !hasDocx &&
        hasPaste
    ) {
        effective = 'Paste';
    }

    if (
        effective === 'Paste' &&
        !hasPaste &&
        hasDocx
    ) {
        effective = 'Upload .docx';
    }

    if (effective === 'Paste') {

        rawText =
            pasteText;

    } else if (
        effective === 'Upload .docx'
    ) {

        if (!hasDocx) {

            allSectionErrors.push(
                'No .docx file selected.'
            );

        } else {

            try {

                const result =
                    await window.mammoth.convertToHtml(
                        {
                            arrayBuffer:
                                window._globalDocxArrayBuffer
                        },
                        {
                            convertImage:
                                mammoth.images.inline(
                                    img =>
                                        img
                                            .read("base64")
                                            .then(
                                                b64 => ({
                                                    src:
                                                        `data:${img.contentType};base64,${b64}`
                                                })
                                            )
                                )
                        }
                    );

                rawText =
                    htmlToPlainText(
                        result?.value || ''
                    );

            } catch {

                allSectionErrors.push(
                    'Failed to read .docx file.'
                );
            }
        }
    }

    if (
        (
            effective === 'Paste' ||
            effective === 'Upload .docx'
        ) &&
        !rawText
    ) {
        allSectionErrors.push(
            'No questions detected in the provided source.'
        );
    }
}


/* ============================================
   PARSE + ALLOCATE
   ============================================ */

if (rawText) {

    const pool =
        parsePastedQuestionsToPool(
            rawText
        );

    if (!pool.length) {

        allSectionErrors.push(
            'No valid question blocks were detected.'
        );

    } else {

        const {
            errors: allocErrors
        } =
            allocateSequentiallyAcrossSections(
                subjectsData,
                pool,
                {
                    shuffleQuestions:
                        getGlobalShuffleQuestions(),

                    shuffleOptions:
                        getGlobalShuffleOptions()
                }
            );

        if (
            Array.isArray(allocErrors) &&
            allocErrors.length
        ) {

            allSectionErrors =
                allSectionErrors.concat(
                    allocErrors
                );
        }
    }
}

                    for (const subjData of subjectsData) {
                       const subjectBlock = {
    subject: subjData.subject,

    chapters:
        sourceTypeGlobal === 'AI Generate'
            ? (
                Array.isArray(subjData.chapters)
                    ? subjData.chapters.slice()
                    : []
            )
            : [],

    allChapters:
        sourceTypeGlobal === 'AI Generate'
            ? !!subjData.allChapters
            : false,

    sections: []
};

                        for (const sec of subjData.sections) {
                            const patched = { ...sec };
                            if (sec.type === 'all' || sec.type === 'any') patched.numQuestions = (sec.questions || []).length;
                            if (sec.type === 'internal') patched.numPairs = (sec.questions || []).length;

                            subjectBlock.sections.push({
                                ...patched,
                                questions: sec.questions || [],
                                instructions: buildSectionInstructions(patched)
                            });
                        }

                        finalPaper.subjects.push(subjectBlock);
                    }
                }

              if (allSectionErrors.length > 0) {
    const currentlyUnselected = getUnselectedDifficultyLevels();
    const shortageOnlySelectedLevels = allSectionErrors.some(e =>
    String(e).includes('Checked difficulty levels do not have enough questions.')
);

    if (sourceTypeGlobal === 'Question Bank' && shortageOnlySelectedLevels && currentlyUnselected.length > 0) {
        const labels = currentlyUnselected.map(levelKeyToLabel).join(', ');
        const allowMore = await showConfirmPrompt(
            `<b>Checked levels do not have enough questions.</b><br><br>` +
            `Do you want to use these unchecked levels: <b>${labels}</b>?`
        );

        if (allowMore) {
            if (currentlyUnselected.includes('L1')) document.getElementById('diff-l1-check').checked = true;
            if (currentlyUnselected.includes('L2')) document.getElementById('diff-l2-check').checked = true;
            if (currentlyUnselected.includes('L3')) document.getElementById('diff-l3-check').checked = true;

            const checkedNow = getAllowedDifficultyLevels();
            const equalPercent = Math.floor(100 / checkedNow.length);
            const remainder = 100 - (equalPercent * checkedNow.length);

            document.getElementById('diff-l1-percent').value = checkedNow.includes('L1') ? equalPercent : 0;
            document.getElementById('diff-l2-percent').value = checkedNow.includes('L2') ? equalPercent : 0;
            document.getElementById('diff-l3-percent').value = checkedNow.includes('L3') ? equalPercent : 0;

            if (checkedNow.length) {
                const last = checkedNow[checkedNow.length - 1];
                const el = document.getElementById(
                    last === 'L1' ? 'diff-l1-percent' :
                    last === 'L2' ? 'diff-l2-percent' :
                    'diff-l3-percent'
                );
                el.value = Number(el.value || 0) + remainder;
            }

            refreshDifficultyTotalNote();
            btn.disabled = false;
            btn.textContent = "Build Exam Draft";
            document.getElementById('exam-setup-form').dispatchEvent(new Event('submit'));
            return;
        } else {
            btn.disabled = false;
            btn.textContent = "Build Exam Draft";
            return;
        }
    }

   const cleanedErrors = allSectionErrors
    .filter(e => !String(e).includes('Checked difficulty levels do not have enough questions.'))
    .map(e => String(e));

if (cleanedErrors.length) {
    showModalPrompt(`<b>Please review:</b><br><ul style="text-align:left">${cleanedErrors.map(e => `<li>${e}</li>`).join('')}</ul>`);
}
    btn.disabled = false;
    btn.textContent = "Build Exam Draft";
    return;
}

                 if (
    sourceTypeGlobal === 'Question Bank' &&
    !(
        (difficultyDistribution.L1 === 100 && difficultyDistribution.L2 === 0 && difficultyDistribution.L3 === 0) ||
        (difficultyDistribution.L1 === 0 && difficultyDistribution.L2 === 100 && difficultyDistribution.L3 === 0) ||
        (difficultyDistribution.L1 === 0 && difficultyDistribution.L2 === 0 && difficultyDistribution.L3 === 100)
    )
) {
    const actual = { L1: 0, L2: 0, L3: 0 };

                    for (const subj of finalPaper.subjects || []) {
                        for (const sec of subj.sections || []) {
                            if (sec.type === "all" || sec.type === "any") {
                                for (const q of (sec.questions || [])) {
                                    if (q._assignedLevel === 'L1') actual.L1 += (q.marks || 0);
                                    if (q._assignedLevel === 'L2') actual.L2 += (q.marks || 0);
                                    if (q._assignedLevel === 'L3') actual.L3 += (q.marks || 0);
                                }
                            }
                        }
                    }

                    const g = (typeof _mixedG !== 'undefined' && _mixedG) ? _mixedG : 1;
                    const tgt = (typeof _mixedTargets !== 'undefined' && _mixedTargets) ? _mixedTargets : { L1:0, L2:0, L3:0 };

                    const d1 = Math.abs((actual.L1||0) - (tgt.L1||0));
                    const d2 = Math.abs((actual.L2||0) - (tgt.L2||0));
                    const d3 = Math.abs((actual.L3||0) - (tgt.L3||0));
                    const ok = (d1 <= g) && (d2 <= g) && (d3 <= g);

                    if (!ok) {
                        showToast(`Mixed: totals L1/L2/L3 achieved ${actual.L1}/${actual.L2}/${actual.L3} (target ${tgt.L1}/${tgt.L2}/${tgt.L3}, ±${g} allowed)`, 'info');
                    }
                }

                                function _finalStemKey(raw, marks, mcqType = '') {
    let t = String(raw || '');

    const normalizedType = normalizeMcqType(mcqType);

    const isMatchingStyle =
        normalizedType === 'Matching Matrix' ||
        normalizedType === 'Matching List' ||
        (/Column\s*I/i.test(raw) && /Column\s*II/i.test(raw)) ||
        (/List-I/i.test(raw) && /List-II/i.test(raw));

    t = t.replace(/^\s*(?:Q\.?\s*)?\d+\s*[:.)-]?\s*/i, '');
    t = t.replace(/<img[^>]*>/gi, ' ')
         .replace(/<[^>]+>/g, ' ')
         .replace(/\bAns?\s*:\s*.*$/i, '');

    if (isMatchingStyle) {
        t = t.replace(/\s*\bOptions\s*:\s*[\s\S]*$/i, '');
    } else {
        t = t.replace(/\s+[A-D][).:][\s\S]*$/i, '');
    }

    try { t = t.normalize('NFKC'); } catch (e) {}

    t = t.replace(/[\u200B-\u200D\uFEFF]/g, '')
         .replace(/[\u2010-\u2015\u2212]/g, '-')
         .replace(/[\u2018\u2019\u201A\u2032]/g, "'")
         .replace(/[\u201C\u201D\u2033]/g, '"')
         .replace(/\u00A0/g, ' ')
         .replace(/\s+/g, ' ')
         .trim()
         .toLowerCase()
         .replace(/[.,;:!?]+$/g, '');

    return t ? (t + '||m=' + (marks ?? '')) : '';
}
                try {
                    if (sourceTypeGlobal === 'Question Bank') {
                        (finalPaper.subjects || []).forEach(s => {
                            const subjectSeen = new Set();

                            (s.sections || []).forEach(sec => {
                                const perSectionSeen = new Set();
                                const out = [];
                                const fallbackMarks = Number(sec.marksPerQuestion ?? 0);

                                for (const q of (sec.questions || [])) {
                                    if (q && 'srcId' in q) delete q.srcId;
                                    const stem  = q?.text ?? q?.question ?? '';
                                    const marks = Number(q?.marks ?? fallbackMarks);
                                    const k = _finalStemKey(stem, marks, sec.mcqType);

                                    if (!k) {
                                        out.push(q);
                                        continue;
                                    }
                                    if (perSectionSeen.has(k) || subjectSeen.has(k)) continue;

                                    perSectionSeen.add(k);
                                    subjectSeen.add(k);
                                    out.push(q);
                                }

                                sec.questions = out.map((q, i) => ({ ...q, number: i + 1 }));

                                if (sec.type === 'internal') {
                                    sec.numPairs = sec.questions.length;
                                } else {
                                    sec.numQuestions = sec.questions.length;
                                }
                            });
                        });
                    } else {
                        (finalPaper.subjects || []).forEach(s => {
                            (s.sections || []).forEach(sec => {
                                const fallbackMarks = Number(sec.marksPerQuestion ?? 0);
                                sec.questions = (sec.questions || []).map((q, i) => {
                                    if (q && 'srcId' in q) delete q.srcId;
                                    if (q && (q.marks == null || isNaN(q.marks))) q.marks = fallbackMarks;
                                    return { ...q, number: i + 1 };
                                });

                                if (sec.type === 'internal') {
                                    sec.numPairs = sec.questions.length;
                                } else {
                                    sec.numQuestions = sec.questions.length;
                                }
                            });
                        });
                    }
                } catch (e) {
                    console.warn('final cleanup error:', e);
                }

                sessionStorage.setItem('examPaper', JSON.stringify(finalPaper));
                window.location.href = 'exam-review.html';

            } catch (err) {
                showToast("Error building exam: " + (err.message || err), "error");
            }

            btn.disabled = false;
            btn.textContent = "Build Exam Draft";
        });
    });
});
