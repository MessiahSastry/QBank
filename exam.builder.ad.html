function showToast(message, type = 'info') {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.style.background = type === 'error' ? '#c82333' : '#0f3d6b';

    function escapeHtml(str) {
    return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function openManualPickModal({ title, questions, requiredCount, marksPerQuestion, mcqType, requiredLevelPlan = null }) {
    return new Promise(resolve => {

                </span>

                    Selected: 0 / ${requiredCount}
                </span>
            </div>
        `;

        listBox.innerHTML = '';

                      questions.forEach((q, idx) => {

            card.style.display = 'block';
            card.style.background = '#fff';
            card.style.border = '1px solid #cfe0f1';
            card.style.borderRadius = '12px';
            card.style.padding = '12px 14px';
            card.style.marginBottom = '12px';
            card.style.cursor = 'pointer';

            let questionContent = '';

            if (isParagraphBased) {
                const subQuestionsHtml = (Array.isArray(q.mcqs) ? q.mcqs : []).map((mcq, subIndex) => {
                    const subQuestion = String(
                        mcq.question ||
                        String(mcq.body || '').split('\n')[0] ||
                        ''
                    ).trim();

                    const subOptions = Array.isArray(mcq.options)
                        ? mcq.options.slice(0, 4)
                        : [];

                    const optionsHtml = subOptions.length === 4
                        ? `

function extractMCQOptions(q) {
  if (Array.isArray(q?.options) && q.options.length === 4) return q.options;

  let s = String(q?.question || q?.text || q?.body || '');
  s = s.replace(/\r/g, '');

  const labelRe = /(^|\s)([ABCD])[\)\.]\s/gi;
  const hits = [];
  let m;
  while ((m = labelRe.exec(s)) !== null) {
    hits.push({ letter: m[2].toUpperCase(), i: m.index + m[0].length });
  }

  const need = ['A', 'B', 'C', 'D'];
  const map = {};
  for (const h of hits) {
    if (!(h.letter in map)) map[h.letter] = h.i;
  }
  if (!need.every(L => map[L] != null)) return null;

  const endA = map['B'];
  const endB = map['C'];
  const endC = map['D'];
  const ansIdx = (s.match(/\bAns?\s*:/i)?.index) ?? s.length;
  const endD = ansIdx;

  const A = s.slice(map['A'], endA).trim();
  const B = s.slice(map['B'], endB).trim();
  const C = s.slice(map['C'], endC).trim();
  const D = s.slice(map['D'], endD).trim();

  return [A, B, C, D];
}
function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}
function shuffleMCQQuestion(questionObj) {
    if (!questionObj.options || !questionObj.options.length) return questionObj;

    let { options, answer } = questionObj;
    let correctIndices = [];

    if (Array.isArray(answer)) {
        if (answer.length && typeof answer[0] === 'number') {
            correctIndices = answer.filter(i => Number.isInteger(i) && i >= 0 && i < 4);
        } else {
            correctIndices = extractAnswerLetters(answer)
                .map(l => "ABCD".indexOf(l))
                .filter(i => i >= 0);
        }
    } else {
        correctIndices = extractAnswerLetters(answer)
            .map(l => "ABCD".indexOf(l))
            .filter(i => i >= 0);
    }

    const optPairs = options.map((opt, idx) => ({ opt, idx }));
    shuffleArray(optPairs);

    const newOptions = optPairs.map(p => p.opt);
    const newCorrectIndices = [];

    optPairs.forEach((p, newIdx) => {
        if (correctIndices.includes(p.idx)) newCorrectIndices.push(newIdx);
    });

    const ansLetters = Array.from(new Set(newCorrectIndices.map(i => "ABCD"[i])));
    return { ...questionObj, options: newOptions, answer: ansLetters.join(',') };
}
function splitCounts(total, percents) {
    let result = percents.map(p => Math.floor(total * p / 100));
    let sum = result.reduce((a, b) => a + b, 0);
    let diff = total - sum;
    for (let i = 0; diff > 0; i++, diff--) result[i % result.length]++;
    return result;
}

function htmlToPlainText(html) {
  if (!html) return '';
  let s = String(html);
  s = s.replace(/<\/p\s*>/gi, '\n')
       .replace(/<br\s*\/?>/gi, '\n')
       .replace(/<\/li\s*>/gi, '\n')
       .replace(/<\/h[1-6]\s*>/gi, '\n');
  s = s.replace(/<[^>]+>/g, ' ');
  s = s.replace(/&nbsp;/gi, ' ')
       .replace(/&amp;/gi, '&')
       .replace(/&lt;/gi, '<')
       .replace(/&gt;/gi, '>')
       .replace(/&#39;/gi, "'")
       .replace(/&quot;/gi, '"');
  s = s.replace(/\r/g, '')
     .replace(/\u00A0/g, ' ')
     .replace(/[ \t]+\n/g, '\n')
     .replace(/[ \t]{2,}/g, ' ')
     .replace(/\n{2,}/g, '\n\n')
     .trim();
  s = s.replace(/\n/g, '\n');
  return s;
}

function parsePastedQuestionsToPool(raw) {
  if (!raw) return [];
  let text = String(raw);

  if (/<[a-z][\s\S]*>/i.test(text)) {
    text = htmlToPlainText(text);
  } else {
    text = text.replace(/\r/g, '').trim();
  }

  // Remove Markdown copy-code fences without touching LaTeX.
  text = text
    .replace(/```(?:text|plaintext|latex|tex)?\s*/gi, '')
    .replace(/```/g, '')
    .trim();

  if (!text) return [];
  const lines = text.split('\n');
  const merged = [];
  for (let i = 0; i < lines.length; i++) {
    const cur = lines[i].trim();
    if (/^(?:Q\.?\s*)?\d+\s*[\.\)]?$/.test(cur) && i + 1 < lines.length) {
      lines[i + 1] = `${cur} ${lines[i + 1]}`;
      continue;
    }
    merged.push(lines[i]);
  }
  const norm = merged.join('\n');

  const headerRe = /^[ \t]*(?:Q\.?\s*)?(\d+)(?:[.:)]|\s)\s*/gmi;
  const starts = [];
  let m;
  while ((m = headerRe.exec(norm)) !== null) {
    starts.push(m.index);
  }
  if (!starts.length) {
    const byLines = norm.split(/\n{2,}/).map(s => s.trim()).filter(Boolean);
    return byLines.length ? byLines : [norm.trim()];
  }

  const blocks = [];
  for (let i = 0; i < starts.length; i++) {
    const start = starts[i];
    const end = i + 1 < starts.length ? starts[i + 1] : norm.length;
    const slice = norm.slice(start, end);
    const cleaned = slice.replace(/^[ \t]*(?:Q\.?\s*)?\d+(?:[.:)]|\s)\s*/, '').trim();
    if (cleaned) blocks.push(cleaned);
  }
  return blocks;
}

function allocateSequentiallyAcrossSections(
  subjectsData,
  pool,
  {
    shuffleQuestions = true,
    shuffleOptions = true
  } = {}
) {

  const errors = [];
  let index = 0;

  const stripLead = s =>
    String(s || '')
      .replace(/^\s*(?:Q\.?\s*)?\d+(?:[.:)]|\s)\s*/, '')
      .trim();


  function toReviewHtml(value) {
    return String(value || '')
      .replace(/\r/g, '')
      .replace(/```(?:text|plaintext|latex|tex)?/gi, '')
      .replace(/```/g, '')
      .split('\n')
      .map(line => line.trim())
      .filter(Boolean)
      .join('<br>');
  }


  function cleanOption(option) {
    return String(option || '')
      .replace(/^[A-D][)\.]\s*/i, '')
      .replace(/\s+[A-D][)\.]?\s*$/i, '')
      .replace(/\s{2,}/g, ' ')
      .trim();
  }


  function parseFinalQuestionBlock(input) {

    let raw = stripLead(input)
      .replace(/```(?:text|plaintext|latex|tex)?/gi, '')
      .replace(/```/g, '')
      .trim();

    let explanation = '';
    let answerText = '';
    let answerLetters = [];


    /* ==========================================
       EXPLANATION
       ========================================== */

    const explanationMatch = raw.match(
      /(?:^|\n)\s*Explanation\s*:\s*([\s\S]*)$/i
    );

    if (explanationMatch) {
      explanation = explanationMatch[1].trim();

      raw = raw
        .slice(0, explanationMatch.index)
        .trim();
    }


    /* ==========================================
       MCQ ANSWER
       ========================================== */

    const mcqAnswerMatch = raw.match(
      /(?:^|\n)\s*Ans(?:wer)?\s*:\s*([A-D](?:\s*,\s*[A-D])*)\s*$/i
    );

    if (mcqAnswerMatch) {

      answerLetters = extractAnswerLetters(
        mcqAnswerMatch[1]
      );

      raw = raw
        .slice(0, mcqAnswerMatch.index)
        .trim();

    } else {

      /* ========================================
         DESCRIPTIVE / NUMERICAL / FILL ANSWER
         ======================================== */

      const textAnswerMatch = raw.match(
        /(?:^|\n)\s*Answer\s*:\s*([\s\S]*)$/i
      );

      if (textAnswerMatch) {

        answerText = textAnswerMatch[1].trim();

        raw = raw
          .slice(0, textAnswerMatch.index)
          .trim();
      }
    }


    /* ==========================================
       OPTIONS
       ========================================== */

    const extracted = extractMCQOptions({
      question: raw
    });

    let stem = raw;
    let options = [];


    if (
      Array.isArray(extracted) &&
      extracted.length === 4
    ) {

      options = extracted.map(cleanOption);

      const optionStart = stem.search(
        /(^|\s)A[)\.]\s/i
      );

      if (optionStart !== -1) {
        stem = stem
          .slice(0, optionStart)
          .trim();
      }
    }


    return {
      stem,
      options,
      answerLetters,
      answerText: toReviewHtml(answerText),
      explanation: toReviewHtml(explanation)
    };
  }


   /* =====================================================
     PARAGRAPH-BASED MCQ PARSER
     ===================================================== */

  function parseParagraphFinalBlock(
    input,
    marks,
    shouldShuffleOptions
  ) {

    let raw = stripLead(input)
      .replace(/```(?:text|plaintext|latex|tex)?/gi, '')
      .replace(/```/g, '')
      .replace(/\r/g, '')
      .trim();


    /* -----------------------------------------
       FIND SUB-QUESTION MARKERS
       ----------------------------------------- */

    let markerRegex =
      /^\s*Sub-question\s*\(([ivx]+|\d+)\)\s*:\s*/gmi;

    let markers =
      Array.from(
        raw.matchAll(markerRegex)
      );


    /* Fallback: allow plain (i), (ii), etc. */

    if (!markers.length) {

      markerRegex =
        /^\s*\(([ivx]+|\d+)\)\s*/gmi;

      markers =
        Array.from(
          raw.matchAll(markerRegex)
        );
    }


    if (!markers.length) {
      return null;
    }


    /* -----------------------------------------
       PASSAGE
       ----------------------------------------- */

    let passage =
      raw
        .slice(
          0,
          markers[0].index
        )
        .trim();


    passage = passage
      .replace(
        /^\s*Read\s+the\s+following\s+passage\s+and\s+answer\s+the\s+questions\s*:?\s*/i,
        ''
      )
      .replace(
        /^\s*Passage\s*:\s*/i,
        ''
      )
      .trim();


    if (!passage) {
      return null;
    }


    /* -----------------------------------------
       SUB-QUESTIONS
       ----------------------------------------- */

    const mcqs = [];


    markers.forEach(
      (marker, subIndex) => {

        const start =
          marker.index +
          marker[0].length;

        const end =
          subIndex + 1 < markers.length
            ? markers[subIndex + 1].index
            : raw.length;


        const block =
          raw
            .slice(start, end)
            .trim();


        if (!block) {
          return;
        }


        const parsed =
          parseFinalQuestionBlock(
            block
          );


        if (
          !parsed ||
          !parsed.stem ||
          !Array.isArray(parsed.options) ||
          parsed.options.length !== 4
        ) {
          return;
        }


        let subOptions =
          parsed.options.slice();

        let subAnswerLetters =
          parsed.answerLetters.slice();


        /* -------------------------------------
           SHUFFLE EACH SUB-QUESTION'S OPTIONS
           ------------------------------------- */

        if (shouldShuffleOptions) {

          const shuffled =
            shuffleMCQQuestion({
              question: parsed.stem,
              options: subOptions,
              answer: subAnswerLetters
            });


          if (
            Array.isArray(shuffled.options) &&
            shuffled.options.length === 4
          ) {

              shuffled.options;
          }


          subAnswerLetters =
            extractAnswerLetters(
              shuffled.answer
            );
        }


        const subAnswer =
          (subAnswerLetters || [])
            .join(',');


        mcqs.push({

          question:
            parsed.stem,

          text:
            parsed.stem,

          body: [
            parsed.stem,
            ...subOptions.map(
              (option, optionIndex) =>
                `${String.fromCharCode(65 + optionIndex)}) ${option}`
            )
          ].join('\n'),

          options:
            subOptions,

          answer:
            subAnswer,

          parsedAnswer:
            subAnswer,

          finalAnswer:
            subAnswer,

            parsed.explanation,

    if (
      !mcqs.length ||

    const paragraphRecord = {
      passage,

    const plainText =
      typeof __ebBuildParagraphPlainText === 'function'
        ? __ebBuildParagraphPlainText(
            paragraphRecord

        : [
            'Read the following passage and answer the questions:',
            'Passage:',
            passage,
            '',
            ...mcqs.flatMap(
              (mcq, subIndex) => [
                `(${subIndex + 1}) ${mcq.question}`,

      options:
        [],

      answer:
        '',

      parsedAnswer:
        '',

      finalAnswer:
        '',

  /* =====================================================

  function parseMatchingFinalBlock(

    let raw = stripLead(input)
      .replace(/```(?:text|plaintext|latex|tex)?/gi, '')
      .replace(/```/g, '')

    let explanation = '';

    /* -----------------------------------------

       ----------------------------------------- */

    const explanationMatch =
      raw.match(

    if (explanationMatch) {

        explanationMatch[1]
          .trim();

        raw
          .slice(
            0,
            explanationMatch.index

          .trim();

    /* -----------------------------------------
       ANSWER
       ----------------------------------------- */

    const answerMatch =
      raw.match(
        /(?:^|\n)\s*Ans(?:wer)?\s*:\s*([A-D](?:\s*,\s*[A-D])*)\s*$/i

    if (answerMatch) {

        extractAnswerLetters(
          answerMatch[1]
        );


      raw =
        raw
          .slice(
            0,
            answerMatch.index
          )
          .trim();
    }


    /* -----------------------------------------
       OPTIONS MARKER
       ----------------------------------------- */

    const optionsMarker =
      raw.match(
        /(?:^|\n)\s*Options\s*:\s*/i
      );


    if (!optionsMarker) {
      return null;
    }


    const stem =
      raw
        .slice(
          0,
          optionsMarker.index
        )
        .trim();


    const optionsRegion =
      raw
        .slice(
          optionsMarker.index +
          optionsMarker[0].length
        )
        .trim();


    if (!stem || !optionsRegion) {
      return null;
    }


    /* -----------------------------------------
       IMPORTANT:
       Extract A-D ONLY from the Options region.

       This prevents Column-I A-D labels from
       being mistaken for answer choices.
       ----------------------------------------- */

    const extracted =
      extractMCQOptions({
        question:
          optionsRegion
      });


    if (
      !Array.isArray(extracted) ||
      extracted.length !== 4
    ) {
      return null;

    let options =
      extracted.map(
        cleanOption
      );


    let outAnswerLetters =
      answerLetters.slice();


    /* -----------------------------------------

       ----------------------------------------- */

    if (shouldShuffleOptions) {

        shuffleMCQQuestion({
          question:
            stem,

          options:
            options,

          answer:
            outAnswerLetters
        });


      if (
        Array.isArray(shuffled.options) &&
        shuffled.options.length === 4
      ) {
        options =
          shuffled.options;
      }


      outAnswerLetters =
        extractAnswerLetters(
          shuffled.answer
        );
    }


    const answer =
      (outAnswerLetters || [])
        .join(',');


    return {

      number: 0,

      text:
        stem,

      question:
        stem,

      body: [
        stem,
        'Options:',
        ...options.map(
          (option, optionIndex) =>
            `${String.fromCharCode(65 + optionIndex)}) ${option}`
        )
      ].join('\n'),

      marks:
        marks,

      options:
        options,

      answer:
        answer,

      parsedAnswer:
        answer,

      finalAnswer:
        answer,

      explanation:
        toReviewHtml(
          explanation
        ),

      solution:
        toReviewHtml(
          explanation
        ),

      type:
        matchingType,

      mcqType:
        matchingType
    };
  }


  /* =====================================================

     ===================================================== */

  function buildInternalAlternativeText(parsed) {

    if (
      !Array.isArray(parsed.options) ||
      parsed.options.length !== 4

      return parsed.stem;

      parsed.stem,
      `A) ${parsed.options[0]}`,
      `B) ${parsed.options[1]}`,
      `C) ${parsed.options[2]}`,
      `D) ${parsed.options[3]}`
    ].join('<br>');
  }


  for (const subj of subjectsData) {

    for (const sec of subj.sections) {


      /* ==========================================
         INTERNAL CHOICE
         ========================================== */

      if (sec.type === 'internal') {

        const needPairs = Number(
          sec.numPairs || 0
        );

        const marks = Number(
          sec.marksPerQuestion || 0
        );

        const pairs = [];


        const takeParsedBlock = () => {

          if (index >= pool.length) {
            return null;
          }

          return parseFinalQuestionBlock(
            pool[index++]
          );
        };


        for (
          let p = 0;
          p < needPairs;
          p++
        ) {

          const a = takeParsedBlock();
          const b = takeParsedBlock();

          if (!a || !b) {
            break;
          }


          const aQuestion =
            buildInternalAlternativeText(a);

          const bQuestion =
            buildInternalAlternativeText(b);


          const aAnswer =
            a.answerLetters.length
              ? a.answerLetters.join(',')
              : a.answerText;

          const bAnswer =
            b.answerLetters.length
              ? b.answerLetters.join(',')
              : b.answerText;


          const questionHtml =
            `(A) ${aQuestion}<br>` +
            `<div style="text-align:center;"><b>(OR)</b></div>` +
            `(B) ${bQuestion}`;


          const answerHtml =
            `(A) ${aAnswer || ''}<br>` +
            `<div style="text-align:center;"><b>(OR)</b></div>` +
            `(B) ${bAnswer || ''}`;


          const explanationHtml =
            `(A) ${a.explanation || ''}<br>` +
            `<div style="text-align:center;"><b>(OR)</b></div>` +
            `(B) ${b.explanation || ''}`;


          pairs.push({
            number: p + 1,
            text: questionHtml,
            marks: marks,
            options: [],
            answer: answerHtml,
            parsedAnswer: answerHtml,
            finalAnswer: answerHtml,
            explanation: explanationHtml,
            solution: explanationHtml
          });
        }


        if (pairs.length < needPairs) {
          errors.push(
            `${subj.subject} - ${sec.label}: ` +
            `Only ${pairs.length} of ${needPairs} pairs available from source.`
          );
        }


        sec.questions = pairs;
        continue;
      }


      /* ==========================================
         NORMAL SECTION
         ========================================== */

      const need = Number(
        sec.numQuestions || 0
      );

      const marks = Number(
        sec.marksPerQuestion || 0
      );

      const pick = [];


      for (
        let i = 0;
        i < need;
        i++
      ) {

        if (index >= pool.length) {
          break;
        }


               const rawSourceBlock =
          pool[index++];


        /* ========================================
           PARAGRAPH-BASED MCQ
           ======================================== */

        if (
          sec.mcqType ===
          'Paragraph-Based MCQ (Single Correct)'
        ) {

          const paragraphQuestion =
            parseParagraphFinalBlock(
              rawSourceBlock,
              marks,
              shuffleOptions
            );


          if (!paragraphQuestion) {

            errors.push(
              `${subj.subject} - ${sec.label}: ` +
              `Paragraph-Based MCQ could not be parsed. ` +
              `Use Passage:, Sub-question (i):, A-D, Ans: and Explanation:.`
            );

            continue;
          }


          paragraphQuestion.number =
            i + 1;


          pick.push(
            paragraphQuestion
          );

          continue;
        }


        /* ========================================
           MATCHING MATRIX / MATCHING LIST
           ======================================== */

        if (
          sec.mcqType === 'Matching Matrix' ||
          sec.mcqType === 'Matching List'
        ) {

          const matchingQuestion =
            parseMatchingFinalBlock(
              rawSourceBlock,
              sec.mcqType,
              marks,
              shuffleOptions
            );


          if (!matchingQuestion) {

            errors.push(
              `${subj.subject} - ${sec.label}: ` +
              `${sec.mcqType} could not be parsed. ` +
              `The final set must contain an Options: line followed by four A-D choices.`
            );

            continue;
          }


          matchingQuestion.number =
            i + 1;


          pick.push(
            matchingQuestion
          );

          continue;
        }


        /* ========================================
           ALL NORMAL QUESTION TYPES
           ======================================== */

        const parsed =
          parseFinalQuestionBlock(
            rawSourceBlock
          );

        /* ========================================
           MCQ
           ======================================== */

        if (
          Array.isArray(parsed.options) &&
          parsed.options.length === 4
        ) {

          let outOptions =
            parsed.options.slice();

          let outAnswerLetters =
            parsed.answerLetters.slice();


          if (shuffleOptions) {

            const shuffled = shuffleMCQQuestion({
              question: parsed.stem,
              options: outOptions,
              answer: outAnswerLetters
            });


            outOptions =
              Array.isArray(shuffled.options)
                ? shuffled.options
                : outOptions;


            outAnswerLetters =
              extractAnswerLetters(
                shuffled.answer
              );
          }


          const answer =
            (outAnswerLetters || [])
              .join(',');


          pick.push({
            number: i + 1,
            text: parsed.stem,
            question: parsed.stem,
            body: [
              parsed.stem,
              ...outOptions.map(
                (option, optionIndex) =>
                  `${String.fromCharCode(65 + optionIndex)}) ${option}`
              )
            ].join('\n'),
            marks: marks,
            options: outOptions,
            answer: answer,
            parsedAnswer: answer,
            finalAnswer: answer,
            explanation: parsed.explanation,
            solution: parsed.explanation,
            mcqType: sec.mcqType || ''
          });


        /* ========================================
           DESCRIPTIVE / NUMERICAL / FILL BLANK
           ======================================== */

        } else {

          pick.push({
            number: i + 1,
            text: parsed.stem,
            question: parsed.stem,
            body: parsed.stem,
            marks: marks,
            options: [],
            answer: parsed.answerText,
            parsedAnswer: parsed.answerText,
            finalAnswer: parsed.answerText,
            explanation: parsed.explanation,
            solution: parsed.explanation,
            mcqType: sec.mcqType || ''
          });
        }
      }


      if (pick.length < need) {
        errors.push(
          `${subj.subject} - ${sec.label}: ` +
          `Only ${pick.length} of ${need} questions available from source.`
        );
      }


      if (
        shuffleQuestions &&
        pick.length > 1
      ) {
        shuffleArray(pick);
      }


      sec.questions = pick;
    }
  }


  return {
    errors
  };
}

function normalizeText(s) {
  if (!s) return '';
  let t = String(s);
  t = t.replace(/<[^>]+>/g, ' ');
  t = t.replace(/&nbsp;/gi, ' ').replace(/\u00A0/g, ' ');
  try { t = t.normalize('NFKC'); } catch (e) {}
  t = t.replace(/[\u200B-\u200D\uFEFF]/g, '');
  t = t.replace(/[\u2010-\u2015\u2212]/g, '-');
  t = t.replace(/[\u2018\u2019\u201A\u2032]/g, "'")
       .replace(/[\u201C\u201D\u2033]/g, '"');
  t = t.replace(/\u00D7/g, 'x');
  t = t.replace(/\s+/g, ' ').trim().toLowerCase();
  t = t.replace(/[.,;:!?]+$/g, '');
  return t;
}

function stripRealOptionBlockForKey(rawText) {

  const aMatch = s.match(/(?:^|\n|\s)A[\)\.]\s+/i);

  const start = aMatch.index;
  const tail = s.slice(start);

  const hasFullOptions =
    /(?:^|\n|\s)A[\)\.]\s+[\s\S]*?(?:^|\n|\s)B[\)\.]\s+[\s\S]*?(?:^|\n|\s)C[\)\.]\s+[\s\S]*?(?:^|\n|\s)D[\)\.]\s+/i.test(tail);

  if (!hasFullOptions) return s;

  return s.slice(0, start).trim();
}

function prepareQuestionStemForKey(q) {
  let raw = String(q?.question || q?.text || q?.body || '');

  const normalizedType = normalizeMcqType(getRawQuestionType(q));

  const isMatchingStyle =
    normalizedType === 'Matching Matrix' ||
    normalizedType === 'Matching List' ||
    (/Column\s*I/i.test(raw) && /Column\s*II/i.test(raw)) ||
    (/List-I/i.test(raw) && /List-II/i.test(raw));

  const isAssertionReason =
    normalizedType === 'Assertion and Reason (MCQ Single)' ||
    looksLikeAssertionReasonQuestion(q);

  raw = raw.replace(/<[^>]+>/g, ' ');
  raw = raw.replace(/^Q\d+:\s*[^A-Za-z0-9]*[\[\]A-Za-z0-9, ]*\s*/i, '');
  raw = raw.replace(/\bAns?\s*:\s*.*$/i, '');

  if (isMatchingStyle) {
    raw = raw.replace(
      /\s*\bOptions\s*:\s*[\s\S]*$/i,
      ''
    );
  } else if (!isAssertionReason) {
    raw = stripRealOptionBlockForKey(raw);
  }

  return raw;
}

function makeStemKey(q) {
  const stemNorm = normalizeText(prepareQuestionStemForKey(q));
  const marks = (q && q.marks != null) ? String(q.marks) : '';
  return stemNorm + '|m=' + String(marks ?? '');
}

function normalizeChoice(s) {
  if (!s) return '';
  let t = String(s);
  t = t.replace(/^[A-D][\)\.]\s*/i, '');
  t = t.replace(/<[^>]+>/g, ' ').replace(/&nbsp;/gi, ' ').replace(/\u00A0/g, ' ');
  try { t = t.normalize('NFKC'); } catch (e) {}
  t = t.replace(/[\u200B-\u200D\uFEFF]/g, '');
  t = t.replace(/[\u2010-\u2015\u2212]/g, '-');
  t = t.replace(/[\u2018\u2019\u201A\u2032]/g, "'").replace(/[\u201C\u201D\u2033]/g, '"');
  t = t.replace(/\u00D7/g, 'x');

function extractAnswerLetters(ans) {
  function parseLetters(raw) {
    let s = String(raw || '').trim().toUpperCase();
    if (!s) return [];

    const named = s.match(/\b(?:ANS?|ANSWER)\s*[:\-]?\s*(.+)$/);
    if (named) s = named[1].trim();

    if (!/^(?:[A-D][\)\.]?)(?:\s*,\s*[A-D][\)\.]?)*$/.test(s)) return [];

    const letters = s.match(/[A-D]/g) || [];
    const out = [];
    const seen = new Set();

    for (const ch of letters) {
      if (!seen.has(ch)) {
        seen.add(ch);
        out.push(ch);
      }
    }
    return out;
  }

  if (ans == null) return [];

  if (Array.isArray(ans)) {
    const out = [];
    const seen = new Set();

    for (const item of ans) {
      for (const ch of parseLetters(item)) {
        if (!seen.has(ch)) {
          seen.add(ch);
          out.push(ch);
        }
      }
    }
    return out;
  }

  return parseLetters(ans);
}
function getRawQuestionType(d) {
  if (typeof d === 'string') return d;

  const candidates = [
    d?.mcqType,
    d?.type,
    d?.questionType,
    d?.qType,
    d?.question_type,
    d?.format,
    d?.category,
    d?.metaLine,
    d?.parsedMeta,
    d?.metadata
  ];

  for (const val of candidates) {
    const s = String(val || '').trim();
    if (s) return s;
  }

  return '';
}

function normalizeMcqType(s) {
  let t = String(s || '')
    .replace(/<[^>]+>/g, ' ')
    .replace(/\u00A0/g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .toLowerCase();

  if (!t) return '';

  if (
    t === 'comprehensive' ||
    t.includes('comprehension') ||
    t.includes('paragraph based') ||
    (t.includes('paragraph') && t.includes('mcq'))
  ) {
    return 'Paragraph-Based MCQ (Single Correct)';
  }

  if (
    (t.includes('assertion') && t.includes('reason')) ||
    t.includes('assertion-reason') ||
    t.includes('assertion reason') ||
    t.includes('assertion & reason') ||
    t.includes('assertion and reason') ||
    t.includes('a & r') ||
    t.includes('a/r')
  ) {
    return 'Assertion and Reason (MCQ Single)';
  }

   if (t.includes('numerical') && t.includes('value')) {
    return 'Numerical Value';
  }

  if (t.includes('matching') && t.includes('list')) {
    return 'Matching List';
  }

  if (t.includes('matching') && t.includes('matrix')) {
    return 'Matching Matrix';
  }

  if ((t.includes('fill') && t.includes('blank')) || t === 'fib') {
    return 'Fill in the Blanks';
  }

  if (t.includes('multiple')) return 'MCQ (Multiple)';

  if (
    t.includes('single correct') ||
    t.includes('single') ||
    t === 'mcq' ||
    t.includes('mcq single') ||
    t.includes('objective')
  ) {
    return 'MCQ (Single)';
  }

  if (t.includes('desc') || t.includes('descriptive')) return 'Descriptive';

  return String(s || '').trim();
}
function looksLikeAssertionReasonQuestion(d) {
  const raw = [
    getRawQuestionType(d),
    d?.metaLine,
    d?.parsedMeta,
    d?.metadata,
    d?.question,
    d?.text,
    d?.body
  ].map(v => String(v || '')).join(' ');

  const text = raw
    .replace(/<[^>]+>/g, ' ')
    .replace(/&nbsp;/gi, ' ')
    .replace(/\u00A0/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();

  if (normalizeMcqType(getRawQuestionType(d)) === 'Assertion and Reason (MCQ Single)') return true;

  if (/\[\s*assertion\s*(?:and|&|-)?\s*reason/i.test(text)) return true;
  if (/\bassertion\s*(?:and|&|-)\s*reason\b/i.test(text)) return true;

  const hasAssertion = /\bassertion\b/i.test(text);
  const hasReason = /\breason\b/i.test(text);

  const hasAssertionLabel =
    /\bassertion\s*\(\s*a\s*\)\s*[:.)-]?/i.test(text) ||
    /\bassertion\s+a\s*[:.)-]/i.test(text) ||
    /\bassertion\s*[:.)-]/i.test(text);

  const hasReasonLabel =
    /\breason\s*\(\s*r\s*\)\s*[:.)-]?/i.test(text) ||
    /\breason\s+r\s*[:.)-]/i.test(text) ||
    /\breason\s*[:.)-]/i.test(text);

  return hasAssertion && hasReason && hasAssertionLabel && hasReasonLabel;
}

function inferMcqType(d) {
  const norm = normalizeMcqType(getRawQuestionType(d));

  if (
    norm === 'Assertion and Reason (MCQ Single)' ||
    (
           looksLikeAssertionReasonQuestion(d) &&
      norm !== 'MCQ (Multiple)' &&
      norm !== 'Numerical Value' &&
      norm !== 'Matching Matrix' &&
      norm !== 'Matching List' &&
      norm !== 'Paragraph-Based MCQ (Single Correct)' &&
      norm !== 'Fill in the Blanks'
    )
  ) {
    return 'Assertion and Reason (MCQ Single)';
  }

  if (
        norm === 'MCQ (Single)' ||
    norm === 'MCQ (Multiple)' ||
    norm === 'Numerical Value' ||
    norm === 'Fill in the Blanks' ||
    norm === 'Matching Matrix' ||
    norm === 'Matching List' ||
    norm === 'Paragraph-Based MCQ (Single Correct)' ||
    norm === 'Descriptive'
  ) {
    return norm;
  }

  if (
    Array.isArray(d?.mcqs) &&
    d.mcqs.length > 0 &&
    String(d?.passage || '').trim()
  ) {
    return 'Paragraph-Based MCQ (Single Correct)';
  }

  const answerValue =
    d?.parsedAnswer ||
    d?.answer ||
    d?.parsedAns ||
    d?.correctAnswer ||
    d?.correct_option ||
    d?.correctOption ||
    '';

  const letters = extractAnswerLetters(answerValue);

  if (letters.length > 1) return 'MCQ (Multiple)';
  if (Array.isArray(d?.options) && d.options.length === 4) return 'MCQ (Single)';
  if (extractMCQOptions(d)?.length === 4) return 'MCQ (Single)';

  return 'Descriptive';
}
function makeDeDupeKey(q) {
  const stemNorm = normalizeText(prepareQuestionStemForKey(q));

  const typeNorm = inferMcqType(q);
  const rawOpts = Array.isArray(q?.options) ? q.options.slice(0, 4) : (extractMCQOptions(q) || []);
  const optNormsInOrder = rawOpts.map(o => normalizeChoice(o)).filter(Boolean);

  const answerValue =
    q?.parsedAnswer ||
    q?.answer ||
    q?.parsedAns ||
    q?.correctAnswer ||
    q?.correct_option ||
    q?.correctOption ||
    '';

  const ansLetters = extractAnswerLetters(answerValue);
  const ansTexts = ansLetters.length && optNormsInOrder.length === 4
    ? ansLetters.map(L => {
        const idx = "ABCD".indexOf(L);
        return idx >= 0 ? optNormsInOrder[idx] : '';
      }).filter(Boolean).sort()
    : [];

  const optionSet = Array.from(new Set(optNormsInOrder)).sort();

  const key =
    stemNorm +
    '||t=' + (typeNorm || '') +
    '||opts=' + optionSet.join('|') +
    '||ans=' + ansTexts.join('|');

  return key;
}
function uniqueByIdOrText(arr) {
  const seenIds = new Set();

    const id = q && q.id;
    const key = makeStemKey(q);
    if ((id && seenIds.has(id)) || (key && seenStem.has(key))) continue;
    if (id) seenIds.add(id);
    if (key) seenStem.add(key);
    out.push(q);
  }

}
function chunk(arr, size) {
  const out = [];
  for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
  return out;
}
function buildMarksFallbackOrder(wanted) {
  const w = parseInt(wanted || 0);
  const universe = [1,2,3,4,5,6,8,10];
  if (!w || !universe.includes(w)) return universe;
  const rest = universe.filter(m => m !== w).sort((a,b) => Math.abs(a-w) - Math.abs(b-w));
  return [w, ...rest];
}
function splitEvenAcrossChapters(total, chapters) {
  const n = Math.max(1, (chapters || []).length);
  const base = Math.floor(total / n);
  const rem = total - base * n;
  const out = Array(n).fill(base);
  for (let i = 0; i < rem; i++) out[i] += 1;
  return out;
}
function takeUniqueFromPool(pool, need, usedIds, usedKeys, subjectSeenKeys, secMarks) {
  const out = [];
  const mPerQ = Number(secMarks ?? 0);
  for (const d of (pool || [])) {
    const id = d && d.id;
    const key = makeStemKey({ text: d.question || d.text || '', marks: mPerQ });
    if ((id && usedIds.has(id)) || (key && usedKeys.has(key)) || (key && subjectSeenKeys.has(key))) continue;
    if (id) usedIds.add(id);
    if (key) usedKeys.add(key);
    out.push(d);
    if (out.length >= need) break;
  }
  return out;
}

const _subjectQuestionCache = new Map();

function _normDifficultyValue(s) {
  let t = String(s || "")
    .replace(/<[^>]+>/g, " ")
    .replace(/\u00A0/g, " ")
    .replace(/\s+/g, "")
    .trim()
    .toLowerCase();
  t = t.replace(/^level[-_]?(\d)$/, 'level$1');
  t = t.replace(/^l(\d)$/, 'level$1');
  return t;
}

function getQuestionDifficultyLevelKey(d) {
  if (__ebIsEntranceExamBoard(d?.board)) {
    return 'L1';
  }

  const directCandidates = [
    d?.difficulty,
    d?.level,
    d?.difficultyLevel,
    d?.levelKey
  ];

  for (const val of directCandidates) {
    const norm = _normDifficultyValue(val);
    if (norm === 'level1') return 'L1';
    if (norm === 'level2') return 'L2';
    if (norm === 'level3') return 'L3';
  }

  const textCandidates = [
    d?.metaLine,
    d?.parsedMeta,
    d?.metadata,
    d?.question,
    d?.text,
    d?.body
  ];

  for (const val of textCandidates) {
    const raw = String(val || '');
    const compact = raw.replace(/<[^>]+>/g, ' ').replace(/\u00A0/g, ' ');
    const match = compact.match(/\b(?:level|lvl|l)\s*[-:]?\s*([123])\b/i);
    if (match) return `L${match[1]}`;
  }

  return '';
}

function getQuestionDifficultyLabel(d) {
  const key = getQuestionDifficultyLevelKey(d);
  return key === 'L1' ? 'Level 1' : key === 'L2' ? 'Level 2' : key === 'L3' ? 'Level 3' : '';
}

function _isAllowedMcqType(doc, mcqType) {
  const typ = inferMcqType(doc);

  if (mcqType === "MCQ (Single)") {
    return typ === "MCQ (Single)";
  }

  if (mcqType === "MCQ (Multiple)") {
    return typ === "MCQ (Multiple)";
  }

  if (mcqType === "Assertion and Reason (MCQ Single)") {
    return typ === "Assertion and Reason (MCQ Single)";
  }

    if (mcqType === "Numerical Value") {
    return typ === "Numerical Value";
  }

  if (mcqType === "Matching Matrix") {
    return typ === "Matching Matrix";
  }

  if (mcqType === "Matching List") {
    return typ === "Matching List";
  }

  if (mcqType === "Paragraph-Based MCQ (Single Correct)") {
    return typ === "Paragraph-Based MCQ (Single Correct)";
  }

  if (mcqType === "Fill in the Blanks") {
    return typ === "Fill in the Blanks";
  }

  if (mcqType === "Descriptive") {
    return typ === "Descriptive";
  }

  return true;
}
async function getSubjectQuestionPool(selectedClass, selectedBoard, selectedSubject) {
  const cacheKey = [currentUser?.uid || '', selectedClass, selectedBoard, selectedSubject].join('|');

  if (_subjectQuestionCache.has(cacheKey)) {
    return _subjectQuestionCache.get(cacheKey).slice();
  }

  const snapshot = await firestore.collection("questions")
    .where("class", "==", selectedClass)
    .where("board", "==", selectedBoard)
    .where("subject", "==", selectedSubject)
    .get();

  const allQuestions = [];
  snapshot.forEach(doc => {
    allQuestions.push({ id: doc.id, ...doc.data() });
  });

  allQuestions.sort((a, b) => Number(a.questionNumber || 0) - Number(b.questionNumber || 0));

  const unique = uniqueByIdOrText(allQuestions);
  _subjectQuestionCache.set(cacheKey, unique.slice());
  return unique.slice();
}

function filterQuestionsFromPool(pool, {
  chapters,
  marksPerQuestion,
  mcqType,
  forceDifficulty,
  allowedDifficulties
}) {
  let rows = Array.isArray(pool) ? pool.slice() : [];

  if (chapters && chapters.length) {
    const chapterSet = new Set(chapters.map(x => String(x || '').trim()));
    rows = rows.filter(d => chapterSet.has(String(d.chapter || '').trim()));
  }

    const entrancePool =
    rows.some(d => __ebIsEntranceExamBoard(d?.board));

  // School/Foundation:
  // use marks and difficulty stored with the question.
  //
  // Entrance Exam Mode:
  // marks come from this Exam Builder section;
  // questions have no stored L1/L2/L3.
  if (
    !entrancePool &&
    marksPerQuestion != null &&
    marksPerQuestion !== ''
  ) {
    const wantedMarks = Number(marksPerQuestion);

    rows = rows.filter(
      d => Number(d.marks) === wantedMarks
    );
  }

  rows = rows.filter(
    d => _isAllowedMcqType(d, mcqType)
  );

  if (!entrancePool) {
    if (forceDifficulty) {
      const want =
        _normDifficultyValue(forceDifficulty);

      rows = rows.filter(
        d =>
          _normDifficultyValue(
            getQuestionDifficultyLabel(d)
          ) === want
      );

    } else if (
      Array.isArray(allowedDifficulties) &&
      allowedDifficulties.length
    ) {
      const wants =
        allowedDifficulties.map(
          _normDifficultyValue
        );

      rows = rows.filter(
        d =>
          wants.includes(
            _normDifficultyValue(
              getQuestionDifficultyLabel(d)
            )
          )
      );
    }
  }
  return uniqueByIdOrText(rows);
}

async function fetchQuestions({
  selectedClass,
  selectedBoard,
  selectedSubject,
  chapters,
  marksPerQuestion,
  mcqType,
  count,
  forceDifficulty,
  allowedDifficulties
}) {
  const pool = await getSubjectQuestionPool(selectedClass, selectedBoard, selectedSubject);

  let rows = filterQuestionsFromPool(pool, {
    chapters,
    marksPerQuestion,
    mcqType,
    forceDifficulty,
    allowedDifficulties
  });

  shuffleArray(rows);
  return rows.slice(0, count);
}

async function fetchQuestionsWithMarksFallback({
  selectedClass,
  selectedBoard,
  selectedSubject,
  chapters,
  marksPerQuestion,
  mcqType,
  count,
  forceDifficulty,
  allowedDifficulties
}) {
  const pool = await getSubjectQuestionPool(selectedClass, selectedBoard, selectedSubject);

  const wantedMarks = parseInt(marksPerQuestion);
  const marksOrder = buildMarksFallbackOrder(wantedMarks);

  const picked = [];
  const usedIds = new Set();
  const usedKeys = new Set();

  for (const marks of marksOrder) {
    let rows = filterQuestionsFromPool(pool, {
      chapters,
      marksPerQuestion: marks,
      mcqType,
      forceDifficulty,
      allowedDifficulties
    });

    shuffleArray(rows);

    for (const d of rows) {
      const id = d && d.id;
      const key = makeStemKey({ text: getQuestionTextFromDoc(d), marks: Number(d.marks || marks || 0) });

      if ((id && usedIds.has(id)) || (key && usedKeys.has(key))) continue;

      if (id) usedIds.add(id);
      if (key) usedKeys.add(key);

      picked.push(d);
      if (picked.length >= count) return picked.slice(0, count);
    }
  }

  return picked.slice(0, count);
}
async function fetchBalancedAcrossChapters({
  selectedClass,
  selectedBoard,
  subject,
  chapters,
  marksPerQuestion,
  mcqType,
  requestedCount,
  difficultyValue,
  subjectSeenKeys,
  globalMixBudget,
  allowedDifficulties
}) {
  const errors = [];
  const items = [];
  const usedIds = new Set();
  const usedKeys = new Set();

  const chs = Array.isArray(chapters) ? chapters.slice() : [];

  async function fetchFor(chapterList, count, forceDifficulty) {
    if (!count) return [];
    let docs = await fetchQuestionsWithMarksFallback({
  selectedClass,
  selectedBoard,
  selectedSubject: subject,
  chapters: chapterList && chapterList.length ? chapterList : undefined,
  marksPerQuestion,
  mcqType,
  count: Math.max(count * 2, count + 2),
  forceDifficulty: forceDifficulty || undefined,
  allowedDifficulties
});
    return uniqueByIdOrText(docs);
  }

  async function borrow(need, sameDifficulty) {
    if (need <= 0) return [];
    let pool = [];
    if (sameDifficulty) {
      pool = await fetchFor(chs, need, sameDifficulty);
      let picked = takeUniqueFromPool(pool, need, usedIds, usedKeys, subjectSeenKeys, marksPerQuestion);
      need -= picked.length;
      if (need <= 0) return picked;

      const pool2 = await fetchFor(chs, need, null);
      picked = picked.concat(takeUniqueFromPool(pool2, need, usedIds, usedKeys, subjectSeenKeys, marksPerQuestion));
      return picked;
    } else {
      pool = await fetchFor(chs, need, null);
      return takeUniqueFromPool(pool, need, usedIds, usedKeys, subjectSeenKeys, marksPerQuestion);
    }
  }

  async function fillNonMixed(totalNeed, forceDiff) {
    if (!chs.length) {
      const pool = await fetchFor(null, totalNeed, forceDiff);
      items.push(...takeUniqueFromPool(pool, totalNeed, usedIds, usedKeys, subjectSeenKeys, marksPerQuestion));
      return;
    }

    const strictOneEach = totalNeed <= chs.length;
    if (strictOneEach) {
      for (let i = 0; i < chs.length && items.length < totalNeed; i++) {
        let pool = await fetchFor([chs[i]], 1, forceDiff);
        let picked = takeUniqueFromPool(pool, 1, usedIds, usedKeys, subjectSeenKeys, marksPerQuestion);
        if (!picked.length) {
          pool = await fetchFor([chs[i]], 1, null);
          picked = takeUniqueFromPool(pool, 1, usedIds, usedKeys, subjectSeenKeys, marksPerQuestion);
        }
        if (picked.length) items.push(...picked);
      }

      let remaining = totalNeed - items.length;
      if (remaining > 0) {
        const borrowedSame = await borrow(remaining, forceDiff);
        items.push(...borrowedSame);
        remaining = totalNeed - items.length;
      }
      if (remaining > 0) {
        const borrowedAny = await borrow(remaining, null);
        items.push(...borrowedAny);
      }
      if (items.length < totalNeed) {
        errors.push(`${subject}: Could not pick one per selected chapter; only ${items.length} of ${totalNeed} found.`);
      }
      return;
    }

    const perChapter = splitEvenAcrossChapters(totalNeed, chs);
    for (let i = 0; i < chs.length; i++) {
      const need = perChapter[i];
      if (!need) continue;
      const pool = await fetchFor([chs[i]], need, forceDiff);
      const picked = takeUniqueFromPool(pool, need, usedIds, usedKeys, subjectSeenKeys, marksPerQuestion);
      items.push(...picked);
      perChapter[i] -= picked.length;
    }

    let remaining = perChapter.reduce((a, b) => a + b, 0);
    if (remaining > 0) {
      const borrowedSame = await borrow(remaining, forceDiff);
      items.push(...borrowedSame);
      remaining = totalNeed - items.length;
    }
    if (remaining > 0) {
      const borrowedAny = await borrow(remaining, null);
      items.push(...borrowedAny);
    }

    if (items.length < totalNeed) {
      errors.push(`${subject}: Only ${items.length} of ${totalNeed} questions found (after chapter balance).`);
    }
  }

  async function fillMixed(totalNeed) {
    const mPerQ = Number(marksPerQuestion || 0);
    const sectionMarks = (Number(totalNeed || 0) * mPerQ);
       const p1 = Number(window._difficultyDistribution?.L1 || 0);
    const p2 = Number(window._difficultyDistribution?.L2 || 0);
    const p3 = Number(window._difficultyDistribution?.L3 || 0);
    const desiredByMarks = splitCounts(sectionMarks, [p1, p2, p3]);

    function takeFromBudget(level, wantedMarks) {
      if (!globalMixBudget) return wantedMarks;
      const key = (level === "Level 1") ? "L1" : (level === "Level 2") ? "L2" : "L3";
      const canGive = Math.max(0, Math.min(globalMixBudget[key] || 0, wantedMarks));
      const qCount = Math.floor(canGive / Math.max(1, mPerQ));
      const givenMarks = qCount * mPerQ;
      globalMixBudget[key] = (globalMixBudget[key] || 0) - givenMarks;
      return givenMarks;
    }

    const allowed = Array.isArray(window._allowedDifficultyLevels) ? window._allowedDifficultyLevels : ['L1','L2','L3'];

const wantL1m = allowed.includes('L1') ? takeFromBudget("Level 1", desiredByMarks[0]) : 0;
const wantL2m = allowed.includes('L2') ? takeFromBudget("Level 2", desiredByMarks[1]) : 0;
const wantL3m = allowed.includes('L3') ? takeFromBudget("Level 3", desiredByMarks[2]) : 0;

    let wantL1q = Math.floor(wantL1m / Math.max(1, mPerQ));
    let wantL2q = Math.floor(wantL2m / Math.max(1, mPerQ));
    let wantL3q = Math.floor(wantL3m / Math.max(1, mPerQ));

    const capTotal = Math.min(totalNeed, wantL1q + wantL2q + wantL3q);
    const scaleDown = (wantL1q + wantL2q + wantL3q) > 0 ? capTotal / (wantL1q + wantL2q + wantL3q) : 0;
    if (scaleDown > 0 && scaleDown < 1) {
      wantL1q = Math.floor(wantL1q * scaleDown);
      wantL2q = Math.floor(wantL2q * scaleDown);
      wantL3q = Math.floor(wantL3q * scaleDown);
      let rem = capTotal - (wantL1q + wantL2q + wantL3q);
      const order = ["L1", "L2", "L3"];
      for (const k of order) {
        if (!rem) break;
        if (k === "L1") wantL1q++;
        else if (k === "L2") wantL2q++;
        else wantL3q++;
        rem--;
      }
    }

    async function pickStrict(count, level, chapterList) {
      if (count <= 0) return [];
      const pool = await fetchFor(chapterList || null, count, level);
      return takeUniqueFromPool(pool, count, usedIds, usedKeys, subjectSeenKeys, marksPerQuestion);
    }

    if (!chs.length) {
      const p1 = await pickStrict(wantL1q, "Level 1", null);
      const p2 = await pickStrict(wantL2q, "Level 2", null);
      const p3 = await pickStrict(wantL3q, "Level 3", null);
      items.push(...p1, ...p2, ...p3);

      if (p1.length < wantL1q) errors.push(`${subject}: Mixed(strict, marks) needs ${wantL1q} L1, got ${p1.length}.`);
      if (p2.length < wantL2q) errors.push(`${subject}: Mixed(strict, marks) needs ${wantL2q} L2, got ${p2.length}.`);
      if (p3.length < wantL3q) errors.push(`${subject}: Mixed(strict, marks) needs ${wantL3q} L3, got ${p3.length}.`);
      return;
    }

    function splitEven(count) { return splitEvenAcrossChapters(count, chs); }

    const L1PerCh = splitEven(wantL1q);
    const L2PerCh = splitEven(wantL2q);
    const L3PerCh = splitEven(wantL3q);

    for (let i = 0; i < chs.length; i++) {
      const ch = chs[i];
      const c1 = await pickStrict(L1PerCh[i], "Level 1", [ch]);
      const c2 = await pickStrict(L2PerCh[i], "Level 2", [ch]);
      const c3 = await pickStrict(L3PerCh[i], "Level 3", [ch]);
      items.push(...c1, ...c2, ...c3);

      if (c1.length < L1PerCh[i]) errors.push(`${subject} / ${ch}: Mixed(strict, marks) needs ${L1PerCh[i]} L1, got ${c1.length}.`);
      if (c2.length < L2PerCh[i]) errors.push(`${subject} / ${ch}: Mixed(strict, marks) needs ${L2PerCh[i]} L2, got ${c2.length}.`);
      if (c3.length < L3PerCh[i]) errors.push(`${subject} / ${ch}: Mixed(strict, marks) needs ${L3PerCh[i]} L3, got ${c3.length}.`);
    }
  }

  if (difficultyValue === "Level 1" || difficultyValue === "Level 2" || difficultyValue === "Level 3") {
    await fillNonMixed(requestedCount, difficultyValue);
} else if (difficultyValue === "Custom") {
    await fillMixed(requestedCount);
} else {
    await fillNonMixed(requestedCount, null);
}

  return { items: items.slice(0, requestedCount), errors };
}

function createDropdown(containerId, options, placeholder) {
    const container = document.getElementById(containerId);
    if (!container) return;
    const optionsHTML = options.map(opt => `<div data-value="${opt}">${opt}</div>`).join('');
    container.innerHTML = `<div class="selected-option">${placeholder}</div><div class="dropdown-options">${optionsHTML}</div>`;
    container.dataset.value = '';
    container.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.custom-dropdown.open').forEach(d => { if (d !== container) d.classList.remove('open'); });
        container.classList.toggle('open');
        if (e.target.dataset.value) {
            const selectedValue = e.target.dataset.value;
            container.querySelector('.selected-option').textContent = selectedValue;
            container.dataset.value = selectedValue;
            container.classList.remove('open');
            container.dispatchEvent(new Event('change', { bubbles: true }));
        }
    });
}

function createMultiSelectDropdown(containerId, options, placeholder, onChange) {
    const container = document.getElementById(containerId);
    if (!container) return;
    const optionsHTML = options.map(opt => `<div><label><input type="checkbox" value="${opt}"> ${opt}</label></div>`).join('');
    container.innerHTML = `<div class="selected-chapters-display placeholder">${placeholder}</div><div class="dropdown-options">${optionsHTML}</div>`;
    container.classList.remove('open');

    function updateDisplay() {
        const checked = Array.from(container.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);
        const display = container.querySelector('.selected-chapters-display');
        if (checked.length) {
            display.textContent = checked.join(', ');
            display.classList.remove('placeholder');
        } else {
            display.textContent = placeholder;
            display.classList.add('placeholder');
        }
    }

    container.addEventListener('click', function (e) {
        e.stopPropagation();
        if (e.target.closest('.selected-chapters-display')) container.classList.toggle('open');
        if (e.target.type === 'checkbox') {
            updateDisplay();
            if (onChange) onChange();
        }
    });

    document.addEventListener('click', () => { container.classList.remove('open'); });
    updateDisplay();
}

function getMarksPerSelectedSubject() {

function setSubjectSectionsFromCurrentPaper(sIdx) {
    const list = document.getElementById(`sections-list-${sIdx}`);
    if (!list) return;

    const preset = getFixedPaperSectionPreset();
    const subjectBlock = list.closest('.subject-block');
    const addButton = subjectBlock?.querySelector('.add-section-btn');

    list.innerHTML = '';

    if (Array.isArray(preset) && preset.length) {
        preset.forEach(section => addSectionForSubject(sIdx, section));
        if (addButton) addButton.style.display = 'none';
    } else {
        addSectionForSubject(sIdx);
        if (addButton) addButton.style.display = '';
    }
}

function rebuildFixedPaperSectionsIfChanged() {
    const preset = getFixedPaperSectionPreset();
    const subjectMaxMarks = getMarksPerSelectedSubject();
    const subjectCount = Math.max(1, getSelectedSubjects().length);

    const nextKey = preset
        ? `${getPaperType()}|${subjectMaxMarks}|${subjectCount}`
        : '';

    const previousKey = window._fixedPaperPresetKey || '';

    if (nextKey === previousKey) return;

    window._fixedPaperPresetKey = nextKey;

    document.querySelectorAll('.subject-block').forEach((subjectBlock, sIdx) => {
        setSubjectSectionsFromCurrentPaper(sIdx);
    });
}

function createSectionDropdown(options, placeholder, defaultValue, onChange) {
    const dropdown = document.createElement('div');
    dropdown.className = 'custom-dropdown';
    const optionsHTML = options.map(opt => `<div data-value="${opt}">${opt}</div>`).join('');
    dropdown.innerHTML = `<div class="selected-option">${defaultValue || placeholder}</div><div class="dropdown-options">${optionsHTML}</div>`;
    dropdown.dataset.value = defaultValue || '';

    dropdown.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.custom-dropdown.open').forEach(d => { if (d !== dropdown) d.classList.remove('open'); });
        dropdown.classList.toggle('open');
        if (e.target.dataset.value) {
            const val = e.target.dataset.value;
            dropdown.querySelector('.selected-option').textContent = val;
            dropdown.dataset.value = val;
            dropdown.classList.remove('open');
            if (onChange) onChange(val);
        }
    });

    return dropdown;
}

        chapterDropdown.querySelector(

    const checkedChapters = Array.from(
        chapterDropdown.querySelectorAll(
            'input[type="checkbox"]:checked:not([value="__ALL__"])'
        )
    ).map(cb => cb.value);

    if (allSelected) {
        display.textContent = 'All Chapters';
        display.classList.remove('placeholder');

    } else if (checkedChapters.length === 0) {
        display.textContent =
            'Select one or more chapters';

        display.classList.add('placeholder');

    } else {
        display.textContent =
            checkedChapters.join(', ');

        display.classList.remove('placeholder');
    }

function buildSectionInstructions(sec) {
    if (sec.type === "all") {
        const n = Number(sec.numQuestions) || 0;
        return n ? `Answer all ${n} questions` : `Answer all the questions`;
    }
    if (sec.type === "any") {
        const anyN = Number(sec.attemptAny) || 0;
        return anyN ? `Answer any ${anyN} questions` : `Answer any questions`;
    }
    if (sec.type === "internal") {
        const p = Number(sec.numPairs) || 0;
        const n = p || 0;
        const plural = n === 1 ? "question" : "questions";
        return n
            ? `Answer all ${n} ${plural}. Choose either (A) or (B) in each.`
            : `Answer all questions. Choose either (A) or (B) in each.`;
    }
    return "";
}

function __ebIsParagraphBasedQuestion(data = {}) {
    return (
        normalizeMcqType(data?.mcqType || data?.type || '') === 'Paragraph-Based MCQ (Single Correct)' ||
        (Array.isArray(data?.mcqs) && data.mcqs.length > 0 && String(data?.passage || '').trim())
    );
}

function __ebGetParagraphSubQuestionText(mcq = {}) {
    return String(
        mcq.question ||
        String(mcq.body || '').split('\n')[0] ||
        ''
    ).trim();
}

function __ebCleanOptionText(option) {
    return String(option || '')
        .replace(/^[A-D][).:\-]\s*/i, '')
        .trim();
}

function __ebBuildParagraphPlainText(data = {}) {
    const passage = String(data.passage || '').trim();
    const mcqs = Array.isArray(data.mcqs) ? data.mcqs : [];

    const blocks = [
        'Read the following passage and answer the questions:',
        'Passage:',
        passage
    ];

    mcqs.forEach((mcq, index) => {
        const question = __ebGetParagraphSubQuestionText(mcq);
        const options = Array.isArray(mcq.options) ? mcq.options.slice(0, 4) : [];

        blocks.push('');
        blocks.push(`(${index + 1}) ${question}`);

        options.forEach((option, optionIndex) => {
            blocks.push(`${String.fromCharCode(65 + optionIndex)}) ${__ebCleanOptionText(option)}`);
        });
    });

    return blocks.join('\n').trim();
}

function getQuestionTextFromDoc(data) {
    if (__ebIsParagraphBasedQuestion(data)) {
        return __ebBuildParagraphPlainText(data);
    }

    return data.question || data.body || data.text || '';
}

function getQuestionAnswerFromDoc(data) {
    const candidates = [
        data.parsedAnswer,
        data.parsedAns,
        data.correctAnswer,
        data.correct_option,
        data.correctOption,
        data.answer
    ];

    for (const val of candidates) {
        if (val == null) continue;

        const letters = extractAnswerLetters(val);
        if (letters.length) {
            return letters.join(',');
        }

        if (Array.isArray(val)) {
            const arr = val.map(v => String(v || '').trim()).filter(Boolean);
            if (arr.length) return arr.join(', ');
            continue;
        }

        const raw = String(val).trim();
        if (raw) return raw;
    }

    return '';
}

function getQuestionExplanationFromDoc(data) {
    return data.explanation || data.solution || data.explain || '';
}

function normalizeQuestionDoc(doc) {
    const q = { ...(doc || {}) };

    q.question = getQuestionTextFromDoc(q);
    q.answer = getQuestionAnswerFromDoc(q);
    q.explanation = getQuestionExplanationFromDoc(q);
    q.mcqType = normalizeMcqType(q.mcqType || q.type || '');
    q.difficulty = q.difficulty || q.level || '';
    q.options = Array.isArray(q.options) ? q.options : [];
    q.mcqs = Array.isArray(q.mcqs) ? q.mcqs.map(mcq => ({ ...mcq })) : [];

    return q;
}

function mapBankQuestionToBuilderQuestion(q, sectionMcqType, marksPerQuestion) {
    const norm = normalizeQuestionDoc(q);

    if (
        sectionMcqType === "Paragraph-Based MCQ (Single Correct)" ||
        __ebIsParagraphBasedQuestion(norm)
    ) {
        const passage = String(norm.passage || '').trim();

        const mappedMcqs = (Array.isArray(norm.mcqs) ? norm.mcqs : []).map((mcq) => {
            const subQuestion = __ebGetParagraphSubQuestionText(mcq);

            let subOptions = Array.isArray(mcq.options)
                ? mcq.options.slice(0, 4).map(__ebCleanOptionText)
                : [];

            let subAnswer = getQuestionAnswerFromDoc(mcq);

            if (subOptions.length === 4 && getGlobalShuffleOptions()) {
                const shuffled = shuffleMCQQuestion({
                    question: subQuestion,
                    options: subOptions,
                    answer: subAnswer
                });

                subOptions = Array.isArray(shuffled.options)
                    ? shuffled.options.slice(0, 4)
                    : subOptions;

                subAnswer = extractAnswerLetters(shuffled.answer).join(',') || subAnswer;
            }

            return {
                question: subQuestion,
                text: subQuestion,
                body: [
                    subQuestion,
                    ...subOptions.map((option, optionIndex) =>
                        `${String.fromCharCode(65 + optionIndex)}) ${option}`
                    )
                ].join('\n'),
                options: subOptions,
                answer: subAnswer || '',
                parsedAnswer: subAnswer || '',
                explanation: mcq.explanation || mcq.solution || mcq.explain || '',
                finalAnswer: mcq.finalAnswer || ''
            };
        });

        const paragraphRecord = {
            passage,
            mcqs: mappedMcqs
        };

        return {
            number: 0,
            text: __ebBuildParagraphPlainText(paragraphRecord),
            passage,
            mcqs: mappedMcqs,
            marks: Number(marksPerQuestion || norm.marks || mappedMcqs.length || 0),
            options: [],
            answer: '',
            explanation: '',
            image: norm.image || '',
            type: 'Paragraph-Based MCQ (Single Correct)',
            mcqType: 'Paragraph-Based MCQ (Single Correct)'
        };
    }

       const stem = norm.question || '';

    const isMatchingStyle =
        sectionMcqType === "Matching Matrix" ||
        sectionMcqType === "Matching List";

    const isFourOptionType = (
        sectionMcqType === "MCQ (Single)" ||
        sectionMcqType === "MCQ (Multiple)" ||
        sectionMcqType === "Assertion and Reason (MCQ Single)" ||
        sectionMcqType === "Matching Matrix" ||
        sectionMcqType === "Matching List"
    );

    let options = [];

    if (Array.isArray(norm.options) && norm.options.length >= 4) {
        options = norm.options.slice(0, 4);
    } else if (
        norm.options &&
        typeof norm.options === 'object' &&
        !Array.isArray(norm.options) &&
        norm.options.A &&
        norm.options.B &&
        norm.options.C &&
        norm.options.D
    ) {
        options = [
            norm.options.A,
            norm.options.B,
            norm.options.C,
            norm.options.D
        ];
    } else {
        const extractedOptions = extractMCQOptions(norm);

        if (Array.isArray(extractedOptions) && extractedOptions.length === 4) {
            options = extractedOptions;
        }
    }

    const clean = options.map(o => {
        const raw = String(o || '');

               return isMatchingStyle
            ? raw.replace(/^[A-D][).:]\s*/i, '').trim()
            : raw.replace(/^[A-D][).:\-]\s*/i, '').trim();
    });

    const rawAnswer = String(norm.answer || '').trim();

    const answerLetters = rawAnswer
        .toUpperCase()
        .split(',')
        .map(x => x.trim())
        .filter(x => /^[A-D]$/.test(x))
        .join(',');

    if (isFourOptionType) {
        if (clean.length === 4) {
            if (getGlobalShuffleOptions()) {
                const shuffled = shuffleMCQQuestion({
                    ...norm,
                    question: stem,
                    options: clean,
                    answer: answerLetters || rawAnswer
                });

                const letterAns = extractAnswerLetters(shuffled.answer).join(',');

                return {
                    number: 0,
                    text: shuffled.question || stem,
                    marks: Number(marksPerQuestion || norm.marks || 0),
                    options: shuffled.options || clean,
                    answer: letterAns || answerLetters || rawAnswer || '',
                    explanation: norm.explanation || '',
                    image: norm.image || '',
                    mcqType: sectionMcqType
                };
            }

            return {
                number: 0,
                text: stem,
                marks: Number(marksPerQuestion || norm.marks || 0),
                options: clean,
                answer: answerLetters || rawAnswer || '',
                explanation: norm.explanation || '',
                image: norm.image || '',
                mcqType: sectionMcqType
            };
        }

        return {
            number: 0,
            text: stem,
            marks: Number(marksPerQuestion || norm.marks || 0),
            options: [],
            answer: answerLetters || rawAnswer || '',
            explanation: norm.explanation || '',
            image: norm.image || '',
            mcqType: sectionMcqType
        };
    }

    if (sectionMcqType === "Fill in the Blanks") {
        return {
            number: 0,
            text: stem,
            marks: Number(marksPerQuestion || norm.marks || 0),
            options: [],
            answer: rawAnswer || '',
            explanation: norm.explanation || '',
            image: norm.image || '',
            mcqType: sectionMcqType
        };
    }

    return {
        number: 0,
        text: stem,
        marks: Number(marksPerQuestion || norm.marks || 0),
        options: [],
        answer: rawAnswer || '',
        explanation: norm.explanation || '',
        image: norm.image || '',
        mcqType: sectionMcqType
    };
}

function __buildDynamicLevelCounts(totalQuestions, percentages) {
    const total = Math.max(0, Number(totalQuestions || 0));

    if (!total) {
        return { L1: 0, L2: 0, L3: 0 };
    }

    const levels = ['L1', 'L2', 'L3'];

    const rows = levels.map((level, index) => {
        const raw = total * Number(percentages[level] || 0) / 100;

        return {
            level,
            index,
            raw,
            count: Math.floor(raw),
            fraction: raw - Math.floor(raw)
        };
    });

    let used = rows.reduce((sum, row) => sum + row.count, 0);
    let remaining = total - used;

    rows
        .slice()
        .sort((a, b) => {
            if (b.fraction !== a.fraction) return b.fraction - a.fraction;
            if (Number(percentages[b.level] || 0) !== Number(percentages[a.level] || 0)) {
                return Number(percentages[b.level] || 0) - Number(percentages[a.level] || 0);
            }
            return a.index - b.index;
        })
        .forEach(row => {
            if (remaining > 0 && Number(percentages[row.level] || 0) > 0) {
                rows.find(x => x.level === row.level).count++;
                remaining--;
            }
        });

    const counts = { L1: 0, L2: 0, L3: 0 };

    rows.forEach(row => {
        counts[row.level] = row.count;
    });

    return counts;
}

function __buildDynamicSectionLevelPlan({ paperType, mcqType, numQuestions }) {
    const qCount = Math.max(0, Number(numQuestions || 0));
    const type = String(mcqType || '').trim();

    if (!qCount) return null;

    let percentages = null;
    let sequence = [];

    if (paperType === 'Core Paper') {
        percentages = { L1: 60, L2: 40, L3: 0 };
        sequence = ['L1', 'L2', 'L1', 'L1', 'L2'];
    } else if (paperType === 'Pinnacle Paper' && type === 'Fill in the Blanks') {
        percentages = { L1: 50, L2: 50, L3: 0 };
        sequence = ['L1', 'L2'];
    } else if (paperType === 'Pinnacle Paper') {
        percentages = { L1: 24, L2: 40, L3: 36 };
        sequence = ['L1', 'L2', 'L3', 'L2', 'L3'];
    } else {
        return null;
    }

    const counts = __buildDynamicLevelCounts(qCount, percentages);
    const plan = [];

    while (plan.length < qCount) {
        let addedInThisRound = false;

        sequence.forEach(level => {
            if (plan.length < qCount && counts[level] > 0) {
                plan.push(level);
                counts[level]--;
                addedInThisRound = true;
            }
        });

        if (!addedInThisRound) break;
    }

    ['L1', 'L2', 'L3'].forEach(level => {
        while (plan.length < qCount && counts[level] > 0) {
            plan.push(level);
            counts[level]--;
        }
    });

    return plan.length === qCount ? plan : null;
}

function buildFairChapterPlan(chapters, totalNeed) {
    const chs = Array.isArray(chapters) ? chapters.filter(Boolean) : [];
    if (!chs.length || totalNeed <= 0) return [];

    const perChapter = splitEvenAcrossChapters(totalNeed, chs);
    const decorated = chs.map((ch, idx) => ({
        ch,
        idx,
        count: perChapter[idx]
    }));

    // rotate starting point so first chapters are not always favored
    const seed = Date.now() % chs.length;
    const rotated = decorated.map((_, i) => decorated[(seed + i) % decorated.length]);

    const plan = [];
    rotated.forEach(item => {
        for (let i = 0; i < item.count; i++) {
            plan.push(item.ch);
        }
    });

    return plan;
}
