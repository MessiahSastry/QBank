    return uniqueByIdOrText(docs);
  }

  async function borrow(need, sameDifficulty) {
    if (need <= 0) return [];
    let pool = [];
    if (sameDifficulty) {
      pool = await fetchFor(chs, need, sameDifficulty);
      let picked = takeUniqueFromPool(pool, need, usedIds, usedKeys, subjectSeenKeys, marksPerQuestion);
      need -= picked.length;
      if (need <= 0) return picked;

      const pool2 = await fetchFor(chs, need, null);
      picked = picked.concat(takeUniqueFromPool(pool2, need, usedIds, usedKeys, subjectSeenKeys, marksPerQuestion));
      return picked;
    } else {
      pool = await fetchFor(chs, need, null);
      return takeUniqueFromPool(pool, need, usedIds, usedKeys, subjectSeenKeys, marksPerQuestion);
    }
  }

  async function fillNonMixed(totalNeed, forceDiff) {
    if (!chs.length) {
      const pool = await fetchFor(null, totalNeed, forceDiff);
      items.push(...takeUniqueFromPool(pool, totalNeed, usedIds, usedKeys, subjectSeenKeys, marksPerQuestion));
      return;
    }

    const strictOneEach = totalNeed <= chs.length;
    if (strictOneEach) {
      for (let i = 0; i < chs.length && items.length < totalNeed; i++) {
        let pool = await fetchFor([chs[i]], 1, forceDiff);
        let picked = takeUniqueFromPool(pool, 1, usedIds, usedKeys, subjectSeenKeys, marksPerQuestion);
        if (!picked.length) {
          pool = await fetchFor([chs[i]], 1, null);
          picked = takeUniqueFromPool(pool, 1, usedIds, usedKeys, subjectSeenKeys, marksPerQuestion);
        }
        if (picked.length) items.push(...picked);
      }

      let remaining = totalNeed - items.length;
      if (remaining > 0) {
        const borrowedSame = await borrow(remaining, forceDiff);
        items.push(...borrowedSame);
        remaining = totalNeed - items.length;
      }
      if (remaining > 0) {
        const borrowedAny = await borrow(remaining, null);
        items.push(...borrowedAny);
      }
      if (items.length < totalNeed) {
        errors.push(`${subject}: Could not pick one per selected chapter; only ${items.length} of ${totalNeed} found.`);
      }
      return;
    }

    const perChapter = splitEvenAcrossChapters(totalNeed, chs);
    for (let i = 0; i < chs.length; i++) {
      const need = perChapter[i];
      if (!need) continue;
      const pool = await fetchFor([chs[i]], need, forceDiff);
      const picked = takeUniqueFromPool(pool, need, usedIds, usedKeys, subjectSeenKeys, marksPerQuestion);
      items.push(...picked);
      perChapter[i] -= picked.length;
    }

    let remaining = perChapter.reduce((a, b) => a + b, 0);
    if (remaining > 0) {
      const borrowedSame = await borrow(remaining, forceDiff);
      items.push(...borrowedSame);
      remaining = totalNeed - items.length;
    }
    if (remaining > 0) {
      const borrowedAny = await borrow(remaining, null);
      items.push(...borrowedAny);
    }

    if (items.length < totalNeed) {
      errors.push(`${subject}: Only ${items.length} of ${totalNeed} questions found (after chapter balance).`);
    }
  }

  async function fillMixed(totalNeed) {
    const mPerQ = Number(marksPerQuestion || 0);
    const sectionMarks = (Number(totalNeed || 0) * mPerQ);
       const p1 = Number(window._difficultyDistribution?.L1 || 0);
    const p2 = Number(window._difficultyDistribution?.L2 || 0);
    const p3 = Number(window._difficultyDistribution?.L3 || 0);
    const desiredByMarks = splitCounts(sectionMarks, [p1, p2, p3]);

    function takeFromBudget(level, wantedMarks) {
      if (!globalMixBudget) return wantedMarks;
      const key = (level === "Level 1") ? "L1" : (level === "Level 2") ? "L2" : "L3";
      const canGive = Math.max(0, Math.min(globalMixBudget[key] || 0, wantedMarks));
      const qCount = Math.floor(canGive / Math.max(1, mPerQ));
      const givenMarks = qCount * mPerQ;
      globalMixBudget[key] = (globalMixBudget[key] || 0) - givenMarks;
      return givenMarks;
    }

    const allowed = Array.isArray(window._allowedDifficultyLevels) ? window._allowedDifficultyLevels : ['L1','L2','L3'];

const wantL1m = allowed.includes('L1') ? takeFromBudget("Level 1", desiredByMarks[0]) : 0;
const wantL2m = allowed.includes('L2') ? takeFromBudget("Level 2", desiredByMarks[1]) : 0;
const wantL3m = allowed.includes('L3') ? takeFromBudget("Level 3", desiredByMarks[2]) : 0;

    let wantL1q = Math.floor(wantL1m / Math.max(1, mPerQ));
    let wantL2q = Math.floor(wantL2m / Math.max(1, mPerQ));
    let wantL3q = Math.floor(wantL3m / Math.max(1, mPerQ));

    const capTotal = Math.min(totalNeed, wantL1q + wantL2q + wantL3q);
    const scaleDown = (wantL1q + wantL2q + wantL3q) > 0 ? capTotal / (wantL1q + wantL2q + wantL3q) : 0;
    if (scaleDown > 0 && scaleDown < 1) {
      wantL1q = Math.floor(wantL1q * scaleDown);
      wantL2q = Math.floor(wantL2q * scaleDown);
      wantL3q = Math.floor(wantL3q * scaleDown);
      let rem = capTotal - (wantL1q + wantL2q + wantL3q);
      const order = ["L1", "L2", "L3"];
      for (const k of order) {
        if (!rem) break;
        if (k === "L1") wantL1q++;
        else if (k === "L2") wantL2q++;
        else wantL3q++;
        rem--;
      }
    }

    async function pickStrict(count, level, chapterList) {
      if (count <= 0) return [];
      const pool = await fetchFor(chapterList || null, count, level);
      return takeUniqueFromPool(pool, count, usedIds, usedKeys, subjectSeenKeys, marksPerQuestion);
    }

    if (!chs.length) {
      const p1 = await pickStrict(wantL1q, "Level 1", null);
      const p2 = await pickStrict(wantL2q, "Level 2", null);
      const p3 = await pickStrict(wantL3q, "Level 3", null);
      items.push(...p1, ...p2, ...p3);

      if (p1.length < wantL1q) errors.push(`${subject}: Mixed(strict, marks) needs ${wantL1q} L1, got ${p1.length}.`);
      if (p2.length < wantL2q) errors.push(`${subject}: Mixed(strict, marks) needs ${wantL2q} L2, got ${p2.length}.`);
      if (p3.length < wantL3q) errors.push(`${subject}: Mixed(strict, marks) needs ${wantL3q} L3, got ${p3.length}.`);
      return;
    }

    function splitEven(count) { return splitEvenAcrossChapters(count, chs); }

    const L1PerCh = splitEven(wantL1q);
    const L2PerCh = splitEven(wantL2q);
    const L3PerCh = splitEven(wantL3q);

    for (let i = 0; i < chs.length; i++) {
      const ch = chs[i];
      const c1 = await pickStrict(L1PerCh[i], "Level 1", [ch]);
      const c2 = await pickStrict(L2PerCh[i], "Level 2", [ch]);
      const c3 = await pickStrict(L3PerCh[i], "Level 3", [ch]);
      items.push(...c1, ...c2, ...c3);

      if (c1.length < L1PerCh[i]) errors.push(`${subject} / ${ch}: Mixed(strict, marks) needs ${L1PerCh[i]} L1, got ${c1.length}.`);
      if (c2.length < L2PerCh[i]) errors.push(`${subject} / ${ch}: Mixed(strict, marks) needs ${L2PerCh[i]} L2, got ${c2.length}.`);
      if (c3.length < L3PerCh[i]) errors.push(`${subject} / ${ch}: Mixed(strict, marks) needs ${L3PerCh[i]} L3, got ${c3.length}.`);
    }
  }

  if (difficultyValue === "Level 1" || difficultyValue === "Level 2" || difficultyValue === "Level 3") {
    await fillNonMixed(requestedCount, difficultyValue);
} else if (difficultyValue === "Custom") {
    await fillMixed(requestedCount);
} else {
    await fillNonMixed(requestedCount, null);
}

  return { items: items.slice(0, requestedCount), errors };
}

function createDropdown(containerId, options, placeholder) {
    const container = document.getElementById(containerId);
    if (!container) return;
    const optionsHTML = options.map(opt => `<div data-value="${opt}">${opt}</div>`).join('');
    container.innerHTML = `<div class="selected-option">${placeholder}</div><div class="dropdown-options">${optionsHTML}</div>`;
    container.dataset.value = '';
    container.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.custom-dropdown.open').forEach(d => { if (d !== container) d.classList.remove('open'); });
        container.classList.toggle('open');
        if (e.target.dataset.value) {
            const selectedValue = e.target.dataset.value;
            container.querySelector('.selected-option').textContent = selectedValue;
            container.dataset.value = selectedValue;
            container.classList.remove('open');
            container.dispatchEvent(new Event('change', { bubbles: true }));
        }
    });
}

function createMultiSelectDropdown(containerId, options, placeholder, onChange) {
    const container = document.getElementById(containerId);
    if (!container) return;
    const optionsHTML = options.map(opt => `<div><label><input type="checkbox" value="${opt}"> ${opt}</label></div>`).join('');
    container.innerHTML = `<div class="selected-chapters-display placeholder">${placeholder}</div><div class="dropdown-options">${optionsHTML}</div>`;
    container.classList.remove('open');

    function updateDisplay() {
        const checked = Array.from(container.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);
        const display = container.querySelector('.selected-chapters-display');
        if (checked.length) {
            display.textContent = checked.join(', ');
            display.classList.remove('placeholder');
        } else {
            display.textContent = placeholder;
            display.classList.add('placeholder');
        }
    }

    container.addEventListener('click', function (e) {
        e.stopPropagation();
        if (e.target.closest('.selected-chapters-display')) container.classList.toggle('open');
        if (e.target.type === 'checkbox') {
            updateDisplay();
            if (onChange) onChange();
        }
    });

    document.addEventListener('click', () => { container.classList.remove('open'); });
    updateDisplay();
}

function setSubjectSectionsFromCurrentPaper(sIdx) {
    if (getSelectedBoard() === 'CBSE' && window.CBSEBuilder) { window.CBSEBuilder.renderSubject(sIdx); return; }
    const list = document.getElementById(`sections-list-${sIdx}`);
    if (!list) return;

    const preset = getFixedPaperSectionPreset();
    const subjectBlock = list.closest('.subject-block');
    const addButton = subjectBlock?.querySelector('.add-section-btn');

    list.innerHTML = '';

    if (Array.isArray(preset) && preset.length) {
        preset.forEach(section => addSectionForSubject(sIdx, section));
        if (addButton) addButton.style.display = 'none';
    } else {
        addSectionForSubject(sIdx);
        if (addButton) addButton.style.display = '';
    }
}

function rebuildFixedPaperSectionsIfChanged() {
    if (getSelectedBoard() === 'CBSE') return;
    const preset = getFixedPaperSectionPreset();
    const subjectMaxMarks = getMarksPerSelectedSubject();
    const subjectCount = Math.max(1, getSelectedSubjects().length);

    const nextKey = preset
        ? `${getPaperType()}|${subjectMaxMarks}|${subjectCount}`
        : '';

    const previousKey = window._fixedPaperPresetKey || '';

    if (nextKey === previousKey) return;

    window._fixedPaperPresetKey = nextKey;

    document.querySelectorAll('.subject-block').forEach((subjectBlock, sIdx) => {
        setSubjectSectionsFromCurrentPaper(sIdx);
    });
}
function __ebGetMappedChapters(
    selectedClass,
    selectedBoard,
    selectedSubject
) {
    const boardMap =
        window.BOARD_CHAPTERS?.[selectedBoard];

    const classMap =
        boardMap?.[selectedClass];

    const chapters =
        classMap?.[selectedSubject];

    if (!Array.isArray(chapters)) {
        return [];
    }

    return Array.from(
        new Set(
            chapters
                .map(ch => String(ch || '').trim())
                .filter(Boolean)
        )
    );
}


async function __ebGetChaptersForCurrentSource(
    selectedClass,
    selectedBoard,
    selectedSubject
) {
    const source =
        getSourceTypeGlobal();

    if (source === 'AI Generate') {

        const mappedChapters =
            __ebGetMappedChapters(
                selectedClass,
                selectedBoard,
                selectedSubject
            );

        if (mappedChapters.length > 0) {
            return mappedChapters;
        }
    }

    return await db.getChapters(
        selectedClass,
        selectedBoard,
        selectedSubject
    );
}

function createSectionDropdown(options, placeholder, defaultValue, onChange) {
    const dropdown = document.createElement('div');
    dropdown.className = 'custom-dropdown';
    const optionsHTML = options.map(opt => `<div data-value="${opt}">${opt}</div>`).join('');
    dropdown.innerHTML = `<div class="selected-option">${defaultValue || placeholder}</div><div class="dropdown-options">${optionsHTML}</div>`;
    dropdown.dataset.value = defaultValue || '';

    dropdown.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.custom-dropdown.open').forEach(d => { if (d !== dropdown) d.classList.remove('open'); });
        dropdown.classList.toggle('open');
        if (e.target.dataset.value) {
            const val = e.target.dataset.value;
            dropdown.querySelector('.selected-option').textContent = val;
            dropdown.dataset.value = val;
            dropdown.classList.remove('open');
            if (onChange) onChange(val);
        }
    });

    return dropdown;

function __ebIsParagraphBasedQuestion(data = {}) {
    return (
        normalizeMcqType(data?.mcqType || data?.type || '') === 'Paragraph-Based MCQ (Single Correct)' ||
        (Array.isArray(data?.mcqs) && data.mcqs.length > 0 && String(data?.passage || '').trim())
    );
}

function __ebGetParagraphSubQuestionText(mcq = {}) {
    return String(
        mcq.question ||
        String(mcq.body || '').split('\n')[0] ||
        ''
    ).trim();
}

function __ebCleanOptionText(option) {
    return String(option || '')
        .replace(/^[A-D][).:\-]\s*/i, '')
        .trim();
}

function __ebBuildParagraphPlainText(data = {}) {
    const passage = String(data.passage || '').trim();
    const mcqs = Array.isArray(data.mcqs) ? data.mcqs : [];

    const blocks = [
        'Read the following passage and answer the questions:',
        'Passage:',
        passage
    ];

    mcqs.forEach((mcq, index) => {
        const question = __ebGetParagraphSubQuestionText(mcq);
        const options = Array.isArray(mcq.options) ? mcq.options.slice(0, 4) : [];

        blocks.push('');
        blocks.push(`(${index + 1}) ${question}`);

        options.forEach((option, optionIndex) => {
            blocks.push(`${String.fromCharCode(65 + optionIndex)}) ${__ebCleanOptionText(option)}`);
        });
    });

    return blocks.join('\n').trim();
}

function getQuestionTextFromDoc(data) {
    if (__ebIsParagraphBasedQuestion(data)) {
        return __ebBuildParagraphPlainText(data);
    }

    return data.question || data.body || data.text || '';
}

function getQuestionAnswerFromDoc(data) {
    const candidates = [
        data.parsedAnswer,
        data.parsedAns,
        data.correctAnswer,
        data.correct_option,
        data.correctOption,
        data.answer
    ];

    for (const val of candidates) {
        if (val == null) continue;

        const letters = extractAnswerLetters(val);
        if (letters.length) {
            return letters.join(',');
        }

        if (Array.isArray(val)) {
            const arr = val.map(v => String(v || '').trim()).filter(Boolean);
            if (arr.length) return arr.join(', ');
            continue;
        }

        const raw = String(val).trim();
        if (raw) return raw;
    }

    return '';
}

function getQuestionExplanationFromDoc(data) {
    return data.explanation || data.solution || data.explain || '';
}

function normalizeQuestionDoc(doc) {
    const q = { ...(doc || {}) };

    q.question = getQuestionTextFromDoc(q);
    q.answer = getQuestionAnswerFromDoc(q);
    q.explanation = getQuestionExplanationFromDoc(q);
    q.mcqType = normalizeMcqType(q.mcqType || q.type || '');
    q.difficulty = q.difficulty || q.level || '';
    q.options = Array.isArray(q.options) ? q.options : [];
    q.mcqs = Array.isArray(q.mcqs) ? q.mcqs.map(mcq => ({ ...mcq })) : [];

    return q;
}

function mapBankQuestionToBuilderQuestion(q, sectionMcqType, marksPerQuestion) {
    const norm = normalizeQuestionDoc(q);

    if (
        sectionMcqType === "Paragraph-Based MCQ (Single Correct)" ||
        __ebIsParagraphBasedQuestion(norm)
    ) {
        const passage = String(norm.passage || '').trim();

        const mappedMcqs = (Array.isArray(norm.mcqs) ? norm.mcqs : []).map((mcq) => {
            const subQuestion = __ebGetParagraphSubQuestionText(mcq);

            let subOptions = Array.isArray(mcq.options)
                ? mcq.options.slice(0, 4).map(__ebCleanOptionText)
                : [];

            let subAnswer = getQuestionAnswerFromDoc(mcq);

            if (subOptions.length === 4 && getGlobalShuffleOptions()) {
                const shuffled = shuffleMCQQuestion({
                    question: subQuestion,
                    options: subOptions,
                    answer: subAnswer
                });

                subOptions = Array.isArray(shuffled.options)
                    ? shuffled.options.slice(0, 4)
                    : subOptions;

                subAnswer = extractAnswerLetters(shuffled.answer).join(',') || subAnswer;
            }

            return {
                question: subQuestion,
                text: subQuestion,
                body: [
                    subQuestion,
                    ...subOptions.map((option, optionIndex) =>
                        `${String.fromCharCode(65 + optionIndex)}) ${option}`
                    )
                ].join('\n'),
                options: subOptions,
                answer: subAnswer || '',
                parsedAnswer: subAnswer || '',
                explanation: mcq.explanation || mcq.solution || mcq.explain || '',
                finalAnswer: mcq.finalAnswer || ''
            };
        });

        const paragraphRecord = {
            passage,
            mcqs: mappedMcqs
        };

        return {
            number: 0,
            text: __ebBuildParagraphPlainText(paragraphRecord),
            passage,
            mcqs: mappedMcqs,
            marks: Number(marksPerQuestion || norm.marks || mappedMcqs.length || 0),
            options: [],
            answer: '',
            explanation: '',
            image: norm.image || '',
            type: 'Paragraph-Based MCQ (Single Correct)',
            mcqType: 'Paragraph-Based MCQ (Single Correct)'
        };
    }

       const stem = norm.question || '';

    const isMatchingStyle =
        sectionMcqType === "Matching Matrix" ||
        sectionMcqType === "Matching List";

    const isFourOptionType = (
        sectionMcqType === "MCQ (Single)" ||
        sectionMcqType === "MCQ (Multiple)" ||
        sectionMcqType === "Assertion and Reason (MCQ Single)" ||
        sectionMcqType === "Matching Matrix" ||
        sectionMcqType === "Matching List"
    );

    let options = [];

    if (Array.isArray(norm.options) && norm.options.length >= 4) {
        options = norm.options.slice(0, 4);
    } else if (
        norm.options &&
        typeof norm.options === 'object' &&
        !Array.isArray(norm.options) &&
        norm.options.A &&
        norm.options.B &&
        norm.options.C &&
        norm.options.D
    ) {
        options = [
            norm.options.A,
            norm.options.B,
            norm.options.C,
            norm.options.D
        ];
    } else {
        const extractedOptions = extractMCQOptions(norm);

        if (Array.isArray(extractedOptions) && extractedOptions.length === 4) {
            options = extractedOptions;
        }
    }

    const clean = options.map(o => {
        const raw = String(o || '');

               return isMatchingStyle
            ? raw.replace(/^[A-D][).:]\s*/i, '').trim()
            : raw.replace(/^[A-D][).:\-]\s*/i, '').trim();
    });

    const rawAnswer = String(norm.answer || '').trim();

    const answerLetters = rawAnswer
        .toUpperCase()
        .split(',')
        .map(x => x.trim())
        .filter(x => /^[A-D]$/.test(x))
        .join(',');

    if (isFourOptionType) {
        if (clean.length === 4) {
            if (getGlobalShuffleOptions()) {
                const shuffled = shuffleMCQQuestion({
                    ...norm,
                    question: stem,
                    options: clean,
                    answer: answerLetters || rawAnswer
                });

                const letterAns = extractAnswerLetters(shuffled.answer).join(',');

                return {
                    number: 0,
                    text: shuffled.question || stem,
                    marks: Number(marksPerQuestion || norm.marks || 0),
                    options: shuffled.options || clean,
                    answer: letterAns || answerLetters || rawAnswer || '',
                    explanation: norm.explanation || '',
                    image: norm.image || '',
                    mcqType: sectionMcqType
                };
            }

            return {
                number: 0,
                text: stem,
                marks: Number(marksPerQuestion || norm.marks || 0),
                options: clean,
                answer: answerLetters || rawAnswer || '',
                explanation: norm.explanation || '',
                image: norm.image || '',
                mcqType: sectionMcqType
            };
        }

        return {
            number: 0,
            text: stem,
            marks: Number(marksPerQuestion || norm.marks || 0),
            options: [],
            answer: answerLetters || rawAnswer || '',
            explanation: norm.explanation || '',
            image: norm.image || '',
            mcqType: sectionMcqType
        };
    }

    if (sectionMcqType === "Fill in the Blanks") {
        return {
            number: 0,
            text: stem,
            marks: Number(marksPerQuestion || norm.marks || 0),
            options: [],
            answer: rawAnswer || '',
            explanation: norm.explanation || '',
            image: norm.image || '',
            mcqType: sectionMcqType
        };
    }

    return {
        number: 0,
        text: stem,
        marks: Number(marksPerQuestion || norm.marks || 0),
        options: [],
        answer: rawAnswer || '',
        explanation: norm.explanation || '',
        image: norm.image || '',
        mcqType: sectionMcqType
    };
}

function __buildDynamicLevelCounts(totalQuestions, percentages) {
    const total = Math.max(0, Number(totalQuestions || 0));

    if (!total) {
        return { L1: 0, L2: 0, L3: 0 };
    }

    const levels = ['L1', 'L2', 'L3'];

    const rows = levels.map((level, index) => {
        const raw = total * Number(percentages[level] || 0) / 100;

        return {
            level,
            index,
            raw,
            count: Math.floor(raw),
            fraction: raw - Math.floor(raw)
        };
    });

    let used = rows.reduce((sum, row) => sum + row.count, 0);
    let remaining = total - used;

    rows
        .slice()
        .sort((a, b) => {
            if (b.fraction !== a.fraction) return b.fraction - a.fraction;
            if (Number(percentages[b.level] || 0) !== Number(percentages[a.level] || 0)) {
                return Number(percentages[b.level] || 0) - Number(percentages[a.level] || 0);
            }
            return a.index - b.index;
        })
        .forEach(row => {
            if (remaining > 0 && Number(percentages[row.level] || 0) > 0) {
                rows.find(x => x.level === row.level).count++;
                remaining--;
            }
        });

    const counts = { L1: 0, L2: 0, L3: 0 };

    rows.forEach(row => {
        counts[row.level] = row.count;
    });

    return counts;
}

function __buildDynamicSectionLevelPlan({ paperType, mcqType, numQuestions }) {
    const qCount = Math.max(0, Number(numQuestions || 0));
    const type = String(mcqType || '').trim();

    if (!qCount) return null;

    let percentages = null;
    let sequence = [];

    if (paperType === 'Core Paper') {
        percentages = { L1: 60, L2: 40, L3: 0 };
        sequence = ['L1', 'L2', 'L1', 'L1', 'L2'];
    } else if (paperType === 'Pinnacle Paper' && type === 'Fill in the Blanks') {
        percentages = { L1: 50, L2: 50, L3: 0 };
        sequence = ['L1', 'L2'];
    } else if (paperType === 'Pinnacle Paper') {
        percentages = { L1: 24, L2: 40, L3: 36 };
        sequence = ['L1', 'L2', 'L3', 'L2', 'L3'];
    } else {
        return null;
    }

    const counts = __buildDynamicLevelCounts(qCount, percentages);
    const plan = [];

    while (plan.length < qCount) {
        let addedInThisRound = false;

        sequence.forEach(level => {
            if (plan.length < qCount && counts[level] > 0) {
                plan.push(level);
                counts[level]--;
                addedInThisRound = true;
            }
        });

        if (!addedInThisRound) break;
    }

    ['L1', 'L2', 'L3'].forEach(level => {
        while (plan.length < qCount && counts[level] > 0) {
            plan.push(level);
            counts[level]--;
        }
    });

    return plan.length === qCount ? plan : null;
}

function getFixedSectionLevelPlan({ paperType, maxMarks, mcqType, numQuestions, marksPerQuestion }) {
    if (__ebIsEntranceExamBoard(getSelectedBoard())) {
        return null;
    }

    const totalMarks = Number(maxMarks || 0);
    const qCount = Number(numQuestions || 0);
    const mpq = Number(marksPerQuestion || 0);
    const type = String(mcqType || '').trim();

    const fixedPlansByMarks = {
        25: {
            "Pinnacle Paper": {
                "MCQ (Single)|6|1": [
                    "L1", "L1",
                    "L2", "L2",

function buildFairChapterPlan(chapters, totalNeed) {
    const chs = Array.isArray(chapters) ? chapters.filter(Boolean) : [];
    if (!chs.length || totalNeed <= 0) return [];

    const perChapter = splitEvenAcrossChapters(totalNeed, chs);
    const decorated = chs.map((ch, idx) => ({
        ch,
        idx,
        count: perChapter[idx]
    }));

    // rotate starting point so first chapters are not always favored
    const seed = Date.now() % chs.length;
    const rotated = decorated.map((_, i) => decorated[(seed + i) % decorated.length]);

    const plan = [];
    rotated.forEach(item => {
        for (let i = 0; i < item.count; i++) {
            plan.push(item.ch);
        }
    });

    return plan;
}
function applyPaperTypePreset() {
    if (getSelectedBoard() === 'CBSE') return;
    const paperType = getPaperType();
    const maxMarks = getMarksPerSelectedSubject();

    const pinnacleTypes = [
        'Pinnacle Paper',
        'Pinnacle Objective Paper'
    ];

    const coreTypes = [
        'Core Paper',
        'Core Objective Paper'
    ];

    const isPinnacle = pinnacleTypes.includes(paperType);
    const isCore = coreTypes.includes(paperType);
    const isFixedPaper = !!getFixedPaperSectionPreset();

    const l1Check = document.getElementById('diff-l1-check');
    const l2Check = document.getElementById('diff-l2-check');
    const l3Check = document.getElementById('diff-l3-check');

    const l1Percent = document.getElementById('diff-l1-percent');
    const l2Percent = document.getElementById('diff-l2-percent');
    const l3Percent = document.getElementById('diff-l3-percent');

    if (!l1Check || !l2Check || !l3Check || !l1Percent || !l2Percent || !l3Percent) return;

    if (isPinnacle) {
        l1Check.checked = true;
        l2Check.checked = true;
        l3Check.checked = true;

               if (
            isFixedPaper &&
            maxMarks === 25 &&
            (paperType === 'Pinnacle Paper' || paperType === 'Pinnacle Objective Paper')
        ) {
            l1Percent.value = 20;
            l2Percent.value = 44;
            l3Percent.value = 36;
               } else if (isFixedPaper && maxMarks === 50) {
            l1Percent.value = 20;
            l2Percent.value = 42;
            l3Percent.value = 38;
                      } else if (
            isFixedPaper &&
            maxMarks === 80 &&
            paperType === 'Pinnacle Paper'
        ) {
            l1Percent.value = 28.75;
            l2Percent.value = 35;
            l3Percent.value = 36.25;
                } else if (
            isFixedPaper &&
            maxMarks === 80 &&
            paperType === 'Pinnacle Objective Paper'
        ) {
            l1Percent.value = 26.25;
            l2Percent.value = 36.25;
            l3Percent.value = 37.5;
                } else if (
            isFixedPaper &&
            maxMarks === 100 &&
            paperType === 'Pinnacle Paper'
        ) {
            l1Percent.value = 20;
            l2Percent.value = 42;
            l3Percent.value = 38;
        } else if (
            isFixedPaper &&
            maxMarks === 100 &&
            paperType === 'Pinnacle Objective Paper'
        ) {
            l1Percent.value = 26;
            l2Percent.value = 36;
            l3Percent.value = 38;
        } else {
            l1Percent.value = 24;
            l2Percent.value = 40;
            l3Percent.value = 36;
        }
    } else if (isCore) {
        l1Check.checked = true;
        l2Check.checked = true;
        l3Check.checked = false;

                                    if (
            isFixedPaper &&
            maxMarks === 80 &&
            paperType === 'Core Paper'
        ) {
            l1Percent.value = 48.75;
            l2Percent.value = 51.25;
            l3Percent.value = 0;
        } else if (
            isFixedPaper &&
            maxMarks === 80 &&
            paperType === 'Core Objective Paper'
        ) {
            l1Percent.value = 56.25;
            l2Percent.value = 43.75;
            l3Percent.value = 0;
                      } else if (
            isFixedPaper &&
            maxMarks === 100 &&
            (paperType === 'Core Paper' || paperType === 'Core Objective Paper')
        ) {
            l1Percent.value = 56;
            l2Percent.value = 44;
            l3Percent.value = 0;
        } else if (
            isFixedPaper &&
            maxMarks === 50 &&
            paperType === 'Core Paper'
        ) {
            l1Percent.value = 50;
            l2Percent.value = 50;
            l3Percent.value = 0;
        } else if (isFixedPaper) {
            l1Percent.value = 56;
            l2Percent.value = 44;
            l3Percent.value = 0;
        } else {
            l1Percent.value = 60;
            l2Percent.value = 40;
            l3Percent.value = 0;
        }
    }

    l1Check.disabled = isFixedPaper;
    l2Check.disabled = isFixedPaper;
    l3Check.disabled = isFixedPaper;

    refreshDifficultyTotalNote();

    if (isFixedPaper) {
        l1Percent.disabled = true;
        l2Percent.disabled = true;
        l3Percent.disabled = true;
    } else {
        l1Percent.disabled = !l1Check.checked;
        l2Percent.disabled = !l2Check.checked;
        l3Percent.disabled = !l3Check.checked;
    }

/* =========================================================
   AI GENERATE — EXAM BUILDER PROMPT HELPERS
   ========================================================= */

function __ebCollectAIBlueprint() {

    const errors = [];

    const selectedClass = getSelectedClass();
    const selectedBoard = getSelectedBoard();
    const selectedSubjects = getSelectedSubjects();

    const examName =
        (document.getElementById('exam-name-input')?.value || '').trim();

    const maxMarks =
        Number(document.getElementById('max-marks-input')?.value || 0);

    const time =
        Number(document.getElementById('time-input')?.value || 0);

    const date =
        document.getElementById('date-input')?.value || '';

    const instructions =
        (document.getElementById('instructions-input')?.value || '').trim();

    const paperType = getPaperType();

    const difficultyDistribution =
        getDifficultyDistribution();

    if (!selectedClass) {
        errors.push('Please select Class.');
    }

    if (!selectedBoard) {
        errors.push('Please select Board.');
    }

    if (!selectedSubjects.length) {
        errors.push('Please select at least one Subject.');
    }

    if (!__ebIsEntranceExamBoard(selectedBoard)) {

        const totalDifficulty =
            Number(difficultyDistribution.L1 || 0) +
            Number(difficultyDistribution.L2 || 0) +
            Number(difficultyDistribution.L3 || 0);

        const checkedLevels =
            getAllowedDifficultyLevels();

        if (!checkedLevels.length) {
            errors.push(
                'Please select at least one difficulty level.'
            );
        }

        if (totalDifficulty !== 100) {
            errors.push(
                'Difficulty percentages must total 100%.'
            );
        }
    }

    const subjects = [];

    document
        .querySelectorAll('.subject-block')
        .forEach((subjectBlock) => {

            const subject =
                subjectBlock.dataset.subject || '';

            const chapterDropdown =
                subjectBlock.querySelector(
                    '[id^="chapters-multiselect-"]'
                );

                        const allChapters =
                !!chapterDropdown?.querySelector(
                    'input[value="__ALL__"]:checked'
                );

            const selectedChapters =
                allChapters
                    ? []
                    : Array.from(
                        chapterDropdown?.querySelectorAll(
                            'input[type="checkbox"]:checked:not([value="__ALL__"])'
                        ) || []
                    )
                    .map(cb => String(cb.value || '').trim())
                    .filter(Boolean);

            const manualChapterText =
                (
                    subjectBlock.querySelector(
                        '.ai-manual-chapters-input'
                    )?.value || ''
                ).trim();

            const manualChapters =
                manualChapterText
                    .split(/[,;\n]+/)
                    .map(name => name.trim())
                    .filter(Boolean);

            const chapters = [];

            [...selectedChapters, ...manualChapters]
                .forEach(name => {

                    const alreadyExists =
                        chapters.some(
                            existing =>
                                existing.toLowerCase() ===
                                name.toLowerCase()
                        );

                    if (!alreadyExists) {
                        chapters.push(name);
                    }
                });

            if (
                !allChapters &&
                chapters.length === 0
            ) {
                errors.push(
                    `Please select or enter at least one chapter / lesson for ${subject}.`
                );
            }

            const sections = [];

            subjectBlock
                .querySelectorAll('.section-item')
                .forEach((sectionItem) => {

                    const label =
                        sectionItem
                            .querySelector(
                                '.section-label-dropdown'
                            )
                            ?.dataset?.value || '';

                    const mcqType =
                        sectionItem
                            .querySelector(
                                '.mcq-type-dropdown'
                            )
                            ?.dataset?.value || '';

                    const typeLabel =
                        sectionItem
                            .querySelector(
                                '.section-type-dropdown'
                            )
                            ?.dataset?.value || '';

                    const typeIndex =
                        config.sectionTypes.indexOf(
                            typeLabel
                        );

                    const type =
                        config.sectionTypeKeys[
                            typeIndex
                        ] || '';

                    const section = {
                        label,
                        mcqType,
                        type
                    };

                    if (!label) {
                        errors.push(
                            `${subject}: Select section label.`
                        );
                    }

                    if (!mcqType) {
                        errors.push(
                            `${subject} - ${label || 'Section'}: Select question type.`
                        );
                    }

                    if (type === 'all') {

                        section.numQuestions =
                            Number(
                                sectionItem
                                    .querySelector(
                                        '.num-questions-input'
                                    )
                                    ?.value || 0
                            );

                        section.marksPerQuestion =
                            Number(
                                sectionItem
                                    .querySelector(
                                        '.marks-per-question-input'
                                    )
                                    ?.value || 0
                            );

                        if (section.numQuestions < 1) {
                            errors.push(
                                `${subject} - ${label}: Number of questions must be at least 1.`
                            );
                        }

                        if (section.marksPerQuestion < 0.5) {
                            errors.push(
                                `${subject} - ${label}: Marks per question must be at least 0.5.`
                            );
                        }

                    } else if (type === 'any') {

                        section.numQuestions =
                            Number(
                                sectionItem
                                    .querySelector(
                                        '.num-questions-input'
                                    )
                                    ?.value || 0
                            );

                        section.attemptAny =
                            Number(
                                sectionItem
                                    .querySelector(
                                        '.attempt-any-input'
                                    )
                                    ?.value || 0
                            );

                        section.marksPerQuestion =
                            Number(
                                sectionItem
                                    .querySelector(
                                        '.marks-per-question-input'
                                    )
                                    ?.value || 0
                            );

                        if (section.numQuestions < 1) {
                            errors.push(
                                `${subject} - ${label}: Number of questions must be at least 1.`
                            );
                        }

                        if (
                            section.attemptAny < 1 ||
                            section.attemptAny >
                            section.numQuestions
                        ) {
                            errors.push(
                                `${subject} - ${label}: Check the "Attempt any" value.`
                            );
                        }

                        if (section.marksPerQuestion < 0.5) {
                            errors.push(
                                `${subject} - ${label}: Marks per question must be at least 0.5.`
                            );
                        }

                    } else if (type === 'internal') {

                        section.numPairs =
                            Number(
                                sectionItem
                                    .querySelector(
                                        '.num-pairs-input'
                                    )
                                    ?.value || 0
                            );

                        section.marksPerQuestion =
                            Number(
                                sectionItem
                                    .querySelector(
                                        '.marks-per-question-input'
                                    )
                                    ?.value || 0
                            );

                        section.pairs = [];

                        sectionItem
                            .querySelectorAll(
                                '.internal-choice-pairs > div'
                            )
                            .forEach((pairDiv) => {

                                const chapterA =
                                    (
                                        pairDiv
                                            .querySelector(
                                                '.pair-chapter-a'
                                            )
                                            ?.value || ''
                                    ).trim();

                                const chapterB =
                                    (
                                        pairDiv
                                            .querySelector(
                                                '.pair-chapter-b'
                                            )
                                            ?.value || ''
                                    ).trim();

                                section.pairs.push({
                                    chapterA,
                                    chapterB
                                });
                            });

                        if (section.numPairs < 1) {
                            errors.push(
                                `${subject} - ${label}: Number of internal-choice pairs must be at least 1.`
                            );
                        }

                        if (section.marksPerQuestion < 0.5) {
                            errors.push(
                                `${subject} - ${label}: Marks per pair must be at least 0.5.`
                            );
                        }
                    }

                    sections.push(section);
                });

            if (!sections.length) {
                errors.push(
                    `Please add at least one section for ${subject}.`
                );
            }

            subjects.push({
                subject,
                chapters,
                allChapters,
                sections
            });
        });

    return {
        errors,

        blueprint: {
            className: selectedClass,
            board: selectedBoard,
            subjects,
            examName,
            maxMarks,
            time,
            date,
            paperType,
            instructions,
            difficultyDistribution
        }
    };
}

function __scMathResearchRules(classLabel, workflow) {
  const grade = Number(
    String(classLabel || '').match(/\d+/)?.[0] || 0
  );

  if (grade < 6 || grade > 12) return '';

  const focus = ({
    6: 'Number sense, patterns, operations, basic geometry, simple reasoning and everyday applications.',
    7: 'Conceptual links, proportional reasoning where prescribed, multi-step arithmetic and geometry.',
    8: 'Algebraic thinking, numerical relationships, geometry, data interpretation and applications.',
    9: 'Algebra, geometry, reasoning, proofs where prescribed and well-structured calculations.',
    10: 'CBSE board-style concept application, mathematical reasoning, competency and case-based problems.',
    11: 'Deeper algebraic, geometric and functional reasoning with accurate multi-step solutions.',
    12: 'Advanced analytical problem-solving, mathematical modelling and rigorous verification.'
  })[grade];

  return `
CBSE MATHEMATICS — VERIFIED CHAPTER-BASED QUESTION RULES
Workflow: ${workflow}; Class: ${grade}

1. PRESCRIBED CURRICULUM AND SOURCE

- Verify the applicable CBSE syllabus and current prescribed Mathematics textbook for the selected academic year, class and chapter. Never hardcode a textbook title or edition.
- Prioritise https://cbseacademic.nic.in/, https://ncert.nic.in/ and https://epathshala.nic.in/; read the actual chapter, not only search snippets, summaries, coaching notes or question-bank websites.
- Confirm the chapter title, definitions, properties, examples, diagrams, exercises and permitted methods.
- Where relevant, distinguish Class 10 Mathematics Basic/Standard and senior-secondary Mathematics/Applied Mathematics; do not silently substitute one course for another.
- If a supplied source conflicts with a general website, verify against the applicable prescribed material before proceeding.

2. CONTENT COVERAGE AND QUESTION MODELS

- Map the selected chapter's actual concepts, subtopics, worked examples, exercise types and applications before writing questions.
- Distribute questions across distinct assessable concepts; avoid repeating one method with only changed numbers.
- Include direct understanding, conceptual reasoning, application, multi-step problem solving, analysis and competency tasks in proportions appropriate to the selected inventory or exam blueprint.
- Stay strictly within the selected class and chapter. Do not require higher-class theorems, shortcuts, formulae or techniques.
- Class ${grade} focus: ${focus}
- Do not force assertions, case studies, proofs or five-mark problems when the actual content cannot support meaningful versions.
- Construct original, syllabus-grounded numerical values and contexts when suitable; do not claim invented problems are verbatim textbook exercises.

3. MATHEMATICAL ACCURACY AND ANSWERS

- Solve each final question independently before setting its answer or choices. Recheck arithmetic, algebra, signs, units, rounding, roots, domain restrictions and special cases.
- For a single-correct MCQ, verify all four options: exactly one must be mathematically valid, including equivalent expressions or forms.
- For multiple-correct MCQs, identify every valid option and follow the selected question-type rules.
- Use plausible error-based distractors, not impossible or unrelated options.
- Descriptive answers must show coherent step-wise working, relevant formulae, substitutions, reasoning and a separate correct final answer.
- Do not force numbered prose points or leave a dangling equals sign.
- Use ONLY inline LaTeX \\( ... \\) in question records; do not use display-math delimiters.
- Preserve the existing Q headers, marks, tags, option lines, Ans:, Answer: and Explanation: structure.

4. DIAGRAMS, GRAPHS AND DATA

- Use accurate geometry diagrams, number lines, graphs, tables or statistical visuals when the chapter and question model warrant them, but not in every question.
- State all necessary measurements, labels, scales, axis values and constraints; an answer must not depend on an imaginary or missing figure.
- Use the existing [Picture Needed: Yes] marker only where supported and genuinely needed.
- Include [Image: actual image URL] only if its content and accessible URL have been verified.
- If a necessary figure cannot be supplied or described unambiguously using the existing format, flag the problem before the final set.
- Never fabricate an image URL.

5. QUESTION COUNTS AND BLUEPRINT

- For individual questions, obey the teacher's exact selected question type, quantity and level allocation.
- For a complete chapter bank, follow the 45-record Mathematics inventory only if the verified chapter can support distinct, valid questions of each requested category.
- Otherwise report the constraint before generating rather than padding the inventory.
- For an exam blueprint, obey every selected chapter, section, slot, model family, question count, marks, competency classification, internal OR and Attempt Any condition.
- Count OR alternatives once toward attempted marks.
- Verify the sum of attempted marks against the selected blueprint.
- Preserve the DRAFT → RECHECK → FINAL SET workflow and exact machine-readable question-record formatting.
- Do not introduce unrequested changes to other subjects or to the selected output schema.

6. SOURCE AND VERIFICATION FAILURE

- If the actual prescribed chapter cannot be accessed or verified using available tools or supplied materials, STOP BEFORE Q1 and request the chapter PDF, text or accessible source link.
- If a specified question type or distribution cannot genuinely be supported, identify the exact conflict rather than inventing content.
- Never claim to have browsed, inspected a figure or verified calculations without doing so.
- Keep research references outside the final question-record block.

These extra rules apply ONLY to CBSE Mathematics (Classes 6–12).
`;
}

function __scIsSocialSubject(value) {
  return /^(?:social(?:[\s-]+(?:science|studies))?|sst|s\.?\s*st\.?|history|geography|political[\s-]*science|civics|economics)$/i.test(
    String(value || '').trim()
  );
}

function __scSocialResearchRules(classLabel, subjectLabel, workflow) {
  const grade = Number(String(classLabel || '').match(/\d+/)?.[0] || 0);
  const subject = String(subjectLabel || '').trim();

  if (grade < 6 || grade > 12 || !__scIsSocialSubject(subject)) {
    return '';
  }

  const structure = grade <= 8
    ? 'Classes 6–8: Social Science is an integrated subject. Do not force separate History, Geography, Political Science or Economics sections.'
    : grade <= 10
      ? 'Classes 9–10: Use History, Geography, Political Science and Economics sections only when the selected blueprint requires them. Generate questions strictly from selected chapters; do not invent missing branch chapters.'

  return `

Workflow: ${workflow}

- ${structure}

- Write clear, syllabus-appropriate and competency-based questions, including case/source/map questions only when the blueprint and chapter content support them.

function __scIsCbseScienceSubject(value) {

function __scScienceResearchRules(classLabel, subjectLabel, workflow) {
  const grade = Number(
    String(classLabel || '').match(/\d+/)?.[0] || 0
  );
  const subject = String(subjectLabel || '').trim();

  if (grade < 6 || grade > 12 ||
      !__scIsCbseScienceSubject(subject)) {
    return '';
  }

  const structure = grade <= 8
    ? 'Classes 6–8: ONE integrated Science subject. Do not divide the paper or chapter bank into Physics, Chemistry and Biology sections; no [Area: ...] tag.'
    : grade <= 10
      ? 'Classes 9–10: ONE Science paper, arranged Section A – Biology, Section B – Chemistry, Section C – Physics, in that exact order. The Class 9 section layout is a school adaptation of the Class 10 pattern. Tag each question with exactly one accurate [Area: Biology], [Area: Chemistry] or [Area: Physics] when supported by the output format.'
      : 'Classes 11–12: Physics, Chemistry and Biology are THREE DIFFERENT CBSE subjects, each with its own syllabus, textbook, question paper and subject-specific blueprint. Never treat senior-secondary Science as a combined paper; never use the Class 10 Science section structure for these subjects.';

  return `
CBSE SCIENCE — MANDATORY TEXTBOOK AND BLUEPRINT RULES
Workflow: ${workflow}
Class: ${grade}; Selected subject: ${subject}

1. OFFICIAL TEXTBOOK RESEARCH
- Verify the applicable CBSE syllabus and NCERT textbook/edition for this class, academic year, subject and selected chapter(s). Do not hardcode textbook titles.
- Prioritise https://cbseacademic.nic.in/, https://ncert.nic.in/ and https://epathshala.nic.in/.
- Actually read each accessible selected chapter, examples, labelled diagrams, investigations, observations, activities and prescribed exercises. Do not rely only on summaries, snippets or chapter titles.
- Cover only selected chapters and the concepts they genuinely contain, without adding higher-class or deleted topics.

2. SCIENCE SUBJECT ORGANISATION
${structure}
- For Classes 9–10, identify the actual scientific branch of EACH selected chapter before assigning its section or [Area: ...] tag. Do not guess merely from the chapter number.
- Follow the current official Class 10 Science section order. For school tests drawn from selected chapters, do not invent questions from missing branches just to fill the full-syllabus template. Report an incompatible blueprint before Q1 and request a suitable custom blueprint.
- For Classes 11–12, when separate subject selection is supported, follow that selected subject's own current CBSE question pattern, not a combined 80-mark Science pattern.

3. SCIENTIFIC QUESTION QUALITY
- Prioritise conceptual understanding, scientific reasoning, investigation, application, evidence interpretation, competency and analysis; stay class-appropriate.
- Physics: use valid principles, correctly defined quantities, SI units, necessary formulae, substitutions, calculations, rounding and physical interpretation.
- Chemistry: check chemical names, symbols, formulae, valencies, equations, balancing, states/conditions and observations; use only syllabus-appropriate reactions.
- Biology: verify biological structures, functions, processes, terminology, sequences, examples and conclusions.
- Use legitimate experiment-based, data/table-based, diagram-based, assertion–reason and case-based questions only when supported by chapter content and the selected question model.
- MCQ (Single) must have exactly one defensible correct option and three plausible distractors; verify every option separately.
- Answer descriptive science questions point-wise when appropriate, using as many points as needed rather than a fixed marks-to-points formula. Give step-wise working for numericals and balanced equations where needed.

4. FIGURES, PRACTICALS AND DATA
- If a question requires a diagram, give correct labels, orientation and scientific context, and use the existing [Picture Needed: Yes] marker where supported.
- Supply [Image: actual image URL] only when verified and accessible. Never fabricate image URLs or assume a diagram was supplied.
- Questions depending on an unavailable visual or unverified data must be replaced by self-contained questions or flagged before the final set.
- Use observed/experimental results accurately; do not invent a result and falsely attribute it to NCERT.

5. INVENTORY, BLUEPRINT AND VERIFICATION
- Chapter bank: follow its existing question-type inventory when the verified content can support genuinely distinct items; never fill it with duplicates or invented content.
- Individual questions: follow the requested type, count and level distribution.
- Exam Builder: obey exact blueprint rows, question order, section names, subject, chapter, Slot, marks, internal OR, Attempt Any and attempted total.

- Preserve the existing Q record metadata, answer/explanation fields, question numbering, formatting and DRAFT → RECHECK → FINAL SET sequence.
- Double-check all facts, calculations, diagrams, equations, MCQ options, marks and answers against the verified chapter.
- If the actual source is unavailable or the selected blueprint cannot be met, STOP BEFORE Q1; state the exact limitation and request an accessible chapter or compatible blueprint. Never claim to have browsed or verified inaccessible material.

Apply these extra rules ONLY to CBSE Science, Physics, Chemistry or Biology in Classes 6–12.

function __scEnglishResearchRules(classLabel, workflow) {
  const grade = Number(
    String(classLabel || '').match(/\d+/)?.[0] || 0
  );

  if (grade < 6 || grade > 12) return '';

  const depth = ({
    6: 'Literal comprehension, important events, vocabulary in context, simple inference.',
    7: 'Comprehension, cause and effect, character choices, reasons and interpretation.',
    8: 'Inference, textual evidence, imagery, theme and age-appropriate analysis.',
    9: 'Interpretation, literary devices, textual evidence and competency-based reasoning.',
    10: 'Board-appropriate extract interpretation, inference and analytical responses.',
    11: 'Close reading, critical interpretation, literary technique and reasoned evaluation.',
    12: 'Precise textual analysis, interpretive reasoning and evaluative responses.'
  })[grade];

  return `
CBSE ENGLISH — MANDATORY TEXTBOOK RESEARCH
Workflow: ${workflow}
Class: ${grade}

1. TEXTBOOK IDENTIFICATION
First verify the current applicable CBSE curriculum and prescribed English course and textbook for this class and academic session.

Do not assume the textbook name from memory.
Do not use a fixed historical textbook list.

For Classes 11 and 12, distinguish English Core from English Elective. If the course is unclear, ask before generating.

2. OFFICIAL WEBSITE RESEARCH
Use available browsing or retrieval tools to check:
https://cbseacademic.nic.in/
https://ncert.nic.in/
https://epathshala.nic.in/

Also use the school's supplied textbook or lesson source if available.

Confirm the exact lesson, matching class, edition and content.

General educational websites, chapter summaries, coaching notes and question banks are not substitutes for the actual textbook.

Official-source research takes priority over earlier suggestions to use third-party educational websites.

3. STUDY THE COMPLETE LESSON
Read the accessible actual lesson and relevant textbook exercises before generating.

For prose, examine real events, setting, characters, motivations, sequence, language and theme.

For poetry, examine actual stanzas, speaker, imagery, tone, poetic devices and message.

For supplementary reading, examine the actual plot, incidents, characters and interpretations.

Cover distinct portions of the complete lesson.

Do not invent characters, incidents, quotations, textbook exercises, page numbers or source claims.

Do not reproduce long copyrighted extracts. Use brief permissible extracts or accurate textual references when suitable.

4. TEXTBOOK-BASED QUESTION RULE
Every literature question and its answer must be supported by the verified lesson.

Do not generate general questions merely related to the chapter title.

For grammar, follow the selected prescribed curriculum topic or textbook exercise.

For unseen reading and independent writing, follow the current syllabus and use suitable original material. Do not pretend it is an extract from the textbook.
4A. PICTURE-BASED AND VISUAL-COMPREHENSION QUESTIONS

Include picture-based questions only when appropriate to the selected CBSE class, English syllabus, lesson content and question type.

Suitable visual-based questions may include:
- Picture comprehension
- Picture description
- Illustration-based questions from the prescribed lesson
- Event identification from textbook illustrations
- Picture-based inference and interpretation
- Visual sequencing of story events
- Chart, graph and infographic comprehension
- Competency-based questions using relevant visual information

STRICT RULES:

1. Do not make picture-based questions compulsory for every chapter or examination.

2. For literature, visual questions must relate directly to the actual prescribed textbook lesson.

3. Do not invent illustrations or assume that a particular picture exists in the textbook.

4. If the textbook contains a relevant illustration, use it only after verifying its actual content.

5. For reading comprehension, charts, graphs and infographics may be used when appropriate to the class and examination pattern.

6. Every visual-based question must test meaningful comprehension, interpretation, observation or reasoning.

7. Do not generate simple picture-identification questions when the selected class requires higher-order interpretation.

8. If the question requires an image, use the existing [Picture Needed: Yes] marker where supported by the question format.

9. Include [Image: actual image URL] only when a genuine, accessible and verified image URL is available.

10. Never invent image URLs, refer to missing pictures or provide answers based on an unseen image.

11. If an image is required but unavailable, clearly report the missing visual during draft review. Do not include an unanswerable question in the final set.

12. In the Exam Builder, visual-based questions must follow the selected blueprint, question type, question count and marks allocation.

13. In the Questions Generator, visual-based questions must be distributed appropriately across the chapter-bank inventory without introducing unnecessary repetitions.

14. Do not alter the existing question-record format, numbering, options, answers, metadata or parsing structure.

5. CLASS-WISE QUESTION STANDARD
For Class ${grade}, follow:
${depth}

Generate genuine comprehension, interpretation, inference, analytical and competency-based questions appropriate to the class.

Avoid repetitive recall, duplicate questions and content outside the prescribed syllabus.

Each single-correct MCQ must have four plausible choices and exactly one defensible correct answer.

6. QUESTION INVENTORY AND BLUEPRINT

For the workflow "${workflow}", follow ${

7. QUALITY VERIFICATION

- Appropriate question type and marks

Keep research URLs outside the final question-record body so the existing HTML parser continues to work.

8. SOURCE UNAVAILABLE OR INSUFFICIENT

function __ebBuildAIExamPrompt(blueprint) {

    const {
        className,
        board,
        subjects,
        examName,
        maxMarks,
        time,
        date,
        paperType,
        instructions,
        difficultyDistribution
    } = blueprint;

    const entranceMode =
        __ebIsEntranceExamBoard(board);

    let prompt = `
You are generating QUESTIONS ONLY for an examination.

Do NOT create the visual question-paper layout.
Do NOT add school headers, decorative formatting or paper styling.

The generated questions will be pasted back into an Exam Builder.
The Exam Builder will handle:
- sections,
- numbering in the final paper,
- instructions,
- Exam Review,
- Preview,
- paper layout and styling.

EXAM DETAILS

Class: ${className}
Board: ${board}
Exam Name: ${examName || 'Not specified'}
Paper Type: ${paperType || 'Custom Paper'}
Maximum Marks: ${maxMarks || 'Not specified'}
Time: ${time ? `${time} minutes` : 'Not specified'}
Date: ${date || 'Not specified'}

${__ebBuildAIBoardRules(board)}
`;

    if (!entranceMode) {

        prompt += `

OVERALL DIFFICULTY DISTRIBUTION:

Level 1: ${Number(difficultyDistribution.L1 || 0)}%
Level 2: ${Number(difficultyDistribution.L2 || 0)}%
Level 3: ${Number(difficultyDistribution.L3 || 0)}%

Use this distribution across the generated questions unless an exact section-level plan is given below.
`;
    }

        prompt += `

${String(board || '').trim().toUpperCase() === 'CBSE' &&
  Array.isArray(subjects) &&
  subjects.some(s =>
    /^english\b/i.test(
      String(s?.subject || s?.name || s || '')
    )
  )
    ? __scEnglishResearchRules(className, 'exam blueprint')
    : ''}

${String(board || '').trim().toUpperCase() === 'CBSE' &&
  Array.isArray(subjects)
    ? subjects
        .filter(s =>
          __scIsCbseScienceSubject(
            s?.subject || s?.name || s
          )
        )
        .map(s =>
          __scScienceResearchRules(
            className,
            s?.subject || s?.name || s,
            'exam blueprint'
          )
        )
        .join('\n')
    : ''}

${String(board || '').trim().toUpperCase() === 'CBSE' &&
  Array.isArray(subjects) &&
  subjects.some(s =>
    /^(?:mathematics|maths?|applied mathematics)\b/i.test(
      String(s?.subject || s?.name || s || '')
    )
  )
    ? __scMathResearchRules(className, 'exam blueprint')
    : ''}

${String(board || '').trim().toUpperCase() === 'CBSE' &&
  Array.isArray(subjects)
    ? subjects
        .filter(s =>
          __scIsSocialSubject(
            s?.subject || s?.name || s
          )
        )
        .map(s =>
          __scSocialResearchRules(
            className,
            s?.subject || s?.name || s,
            'exam blueprint'
          )
        )
        .join('\n')
    : ''}

QUESTION BLUEPRINT — FOLLOW THIS ORDER EXACTLY
`;

    let sequenceNumber = 1;

    subjects.forEach((subjectData) => {

                const chapterText =
            subjectData.allChapters
                ? (
                    subjectData.chapters &&
                    subjectData.chapters.length
                        ? `All Chapters; Additional Lesson / Chapter Names: ${subjectData.chapters.join(', ')}`
                        : 'All Chapters'
                  )
                : subjectData.chapters.join(', ');

        subjectData.sections.forEach((section) => {

            const generatedCount =
                section.type === 'internal'
                    ? Number(section.numPairs || 0) * 2
                    : Number(section.numQuestions || 0);

            let attemptInstruction = '';

            if (section.type === 'all') {

                attemptInstruction =
                    `Generate ${section.numQuestions} question(s).`;

            } else if (section.type === 'any') {

                attemptInstruction =
                    `Generate ${section.numQuestions} question(s). Students will attempt any ${section.attemptAny}.`;

            } else if (section.type === 'internal') {

                attemptInstruction =
                    `Generate ${section.numPairs} internal-choice pair(s). ` +
                    `Each pair requires TWO separate question blocks: Alternative A followed immediately by Alternative B. ` +
                    `Therefore generate ${generatedCount} question blocks for this section.`;
            }

            let levelPlanText = '';

            if (!entranceMode) {

                try {

                    const planCount =
                        section.type === 'internal'
                            ? generatedCount
                            : Number(
                                section.numQuestions || 0
                            );

                    const fixedPlan =
                        getFixedSectionLevelPlan({
                            paperType,
                            maxMarks,
                            mcqType: section.mcqType,
                            numQuestions: planCount,
                            marksPerQuestion:
                                section.marksPerQuestion
                        });

                    if (
                        Array.isArray(fixedPlan) &&
                        fixedPlan.length === planCount
                    ) {

                        levelPlanText =
                            `\nExact difficulty order for this section: ` +
                            fixedPlan
                                .map(x =>
                                    x === 'L1'
                                        ? 'Level 1'
                                        : x === 'L2'
                                            ? 'Level 2'
                                            : 'Level 3'
                                )
                                .join(', ') +
                            '.';
                    }

                } catch (err) {
                    console.warn(
                        'Could not build fixed level plan',
                        err
                    );
                }
            }

            let internalPairText = '';

            if (
                section.type === 'internal' &&
                Array.isArray(section.pairs) &&
                section.pairs.length
            ) {

                const pairLines =
                    section.pairs
                        .map((pair, index) => {

                            const a =
                                pair.chapterA ||
                                'selected chapter(s)';

                            const b =
                                pair.chapterB ||
                                'selected chapter(s)';

                            return (
                                `Pair ${index + 1}: ` +
                                `Alternative A from "${a}"; ` +
                                `Alternative B from "${b}".`
                            );
                        })
                        .join('\n');

                internalPairText =
                    `\nInternal-choice chapter guidance:\n${pairLines}`;
            }

            let paragraphNote = '';

            if (
                section.mcqType ===
                'Paragraph-Based MCQ (Single Correct)'
            ) {

                paragraphNote =
                    `\nFor each required question, generate one passage set with 2 single-correct MCQ sub-questions.`;
            }

            prompt += `

${sequenceNumber}. SUBJECT: ${subjectData.subject}
SECTION: ${section.label}
CHAPTERS: ${chapterText}
QUESTION TYPE: ${section.mcqType}
SECTION RULE: ${attemptInstruction}
MARKS: ${section.marksPerQuestion} mark(s) per ${
    section.type === 'internal'
        ? 'internal-choice pair'
        : 'question'
}.${levelPlanText}${internalPairText}${paragraphNote}
`;

            sequenceNumber++;
        });
    });


    if (instructions) {

        prompt += `

ADDITIONAL TEACHER INSTRUCTIONS:

${instructions}
`;
    }


    prompt += `

STRICT QUALITY CHECK:

- Every question must be academically correct.
- Verify calculations, facts, options and answers before output.
- Do not create ambiguous questions.
- Do not repeat the same question.
- Do not generate questions outside the selected chapters.
- Keep the standard appropriate to the selected board.
- Follow the requested question type exactly.
- For MCQ (Single), exactly one option must be correct.
- For MCQ (Multiple), at least one option must be correct.
- Keep distractors plausible.
- Preserve mathematical notation clearly.

${__ebBuildAIFormatRules()}

Before finalising, silently verify that the TOTAL NUMBER and ORDER of generated question blocks exactly match the blueprint.

Now generate the DRAFT question set for teacher review.

Do not give the FINAL SET until the teacher explicitly asks for it.
`;

    return prompt.trim();
}

function __ebOpenAIQuestionGenerator(prompt) {
    const url = new URL('https://chatgpt.com/');
    url.searchParams.set('q', prompt);

    // Launch within the click event; do not wait for clipboard permission.
    // With noopener, a null return does not prove that the popup was blocked.
    try {
        window.open(url.toString(), '_blank', 'noopener');
    } catch (_) {
        showToast('Could not open ChatGPT. Allow popups or use Copy / download request.', 'error');
        return false;
    }
    try {
        navigator.clipboard?.writeText(prompt)?.catch(() => {});
    } catch (_) {
        // The URL carries the prompt even when clipboard access is unavailable.
    }
    showToast('Opening ChatGPT with your prompt. Paste the generated questions back here.', 'success');
    return true;
}

      }

      raw = (

          arrayBuffer: window._globalDocxArrayBuffer
        })
      ).value;
    }

    const subjects = getSelectedSubjects();
    const selectedClass = getSelectedClass();

    const chaptersBySubject = new Map(
      subjects.map((subject, index) => [
        subject,
        selectedChapters(index)
      ])
    );

    const chapters = subjects.length === 1
      ? chaptersBySubject.get(subjects[0])
      : [];

    const questions = C.parseImport(raw, {
      class: selectedClass,
      board: 'CBSE',
      subject: subjects.length === 1 ? subjects[0] : '',
      chapter: chapters.length === 1 ? chapters[0] : ''
    });

    const issues = [];

    questions.forEach((q, index) => {
      const label =
        (String(q.metaLine || '').match(/Q\s*\d+/i) || [])[0]
        || `Question ${index + 1}`;

      if (q.class !== selectedClass) {
        issues.push(
          `${label}: class "${q.class || 'missing'}" does not match "${selectedClass}".`
        );
      }

      if (q.board !== 'CBSE') {
        issues.push(
          `${label}: board "${q.board || 'missing'}" does not match CBSE.`
        );
      }

      const allowedChapters = chaptersBySubject.get(q.subject);

      if (!allowedChapters) {
        issues.push(
          `${label}: subject "${q.subject || 'missing'}" is not selected. Selected subjects: ${subjects.join(', ')}.`
        );
        return;
      }

      const matchingChapter = allowedChapters.find(
        chapter => cbseChapterKey(chapter) === cbseChapterKey(q.chapter)
      );

      if (matchingChapter !== undefined) {
        // Use the selected chapter's exact name for later blueprint checks.
        q.chapter = matchingChapter;
      } else {
        issues.push(
          `${label}: chapter "${q.chapter || 'missing'}" does not match the selected ${q.subject} chapters: ${allowedChapters.join('; ')}.`
        );
      }
    });

    if (issues.length) {
      throw new Error(
        'Please correct these details:\n\n' + issues.join('\n\n')

  function flatten(items) { return items.flatMap(q => q.alternatives ? flatten(q.alternatives) : [q]); }
  function paperErrors(paper) {
    const errors = []; let total = 0;
    for (const sub of paper.subjects || []) {
      const bp = { marks: sub.marks, rows: sub.rows };
      errors.push(...C.validateBlueprint(bp).map(e => `${sub.subject}: ${e}`));
      const seen = new Set();
      for (const r of sub.rows) {
        const expectedFamilies = Object.entries(C.allocateCounts(r.count, sub.policy.strictModels ? r.models : {})).flatMap(([f, n]) => Array(n).fill(f));
        if (r.items.length !== r.count) errors.push(`${sub.subject}, ${r.title}: wrong printed count.`);
        if (r.items.filter(q => q.alternatives?.length).length !== r.orCount) errors.push(`${sub.subject}, ${r.title}: wrong OR count.`);
        r.items.forEach((item, i) => {
          errors.push(...C.nodeErrors(item, `${sub.subject}, ${r.title} ${i + 1}`));
          if (C.effectiveMarks(item) !== r.marks) errors.push(`${r.title}: marks changed after selection.`);
          flatten([item]).forEach(q => {
            if (!C.compatible({ ...q, _errors: [] }, r, expectedFamilies[i] || 'Any')) errors.push(`${r.title}: a selected question no longer matches its type, area, model or subpart pattern.`);
            if (q.class !== paper.class || q.board !== 'CBSE' || q.subject !== sub.subject || !sub.chapters.includes(q.chapter)) errors.push(`${r.title}: question metadata falls outside the selected class, subject or chapters.`);
            const f = C.fingerprint(q); if (seen.has(f)) errors.push(`${sub.subject}: repeated question detected.`); seen.add(f);
          });
        });
      }
      const covered = new Set(sub.rows.flatMap(r => flatten(r.items)).map(q => q.chapter));
      if (sub.policy.requireCoverage) for (const ch of sub.chapters) if (!covered.has(ch)) errors.push(`${sub.subject}: chapter ${ch} is not represented.`);
      if (C.competencyMinimum(sub.rows) < sub.marks * sub.policy.competencyMinimum / 100) errors.push(`${sub.subject}: confirmed competency minimum is below its target.`);
      total += sub.marks;
    }
    if (total !== paper.maxMarks) errors.push('The paper total does not equal its subject totals.');
    return errors;
  }
