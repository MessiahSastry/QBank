              function __qbNormalizeTypeForSection(rawType = '') {
  const t = String(rawType || '').trim();

  if (t === 'Text Book (MCQ Single)' || t === 'Text (Single)') return 'MCQ (Single)';
  if (t === 'Text Book (MCQ Multiple)' || t === 'Text (Multiple)') return 'MCQ (Multiple)';
  return t;
}

function __qbIsParagraphQuestionType(rawType = '') {
  const t = String(rawType || '').trim();
  return t === 'Paragraph-Based MCQ (Single Correct)' || t === 'Comprehensive';
}

function __qbIsParagraphMeta(metaLine = '') {
  return /\[(?:Paragraph-Based MCQ \(Single Correct\)|Comprehensive)\]/i.test(String(metaLine || ''));
}

function __qbGetSectionKeyForSave({
  rawType = '',
  marks = 0,
  level = '',
  board = '',
  bankMode = '',
  category = '',
  modelType = ''
} = {}) {

  const type =
    __qbNormalizeTypeForSection(rawType);

  const isChapterBank =
    String(bankMode || '').trim() === 'chapter';

  /* =====================================================
     COMPLETE CHAPTER BANK
     No Level 1 / Level 2 / Level 3 grouping
  ===================================================== */

  if (isChapterBank) {

    const cleanCategory =
      String(category || '')
        .replace(/[^A-Za-z0-9]+/g, '_')
        .replace(/^_+|_+$/g, '')
        .toUpperCase();

    if (type === 'MCQ (Single)') {
      return 'CHAPTER_BANK_MCQ_SINGLE';
    }

    if (type === 'MCQ (Multiple)') {
      return 'CHAPTER_BANK_MCQ_MULTIPLE';
    }

    if (type === 'Assertion and Reason (MCQ Single)') {
      return 'CHAPTER_BANK_ASSERTION_REASON';
    }

    if (type === 'Descriptive') {
      return `CHAPTER_BANK_DESCRIPTIVE_${cleanCategory || 'GENERAL'}_${Number(marks || 0)}`;
    }

    if (type === 'Case Based') {
      return `CHAPTER_BANK_CASE_BASED_${Number(marks || 0)}`;
    }

    if (type === 'Map') {
      return `CHAPTER_BANK_MAP_${Number(marks || 0)}`;
    }

    return `CHAPTER_BANK_${String(type || 'QUESTION')
      .replace(/[^A-Za-z0-9]+/g, '_')
      .replace(/^_+|_+$/g, '')
      .toUpperCase()}_${Number(marks || 0)}`;
  }

  /* =====================================================
     EXISTING ENTRANCE EXAM LOGIC
  ===================================================== */

  const isEntrance =
    typeof __isEntranceExamBoard === 'function'
      ? __isEntranceExamBoard(board)
      : ['JEE Main', 'JEE Advanced', 'AP EAPCET'].includes(
          String(board || '').trim()
        );

  if (isEntrance) {
    if (type === 'MCQ (Single)') return 'MCQ_SINGLE';
    if (type === 'MCQ (Multiple)') return 'MCQ_MULTIPLE';
    if (type === 'Numerical Value') return 'NUMERICAL_VALUE';
    if (type === 'Matching List') return 'MATCHING_LIST';

    return `EXAM_${String(type || 'QUESTION')
      .replace(/[^A-Za-z0-9]+/g, '_')
      .replace(/^_+|_+$/g, '')
      .toUpperCase()}`;
  }

  /* =====================================================
     EXISTING NORMAL GENERATION LOGIC
  ===================================================== */

  const levelText =
    String(level || 'Level 1').trim() || 'Level 1';

  const levelKey =
    levelText.replace(/\s+/g, '_').toUpperCase();

  if (type === 'MCQ (Single)') return `MCQ_SINGLE_${levelKey}`;
  if (type === 'MCQ (Multiple)') return `MCQ_MULTIPLE_${levelKey}`;
  if (type === 'Fill in the Blanks') return `FILL_BLANKS_${levelKey}`;
  if (type === 'Assertion and Reason (MCQ Single)') return `ASSERTION_REASON_${levelKey}`;
  if (type === 'Matching Matrix') return `MATCHING_MATRIX_${levelKey}`;
  if (type === 'Matching List') return `MATCHING_LIST_${levelKey}`;
  if (type === 'Numerical Value') return `NUMERICAL_VALUE_${levelKey}`;
  if (type === 'Paragraph-Based MCQ (Single Correct)') return `PARAGRAPH_MCQ_SINGLE_${levelKey}`;
  if (type === 'Comprehensive') return `COMPREHENSIVE_${levelKey}`;

  return `DESCRIPTIVE_${Number(marks || 0)}_${levelKey}`;
}

function __qbBuildSeedFromQuestion(
  qData = {},
  sessionQuestionType = ''
) {

  const meta =
    parseMetaLine(qData.parsedMeta || '');

  const isChapterBank =
    qData.bankMode === 'chapter' ||
    qData.generationMode === 'chapter-bank';

  const rawType =
    (qData.parsedMeta &&
     /\[Paragraph-Based MCQ \(Single Correct\)\]/i.test(qData.parsedMeta))
      ? 'Paragraph-Based MCQ (Single Correct)'

      : (qData.parsedMeta &&
         /\[Comprehensive\]/i.test(qData.parsedMeta))
        ? 'Comprehensive'

        : (
            qData.type ||
            qData.mcqType ||
            meta.type ||
            sessionQuestionType ||
            'Descriptive'
          );

  const boardText =
    String(qData.board || '').trim();

  const isEntrance =
    typeof __isEntranceExamBoard === 'function'
      ? __isEntranceExamBoard(boardText)
      : ['JEE Main', 'JEE Advanced', 'AP EAPCET'].includes(
          boardText
        );

  let levelText = '';

  if (!isEntrance && !isChapterBank) {
    levelText =
      String(
        qData.difficulty ||
        qData.level ||
        meta.difficulty ||
        'Level 1'
      ).trim() || 'Level 1';
  }

  const marksValue =
    isEntrance
      ? 0
      : Number(
          qData.marks ||
          meta.marks ||
          0
        );

  const seed = {
    class:
      String(qData.class || '').trim(),

    board:
      boardText,

    subject:
      String(qData.subject || '').trim(),

    chapter:
      String(qData.chapter || '').trim(),

    rawType:
      rawType,

    marks:
      marksValue,

    level:
      levelText,

    bankMode:
      isChapterBank ? 'chapter' : '',

    category:
      qData.category ||
      qData.descriptiveType ||
      meta.category ||
      '',

    modelType:
      qData.modelType ||
      meta.modelType ||
      ''
  };

  seed.sectionKey =
    __qbGetSectionKeyForSave(seed);

  return seed;
}
function __qbSeedGroupKey(seed = {}) {
  return [
    String(seed.class || '').trim(),
    String(seed.board || '').trim(),
    String(seed.subject || '').trim(),
    String(seed.chapter || '').trim(),
    String(seed.sectionKey || '').trim()
  ].join('|||');
}

async function __qbGetMaxQuestionNumberForSeed(seed = {}) {
  if (!seed.class || !seed.board || !seed.subject || !seed.chapter || !seed.sectionKey) return 0;

  const snap = await db.collection('questions')
    .where('class', '==', seed.class)
    .where('board', '==', seed.board)
    .where('subject', '==', seed.subject)
    .where('chapter', '==', seed.chapter)
    .where('sectionKey', '==', seed.sectionKey)
    .get();

  let maxNo = 0;
  snap.forEach(doc => {
    const n = Number((doc.data() || {}).questionNumber || 0);
    if (n > maxNo) maxNo = n;
  });

  return maxNo;
}

function __qbSortDocsForSave(a, b) {
  const da = a.data ? a.data() : a;
  const dbb = b.data ? b.data() : b;

  const qa = Number(da.questionNumber || 999999);
  const qb = Number(dbb.questionNumber || 999999);
  if (qa !== qb) return qa - qb;

  const ta = da.timestamp && typeof da.timestamp.toMillis === 'function' ? da.timestamp.toMillis() : 0;
  const tb = dbb.timestamp && typeof dbb.timestamp.toMillis === 'function' ? dbb.timestamp.toMillis() : 0;
  if (ta !== tb) return ta - tb;

  const sa = String(da.question || da.body || da.text || da.metaLine || '').trim();
  const sb = String(dbb.question || dbb.body || dbb.text || dbb.metaLine || '').trim();
  return sa.localeCompare(sb);
}

async function __qbRenumberSectionQuestionsFromSeed(seed = {}) {
  if (!seed.class || !seed.board || !seed.subject || !seed.chapter || !seed.sectionKey) return;

  const snap = await db.collection('questions')
    .where('class', '==', seed.class)
    .where('board', '==', seed.board)
    .where('subject', '==', seed.subject)
    .where('chapter', '==', seed.chapter)
    .where('sectionKey', '==', seed.sectionKey)
    .get();

  if (snap.empty) return;

  const docs = snap.docs.slice().sort(__qbSortDocsForSave);

  let batch = db.batch();
  let ops = 0;

  for (let i = 0; i < docs.length; i++) {
    batch.update(docs[i].ref, {
      sectionKey: seed.sectionKey,
      questionNumber: i + 1
    });

    ops++;
    if (ops >= 400) {
      await batch.commit();
      batch = db.batch();
      ops = 0;
    }
  }

  if (ops > 0) {
    await batch.commit();
  }
}

window.__loadedChapterBoardFiles = window.__loadedChapterBoardFiles || {};

window.__chapterBoardSlug = function(boardName) {
  const b = (boardName || '')
    .toString()
    .trim()
    .toLowerCase();

  // Keep compatibility with existing chapter filenames
  if (b === 'jee main') return 'jee-mains';
  if (b === 'jee advanced') return 'jee-advance';

  return b
    .replace(/&/g, 'and')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
}

window.loadBoardChapterFile = function(boardName) {
  const board = (boardName || '').trim();
  if (!board || board === 'Other') return Promise.resolve(false);

    const slug = window.__chapterBoardSlug(board);
  if (!slug) return Promise.resolve(false);

  const fileName = `chapters-${slug}.js`;

  if (window.__loadedChapterBoardFiles[fileName]) {
    return Promise.resolve(true);
  }

  return new Promise((resolve) => {
    const existing = document.querySelector(`script[data-chapter-file="${fileName}"]`);
    if (existing) {
      existing.addEventListener('load', () => {
        window.__loadedChapterBoardFiles[fileName] = true;
        resolve(true);
      }, { once: true });
      existing.addEventListener('error', () => resolve(false), { once: true });
      return;
    }

    const s = document.createElement('script');
    s.src = fileName;
    s.async = true;
    s.setAttribute('data-chapter-file', fileName);

    s.onload = () => {
      window.__loadedChapterBoardFiles[fileName] = true;
      resolve(true);
    };

    s.onerror = () => {
      resolve(false);
    };

    document.head.appendChild(s);
  });
}

window.getBoardChapterData = function(boardName) {
  const board = (boardName || '').trim();
  if (!board) return {};

  const boardAliases = {
    "JEE Main": ["JEE Main", "JEE Mains"],
    "JEE Advanced": ["JEE Advanced", "JEE Advance"],
    "AP EAPCET": ["AP EAPCET"]
  };

  const candidates = boardAliases[board] || [board];
  const registry = window.BOARD_CHAPTERS || window.boardChapters || {};

  for (const key of candidates) {
    if (registry && typeof registry === 'object' && registry[key]) {
      return registry[key];
    }
  }

  for (const key of candidates) {
    const globalKey = `CHAPTERS_${key.toUpperCase().replace(/[^A-Z0-9]+/g, '_')}`;
    if (window[globalKey] && typeof window[globalKey] === 'object') {
      return window[globalKey];
    }
  }

  return {};
}

function __isEntranceExamBoard(boardName) {
  return [
    'JEE Main',

  ].includes((boardName || '').trim());
}

function syncEntranceExamUI(selectedBoard) {
  const isEntrance = __isEntranceExamBoard(selectedBoard);

  const levelsWrap = document.getElementById('levels-wrap-ai');
  const mcqWrap = document.getElementById('mcq-levels-wrap-ai');
  const descWrap = document.getElementById('desc-levels-wrap-ai');

  const l1 = document.getElementById('lvl1-ai');
  const l2 = document.getElementById('lvl2-ai');
  const l3 = document.getElementById('lvl3-ai');
  const total = document.getElementById('lvl-total-ai');

  const mainLabel = levelsWrap ? levelsWrap.querySelector('label') : null;

  const levelRows = [
    l1?.parentElement,
    l2?.parentElement,
    l3?.parentElement
  ].filter(Boolean);

  const totalRow = total?.parentElement;
  const totalLabel = totalRow ? totalRow.querySelector('div') : null;

  if (isEntrance) {
    if (mainLabel) mainLabel.textContent = 'Number of Questions:';

    levelRows.forEach(row => {
      row.style.display = 'none';
    });

    if (mcqWrap) mcqWrap.style.display = 'flex';
    if (descWrap) descWrap.style.display = 'none';

    if (total) {
      total.removeAttribute('readonly');
      total.min = '1';

      // Clear the old calculated L1/L2/L3 total
      total.value = '';

      total.style.background = '#f4fbff';
      total.style.borderColor = '#cfe0f1';
    }

    if (totalLabel) {
      totalLabel.textContent = 'Questions';
    }

    if (l1) l1.value = '0';
    if (l2) l2.value = '0';
    if (l3) l3.value = '0';

  } else {
    if (mainLabel) mainLabel.textContent = 'Questions by Level:';

    levelRows.forEach(row => {
      row.style.display = 'flex';
    });

    if (total) {
      total.setAttribute('readonly', '');
      total.removeAttribute('min');

      const a = parseInt(l1?.value || '0', 10) || 0;
      const b = parseInt(l2?.value || '0', 10) || 0;
      const c = parseInt(l3?.value || '0', 10) || 0;

      total.value = String(a + b + c);
      total.style.background = '#f6f6f6';
      total.style.borderColor = '#cfd3d8';
    }

    if (totalLabel) {
      totalLabel.textContent = 'Total';
    }
  }
}

async function updateChapterDropdown(selectedClass, selectedSubject) {
  const chapterDropdown = document.getElementById('chapter-dropdown-ai');
  if (!chapterDropdown) return;

  const chapterOptions = chapterDropdown.querySelector('.dropdown-options');
  const chapterSelected = chapterDropdown.querySelector('.selected-option');
  const chapterInput = document.getElementById('chapter-value-ai');

  const resetChapterDropdown = (msg = 'Select Chapter') => {
    chapterOptions.innerHTML = `<div data-value="">${msg}</div>`;
    chapterSelected.textContent = msg;
    chapterInput.value = '';
  };

  const rawBoard = document.getElementById('board-value-ai')?.value || '';
  const otherBoard = (document.getElementById('board-other-input')?.value || '').trim();
  const finalBoard = (rawBoard === 'Other') ? (otherBoard || 'Other') : rawBoard;

  const otherSubject = (document.getElementById('subject-other-input')?.value || '').trim();
  const finalSubject = (selectedSubject === 'Other')
    ? (otherSubject || 'Other')
    : (selectedSubject || '');

  if (!finalBoard || !finalSubject || finalBoard === 'Other' || finalSubject === 'Other') {
    resetChapterDropdown('Select Chapter');
    return;
  }

    await window.loadBoardChapterFile(finalBoard);

    const boardData = window.getBoardChapterData(finalBoard);

    let chapters = [];

  const subjectAliases = {
    "Physics (JEE Main)": ["Physics (JEE Main)", "Physics (Mains)"],
    "Chemistry (JEE Main)": ["Chemistry (JEE Main)", "Chemistry (Mains)"],
    "Mathematics (JEE Main)": ["Mathematics (JEE Main)", "Mathematics (Mains)"],

    "Physics (JEE Advanced)": ["Physics (JEE Advanced)", "Physics (Advance)"],
    "Chemistry (JEE Advanced)": ["Chemistry (JEE Advanced)", "Chemistry (Advance)"],
    "Mathematics (JEE Advanced)": ["Mathematics (JEE Advanced)", "Mathematics (Advance)"]
  };

  const subjectCandidates = subjectAliases[finalSubject] || [finalSubject];

  for (const subjectKey of subjectCandidates) {
    if (Array.isArray(boardData?.[subjectKey])) {
      chapters = boardData[subjectKey];
      break;
    }

    if (Array.isArray(boardData?.[selectedClass]?.[subjectKey])) {
      chapters = boardData[selectedClass][subjectKey];
      break;
    }

    if (Array.isArray(boardData?.[selectedClass?.trim()]?.[subjectKey])) {
      chapters = boardData[selectedClass.trim()][subjectKey];
      break;
    }
  }

  const uniqueChapters = Array.from(new Set((chapters || []).filter(Boolean)));

  if (!uniqueChapters.length) {
    resetChapterDropdown('No chapters available');
    return;
  }

  chapterOptions.innerHTML = uniqueChapters
    .map(ch => `<div data-value="${String(ch).replace(/"/g, '&quot;')}">${ch}</div>`)
    .join('');

  chapterSelected.textContent = uniqueChapters[0];
  chapterInput.value = uniqueChapters[0];

  optionsContainerListener(
    chapterOptions,
    chapterSelected,
    chapterInput,
    chapterDropdown
  );
}
function setupCustomDropdown(dropdownId, inputId, callback) {
  const dropdown = document.getElementById(dropdownId);
  if (!dropdown) return;

  const selected = dropdown.querySelector('.selected-option');
  const options = dropdown.querySelector('.dropdown-options');
  const input = document.getElementById(inputId);

  selected.onclick = (e) => {
    e.stopPropagation();
    toggleDropdown(dropdownId);
  };

  optionsContainerListener(options, selected, input, dropdown, callback);
}

function optionsContainerListener(options, selected, input, dropdown, callback) {
  options.querySelectorAll('div[data-value]').forEach(option => {
    option.onclick = () => {
      selected.textContent = option.textContent;
      input.value = option.dataset.value;
      dropdown.classList.remove('open');
      if (callback) callback(input.value);
    };
  });
}

function toggleDropdown(dropdownId) {
  const currentDropdown = document.getElementById(dropdownId);
  if(!currentDropdown) return;

  const currentlyOpen = currentDropdown.classList.contains('open');
  document.querySelectorAll('.custom-dropdown.open').forEach(d => {
    if (d.id !== dropdownId) d.classList.remove('open');
  });
  if(!currentlyOpen) currentDropdown.classList.add('open');
}

// Convert LaTeX delimiters to Markdown math that ChatGPT renders well
function __normalizeLatexDelimiters(s = '') {
  return String(s)
    // block: \[...\] -> $$...$$
    .replace(/\\\[/g, '$$').replace(/\\\]/g, '$$')
    // inline: \(...\) -> $...$
    .replace(/\\\(/g, '$').replace(/\\\)/g, '$')
    // collapse accidental $$$ or extra spaces
    .replace(/\${3,}/g, '$$')
    .replace(/[ \t]+\n/g, '\n');
}

// Decode any HTML entities that might have slipped in from your UI rendering
function __decodeEntities(s = '') {
  const d = document.createElement('textarea');
  d.innerHTML = s;
  return d.value;
}
// Wrap ( ... ) as \( ... \) ONLY when the (...) contains a LaTeX command like \frac, \sqrt, \cdot, etc.
function __fixLatex(s = '') {
  let t = String(s || '');

  t = t.replace(/\$\$([\s\S]*?)\$\$/g, '\\[$1\\]');
  t = t.replace(/\$([^\$]+)\$/g, '\\($1\\)');

  t = t.replace(/\\\(\s+/g, '\\(').replace(/\s+\\\)/g, '\\)');
  t = t.replace(/\\\[\s+/g, '\\[').replace(/\s+\\\]/g, '\\]');

  return t;
}
// Convert LaTeX-y input to plain math for ChatGPT prefill
function __toPlainMath(s = '') {
  let t = String(s);

  // remove $ / $$ and \( \) \[ \]
  t = t.replace(/\$\$?/g, '');
  t = t.replace(/\\\(|\\\)|\\\[|\\\]/g, '');

  // \frac{a}{b} -> (a)/(b)
  t = t.replace(/\\frac\s*\{([^}]*)\}\s*\{([^}]*)\}/g, '($1)/($2)');

  // exponents ^{...} -> ^...
  t = t.replace(/\^\{([^}]+)\}/g, '^$1');

  // common symbols
  t = t
    .replace(/\\times/g, '×')
    .replace(/\\cdot/g, '·')
    .replace(/\\leq/g, '≤')
    .replace(/\\geq/g, '≥')
    .replace(/\\neq/g, '≠')
    .replace(/\\pm/g, '±')
    .replace(/\\sqrt\{([^}]+)\}/g, '√($1)');

  // drop \left \right
  t = t.replace(/\\left/g, '').replace(/\\right/g, '');

  return t.replace(/[ \t]+\n/g, '\n').trim();
}

function buildChatGptPromptFromQuestion(qData, sessionParams) {
  const meta = qData.parsedMeta || '';

  const headerBits = [
    sessionParams?.subject && `Subject: ${sessionParams.subject}`,
    sessionParams?.class && `Class: ${sessionParams.class}`,
    sessionParams?.chapter && `Chapter: ${sessionParams.chapter}`
  ]
    .filter(Boolean)
    .join(' · ');

  // decode & normalize math
  const rawQ    = __decodeEntities((qData.question || '').trim());
  const rawBody = __decodeEntities((qData.parsedBody || '').trim());

      const qText = __fixLatex(rawQ);
    const body  = __fixLatex(rawBody);

  const hasOptions = Array.isArray(qData.options) && qData.options.length === 4;

  let prompt = 'Please solve and explain clearly.\n';
  if (headerBits) prompt += headerBits + '\n\n';

  if (qText) {
    prompt += `Question:\n${qText}\n`;

    if (hasOptions) {
      const opts = qData.options
        .map((o, i) => {
          const clean = __toPlainMath(
            __decodeEntities(String(o || '').replace(/^[A-D][).]\s*/, ''))
          );
          return `${String.fromCharCode(65 + i)}) ${clean}`;
        })
        .join('\n');

      prompt += `\nOptions:\n${opts}`;
    }
  } else {
    prompt += `Question:\n${body}\n`;
  }

  prompt += hasOptions
    ? `\n\nRespond with the correct option (A–D) and a step-by-step explanation.`
    : `\n\nRespond with the final answer and a step-by-step explanation.`;

  if (meta) prompt += `\n\nMeta: ${meta}`;

  return prompt;
}

async function openInChatGptWithPrefill(prompt) {
  let copied = false;

  try {
    await navigator.clipboard.writeText(prompt);
    copied = true;
  } catch (_) {
    /* clipboard may be blocked; continue */
  }

  __qb_toast(copied ? 'Copied prompt. Opening ChatGPT…' : 'Opening ChatGPT… (paste prompt manually)');

  const url = new URL('https://chatgpt.com/?');
  url.searchParams.set('q', prompt); // pre-fill message
  window.open(url.toString(), '_blank', 'noopener');
}

function __scMathResearchRules(classLabel, workflow) {
  const grade = Number(
    String(classLabel || '').match(/\d+/)?.[0] || 0
  );

  if (grade < 6 || grade > 12) return '';

  const focus = ({
    6: 'Number sense, patterns, operations, basic geometry, simple reasoning and everyday applications.',
    7: 'Conceptual links, proportional reasoning where prescribed, multi-step arithmetic and geometry.',
    8: 'Algebraic thinking, numerical relationships, geometry, data interpretation and applications.',
    9: 'Algebra, geometry, reasoning, proofs where prescribed and well-structured calculations.',
    10: 'CBSE board-style concept application, mathematical reasoning, competency and case-based problems.',
    11: 'Deeper algebraic, geometric and functional reasoning with accurate multi-step solutions.',
    12: 'Advanced analytical problem-solving, mathematical modelling and rigorous verification.'
  })[grade];

  return `
CBSE MATHEMATICS — VERIFIED CHAPTER-BASED QUESTION RULES
Workflow: ${workflow}; Class: ${grade}

1. PRESCRIBED CURRICULUM AND SOURCE

- Verify the applicable CBSE syllabus and current prescribed Mathematics textbook for the selected academic year, class and chapter. Never hardcode a textbook title or edition.
- Prioritise https://cbseacademic.nic.in/, https://ncert.nic.in/ and https://epathshala.nic.in/; read the actual chapter, not only search snippets, summaries, coaching notes or question-bank websites.
- Confirm the chapter title, definitions, properties, examples, diagrams, exercises and permitted methods.
- Where relevant, distinguish Class 10 Mathematics Basic/Standard and senior-secondary Mathematics/Applied Mathematics; do not silently substitute one course for another.
- If a supplied source conflicts with a general website, verify against the applicable prescribed material before proceeding.

2. CONTENT COVERAGE AND QUESTION MODELS

- Map the selected chapter's actual concepts, subtopics, worked examples, exercise types and applications before writing questions.
- Distribute questions across distinct assessable concepts; avoid repeating one method with only changed numbers.
- Include direct understanding, conceptual reasoning, application, multi-step problem solving, analysis and competency tasks in proportions appropriate to the selected inventory or exam blueprint.
- Stay strictly within the selected class and chapter. Do not require higher-class theorems, shortcuts, formulae or techniques.
- Class ${grade} focus: ${focus}
- Do not force assertions, case studies, proofs or five-mark problems when the actual content cannot support meaningful versions.
- Construct original, syllabus-grounded numerical values and contexts when suitable; do not claim invented problems are verbatim textbook exercises.

3. MATHEMATICAL ACCURACY AND ANSWERS

- Solve each final question independently before setting its answer or choices. Recheck arithmetic, algebra, signs, units, rounding, roots, domain restrictions and special cases.
- For a single-correct MCQ, verify all four options: exactly one must be mathematically valid, including equivalent expressions or forms.
- For multiple-correct MCQs, identify every valid option and follow the selected question-type rules.
- Use plausible error-based distractors, not impossible or unrelated options.
- Descriptive answers must show coherent step-wise working, relevant formulae, substitutions, reasoning and a separate correct final answer.
- Do not force numbered prose points or leave a dangling equals sign.
- Use ONLY inline LaTeX \\( ... \\) in question records; do not use display-math delimiters.
- Preserve the existing Q headers, marks, tags, option lines, Ans:, Answer: and Explanation: structure.

4. DIAGRAMS, GRAPHS AND DATA

- Use accurate geometry diagrams, number lines, graphs, tables or statistical visuals when the chapter and question model warrant them, but not in every question.
- State all necessary measurements, labels, scales, axis values and constraints; an answer must not depend on an imaginary or missing figure.
- Use the existing [Picture Needed: Yes] marker only where supported and genuinely needed.
- Include [Image: actual image URL] only if its content and accessible URL have been verified.
- If a necessary figure cannot be supplied or described unambiguously using the existing format, flag the problem before the final set.
- Never fabricate an image URL.

5. QUESTION COUNTS AND BLUEPRINT

- For individual questions, obey the teacher's exact selected question type, quantity and level allocation.
- For a complete chapter bank, follow the 45-record Mathematics inventory only if the verified chapter can support distinct, valid questions of each requested category.
- Otherwise report the constraint before generating rather than padding the inventory.
- For an exam blueprint, obey every selected chapter, section, slot, model family, question count, marks, competency classification, internal OR and Attempt Any condition.
- Count OR alternatives once toward attempted marks.
- Verify the sum of attempted marks against the selected blueprint.
- Preserve the DRAFT → RECHECK → FINAL SET workflow and exact machine-readable question-record formatting.
- Do not introduce unrequested changes to other subjects or to the selected output schema.

6. SOURCE AND VERIFICATION FAILURE

- If the actual prescribed chapter cannot be accessed or verified using available tools or supplied materials, STOP BEFORE Q1 and request the chapter PDF, text or accessible source link.
- If a specified question type or distribution cannot genuinely be supported, identify the exact conflict rather than inventing content.
- Never claim to have browsed, inspected a figure or verified calculations without doing so.
- Keep research references outside the final question-record block.

These extra rules apply ONLY to CBSE Mathematics (Classes 6–12).

function splitMcqOptions(body) {
  if ((body.match(/^[A-D]\)/gm) || []).length >= 3) return body;

  if (/A\).+B\).+C\).+D\)/.test(body)) {
    const m = body.match(/A\)([^B]+)B\)([^C]+)C\)([^D]+)D\)(.+)/);
    if (m) {
      return [
        "A)" + m[1].trim(),
        "B)" + m[2].trim(),
        "C)" + m[3].trim(),
        "D)" + m[4].trim()
      ].join('\n');
    } else {
      return body
        .replace(/([A-D]\))/g, '\n$1')
        .replace(/^\n/, '');
    }
  }

  return body;
}
/* ========= NEW: Shuffle utilities for MCQs ========= */

/** Strip leading "A)"/"B)"/"C)"/"D)" labels and trim */
function __normalizeOptionText(s) {
  return String(s || '').replace(/^[A-D][).]\s*/, '').trim();
}

/** Fisher–Yates shuffle; returns a new shuffled copy */
function __shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/**
 * Randomize options A–D and remap the Ans: letters.
 * Works for Single (one letter) and Multiple (several letters).
 * Mutates qData: { options, parsedBody, parsedAnswer, fullText }
 */
function shuffleOptionsForQuestion(qData) {
  if (!qData || !Array.isArray(qData.options) || qData.options.length !== 4) return;

  // Normalize existing options (remove labels like "A) ")
  const old = qData.options.map(__normalizeOptionText);

  // Build permutation mapping: perm[newIndex] = oldIndex
  const oldIndices = [0, 1, 2, 3];
  const shuffledOldIndices = __shuffleArray(oldIndices);

  // Reorder options by shuffled indices
  const newOptions = shuffledOldIndices.map(idx => old[idx]);

  // Remap answers (if present)
  let newAnsLine = qData.parsedAnswer || null;
  const foundLetters = newAnsLine ? [...newAnsLine.matchAll(/\b([A-D])\)/g)].map(m => m[1]) : [];

  if (foundLetters.length > 0) {
    const remappedLetters = foundLetters.map(letter => {
      const oi = letter.charCodeAt(0) - 65; // original index 0..3
      // find newIndex such that perm[newIndex] === oi
      const ni = shuffledOldIndices.findIndex(orig => orig === oi);
      return String.fromCharCode(65 + ni);
    });

    if (remappedLetters.length === 1) {
      newAnsLine = `Ans: ${remappedLetters[0]})`;
    } else {
      newAnsLine = `Ans: ${remappedLetters.map(L => `${L})`).join(', ')}`;
    }
  }

  // Rebuild parsedBody with new A)/B)/C)/D) order
  const rebuilt = [
    (qData.question || '').trim(),
    `A) ${newOptions[0]}`,
    `B) ${newOptions[1]}`,
    `C) ${newOptions[2]}`,
    `D) ${newOptions[3]}`
  ].join('\n');

  // Mutate qData consistently
  qData.options = newOptions.slice(); // store de-labeled texts
  qData.parsedBody = rebuilt;
  if (newAnsLine) qData.parsedAnswer = newAnsLine;

    qData.fullText = `${qData.parsedMeta}\n${qData.parsedBody}${qData.parsedAnswer ? `\n${qData.parsedAnswer}` : ''}${qData.explanation ? `\nExplanation: ${qData.explanation}` : ''}`;
}

/* ======== END NEW shuffle utilities ======== */

/**
 * Normalize “Ans:” letters into a clean array of A-D, keeping order.
 * Accepts: "Ans: C)", "Ans: A), C)", "Ans: B),D)"
 */
function __extractAnswerLetters(ansLine = '') {
  const m = String(ansLine).match(/Ans\s*:\s*([A-D\)\s,]+)/i);
  if (!m) return [];
  const letters = [];
  (m[1].match(/[A-D]\)/gi) || []).forEach(tok => {
    const L = tok[0].toUpperCase();
    if (!letters.includes(L)) letters.push(L);
  });
  return letters;
}

/** Remove “Qn:” header line and return {meta, body} */
function __splitMetaAndBody(block) {
  const lines = String(block).split('\n');
  const first = lines.shift() || '';
  return { meta: first.trim(), body: lines.join('\n').trim() };
}

/** Ensure options are split into 4 lines starting with A) B) C) D) */
function __forceOptionLines(body) {
  let text = String(body || '').trim();

  if (!text) return text;

  /* =====================================================
     ALREADY PROPERLY LINE-BROKEN
  ===================================================== */
  const existingOptionLines =
    text.match(/^[ \t]*[A-D]\)[ \t]*/gm) || [];

  if (existingOptionLines.length >= 4) {
    return text;
  }

  /* =====================================================
     INLINE OPTIONS
     Preserve the question stem and split:
     A) ... B) ... C) ... D) ...
  ===================================================== */

  const match = text.match(
    /^([\s\S]*?)\bA\)\s*([\s\S]*?)\s+\bB\)\s*([\s\S]*?)\s+\bC\)\s*([\s\S]*?)\s+\bD\)\s*([\s\S]*)$/i
  );

  if (match) {
    const stem = String(match[1] || '').trim();
    const optA = String(match[2] || '').trim();
    const optB = String(match[3] || '').trim();
    const optC = String(match[4] || '').trim();
    const optD = String(match[5] || '').trim();

    return [
      stem,
      `A) ${optA}`,
      `B) ${optB}`,
      `C) ${optC}`,
      `D) ${optD}`
    ]
      .filter(Boolean)
      .join('\n');
  }

  /* =====================================================
     FALLBACK
  ===================================================== */

  return text
    .replace(/\s+(?=[A-D]\)\s*)/g, '\n')
    .trim();
}

/**
 * Parse a pasted FINAL SET block into our session question objects.
 * Respects the current sessionParams.questionType (MCQ Single/Multiple/Descriptive)
 */
function __qbBuildParagraphFullText(qData = {}) {
  const lines = [
    qData.parsedMeta || '',
    'Passage:',
    qData.passage || '',
    ''
  ];

  (qData.mcqs || []).forEach((mcq, index) => {
    lines.push(`Sub-question ${index + 1}:`);
    lines.push(mcq.body || '');

    if (mcq.answer) lines.push(mcq.answer);
    if (mcq.explanation) lines.push(`Explanation: ${mcq.explanation}`);
    if (mcq.finalAnswer) lines.push(`Answer: ${mcq.finalAnswer}`);

    lines.push('');
  });

  return lines.join('\n').trim();
}

  if (!passage || !mcqs.length) return null;

  const rawMeta = parseMetaLine(meta);
  const questionNo = (meta.match(/^Q\s*(\d+)/i) || [, '1'])[1];
  const levelText = rawMeta.difficulty || 'Level 1';
  const marks = mcqs.length;

  const qData = {
    type: 'Paragraph-Based MCQ (Single Correct)',
    mcqType: 'Paragraph-Based MCQ (Single Correct)',
    class: sessionParams.class,
    board: sessionParams.board,
    subject: sessionParams.subject,
    chapter: sessionParams.chapter,
    parsedMeta: `Q${questionNo}: ${levelText}, ${marks} Mark${marks === 1 ? '' : 's'} [Paragraph-Based MCQ (Single Correct)]`,
    passage,
    mcqs,
    question: '',
    options: [],
    parsedAnswer: '',
    parsedBody: '',
    explanation: ''
  };

  qData.fullText = __qbBuildParagraphFullText(qData);
  qData.parsedBody = qData.fullText.replace(`${qData.parsedMeta}\n`, '');

  return qData;
}

/* =========================================================
   COMPLETE CHAPTER BANK — MIXED QUESTION PARSER

function parseCompleteChapterBankQuestions(text, sessionParams = {}) {
  const startIdx = text.search(/\bQ\s*1\s*:/i);
  const cleaned = startIdx >= 0 ? text.slice(startIdx) : text;

  const blocks = cleaned
    .split(/\n(?=Q\s*\d+\s*:)/g)
    .map(s => s.trim())
    .filter(s => /^Q\s*\d+\s*:/i.test(s));

  const out = [];

  blocks.forEach((block, index) => {
    const lines = block.split('\n');
    const rawMeta = (lines.shift() || '').trim();
    const body = lines.join('\n').trim();

    const marksMatch = rawMeta.match(/(\d+)\s*Mark(?:s)?/i);
    const marks = marksMatch ? parseInt(marksMatch[1], 10) : 0;

    const typeMatch = rawMeta.match(
      /\[(MCQ \(Single\)|MCQ \(Multiple\)|Assertion and Reason \(MCQ Single\)|Descriptive|Case Based|Map)\]/i
    );

    let questionType = typeMatch
      ? typeMatch[1].trim()
      : 'Descriptive';

    const categoryMatch =
      rawMeta.match(/\[Category:\s*([^\]]+)\]/i);

    const modelMatch =
      rawMeta.match(/\[Model:\s*([^\]]+)\]/i);

    const areaMatch =
      rawMeta.match(/\[Area:\s*([^\]]+)\]/i);

    const category =
      categoryMatch ? categoryMatch[1].trim() : '';

    const modelType =
      modelMatch ? modelMatch[1].trim() : '';

    const subjectArea =
      areaMatch ? areaMatch[1].trim() : '';

    const isMcq =
      questionType === 'MCQ (Single)' ||
      questionType === 'MCQ (Multiple)' ||
      questionType === 'Assertion and Reason (MCQ Single)';

    const qData = {
      bankMode: 'chapter',
      generationMode: 'chapter-bank',

      class: sessionParams.class || '',
      board: sessionParams.board || '',
      subject: sessionParams.subject || '',
      chapter: sessionParams.chapter || '',

      type: questionType,
      mcqType: isMcq ? questionType : '',

      marks: marks,
      category: category,
      descriptiveType:
        questionType === 'Descriptive'
          ? category
          : '',

      modelType: modelType,
      subjectArea: subjectArea,

      difficulty: null,
      level: null,

      parsedMeta: rawMeta.replace(
        /^Q\s*\d+\s*:/i,
        `Q${index + 1}:`
      ),

      question: '',
      options: [],
      parsedAnswer: '',
      parsedBody: '',
      explanation: '',
      finalAnswer: '',
      fullText: block
    };

    /* =====================================================
       MCQ / ASSERTION-REASON
    ===================================================== */

    if (isMcq) {
      const ansMatch =
        body.match(/^\s*Ans\s*:\s*(.+)$/im);

      const answerLetters = ansMatch
        ? __extractAnswerLetters(ansMatch[0])
        : [];

      qData.parsedAnswer = answerLetters.length
        ? `Ans: ${answerLetters.map(x => `${x})`).join(', ')}`
        : '';

      const explanationMatch =
        body.match(
          /Explanation\s*:\s*([\s\S]*?)(?=\n\s*Answer\s*:|$)/i
        );

      qData.explanation = explanationMatch
        ? explanationMatch[1].trim()
        : '';

      const finalAnswerMatch =
        body.match(
          /\n\s*Answer\s*:\s*([\s\S]*)$/i
        );

      qData.finalAnswer = finalAnswerMatch
        ? finalAnswerMatch[1].trim()
        : '';

      let questionPart = body
        .replace(/^\s*Ans\s*:\s*.+$/gim, '')
        .replace(
          /Explanation\s*:\s*[\s\S]*?(?=\n\s*Answer\s*:|$)/i,
          ''
        )
        .replace(
          /\n\s*Answer\s*:\s*[\s\S]*$/i,
          ''
        )
        .trim();

      questionPart = __forceOptionLines(questionPart);

      const qLines = questionPart
        .split('\n')
        .map(x => x.trim())
        .filter(Boolean);

      const optionStart =
        qLines.findIndex(x => /^[A-D]\)/i.test(x));

      const stemLines =
        optionStart >= 0
          ? qLines.slice(0, optionStart)
          : qLines;

      const optionLines =
        optionStart >= 0
          ? qLines.slice(optionStart)
          : [];

      qData.question =
        stemLines.join('\n').trim();

      const A =
        optionLines.find(x => /^A\)/i.test(x)) || 'A) ';
      const B =
        optionLines.find(x => /^B\)/i.test(x)) || 'B) ';
      const C =
        optionLines.find(x => /^C\)/i.test(x)) || 'C) ';
      const D =
        optionLines.find(x => /^D\)/i.test(x)) || 'D) ';

      qData.options = [A, B, C, D].map(x =>
        x.replace(/^[A-D]\)\s*/i, '').trim()
      );

      qData.parsedBody = [
        qData.question,
        `A) ${qData.options[0]}`,
        `B) ${qData.options[1]}`,
        `C) ${qData.options[2]}`,
        `D) ${qData.options[3]}`
      ].join('\n');

      qData.fullText =
        `${qData.parsedMeta}\n${qData.parsedBody}` +
        `${qData.parsedAnswer ? `\n${qData.parsedAnswer}` : ''}` +
        `${qData.explanation ? `\nExplanation: ${qData.explanation}` : ''}` +
        `${qData.finalAnswer ? `\nAnswer: ${qData.finalAnswer}` : ''}`;
    }

    /* =====================================================
       CASE BASED
    ===================================================== */

    else if (questionType === 'Case Based') {
      const answersMatch =
        body.match(/\n\s*Answers?\s*:\s*([\s\S]*)$/i);

      const answerText =
        answersMatch ? answersMatch[1].trim() : '';

      const bodyWithoutAnswers =
        answersMatch
          ? body.replace(
              /\n\s*Answers?\s*:\s*[\s\S]*$/i,
              ''
            ).trim()
          : body.trim();

      qData.question =
        bodyWithoutAnswers.split('\n')[0] || '';

      qData.parsedBody =
        bodyWithoutAnswers;

      qData.parsedAnswer =
        answerText
          ? `Answer: ${answerText}`
          : '';

      qData.fullText =
        `${qData.parsedMeta}\n${qData.parsedBody}` +
        `${qData.parsedAnswer ? `\n${qData.parsedAnswer}` : ''}`;
    }

    /* =====================================================
       DESCRIPTIVE / MAP / OTHER
    ===================================================== */

    else {
      const explanationMatch =
        body.match(
          /Explanation\s*:\s*([\s\S]*)$/i
        );

      qData.explanation =
        explanationMatch
          ? explanationMatch[1].trim()
          : '';

      const bodyWithoutExplanation =
        explanationMatch
          ? body.replace(
              /Explanation\s*:\s*[\s\S]*$/i,
              ''
            ).trim()
          : body.trim();

      const answerMatch =
        bodyWithoutExplanation.match(
          /\n\s*Answer\s*:\s*([\s\S]*)$/i
        );

      const answerText =
        answerMatch
          ? answerMatch[1].trim()
          : '';

      const questionBody =
        answerMatch
          ? bodyWithoutExplanation.replace(
              /\n\s*Answer\s*:\s*[\s\S]*$/i,
              ''
            ).trim()
          : bodyWithoutExplanation;

      qData.question =
        (questionBody.split('\n')[0] || '').trim();

      qData.parsedBody =
        questionBody;

      qData.parsedAnswer =
        answerText
          ? `Answer: ${answerText}`
          : '';

      qData.fullText =
        `${qData.parsedMeta}\n${qData.parsedBody}` +
        `${qData.parsedAnswer ? `\n${qData.parsedAnswer}` : ''}` +
        `${qData.explanation ? `\nExplanation: ${qData.explanation}` : ''}`;
    }

    out.push(qData);
  });

  return out;
}


function parseFinalSetIntoQuestions(text, sessionParams) {

  /* =====================================================
     COMPLETE CHAPTER BANK
     Each pasted question carries its own type and marks.
  ===================================================== */

  const isChapterBank =
    sessionParams &&
    (
      sessionParams.generationMode === 'chapter-bank' ||
      sessionParams.bankMode === 'chapter' ||
      sessionParams.questionType === 'Complete Chapter Bank'
    );

  if (isChapterBank) {
    return parseCompleteChapterBankQuestions(
      text,
      sessionParams
    );
  }
  // keep only from first Qn onward (ignore any chatty intro)
  const startIdx = text.search(/\bQ\s*1\s*:/i);
  const cleaned = startIdx >= 0 ? text.slice(startIdx) : text;

  const blocks = cleaned
    .split(/\n(?=Q\s*\d+\s*:)/g)
    .map(s => s.trim())
    .filter(s => /^Q\s*\d+\s*:/i.test(s));

    const out = [];

  const isParagraphBased = sessionParams.questionType === 'Paragraph-Based MCQ (Single Correct)';

  if (isParagraphBased) {
    blocks.forEach((block) => {
      const paragraphSet = __qbParseParagraphSetBlock(block, sessionParams);
      if (paragraphSet) out.push(paragraphSet);
    });

    out.forEach((qData, index) => {
      qData.parsedMeta = qData.parsedMeta.replace(/^Q\s*\d+\s*:/i, `Q${index + 1}:`);
      qData.fullText = __qbBuildParagraphFullText(qData);
      qData.parsedBody = qData.fullText.replace(`${qData.parsedMeta}\n`, '');
    });

    return out;
  }

   const isMatchingMatrix =
    sessionParams.questionType === 'Matching Matrix';

  const isMatchingList =
    sessionParams.questionType === 'Matching List';

  const isMatchingStyle =
    isMatchingMatrix || isMatchingList;

  const isMcqStyle =
    sessionParams.questionType.startsWith('MCQ') ||
    sessionParams.questionType.startsWith('Text Book') ||
    sessionParams.questionType === 'Assertion and Reason (MCQ Single)' ||
    isMatchingStyle;

  for (const b of blocks) {
    const { meta, body } = __splitMetaAndBody(b);

    const qData = {
      fullText: b,
      class: sessionParams.class,
      board: sessionParams.board,
      subject: sessionParams.subject,
      chapter: sessionParams.chapter,
      parsedMeta: meta,
      question: '',
      options: [],
      parsedAnswer: null,
      parsedBody: '',
      explanation: ''
    };

      if (isMatchingStyle) {
      const explanationMatch = body.match(/Explanation\s*:\s*([\s\S]*)$/i);
      const explanationText = explanationMatch ? explanationMatch[1].trim() : '';

      const bodyWithoutExplanation = explanationMatch
        ? body.replace(/Explanation\s*:\s*[\s\S]*$/i, '').trim()
        : body;

      const ansMatch = bodyWithoutExplanation.match(/Ans\s*:\s*.*$/im);
      const ansLine = ansMatch ? ansMatch[0].trim() : null;

      const withoutAns = ansMatch
        ? bodyWithoutExplanation.replace(ansMatch[0], '').trim()
        : bodyWithoutExplanation.trim();

      const matrixParts = withoutAns.split(/\n\s*Options\s*:\s*\n?/i);
      const matrixStem = (matrixParts.shift() || '').trim();

      let optBlock = matrixParts.join('\n').trim();
      optBlock = __forceOptionLines(optBlock);

      const optLines = optBlock
        .split('\n')
        .map(x => x.trim())
        .filter(x => /^[A-D]\)/i.test(x));

      const A = optLines.find(l => /^A\)/i.test(l)) || 'A) ';
      const B = optLines.find(l => /^B\)/i.test(l)) || 'B) ';
      const C = optLines.find(l => /^C\)/i.test(l)) || 'C) ';
      const D = optLines.find(l => /^D\)/i.test(l)) || 'D) ';

      qData.question = matrixStem ? `${matrixStem}\n\nOptions:` : 'Options:';

      qData.options = [A, B, C, D].map(s =>
        s.replace(/^[A-D]\)\s*/i, '').trim()
      );

      qData.parsedAnswer = ansLine
        ? `Ans: ${__extractAnswerLetters(ansLine).map(L => `${L})`).join(', ')}`
        : null;

      qData.explanation = explanationText;

      qData.parsedBody = [
        qData.question,
        `A) ${qData.options[0]}`,
        `B) ${qData.options[1]}`,
        `C) ${qData.options[2]}`,
        `D) ${qData.options[3]}`
      ].join('\n');

      qData.fullText =
        `${qData.parsedMeta}\n${qData.parsedBody}` +
        `${qData.parsedAnswer ? `\n${qData.parsedAnswer}` : ''}` +
        `${qData.explanation ? `\nExplanation: ${qData.explanation}` : ''}`;

    } else if (isMcqStyle) {
      const explanationMatch = body.match(/Explanation\s*:\s*([\s\S]*)$/i);
      const explanationText = explanationMatch ? explanationMatch[1].trim() : '';

      const bodyWithoutExplanation = explanationMatch
        ? body.replace(/Explanation\s*:\s*[\s\S]*$/i, '').trim()
        : body;

      const ansMatch = bodyWithoutExplanation.match(/Ans\s*:\s*.*$/im);
      const ansLine = ansMatch ? ansMatch[0].trim() : null;

      const withoutAns = ansMatch
        ? bodyWithoutExplanation.replace(ansMatch[0], '').trim()
        : bodyWithoutExplanation.trim();

      const lines = withoutAns
        .split('\n')
        .map(l => l.trim())
        .filter(Boolean);

      const optionStartIndex = lines.findIndex(l => /^[A-D]\)/i.test(l));
      const stemLines = optionStartIndex >= 0
        ? lines.slice(0, optionStartIndex)
        : lines.slice(0, 1);

      const optionLinesRaw = optionStartIndex >= 0
        ? lines.slice(optionStartIndex)
        : lines.slice(1);

      const qText = stemLines.join('\n').trim();

      let optBlock = optionLinesRaw.join('\n');
      optBlock = __forceOptionLines(optBlock);

      const optLines = optBlock
        .split('\n')
        .map(x => x.trim())
        .filter(Boolean);

      const A = optLines.find(l => /^A\)/i.test(l)) || 'A) ';
      const B = optLines.find(l => /^B\)/i.test(l)) || 'B) ';
      const C = optLines.find(l => /^C\)/i.test(l)) || 'C) ';
      const D = optLines.find(l => /^D\)/i.test(l)) || 'D) ';

      qData.question = qText;

      qData.options = [A, B, C, D].map(s =>
        s.replace(/^[A-D]\)\s*/i, '').trim()
      );

      qData.parsedAnswer = ansLine
        ? `Ans: ${__extractAnswerLetters(ansLine).map(L => `${L})`).join(', ')}`
        : null;

      qData.explanation = explanationText;

      qData.parsedBody = [
        qText,
        `A) ${qData.options[0]}`,
        `B) ${qData.options[1]}`,
        `C) ${qData.options[2]}`,
        `D) ${qData.options[3]}`
      ].join('\n');

      qData.fullText =
        `${qData.parsedMeta}\n${qData.parsedBody}` +
        `${qData.parsedAnswer ? `\n${qData.parsedAnswer}` : ''}` +
        `${qData.explanation ? `\nExplanation: ${qData.explanation}` : ''}`;

    } else {
      const explanationMatch = body.match(/Explanation\s*:\s*([\s\S]*)$/i);
      const explanationText = explanationMatch ? explanationMatch[1].trim() : '';

      const bodyWithoutExplanation = explanationMatch
        ? body.replace(/Explanation\s*:\s*[\s\S]*$/i, '').trim()
        : body;

      const finalAnswerMatch = bodyWithoutExplanation.match(/Answer\s*:\s*([\s\S]*)$/i);
      const finalAnswerText = finalAnswerMatch ? finalAnswerMatch[1].trim() : '';

      const bodyWithoutAnswer = finalAnswerMatch
        ? bodyWithoutExplanation.replace(/Answer\s*:\s*[\s\S]*$/i, '').trim()
        : bodyWithoutExplanation;

            qData.question =
        sessionParams.questionType === 'Numerical Value'
          ? bodyWithoutAnswer.trim()
          : (bodyWithoutAnswer.split('\n')[0] || '');
      qData.options = [];
      qData.parsedAnswer = finalAnswerText ? `Answer: ${finalAnswerText}` : null;
      qData.parsedBody = bodyWithoutAnswer;
      qData.explanation = explanationText;

      qData.fullText =
        `${qData.parsedMeta}\n${qData.parsedBody}` +
        `${qData.parsedAnswer ? `\n${qData.parsedAnswer}` : ''}` +
        `${qData.explanation ? `\nExplanation: ${qData.explanation}` : ''}`;
    }

    out.push(qData);
  }

  let TYPE = sessionParams.questionType;

  if (TYPE === 'Text Book (MCQ Single)') TYPE = 'Text (Single)';
  if (TYPE === 'Text Book (MCQ Multiple)') TYPE = 'Text (Multiple)';

    const isEntranceExamMode =
    typeof __isEntranceExamBoard === 'function'
      ? __isEntranceExamBoard(sessionParams.board)
      : ['JEE Main', 'JEE Advanced', 'AP EAPCET'].includes(
          (sessionParams.board || '').trim()
        );

  for (let i = 0; i < out.length; i++) {
    const m = out[i].parsedMeta || '';

    if (isEntranceExamMode) {
      out[i].parsedMeta =
        `Q${i + 1}: [${TYPE}]`;

    } else {
      const lvl =
        (m.match(/Level\s*([1-3])/i) || [, '?'])[1];

      const mkMatch =
        m.match(/(\d+)\s*Mark/i);

      const marks = mkMatch
        ? `${mkMatch[1]} Mark${mkMatch[1] === '1' ? '' : 's'}`
        : (
            TYPE.startsWith('MCQ') ||
            TYPE === 'Assertion and Reason (MCQ Single)' ||
            TYPE === 'Matching Matrix' ||
            TYPE === 'Matching List'
          )
          ? '1 Mark'
          : '';

      out[i].parsedMeta =
        `Q${i + 1}: Level ${lvl}, ${marks} [${TYPE}]`;
    }

    out[i].fullText =
      `${out[i].parsedMeta}\n${out[i].parsedBody}` +
      `${out[i].parsedAnswer ? `\n${out[i].parsedAnswer}` : ''}` +
      `${out[i].explanation ? `\nExplanation: ${out[i].explanation}` : ''}`;
  }

  return out;
}

    .split(/\n(?=Q\s*\d+:)/g)

      // Shuffle only the four matching answer choices.

    } else if (isMcqStyle) {
      const explanationMatch = rawBody.match(/Explanation\s*:\s*([\s\S]*)$/i);

        ? rawBody.replace(/Explanation\s*:\s*[\s\S]*$/i, '').trim()
        : rawBody;

      const answerMatch = bodyWithoutExplanation.match(/(.*)(Ans:\s*.*)/s);

      if (answerMatch) {

          .split('\n')
          .map(x => x.trim())
          .filter(x => x && x !== '<br>' && x !== '');

        const optionStartIndex = lines.findIndex(l => /^[A-D]\)/i.test(l));

        const stemLines = optionStartIndex >= 0
          ? lines.slice(0, optionStartIndex)
          : lines.slice(0, 1);

        const optionLines = optionStartIndex >= 0
          ? lines.slice(optionStartIndex, optionStartIndex + 4)
          : lines.slice(1, 5);

        questionData.question = stemLines.join('\n').trim();
        questionData.options = optionLines.map(x => x || '');
        questionData.parsedAnswer = answerMatch[2].trim();

        questionData.parsedBody = [
          questionData.question,
          ...questionData.options
        ].join('\n');
      } else {
        questionData.question = bodyWithoutExplanation.split('\n')[0].trim();
        questionData.options = bodyWithoutExplanation
          .split('\n')
          .slice(1, 5)
          .map(x => x.trim());

        questionData.parsedAnswer = null;
        questionData.parsedBody = bodyWithoutExplanation;
      }

      questionData.explanation = explanationText;

      questionData.parsedBody = questionData.parsedBody || '';
      questionData.parsedAnswer = questionData.parsedAnswer || '';
      questionData.parsedMeta = questionData.parsedMeta || '';
      questionData.explanation = questionData.explanation || '';

      shuffleOptionsForQuestion(questionData);

    } else {
      const explanationMatch = rawBody.match(/Explanation\s*:\s*([\s\S]*)$/i);
      const explanationText = explanationMatch ? explanationMatch[1].trim() : '';

      const bodyWithoutExplanation = explanationMatch
        ? rawBody.replace(/Explanation\s*:\s*[\s\S]*$/i, '').trim()
        : rawBody;

      const finalAnswerMatch = bodyWithoutExplanation.match(/Answer\s*:\s*([\s\S]*)$/i);
      const finalAnswerText = finalAnswerMatch ? finalAnswerMatch[1].trim() : '';

      const bodyWithoutAnswer = finalAnswerMatch
        ? bodyWithoutExplanation.replace(/Answer\s*:\s*[\s\S]*$/i, '').trim()
        : bodyWithoutExplanation;

           questionData.question =
        sessionParams.questionType === 'Numerical Value'
          ? bodyWithoutAnswer.trim()
          : (bodyWithoutAnswer.trim().split('\n')[0] || '');
      questionData.options = [];
      questionData.parsedAnswer = finalAnswerText ? `Answer: ${finalAnswerText}` : null;
      questionData.parsedBody = bodyWithoutAnswer.trim();
      questionData.explanation = explanationText;
    }

    currentSessionQuestions.push(questionData);
    sessionStorage.setItem(
      'currentSessionQuestions',
      JSON.stringify(currentSessionQuestions)
    );

    const questionEl = createQuestionElement(
      questionData,
      currentSessionQuestions.length - 1
    );

    fragment.appendChild(questionEl);
  });

  messagesArea.appendChild(fragment);

  if (window.MathJax) {
    MathJax.typesetPromise([messagesArea]);
  }

  messagesArea.scrollTop = messagesArea.scrollHeight;
}

function createQuestionElement(qData, index) {
  const questionEl = document.createElement('div');
  questionEl.className = 'message ai-question-item';
  questionEl.dataset.sessionQuestionIndex = index;

  questionEl.innerHTML = `
    <div class="question-meta-ai">${qData.parsedMeta}</div>
    <div class="question-text-ai">${(qData.parsedBody || '').replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>
    ${qData.parsedAnswer ? (() => {
  const safeAns = (qData.parsedAnswer || '').replace(/</g, "&lt;").replace(/>/g, "&gt;");

  if (qData.parsedMeta && qData.parsedMeta.includes('[Descriptive]')) {
    const answerOnly = safeAns.replace(/^Answer:\s*/i, '').trim();
    return `<div class="temp-answer answer-box" style="display:block; margin-top:8px;"><b>Answer:</b><br>${answerOnly}</div>`;
  }

  return `<div class="temp-answer answer-box" style="display:block; margin-top:8px;"><b>${safeAns}</b></div>`;
})() : ''}
    ${qData.explanation ? `<div class="temp-answer" style="display:block; margin-top:8px;"><b>Explanation:</b> ${(qData.explanation || '').replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>` : ''}
    <div class="question-actions">
      <button class="q-action-btn" title="Options"><i class="fas fa-ellipsis-v"></i></button>
    </div>
  `;

  const actionButton = questionEl.querySelector('.q-action-btn');

  actionButton.addEventListener('click', (e) => {
    e.stopPropagation();

    const existingMenu = document.querySelector('.actions-menu');
    if (existingMenu) existingMenu.remove();

    const menu = document.createElement('div');
    menu.className = 'actions-menu';
    menu.innerHTML = `
      <button class="menu-show-answer-btn">Show Answer</button>
      <button class="menu-edit-btn">Edit</button>
      <button class="menu-delete-btn">Delete</button>
    `;

    const isAnswerShowing = questionEl.querySelector('.temp-answer');
    if (isAnswerShowing) {
      const buttonInMenu = menu.querySelector('.menu-show-answer-btn');
      buttonInMenu.textContent = 'Hide Answer';
    }

    questionEl.appendChild(menu);

    menu.querySelector('.menu-show-answer-btn').onclick = async (event) => {
      event.stopPropagation();
      try {
        const q = currentSessionQuestions[index];
        const prompt = buildChatGptPromptFromQuestion(q, lastSessionParams || {});
        await openInChatGptWithPrefill(prompt);
      } catch (err) {
        __qb_toast('Could not open ChatGPT.');
        console.error(err);
      }
      menu.remove();
    };

    menu.querySelector('.menu-edit-btn').onclick = () => {
      showEditPopupForQuestion(index);
      menu.remove();
    };

    menu.querySelector('.menu-delete-btn').onclick = () => {
      if (confirm('Are you sure you want to delete this question?')) {
        currentSessionQuestions.splice(index, 1);
        rerenderAllQuestions();
      }
      menu.remove();
    };
  });

  return questionEl;
}

function showEditPopupForParagraph(index) {
  const qData = currentSessionQuestions[index];
  if (!qData) return;

  document.querySelectorAll('.edit-popup').forEach(p => p.remove());

  const popup = document.createElement('div');
  popup.className = 'edit-popup';

  popup.innerHTML = `
    <h3>Edit Paragraph-Based MCQ Set</h3>

    <label>Complete Passage Set:</label>
    <textarea id="edit-paragraph-set-text" rows="18"></textarea>

    <div class="popup-buttons">
      <button id="edit-cancel">Cancel</button>
      <button id="edit-save">Save</button>
    </div>
  `;

  document.body.appendChild(popup);

  const textarea = popup.querySelector('#edit-paragraph-set-text');
  textarea.value = qData.fullText || __qbBuildParagraphFullText(qData);

  popup.querySelector('#edit-cancel').onclick = () => popup.remove();

  popup.querySelector('#edit-save').onclick = () => {
    const updatedText = textarea.value.trim();

    const params = {
      ...(lastSessionParams || {}),
      questionType: 'Paragraph-Based MCQ (Single Correct)'
    };

    const parsed = parseFinalSetIntoQuestions(updatedText, params);

    if (
      !parsed.length ||
      !parsed[0].passage ||
      !Array.isArray(parsed[0].mcqs) ||
      parsed[0].mcqs.length < 2
    ) {
      alert('Keep one Passage and at least two Sub-question blocks in the required format.');
      return;
    }

    currentSessionQuestions[index] = parsed[0];
    sessionStorage.setItem('currentSessionQuestions', JSON.stringify(currentSessionQuestions));

    popup.remove();
    rerenderAllQuestions();
  };
}

function rerenderAllQuestions() {
  const messagesArea = document.getElementById('chat-messages-area');
  messagesArea.querySelectorAll('.ai-question-item').forEach(item => item.remove());

  const fragment = document.createDocumentFragment();

  currentSessionQuestions.forEach((q, i) => {
       // For paragraph-based passage sets, use the grouped renderer
    if (__qbIsParagraphMeta(q.parsedMeta) || __qbIsParagraphQuestionType(q.type)) {
      // Renumber meta
      const metaPartsMatch = q.parsedMeta.match(/Q\s*\d+:\s*(.*)/i);
      const details = metaPartsMatch ? metaPartsMatch[1] : '';
      q.parsedMeta = `Q${i + 1}: ${details}`;

      // Build element (copy from parseAndDisplayAiQuestions)
      const blockEl = document.createElement('div');
      blockEl.className = 'message ai-question-item';
      blockEl.dataset.sessionQuestionIndex = i;

                 // Build paragraph sub-question HTMLs with compact visible Answer and Explanation in Preview
      const mcqHtml = (Array.isArray(q.mcqs) ? q.mcqs : []).map((mcq, k) => {
        const cleanBody = String(mcq.body || '')
          .replace(/^Q\d+:\s*/i, '')
          .replace(/\n?\s*Ans\s*:[\s\S]*$/i, '')
          .trim();

        const safeBody = __fixLatex(
          cleanBody
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
        );

        const rawAnswer = String(
          mcq.parsedAnswer ||
          mcq.answer ||
          mcq.finalAnswer ||
          ''
        ).trim();

        const answerOnly = rawAnswer
          .replace(/^\s*Ans\s*:\s*/i, '')
          .replace(/^\s*Answer\s*:\s*/i, '')
          .trim();

        const explanationOnly = String(mcq.explanation || '')
          .replace(/^\s*Explanation\s*:\s*/i, '')
          .trim();

        const safeAnswer = __fixLatex(
          answerOnly
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
        );

        const safeExplanation = __fixLatex(
          explanationOnly
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
        );

        return `<div class="question-text-ai" style="margin-top:14px;text-align:left;white-space:normal;">
          <div style="margin-bottom:6px;white-space:pre-wrap;"><b>Q${k + 1}.</b> ${safeBody}</div>
          ${safeAnswer ? `<div class="temp-answer answer-box" style="display:block;margin-top:8px;padding:8px 12px;white-space:normal;"><b>Ans:</b> ${safeAnswer}</div>` : ''}
          ${safeExplanation ? `<div class="temp-answer explanation-box" style="display:block;margin-top:8px;padding:8px 12px;white-space:normal;"><b>Explanation:</b><div style="margin-top:4px;white-space:pre-wrap;">${safeExplanation}</div></div>` : ''}
        </div>`;
      }).join('');
      blockEl.innerHTML = `
        <div class="question-meta-ai">${q.parsedMeta}</div>
        <div class="question-text-ai" style="white-space:pre-line; margin-bottom:8px;"><b>Passage:</b> ${__fixLatex(q.passage || '')}</div>
        ${mcqHtml}
        <div class="question-actions">
          <button class="q-action-btn" title="Options"><i class="fas fa-ellipsis-v"></i></button>
        </div>
      `;

      blockEl.querySelector('.q-action-btn').onclick = (e) => {
        e.stopPropagation();

        const existingMenu = document.querySelector('.actions-menu');
        if (existingMenu) existingMenu.remove();

        const menu = document.createElement('div');
        menu.className = 'actions-menu';
               menu.innerHTML = `
          <button class="menu-show-answer-btn">Explain It</button>
          <button class="menu-edit-btn">Edit</button>
          <button class="menu-delete-btn">Delete</button>
        `;

        blockEl.appendChild(menu);

        menu.querySelector('.menu-show-answer-btn').onclick = () => {
                    const q = currentSessionQuestions[i]; // paragraph-based data
          const meta = q.parsedMeta || '';
          const cls  = q.class  || (lastSessionParams && lastSessionParams.class)  || '';
          const subj = q.subject|| (lastSessionParams && lastSessionParams.subject)|| '';
          const chap = q.chapter|| (lastSessionParams && lastSessionParams.chapter)|| '';

          let prompt = `Please solve and explain clearly.\n`;
          const metaLineParts = [
            cls  && `Class: ${cls}`,
            subj && `Subject: ${subj}`,
            chap && `Chapter: ${chap}`,
            meta && meta.replace(/^Q\d+:\s*/, '').trim()
          ].filter(Boolean).join(' · ');
          if (metaLineParts) prompt += metaLineParts + `\n\n`;

          prompt += `Passage:\n${q.passage}\n\n`;

          if (Array.isArray(q.mcqs) && q.mcqs.length) {
            prompt += `Questions:\n`;
            q.mcqs.forEach((mcq, idx) => {
              const cleanBody = (mcq.body || '').replace(/^Q\d+:\s*/i, '').trim();
              prompt += `\nQ${idx + 1}.\n${cleanBody}\n`;
              if (mcq.answer) {
                prompt += `(If you know, the key says: ${mcq.answer})\n`;
              }
            });
            prompt += `\nRespond with answers for each MCQ (e.g., A–D) and brief step-by-step explanations.`;
          } else {
            prompt += `Respond with the final answers and brief explanations.`;
          }

          openInChatGptWithPrefill(prompt);
          menu.remove();
        };

        menu.querySelector('.menu-edit-btn').onclick = () => {
                    showEditPopupForParagraph(i);
          menu.remove();
        };

        menu.querySelector('.menu-delete-btn').onclick = () => {
                   if (confirm('Are you sure you want to delete this paragraph-based passage set?')) {
            currentSessionQuestions.splice(i, 1);
sessionStorage.setItem('currentSessionQuestions', JSON.stringify(currentSessionQuestions));
rerenderAllQuestions();
          }
          menu.remove();
        };
      };

      fragment.appendChild(blockEl);

    } else {
      // Normal question
      const metaPartsMatch = q.parsedMeta.match(/Q\s*\d+:\s*(.*)/i);
      const details = metaPartsMatch ? metaPartsMatch[1] : '';
      q.parsedMeta = `Q${i + 1}: ${details}`;

      const questionEl = createQuestionElement(q, i);
      fragment.appendChild(questionEl);
    }
  });

  messagesArea.appendChild(fragment);
  if (window.MathJax) MathJax.typesetPromise([messagesArea]);
}

function parseMetaLine(metaLine) {
  const text = String(metaLine || '');

  const meta = {
    difficulty: null,
    level: null,
    marks: null,

    type: '',
    category: '',
    modelType: '',
    subjectArea: ''
  };

  const levelMatch =
    text.match(/Level\s*(\d+)/i);

  const marksMatch =
    text.match(/(\d+(?:\.\d+)?)\s*Mark(?:s)?/i);

  const categoryMatch =
    text.match(/\[Category:\s*([^\]]+)\]/i);

  const modelMatch =
    text.match(/\[Model:\s*([^\]]+)\]/i);

  const areaMatch =
    text.match(/\[Area:\s*([^\]]+)\]/i);

  const typeMatch =
    text.match(
      /\[(MCQ \(Single\)|MCQ \(Multiple\)|Assertion and Reason \(MCQ Single\)|Descriptive|Case Based|Map|Fill in the Blanks|Matching Matrix|Matching List|Numerical Value|Paragraph-Based MCQ \(Single Correct\)|Comprehensive)\]/i
    );

  if (levelMatch) {
    meta.level =
      parseInt(levelMatch[1], 10);

    meta.difficulty =
      `Level ${levelMatch[1]}`;
  }

  if (marksMatch) {
    meta.marks =
      parseFloat(marksMatch[1]);
  }

  if (typeMatch) {
    meta.type =
      typeMatch[1].trim();
  }

  if (categoryMatch) {
    meta.category =
      categoryMatch[1].trim();
  }

  if (modelMatch) {
    meta.modelType =
      modelMatch[1].trim();
  }

  if (areaMatch) {
    meta.subjectArea =
      areaMatch[1].trim();
  }

  return meta;
}

async function getNextQuestionNumber(className, subjectName, chapterName) {
  const query = db.collection("questions")
    .where("class", "==", className)
    .where("subject", "==", subjectName)
    .where("chapter", "==", chapterName)
    .orderBy("questionNumber", "desc")
    .limit(1);

  const snapshot = await query.get();
  if (snapshot.empty) return 1;

  const lastQuestion = snapshot.docs[0].data();
  return (lastQuestion.questionNumber || 0) + 1;
}

function getTextSimilarity(a, b) {
  if (!a || !b) return 0; // If either is missing, return 0 similarity

  a = String(a).toLowerCase().replace(/\s+/g, ' ').trim();
  b = String(b).toLowerCase().replace(/\s+/g, ' ').trim();

  const aWords = new Set(a.split(' '));
  const bWords = new Set(b.split(' '));
  const common = [...aWords].filter(w => bWords.has(w));

  return common.length / Math.max(aWords.size, bWords.size);
}

document.addEventListener('click', function (event) {
  document.querySelectorAll('.custom-dropdown.open').forEach(dropdown => {
    if (!dropdown.contains(event.target)) {
      dropdown.classList.remove('open');
    }
  });

  const existingMenu = document.querySelector('.actions-menu');
  if (existingMenu && !existingMenu.contains(event.target) && !event.target.closest('.q-action-btn')) {
    existingMenu.remove();
  }
});

function showEditPopupForQuestion(index) {
  const qData = currentSessionQuestions[index];

  // Remove existing popup if any
  document.querySelectorAll('.edit-popup').forEach(p => p.remove());

  // Prepare default values
  const options = (qData.options && qData.options.length === 4) ? qData.options : ["", "", "", ""];
  const answerVal = qData.parsedAnswer ? qData.parsedAnswer.replace(/^Ans:\s*/i, "") : "";

  // Create popup
  const popup = document.createElement('div');
  popup.className = 'edit-popup';
  popup.innerHTML = `
    <h3>Edit Question</h3>

    <label>Question:</label>
    <textarea id="edit-q-text" rows="2">${qData.question || ''}</textarea>

    <label>Option A:</label>
    <input type="text" id="edit-q-optA" value="${options[0] || ''}">

    <label>Option B:</label>
    <input type="text" id="edit-q-optB" value="${options[1] || ''}">

    <label>Option C:</label>
    <input type="text" id="edit-q-optC" value="${options[2] || ''}">

    <label>Option D:</label>
    <input type="text" id="edit-q-optD" value="${options[3] || ''}">

    <label>Answer (e.g., "A)", or "A), C)" for multiple correct):</label>
    <input type="text" id="edit-q-answer" value="${answerVal}">

    <div class="popup-buttons">
      <button id="edit-cancel">Cancel</button>
      <button id="edit-save">Save</button>
    </div>
  `;
  document.body.appendChild(popup);

  // Cancel button logic
  document.getElementById('edit-cancel').onclick = () => popup.remove();

  // Save button logic
  document.getElementById('edit-save').onclick = () => {
    // Get edited values
    const qText  = document.getElementById('edit-q-text').value.trim();
    const optA   = document.getElementById('edit-q-optA').value.trim();
    const optB   = document.getElementById('edit-q-optB').value.trim();
    const optC   = document.getElementById('edit-q-optC').value.trim();
    const optD   = document.getElementById('edit-q-optD').value.trim();
    const answer = document.getElementById('edit-q-answer').value.trim();

    // Simple validation (optional)
    if (!qText || !optA || !optB || !optC || !optD || !answer) {
      alert("All fields are required.");
      return;
    }

    // Update data
    qData.question = qText;
    qData.options  = [optA, optB, optC, optD];
    qData.parsedBody = [qText, `A) ${optA}`, `B) ${optB}`, `C) ${optC}`, `D) ${optD}`].join('\n');
    qData.parsedAnswer = `Ans: ${answer}`;
        qData.fullText = `${qData.parsedMeta}\n${qData.parsedBody}\n${qData.parsedAnswer}${qData.explanation ? `\nExplanation: ${qData.explanation}` : ''}`;

    // Close popup and re-render
    popup.remove();
    rerenderAllQuestions();
  };
}
