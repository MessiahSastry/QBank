}

.matching-matrix-table {

<body>
    <div id="page-container">

</div>
 <script>
  function formatSubQuestions(text) {
  if (!text) return '';

 let t = String(text)
  .replace(/\r/g, '')
  .replace(/&nbsp;/gi, ' ')
  .replace(/<br\s*\/?>/gi, '\n')
  .replace(/<\/p>/gi, '\n')
  .replace(/<p[^>]*>/gi, '')          // ← remove opening <p> so (A)/(B) are detected
  .replace(/<div[^>]*>/gi, '\n')
  .replace(/<\/div>/gi, '')
  .replace(/<li[^>]*>/gi, '\n')
  .replace(/<\/li>/gi, '')
  .replace(/<ol[^>]*>|<ul[^>]*>|<\/ol>|<\/ul>/gi, '')
  .trim();


    const lines = t.split('\n').map(s=>s.trim()).filter(Boolean);
  const A_RE = /^\s*(?:<[^>]+>\s*)*(?:\(\s*A\s*\)|A[\)\.\:])\s*/i;
  const B_RE = /^\s*(?:<[^>]+>\s*)*(?:\(\s*B\s*\)|B[\)\.\:])\s*/i;
// (kept same tokens; leaving here to confirm you’re matching A) / (A) / A. / A: even if wrapped)


  let aIdx=-1, bIdx=-1;
  for (let i=0;i<lines.length;i++){
    if (aIdx===-1 && A_RE.test(lines[i])) aIdx=i;
    if (aIdx!==-1 && bIdx===-1 && B_RE.test(lines[i])) { bIdx=i; break; }
  }

   if (aIdx!==-1 && bIdx!==-1 && bIdx>aIdx){

    const stripLead = s => s.replace(A_RE,'').replace(B_RE,'').trim();
    const dropWrappedAB = s => s.replace(/\n\s*(?:\(\s*[AB]\s*\)|[AB][\)\.\:])\s+/gi, '\n');

    const aTxt = dropWrappedAB([lines[aIdx].replace(A_RE,''), ...lines.slice(aIdx+1,bIdx)].join('\n'));
    const bTxt = dropWrappedAB([lines[bIdx].replace(B_RE,''), ...lines.slice(bIdx+1)].join('\n'));

       return `
      <div class="pair-a"><span class="label">(A)</span><span class="txt">${aTxt}</span></div>
      <div class="pair-or">(OR)</div><div class="ab-gap"></div>
      <div class="pair-b"><span class="label">(B)</span><span class="txt">${bTxt}</span></div>
    `;
  }

  // Fallback: (A)…(B)… present inside a single line/block
  const abMatch = /\bOR\b/i.test(t) ? null : t.match(/\(\s*A\s*\)\s*([\s\S]*?)\s*\(\s*B\s*\)\s*([\s\S]*)$/i);
if (abMatch) {
  const aTxt = abMatch[1].trim();
  const bTxt = abMatch[2].trim();
    return `
      <div class="pair-a"><span class="label">(A)</span><span class="txt">${aTxt}</span></div>
      <div class="pair-or">(OR)</div><div class="ab-gap"></div>
      <div class="pair-b"><span class="label">(B)</span><span class="txt">${bTxt}</span></div>
    `;
  }

  // 🔁 Fallback: A and B inside a single block (no newlines detected)
  const inline = /\bOR\b/i.test(t) ? null : t.match(/\(\s*A\s*\)\s*([\s\S]*?)\s*\(\s*B\s*\)\s*([\s\S]*)$/i);
if (inline){
    const aTxt = inline[1].trim();
    const bTxt = inline[2].trim();
    return `
      <div class="pair-a"><span class="label">(A)</span><span class="txt">${aTxt}</span></div>
      <div class="pair-or">(OR)</div><div class="ab-gap"></div>
      <div class="pair-b"><span class="label">(B)</span><span class="txt">${bTxt}</span></div>
    `;
  }

   // Default: wrap each remaining line
  return lines.map(line => `<div>${line}</div>`).join('');
} // <-- end of formatSubQuestions

// --- helper: force "(OR)" between (A) and (B) ---
function forceOrAB(html){
  if (!html) return '';
  // already has (OR) or explicit node
  if (/\(\s*OR\s*\)/i.test(html) || /\bclass\s*=\s*["']pair-or["']/.test(html)) return html;

  // pair markup present but missing (OR)
  if (/\bpair-a\b/.test(html) && /\bpair-b\b/.test(html)) {
    return html.replace(
      /(<\/div>\s*)(<div[^>]*class=["']pair-b\b)/i,
      '$1<div class="pair-or">(OR)</div><div class="ab-gap"></div>$2'
    );
  }

  // raw (A) ... (B) in one block
  const m = html.match(/\(\s*A\s*\)\s*([\s\S]*?)\s*\(\s*B\s*\)\s*([\s\S]*)$/i);
  if (m) {
    const a = m[1].trim(), b = m[2].trim();
    return `
      <div class="pair-a"><span class="label">(A)</span><span class="txt">${a}</span></div>
      <div class="pair-or">(OR)</div><div class="ab-gap"></div>
      <div class="pair-b"><span class="label">(B)</span><span class="txt">${b}</span></div>
    `;
  }
  return html;
}

// shim so older calls keep working
function ensureOrAB(html){
  return forceOrAB(html);
}

  function autoLatexAll(str) {
  if (!str) return '';

  // normalize legacy markers used by older content
  str = str.replace(/\$begin\{pmatrix\}/g, '\\begin{pmatrix}')
           .replace(/\$end\{pmatrix\}/g, '\\end{pmatrix}')
           .replace(/\$pmatrix\$/g, '')
           .replace(/Send/g, '');

  // If author already delimited math, just normalize $...$ → \( ... \)
  if (/\$[^$]+\$|\\\([^]*?\\\)|\\\[[\s\S]*?\\\]/.test(str)) {
    return str.replace(/\$([^\$]+)\$/g, '\\($1\\)');
  }

  // Only auto-wrap SHORT symbolic fragments, never full sentences
  const words = str.trim().split(/\s+/).length;
  const hasMathTokens = /(\^|_|\\frac|\\sqrt|\\binom|\\sum|\\int|\\lim|\\log|\\sin|\\cos|\\tan|[≤≥≈≠∞√])/.test(str);
  const isDimension = /\[[^\]]+\]/.test(str); // e.g. [M^0 L^2 T^-2]
  const looksAlgebra = /\b[A-Za-z]\s*\^\s*\d\b|[A-Za-z]\d/.test(str) || /\b[xyz]\s*=/.test(str);

  if ((isDimension || hasMathTokens || looksAlgebra) && words <= 6) {
    return `\\(${str}\\)`;
  }
  return str;
}

function removeMetaPrefix(str) {
  return str
    .replace(/^Q\d+:\s*Level\s*\d+,\s*\d+\s*Mark[s]?\s*/i, '')
    .replace(/^Q\d+:\s*Level\s*\d+,\s*/i, '')
    .replace(/^Q\d+:\s*\d+\s*Mark[s]?\s*/i, '')
    .replace(/^Q\d+:\s*/i, '');
}
   function removeMetaTags(str) {
  // Removes [Descriptive], [MCQ], [Multiple], etc. at the beginning or after numbers
  return (str || '').replace(/^\s*\[[^\]]+\]\s*/i, '').replace(/^\d+\.\s*\[[^\]]+\]\s*/i, '');
}
   function removeMetaLines(str) {
  // Remove any line that starts with Qxx: Level, Marks, [Type], etc.
  return str.replace(/Q\d{1,3}.*\n?/g, '');
}
   function formatDate(dateStr) {
    if (!dateStr) return '';
    const [year, month, day] = dateStr.split('-');
    return `${day}-${month}-${year}`;
}
   function removeDuplicateLines(str) {
  return str
    .split('\n')
    .filter((line, idx, arr) => 
      line.trim() && arr.findIndex(l => l.trim() === line.trim()) === idx
    )
    .join('\n');
}
function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function __epGetQuestionType(q = {}) {
  return String(q.mcqType || q.questionType || q.type || '').trim().toLowerCase();
}

function __epIsParagraphBasedQuestion(q = {}) {
  const type = __epGetQuestionType(q);
  const rawText = String(q.question || q.text || q.body || q.html || '');

  return (
    type === 'paragraph-based mcq (single correct)' ||
    type === 'comprehensive' ||
    type.includes('paragraph') ||
    type.includes('comprehension') ||
    (Array.isArray(q.mcqs) && q.mcqs.length > 0 && String(q.passage || '').trim()) ||
    (
      /read\s+the\s+following\s+passage/i.test(rawText) &&
      /\bpassage\s*:/i.test(rawText)
    )
  );
}

function __epIsMatchingMatrixQuestion(q = {}) {
  const type = __epGetQuestionType(q);
  const rawText = String(
    q.question ||
    q.text ||
    q.body ||
    q.html ||
    q.renderedHTML ||
    q.finalHTML ||
    q.formattedHTML ||
    ''
  );

  return (
    (type.includes('matching') && type.includes('matrix')) ||
    (/Column\s*I/i.test(rawText) && /Column\s*II/i.test(rawText))
  );
}

function __epParseOptionRegion(regionText = '') {
  const text = String(regionText || '').replace(/\s+/g, ' ').trim();
  if (!text) return [];

  const optionRegex = /(?:^|\s)([A-D])[\)\.:]\s*/gi;
  const matches = Array.from(text.matchAll(optionRegex));

  if (!matches.length) return [];

  const options = [];

  matches.forEach((match, index) => {
    const start = match.index + match[0].length;
    const end = index + 1 < matches.length ? matches[index + 1].index : text.length;

    options.push(
      text.slice(start, end)
        .replace(/\s+/g, ' ')
        .trim()
    );
  });

  return options.slice(0, 4);
}

function __epParseParagraphQuestionFromText(q = {}) {
  const raw = __epGetPlainQuestionText(q)
    .replace(/\r/g, '')
    .replace(/\s*\bAns(?:wer)?\s*:\s*[\s\S]*$/i, '')
    .trim();

  if (!raw) {
    return {
      passage: String(q.passage || '').trim(),
      mcqs: Array.isArray(q.mcqs) ? q.mcqs : []
    };
  }

  let cleaned = raw
    .replace(/Read\s+the\s+following\s+passage\s+and\s+answer\s+the\s+questions\s*:?\s*/i, '')
    .trim();

  const passageMatch = cleaned.match(/\bPassage\s*:\s*/i);
  let afterPassage = cleaned;

  if (passageMatch) {
    afterPassage = cleaned.slice(passageMatch.index + passageMatch[0].length).trim();
  }

  const subRegex = /\(\s*(\d+)\s*\)\s*/g;
  const subMatches = Array.from(afterPassage.matchAll(subRegex));

  if (!subMatches.length) {
    return {
      passage: String(q.passage || afterPassage || '').trim(),
      mcqs: Array.isArray(q.mcqs) ? q.mcqs : []
    };
  }

  const firstSubStart = subMatches[0].index;
  const passage = afterPassage.slice(0, firstSubStart).trim();

  const subArea = afterPassage.slice(firstSubStart).trim();
  const subMarkers = Array.from(subArea.matchAll(subRegex));

  const mcqs = subMarkers.map((marker, index) => {
    const qStart = marker.index + marker[0].length;
    const nextQStart = index + 1 < subMarkers.length ? subMarkers[index + 1].index : subArea.length;
    const block = subArea.slice(qStart, nextQStart).trim();

   const firstOption = block.search(/\bA[\)\.:]\s+/i);

    let questionText = block;
    let options = [];

    if (firstOption !== -1) {
      questionText = block.slice(0, firstOption).trim();
      options = __epParseOptionRegion(block.slice(firstOption));
    }

    return {
      question: questionText,
      text: questionText,
      body: questionText,
      options,
      answer: '',
      parsedAnswer: '',
      explanation: ''
    };
  });

  const emptyOptionCount = mcqs.filter(mcq => !Array.isArray(mcq.options) || mcq.options.length !== 4).length;

  if (emptyOptionCount > 0) {
    const firstOptionInAll = subArea.search(/\bA[\)\.:]\s+/i);

    if (firstOptionInAll !== -1) {
      const optionsText = subArea.slice(firstOptionInAll);
      const allOptions = [];

      const optionRegex = /([A-D])[\)\.:\-]\s*/gi;
      const matches = Array.from(optionsText.matchAll(optionRegex));

      matches.forEach((match, index) => {
        const start = match.index + match[0].length;
        const end = index + 1 < matches.length ? matches[index + 1].index : optionsText.length;

        allOptions.push(
          optionsText.slice(start, end)
            .replace(/\s+/g, ' ')
            .trim()
        );
      });

      if (allOptions.length >= mcqs.length * 4) {
        mcqs.forEach((mcq, index) => {
          mcq.options = allOptions.slice(index * 4, index * 4 + 4);
        });

        const questionOnlyPart = subArea.slice(0, firstOptionInAll).trim();
        const questionMarkers = Array.from(questionOnlyPart.matchAll(subRegex));

        if (questionMarkers.length === mcqs.length) {
          questionMarkers.forEach((marker, index) => {
            const qStart = marker.index + marker[0].length;
            const nextQStart = index + 1 < questionMarkers.length ? questionMarkers[index + 1].index : questionOnlyPart.length;
            const cleanQ = questionOnlyPart.slice(qStart, nextQStart).trim();

            if (cleanQ) {
              mcqs[index].question = cleanQ;
              mcqs[index].text = cleanQ;
              mcqs[index].body = cleanQ;
            }
          });
        }
      }
    }
  }

  return {
    passage,
    mcqs
  };
}

function __epNormalizeParagraphQuestion(q = {}) {
  const existingMcqs = Array.isArray(q.mcqs) ? q.mcqs : [];
  const existingPassage = String(q.passage || '').trim();

  if (existingPassage && existingMcqs.length) {
    return q;
  }

  const parsed = __epParseParagraphQuestionFromText(q);

  return {
    ...q,
    passage: existingPassage || parsed.passage || '',
    mcqs: existingMcqs.length ? existingMcqs : parsed.mcqs,
    type: 'Paragraph-Based MCQ (Single Correct)',
    mcqType: 'Paragraph-Based MCQ (Single Correct)'
  };
}

function __epGetParagraphMcqs(q = {}) {
  const normalized = __epNormalizeParagraphQuestion(q);
  return Array.isArray(normalized.mcqs) ? normalized.mcqs : [];
}

function __epGetParagraphSubQuestionText(mcq = {}) {
  return String(
    mcq.question ||
    mcq.text ||
    String(mcq.body || '').split('\n')[0] ||
    ''
  ).trim();
}

function __epCleanOption(option) {
  return String(option || '')
    // Remove only real option labels like A), A., A:
    // Do NOT remove A- because Matching Matrix answers use A-P, B-Q, C-R, D-S
    .replace(/^[A-D][).:]\s*/i, '')
    .trim();
}

function __epSafeText(value) {
  return autoLatexAll(escapeHtml(String(value || '')))
    .replace(/\r/g, '')
    .replace(/\n/g, '<br>');
}

function __epBuildOptionLines(options = []) {
  return (Array.isArray(options) ? options.slice(0, 4) : []).map((option, index) =>
    `${String.fromCharCode(65 + index)}) ${__epCleanOption(option)}`
  );
}

function __epGetPlainQuestionText(q = {}) {
  return String(q.question || q.text || q.body || '')
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/p\s*>/gi, '\n')
    .replace(/<p[^>]*>/gi, '')
    .replace(/<\/div\s*>/gi, '\n')
    .replace(/<div[^>]*>/gi, '')
    .replace(/<[^>]+>/g, ' ')
    .replace(/&nbsp;/gi, ' ')
    .replace(/\r/g, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

function __epParseMatchingMatrix(q = {}) {
  const cleaned = __epGetPlainQuestionText(q)
    .replace(/\s*\bOptions\s*:?\s*[\s\S]*$/i, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();

  const lines = cleaned
    .split(/\n+/)
    .map(line => line.trim())
    .filter(Boolean);

  const headingIndex = lines.findIndex(line =>
    /Column\s*I/i.test(line) && /Column\s*II/i.test(line)
  );

  const introLines = headingIndex > 0
    ? lines.slice(0, headingIndex)
    : [];

    let matrixLines = headingIndex >= 0
    ? lines.slice(headingIndex + 1)
    : lines.slice();

  // Fix: sometimes preview receives "Column I Column II A) ... P) ..." in one single line
  if (headingIndex >= 0) {
    const headingLine = lines[headingIndex] || '';
    const afterHeading = headingLine
      .replace(/^\s*Column\s*I\s+Column\s*II\s*/i, '')
      .trim();

    if (afterHeading && /[A-D][\)\.:\-]\s*/i.test(afterHeading)) {
      matrixLines.unshift(afterHeading);
    }
  }

  const rowPattern =
    /^\s*([A-D])[\)\.:\-]\s*(.*?)\s{2,}([P-S])[\)\.:\-]\s*(.*?)\s*$/i;

  const rowPatternLoose =
    /^\s*([A-D])[\)\.:\-]\s*(.*?)\s+([P-S])[\)\.:\-]\s*(.*?)\s*$/i;

  let rows = matrixLines
    .map(line => {
      const match = line.match(rowPattern) || line.match(rowPatternLoose);

      return match
        ? {
            leftLabel: match[1].toUpperCase(),
            leftText: match[2].trim(),
            rightLabel: match[3].toUpperCase(),
            rightText: match[4].trim()
          }
        : null;
    })
    .filter(Boolean);

  if (!rows.length) {
    const oneLine = matrixLines
      .join(' ')
      .replace(/Column\s*I\s+Column\s*II/gi, '')
      .replace(/\s+/g, ' ')
      .trim();

    const foundRows = Array.from(
      oneLine.matchAll(
        /([A-D])[\)\.:\-]\s*([\s\S]*?)\s+([P-S])[\)\.:\-]\s*([\s\S]*?)(?=\s+[A-D][\)\.:\-]\s+|$)/gi
      )
    );

    rows = foundRows.map(match => ({
      leftLabel: match[1].toUpperCase(),
      leftText: match[2].trim(),
      rightLabel: match[3].toUpperCase(),
      rightText: match[4].trim()
    }));
  }

  return {
    intro: introLines.join('\n').trim(),
    rows,
    raw: cleaned
  };
}

function waitForPreviewUserOnce(timeoutMs = 2500) {
  return new Promise(resolve => {
    if (!previewAuth) {
      resolve(null);
      return;
    }

    if (previewAuth.currentUser) {
      resolve(previewAuth.currentUser);
      return;
    }

    let done = false;
    const timer = setTimeout(() => {
      if (done) return;
      done = true;
      try { unsub(); } catch (e) {}
      resolve(previewAuth.currentUser || null);
    }, timeoutMs);

    const unsub = previewAuth.onAuthStateChanged(user => {
      if (done) return;
      if (user) {
        done = true;
        clearTimeout(timer);
        try { unsub(); } catch (e) {}
        resolve(user);
      }
    }, () => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      try { unsub(); } catch (e) {}
      resolve(null);
    });
  });
}

async function ensurePreviewSignedIn() {
  if (!previewAuth) {
    throw new Error('Firebase Auth script not loaded');
  }

  const user = previewAuth.currentUser || await waitForPreviewUserOnce(2500);

  if (!user) {
    throw new Error('Admin login required to generate QR');
  }

  return user;
}

function buildPublicAnswerKeyUrl(paperId) {
  const url = new URL(window.location.origin + window.location.pathname);
  url.search = '';
  url.hash = '';
  url.searchParams.set('mode', 'answerkey');
  url.searchParams.set('paperId', paperId);
  return url.toString();
}

async function ensureAnswerKeyPaperId(examData) {
  const user = await ensurePreviewSignedIn();

  if (!user) {
    throw new Error('Anonymous sign-in failed');
  }

  const schoolNames = Array.isArray(examData.schoolNames) && examData.schoolNames.length
    ? examData.schoolNames
    : [examData.schoolName || 'SciMentra'];

  let idx = parseInt(examData.currentSchoolIndex, 10);
  if (isNaN(idx)) idx = 0;
  idx = Math.max(0, Math.min(idx, schoolNames.length - 1));

  const currentSchoolName = schoolNames[idx] || examData.schoolName || 'SciMentra';
  const schoolKey = sanitizeFileName(currentSchoolName);

  if (!examData.answerKeyPaperIds || typeof examData.answerKeyPaperIds !== 'object') {
    examData.answerKeyPaperIds = {};
  }

  const existingId = examData.answerKeyPaperIds[schoolKey];
  const docRef = existingId
    ? previewDb.collection('publicAnswerKeys').doc(existingId)
    : previewDb.collection('publicAnswerKeys').doc();

  examData.currentSchoolIndex = idx;
  examData.schoolName = currentSchoolName;
  examData.answerKeyPaperIds[schoolKey] = docRef.id;
  examData.answerKeyPaperId = docRef.id;

  sessionStorage.setItem('finalExamData', JSON.stringify(examData));

  await docRef.set({
    ...buildAnswerKeyDoc(examData),
    ownerUid: user.uid
  }, { merge: true });

  return docRef.id;
}

function cleanAnswerKeyBlock(str) {
  return String(str || '')
    .replace(/\r/g, '')
    .replace(/&nbsp;/gi, ' ')
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/p>/gi, '\n')
    .replace(/<p[^>]*>/gi, '')
    .replace(/<div[^>]*>/gi, '\n')
    .replace(/<\/div>/gi, '')
    .replace(/<li[^>]*>/gi, '\n')
    .replace(/<\/li>/gi, '')
    .replace(/<ol[^>]*>|<ul[^>]*>|<\/ol>|<\/ul>/gi, '')
    .trim();
}

function getAnswerKeySectionInstruction(section) {
  if (section.instructions) return section.instructions;

  if (section.type === 'all') {
    return `Answer all ${section.numQuestions || 0} questions`;
  }
  if (section.type === 'any') {
    return `Answer any ${section.attemptAny || section.numQuestions || 0} questions`;
  }
  if (section.type === 'internal') {
    return `Answer all ${section.numPairs || 0} pairs`;
  }
  return '';

function getAnswerKeySectionMarks(section) {
  if (section.type === 'all') {
    return `${section.numQuestions || 0} x ${section.marksPerQuestion || 0} = ${(section.numQuestions || 0) * (section.marksPerQuestion || 0)} Marks`;
  }
  if (section.type === 'any') {
    const n = section.attemptAny || section.numQuestions || 0;
    return `${n} x ${section.marksPerQuestion || 0} = ${n * (section.marksPerQuestion || 0)} Marks`;
  }
  if (section.type === 'internal') {
    return `${section.numPairs || 0} x ${section.marksPerQuestion || 0} = ${(section.numPairs || 0) * (section.marksPerQuestion || 0)} Marks`;
  }
  return '';
}

function formatAnswerKeyQuestionHtml(q) {
  let raw = q.html || q.question || q.text || '';

  if (/\bpair-a\b/.test(raw) && /\bpair-b\b/.test(raw)) {
    return forceOrAB(raw);
  }

  raw = removeMetaLines(removeMetaTags(removeMetaPrefix(String(raw))))
    .replace(/<img[^>]*>/gi, '')
    .trim();

  if (Array.isArray(q.options) && q.options.length) {
    raw = raw.replace(/\s*A\).*/gis, '').trim();
  }

  raw = raw
    .replace(/<\/p>/gi, '<br>')
    .replace(/<p[^>]*>/gi, '')
    .replace(/<div[^>]*>/gi, '<br>')
    .replace(/<\/div>/gi, '')
    .replace(/\n/g, '<br>');

  return autoLatexAll(raw);
}

function getAnswerKeyOptionLines(q) {
  if (!Array.isArray(q.options) || !q.options.length) return [];
  return q.options.map((opt, idx) => {
    const clean = stripLeadingLabel(String(opt || '').trim());
    return `${String.fromCharCode(65 + idx)}) ${autoLatexAll(clean)}`;
  });
}

function formatAnswerKeyAnswerHtml(answer, subjectName = '') {
  const text = cleanAnswerKeyBlock(answer)
    .replace(/^(?:final\s*)?answer\s*[:.-]?\s*/i, '')
    .trim();

  if (!text) return '';

  const isMathSubject = /\b(math|maths|mathematics)\b/i.test(String(subjectName || ''));

  const lines = text
    .split('\n')
    .map(s => s.trim())
    .filter(Boolean)
    .map(line => line.replace(/^Step\s*\d+\s*[:.-]?\s*/i, '').trim())
    .filter(Boolean);

  if (!lines.length) return '';

  const merged = lines.join(' ').replace(/\s+/g, ' ').trim();
  const numberedPoints = merged.match(/\d+[\.\)]\s*[\s\S]*?(?=(?:\s+\d+[\.\)]\s*)|$)/g);

  // Point-wise answers -> below "Answer:"
  if (numberedPoints && numberedPoints.length >= 2) {
    return `
      <div class="answer-point-list">
        ${numberedPoints.map(p => p.trim()).map(point => {
          const m = point.match(/^(\d+[\.\)])\s*(.*)$/);
          if (!m) {
            return `<div style="margin-bottom:4px;">${escapeHtml(point)}</div>`;
          }
          return `
            <div style="display:flex; align-items:flex-start; margin-bottom:4px;">
              <span style="display:inline-block; min-width:22px; font-weight:400;">${escapeHtml(m[1])}</span>
              <span style="display:block; flex:1;">${escapeHtml(m[2])}</span>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  // Math stepwise answers -> below "Answer:"
  if (isMathSubject && lines.length >= 2) {
    return `
      <div class="answer-block-lines">
        ${lines.map(line => `<div style="margin-bottom:2px;">${autoLatexAll(line)}</div>`).join('')}
      </div>
    `;
  }

  // All other normal answers -> same line as "Answer:"
  return autoLatexAll(lines.join(' '));
}
function formatAnswerKeyExplanationHtml(explanation, answerValue, subjectName = '') {
  const text = cleanAnswerKeyBlock(explanation);
  if (!text) return '';

  const isMathSubject = /\b(math|maths|mathematics)\b/i.test(String(subjectName || ''));

  const lines = text
    .split('\n')
    .map(s => s.trim())
    .filter(Boolean)
    .map(line => line
      .replace(/^Explanation\s*[:.-]?\s*/i, '')
      .replace(/^Step\s*\d+\s*[:.-]?\s*/i, '')
      .trim()
    )
    .filter(Boolean)
    .filter(line => !/^(?:final\s*)?answer\s*[:.-]/i.test(line));

  if (!lines.length) return '';

  // Math: keep existing line-by-line style, but without "Step 1", "Step 2", etc.
  if (isMathSubject) {
    return lines.map(line => `<div style="margin-bottom:2px;">${autoLatexAll(line)}</div>`).join('');
  }

  // Other subjects: if explanation has numbered points like 1. 2. 3., print point-wise
  const merged = lines.join(' ').replace(/\s+/g, ' ').trim();
  const pointMatches = merged.match(/(?:^|\s)(\d+[\.\)]\s*.*?)(?=\s+\d+[\.\)]\s*|$)/g);

 if (pointMatches && pointMatches.length >= 2) {
  return pointMatches
    .map(p => p.trim())
    .map(point => {
      const m = point.match(/^(\d+[\.\)])\s*(.*)$/);
      if (!m) {
        return `<div style="margin-bottom:4px;">${escapeHtml(point)}</div>`;
      }
      return `
        <div style="display:flex; align-items:flex-start; margin-bottom:4px;">

          <span style="display:block; flex:1;">${escapeHtml(m[2])}</span>
        </div>
      `;
    })
    .join('');
}
  // Fallback: preserve existing line breaks
  return lines.map(line => `<div style="margin-bottom:2px;">${escapeHtml(line)}</div>`).join('');
}

function formatExamTime(mins) {
  mins = parseInt(mins);
  if (isNaN(mins) || mins <= 0) return '';

  const hours = Math.floor(mins / 60);
  const remainder = mins % 60;
  let fraction = '';

  if (remainder === 15) fraction = '¼';
  else if (remainder === 30) fraction = '½';
  else if (remainder === 45) fraction = '¾';

  let result = '';
  if (hours === 0) {
    result = fraction ? `${fraction} hour` : `${mins} min`;
  } else {
    result = fraction ? `${hours}${fraction} hours` : `${hours} hour${hours > 1 ? 's' : ''}`;
  }

  return result;
}

function renderOptionsLayout(optionLines, hostNode) {
  if (!Array.isArray(optionLines) || optionLines.length === 0) {
    return '';
  }

  const rendered = optionLines.map(option =>
    formatPreviewOption(String(option || '').trim())
      .replace(/\n/g, '<br>')
  );

  function buildLayout(mode) {
    return `
      <div class="option-layout option-layout-${mode}" data-option-layout="${mode}">
        ${rendered.map(html => `
          <div class="option-item">${html}</div>
        `).join('')}
      </div>
    `;
  }

  /* Any number other than four must remain one option per line */
  if (optionLines.length !== 4) {
    return buildLayout(1);
  }

  /*
    Do not measure before the options block has been inserted into the page.
    It will be rendered again by doTypeset() with the real hostNode.
  */
  if (!hostNode || !hostNode.isConnected) {
    return buildLayout(1);
  }

  const hostStyle = window.getComputedStyle(hostNode);
  const hostRect = hostNode.getBoundingClientRect();

  const paddingLeft = parseFloat(hostStyle.paddingLeft) || 0;
  const paddingRight = parseFloat(hostStyle.paddingRight) || 0;

  const availableWidth = Math.floor(
    hostRect.width - paddingLeft - paddingRight - 4
  );

  if (availableWidth <= 0) {
    return buildLayout(1);
  }

  function measureOption(html) {
    const probe = document.createElement('span');

    probe.style.position = 'fixed';
    probe.style.left = '-100000px';
    probe.style.top = '0';
    probe.style.visibility = 'hidden';
    probe.style.display = 'inline-block';
    probe.style.width = 'max-content';
    probe.style.maxWidth = 'none';
    probe.style.whiteSpace = 'nowrap';
    probe.style.margin = '0';
    probe.style.padding = '0';
    probe.style.border = '0';

    probe.style.fontFamily =
      hostStyle.fontFamily || "'Times New Roman', Times, serif";

    probe.style.fontSize =
      hostStyle.fontSize || '16px';

    probe.style.fontWeight =
      hostStyle.fontWeight || '400';

    probe.style.fontStyle =
      hostStyle.fontStyle || 'normal';

    probe.style.letterSpacing =
      hostStyle.letterSpacing || 'normal';

    probe.style.lineHeight =
      hostStyle.lineHeight || 'normal';

    probe.innerHTML = html;

    document.body.appendChild(probe);

    const measuredWidth = Math.ceil(
      probe.getBoundingClientRect().width
    );

    probe.remove();

    return measuredWidth;
  }

  const optionWidths = rendered.map(measureOption);

  /* 1. Try all four options in one row */
  const fourColumnGap = 14;
  const requiredFourWidth =
    optionWidths.reduce((total, width) => total + width, 0) +
    fourColumnGap * 3;

  if (requiredFourWidth <= availableWidth) {
    return buildLayout(4);
  }

  /* 2. Try two options per row */
  const twoColumnGap = 18;
  const eachColumnWidth =
    Math.floor((availableWidth - twoColumnGap) / 2);

  const fitsTwoColumns = optionWidths.every(
    width => width <= eachColumnWidth - 3
  );

  if (fitsTwoColumns) {
    return buildLayout(2);
  }

  /* 3. Otherwise use four separate lines */
  return buildLayout(1);
}


/*
  Final check after MathJax has rendered.
  If MathJax makes an option wider, downgrade:
  4 columns → 2 columns → 1 column.
*/
function repairOptionLayouts(root = document) {
  const scope = root || document;

  scope.querySelectorAll('.option-layout').forEach(layout => {
    const items = Array.from(
      layout.querySelectorAll('.option-item')
    );

    function changeMode(mode) {
      layout.classList.remove(
        'option-layout-4',
        'option-layout-2',
        'option-layout-1'
      );

      layout.classList.add(`option-layout-${mode}`);
      layout.setAttribute('data-option-layout', String(mode));
    }

    function layoutCrossesRightMargin() {
      const layoutRect = layout.getBoundingClientRect();

      return (
        layout.scrollWidth > layout.clientWidth + 1 ||
        items.some(item => {
          const itemRect = item.getBoundingClientRect();

          return itemRect.right > layoutRect.right + 1;
        })
      );
    }

    function twoColumnItemOverflows() {
      return items.some(item =>
        item.scrollWidth > item.clientWidth + 1
      );
    }

    if (
      layout.classList.contains('option-layout-4') &&
      layoutCrossesRightMargin()
    ) {
      changeMode(2);
    }

    if (
      layout.classList.contains('option-layout-2') &&
      (
        layoutCrossesRightMargin() ||
        twoColumnItemOverflows()
      )
    ) {
      changeMode(1);
    }
  });
}

function formatQuestionText(text) {
    text = text.replace(/^\d+\.\s*/, '');
    text = text.replace(/^.*?,\s*\d+\s+Marks?\s*/i, '');
    text = text.replace(/^Q\d+:[^A-Za-z]*?Marks?\s*/i, '');
    text = text.replace(/^Q\d+:[^A-Za-z0-9]*\s*/, '');
    text = text.replace(/\s*Ans:\s*[A-D]\)?\.?$/, '');

    if (text.includes('A)') && text.includes('B)')) {
        return text
            .replace(/\s*A\)/g, '\nA)')
            .replace(/\s*B\)/g, '\nB)')
            .replace(/\s*C\)/g, '\nC)')
            .replace(/\s*D\)/g, '\nD)');
    }

    return text;
}

function stripLeadingLabel(s) {
  let t = String(s).trim();

  // Remove only real option labels: A), A., A:, (A), i), ii), etc.
  // Do NOT treat A-P, B-Q, C-R, D-S as option labels.
  const labelRe = /^\s*[\(\[]?\s*(?:[A-Da-d]|(?:iv|vi|ix|v?i{1,3}))\s*[)\.:]\s*/i;

  while (labelRe.test(t)) t = t.replace(labelRe, '');
  return t;
}

function formatPreviewOption(opt) {
  const s = String(opt || '').trim();
  const m = s.match(/^([A-D]\))\s*(.*)$/);
  if (!m) return s;
  return `<span style="color:#7A2230;font-weight:700;">${m[1]}</span> <span style="color:#111111;">${m[2]}</span>`;
}
  function stripABPrefix(html) {
  if (html == null) return '';
  let s = String(html)
    .replace(/&nbsp;/gi, ' ')
    .replace(/^\s+(?=<)/, ''); // drop spaces before a leading tag

  // Allow any number of leading tags before the label: <b>(A)</b>, <span>A)</span>, etc.
  const RE = /^\s*(?:<[^>]+>\s*)*(?:\(\s*[AB]\s*\)|[AB][)\.:])\s*/i;

  // Strip repeatedly in case there are nested/duplicated prefixes
  while (RE.test(s)) s = s.replace(RE, '');
  return s.trim();
}

function waitForExamMathJax(maxWaitMs = 5000) {

            : Promise.resolve();

        Promise.resolve(startupPromise)
          .catch(() => {})
          .then(resolve);

        return;
      }

      if (Date.now() - startedAt >= maxWaitMs) {
        resolve();
        return;
      }

      setTimeout(check, 50);
    }

    check();
  });
}

function waitForExamImages(root) {
  if (!root) return Promise.resolve();

  const images = Array.from(root.querySelectorAll('img'));

  return Promise.all(
    images.map(img => {
      if (img.complete) return Promise.resolve();

      return new Promise(resolve => {
        img.addEventListener('load', resolve, { once: true });
        img.addEventListener('error', resolve, { once: true });
      });
    })
  );
}

function ensureExamPageSettings(pageIndex) {

function isExamQuestionFlowBlock(node) {
  return !!(
    node &&
    node.nodeType === 1 &&

}

function isExamSubjectHeading(node) {
  if (!node || node.nodeType !== 1) return false;

  return /^Subject\s*:/i.test(
    String(node.textContent || '').trim()
  );
}

function createExamFlowGroup() {
  const group = document.createElement('div');
  group.className = 'exam-flow-group';
  return group;
}

function __examExtractDirectFlowPieces(wrapper) {
  if (!wrapper) return [];

  const pieces = Array.from(
    wrapper.children
  ).filter(child =>
    child.hasAttribute(
      'data-exam-flow-piece'
    )
  );

  if (!pieces.length) {
    return [wrapper];
  }

  pieces.forEach(piece => {
    piece.remove();
  });

  wrapper.remove();

  return pieces;
}

function __examSplitStandardQuestion(node) {
  if (
    !node ||
    !node.matches('.question-container')
  ) {
    return [node];
  }

  /*
    Paragraph and Matching Matrix have already been
    separated by their own render functions.
  */
  if (
    node.querySelector('.matching-matrix-table') ||
    node.closest('.paragraph-set-preview') ||
    node.closest('.matching-set-preview')
  ) {
    return [node];
  }

  const numberNode =
    node.querySelector(
      ':scope > .question-number'
    );

  const bodyNode =
    node.querySelector(
      ':scope > .question-body'
    );

  if (!numberNode || !bodyNode) {
    return [node];
  }

  const optionsNode =
    bodyNode.querySelector(
      ':scope > .options-block'
    );

  if (!optionsNode) {
    return [node];
  }

  /*
    Build a question-only block.
  */
  const questionPart =
    document.createElement('div');

  questionPart.className =
    'question-container ' +
    'normal-question-flow ' +
    'exam-flow-piece';

  questionPart.setAttribute(
    'data-exam-flow-piece',
    'normal-question'
  );

  const newBody =
    document.createElement('div');

  newBody.className = 'question-body';

  Array.from(bodyNode.childNodes)
    .forEach(child => {
      if (child !== optionsNode) {
        newBody.appendChild(child);
      }
    });

  questionPart.appendChild(numberNode);
  questionPart.appendChild(newBody);

  /*
    Options become a separate block.
  */
  optionsNode.remove();

  optionsNode.classList.add(
    'normal-options-flow',
    'exam-flow-piece'
  );

  optionsNode.setAttribute(
    'data-exam-flow-piece',
    'normal-options'
  );

  node.remove();

  return [
    questionPart,
    optionsNode
  ];
}

function __examExpandTopLevelNode(node) {
  if (!node || node.nodeType !== 1) {
    return [];
  }

  if (
    node.matches(
      '.paragraph-set-preview, ' +
      '.matching-set-preview'
    )
  ) {
    return __examExtractDirectFlowPieces(
      node
    );
  }

  if (
    node.matches('.question-container')
  ) {
    return __examSplitStandardQuestion(
      node
    );
  }

  return [node];
}

function __examCanFollowHeading(node) {
  return !!(
    node &&
    node.nodeType === 1 &&
    (
      node.hasAttribute(
        'data-exam-flow-piece'
      ) ||
      node.matches(
        '.question-container, ' +
        '.paragraph-set-preview, ' +
        '.matching-set-preview'
      )
    )
  );
}

function getExamFlowBlocks(sourcePage) {
  const rawNodes = Array.from(
    sourcePage.children
  ).filter(node => {
    return (
      node.nodeType === 1 &&
      !node.classList.contains(
        'print-footer-spacer'
      ) &&
      !node.classList.contains(
        'exam-page-footer'
      )
    );
  });

  /*
    Convert paragraph sets, matching matrices and
    ordinary MCQs into smaller independent blocks.
  */
  const nodes = [];

  rawNodes.forEach(node => {
    __examExpandTopLevelNode(node)
      .forEach(piece => {
        if (piece) {
          nodes.push(piece);
        }
      });
  });

  const blocks = [];
  let index = 0;

  while (index < nodes.length) {
    const node = nodes[index];

    /*
      Keep school heading and details box together.
    */
    if (
      node.classList.contains(
        'heading-row'
      ) &&
      nodes[index + 1] &&
      nodes[index + 1].classList.contains(
        'details-rect'
      )
    ) {
      const group =
        createExamFlowGroup();

      group.classList.add(
        'exam-first-page-header'
      );

      group.appendChild(node);
      group.appendChild(
        nodes[index + 1]
      );

      blocks.push(group);
      index += 2;
      continue;
    }

    /*
      Subject heading + section heading +
      only the first logical content block.
    */
    if (isExamSubjectHeading(node)) {
      const group =
        createExamFlowGroup();

      group.appendChild(node);
      index += 1;

      if (
        nodes[index] &&
        nodes[index].classList.contains(
          'section-block'
        )
      ) {
        group.appendChild(nodes[index]);
        index += 1;
      }

      if (
        nodes[index] &&
        __examCanFollowHeading(
          nodes[index]
        )
      ) {
        group.appendChild(nodes[index]);
        index += 1;
      }

      blocks.push(group);
      continue;
    }

    /*
      Section heading stays only with the first
      passage/question/matrix piece—not the whole set.
    */
    if (
      node.classList.contains(
        'section-block'
      )
    ) {
      const group =
        createExamFlowGroup();

      group.appendChild(node);
      index += 1;

      if (
        nodes[index] &&
        __examCanFollowHeading(
          nodes[index]
        )
      ) {
        group.appendChild(nodes[index]);
        index += 1;
      }

      blocks.push(group);
      continue;
    }

    /*
      All passage questions, options, matrix rows
      and normal MCQ options now flow independently.
    */
    blocks.push(node);
    index += 1;
  }

  return blocks;
}

function applyExamQuestionGap(
  root,
  settings = getDefaultExamPageSettings()
) {
  if (!root) return;

  const gap =
    `${Number(settings.questionGap || 12)}px`;

  const questionBlocks = [];

  if (
    root.nodeType === 1 &&
    root.matches(
      '.question-container, .paragraph-set-preview'
    )
  ) {
    questionBlocks.push(root);
  }

  root.querySelectorAll(
    '.question-container, .paragraph-set-preview'
  ).forEach(node => {
    questionBlocks.push(node);
  });

  questionBlocks.forEach(node => {
    node.style.setProperty(
      'margin-bottom',
      gap,
      'important'
    );
  });
}

 function addNewPage() {

}

  let currentShell = addNewPage();

applyExamQuestionGap(

currentShell.content.appendChild(block);

void currentShell.content.offsetHeight;

 const totalPages = pages.length;

                  section.type === 'internal' ? `${section.numPairs} x ${section.marksPerQuestion} = ${section.numPairs * section.marksPerQuestion} Marks` : ''
                }

              // ------- Single-subject branch -------
if (section.questions && section.questions.length > 0) {
    const questionsHTML = section.questions.map(q => {
    const currentQNum = Math.max(qNum, Number(q.number || qNum));

    const qForPreviewRender = {
      ...q,
      mcqType: q.mcqType || q.type || q.questionType || section.mcqType || section.questionType || ''
    };

    if (__epIsParagraphBasedQuestion(qForPreviewRender)) {
      const normalizedParagraph = __epNormalizeParagraphQuestion(qForPreviewRender);
      const paragraphCount = Math.max(__epGetParagraphMcqs(normalizedParagraph).length, 1);
      const html = __epBuildParagraphPreviewQuestionHtml(normalizedParagraph, currentQNum);
      qNum = currentQNum + paragraphCount;
      return html;
    }

    if (__epIsMatchingMatrixQuestion(qForPreviewRender)) {
      qNum = currentQNum + 1;
      return __epBuildMatchingMatrixPreviewQuestionHtml(qForPreviewRender, currentQNum);
    }

    qNum = currentQNum + 1;

    let questionContentHTML = '';
    let optionLines = [];
    const hasShuffledOptions = Array.isArray(q.options) && q.options.length === 4;
    let isAlreadyFormatted = false; // <-- 1. FLAG

    if (hasShuffledOptions) {
      const raw = (q.question || q.text || '');
      questionContentHTML = raw.replace(/\s*A\).*/g, '').trim();
      optionLines = q.options.map((opt, idx) => {
        const cleanOpt = stripLeadingLabel(opt);
        return String.fromCharCode(65 + idx) + ') ' + cleanOpt;
      });
    } else {
      // UPGRADED LOGIC
      const pre = (q.html || q.renderedHTML || q.finalHTML || q.formattedHTML || q.question || q.text || '');
      // If review already produced pair markup, trust it as-is
           if (/\bpair-a\b/.test(pre) && /\bpair-b\b/.test(pre)) {
        questionContentHTML = pre;
        isAlreadyFormatted = true; // <-- 2. SET THE FLAG
      } else {
        let html = pre
          .replace(/<img[^>]*>/gi, '')
          .replace(/<\/p>/gi, '<br>')
          .replace(/<div[^>]*>/gi, '<br>')
          .replace(/<\/div>/gi, '')
          .replace(/<li[^>]*>/gi, '<br>')
          .replace(/<\/li>/gi, '')
          .replace(/<ol[^>]*>|<ul[^>]*>|<\/ol>|<\/ul>/gi, '');

        let parts = html.split(/<br\s*\/?>|\r?\n|\r/gi)
          .map(s => s.replace(/ /g, ' ').trim())
          .filter(Boolean);

                if (parts.length > 0) {
          questionContentHTML = autoLatexAll(removeMetaPrefix((parts[0] || '')));
          for (let i = 1; i < parts.length; i++) {
            let line = autoLatexAll(parts[i]);
            let inlineOpts = line.match(/((?:^|\s|\()(?:(?:[A-D])|(?:iv|vi|ix|v?i{1,3}))\s*[)\.: -]\s*.*?)(?=\s+(?:^|\s|\()(?:(?:[A-D])|(?:iv|vi|ix|v?i{1,3}))\s*[)\.: -]\s*|$)/gi);
            if (inlineOpts && inlineOpts.length >= 2) {
              optionLines.push(...inlineOpts.map(opt => autoLatexAll(opt.trim())));
            } else {
              const singleOpt = line.match(/^\s*(?:^|\s|\()(?:(?:[A-D])|(?:iv|vi|ix|v?i{1,3}))\s*[)\.:]\s+.+$/i);
              if (singleOpt) {
                optionLines.push(autoLatexAll((singleOpt[0] || '').trim()));
              } else if (line && !/^\s*(?:^|\s|\()(?:(?:[A-D])|(?:\(?i{1,3}\)?|iv))\s*[\)\.\:\-–—]\s+/.test(line)) {
                questionContentHTML += '<br>' + line;
              }
            }
          }
          if (optionLines.length === 4) {
            optionLines = optionLines
              .map(s => stripLeadingLabel(s).replace(/\s+/g, ' ').trim())
              .map((opt, i) => String.fromCharCode(65 + i) + ') ' + opt);
          }
        } // ← closes if(parts.length>0)
      }   // ← closes else { ... } for hasShuffledOptions
    }

    const optionsHTML = renderOptionsLayout(optionLines);
    const imageHTML = q.image ? `<div class="question-img-block"><img class="question-img" src="${q.image}" alt="Question Image" /></div>` : '';

    // <-- 3. FINAL HTML (avoid double-formatting)
       const finalQuestionHTML = (() => {
      let h = questionContentHTML || '';
      h = h
        .replace(/<\/p>/gi, '<br>')
        .replace(/<p[^>]*>/gi, '')
        .replace(/<div[^>]*>/gi, '<br>')
        .replace(/<\/div>/gi, '');
      return h;
    })();
    // --- END ---

    return `

          <div class="options-block" data-options="${encodeURIComponent(JSON.stringify(optionLines))}">${optionsHTML}</div>
        </div>
      </div>
    `;
  }).join('');
  contentHTML += questionsHTML;
      }
      }
    }
  }

   function doTypeset() {
    // Build options HTML BEFORE MathJax
    document.querySelectorAll('.options-block[data-options]').forEach(node => {
      try {
        const raw = node.getAttribute('data-options') || '[]';
        const arr = JSON.parse(decodeURIComponent(raw));
        if (Array.isArray(arr) && arr.length) {
          node.innerHTML = renderOptionsLayout(arr, node);
        }
      } catch (e) {
        console.error('options-block parse failed', e);
      }
    });

    // Typeset MathJax (FORCE normal weight: strip bold tags + bold styles, then clear & re-typeset)
const target = document.getElementById('print-preview');

if (target) {
  // 1) remove <b>/<strong>
  target.querySelectorAll('b,strong').forEach(el => {
    const span = document.createElement('span');
    span.innerHTML = el.innerHTML;
    el.replaceWith(span);
  });

  // 2) remove inline bold styles (very common in saved HTML)
  target.querySelectorAll('[style*="font-weight"]').forEach(el => {
    try { el.style.fontWeight = 'normal'; } catch(e) {}
  });

  // 3) force container normal weight (so MathJax reads normal at typeset time)
  target.style.fontWeight = 'normal';

  // 4) IMPORTANT: remove old MathJax output so it regenerates (otherwise bold SVG stays)
 
  if (window.MathJax && typeof window.MathJax.typesetClear === 'function') {
    window.MathJax.typesetClear([target]);
  }
}

if (window.MathJax && typeof window.MathJax.typesetPromise === 'function' && target) {
  return window.MathJax.typesetPromise([target])
    .catch(err => console.error('MathJax typeset failed:', err))
    .then(() => {
  // ✅ kill bold inside MathJax SVG (Chrome print preview issue)
  if (target) {
    target.querySelectorAll('mjx-container svg [font-weight]').forEach(n => {
      try { n.setAttribute('font-weight', '400'); } catch(e) {}
    });
    target.querySelectorAll('mjx-container svg [style*="font-weight"]').forEach(n => {
      try { n.style.fontWeight = '400'; } catch(e) {}
    });
    target.querySelectorAll('mjx-container svg text, mjx-container svg tspan').forEach(n => {
      try { n.style.fontWeight = '400'; n.setAttribute('font-weight','400'); } catch(e) {}
    });
  }
  dedupePairText(document);
repairOptionLayouts(target || document);
});

}
    // No-MathJax fallback
    return Promise.resolve().then(() => {
  dedupePairText(document);
repairOptionLayouts(target || document);
});
  }
    window.__examPreviewReadyPromise =
    waitForExamMathJax()
      .then(() => doTypeset())
      .then(async () => {
        if (
          renderId !== window.__examPreviewRenderId ||

        console.error(

        /*
          Even when MathJax has a problem, create the

        */
        if (
          renderId === window.__examPreviewRenderId &&
          page.isConnected
        ) {
          await paginateExamPreview(page, renderId);
        }
      });

  return window.__examPreviewReadyPromise;
}



// Inserts a gap + editable OR box when (A)... and (B)... exist in the SAME block (even with <br>)
function insertManualOrBoxes(root=document){
  (root.querySelectorAll('.question-text')||[]).forEach(qt=>{
   if (qt.querySelector('.pair-or')) return;
// do NOT return just because pairs exist; we still have to insert the OR

    // Text-first parse (robust across stray tags/BRs)
    const raw = (qt.innerHTML || '')
      .replace(/<\/p>/gi,'\n').replace(/<p[^>]*>/gi,'')
      .replace(/<br\s*\/?>/gi,'\n')
      .replace(/<div[^>]*>/gi,'\n').replace(/<\/div>/gi,'')
      .replace(/\r/g,'');
    const lines = raw.split('\n').map(s=>s.trim()).filter(Boolean);

    const A_RE = /^\(\s*A\s*\)|^A[\)\.\:]/i;
    const B_RE = /^\(\s*B\s*\)|^B[\)\.\:]/i;

    let aIdx = lines.findIndex(l=>A_RE.test(l));
    let bIdx = -1;
    if (aIdx !== -1){
      for (let i=aIdx+1;i<lines.length;i++){ if (B_RE.test(lines[i])) { bIdx=i; break; } }
    }
    if (aIdx !== -1 && bIdx !== -1){
      const aHTML = lines[aIdx].replace(A_RE,'').trim() + (bIdx-aIdx>1? ('\n'+lines.slice(aIdx+1,bIdx).join('\n')) : '');
      const bHTML = lines[bIdx].replace(B_RE,'').trim() + (bIdx<lines.length-1? ('\n'+lines.slice(bIdx+1).join('\n')) : '');
      qt.innerHTML =
        `<div class="pair-a"><span class="label">(A)</span><span class="txt">${aHTML}</span></div>`+
        `<div class="pair-or">(OR)</div><div class="ab-gap"></div>`+
        `<div class="pair-b"><span class="label">(B)</span><span class="txt">${bHTML}</span></div>`;
    }
  });
}

async function exportCurrentPreviewPdfBlob() {
  await waitForPreviewReady();

  const pages = Array.from(
    document.querySelectorAll(
      '#print-preview .a4-page.exam-paginated-page'
    )
  );

  if (!pages.length) {
    throw new Error(
      'No page-wise preview pages were found'
    );
  }

  const { jsPDF } = window.jspdf;

  const pdf = new jsPDF({
    orientation: 'portrait',
    unit: 'mm',
    format: 'a4',
    compress: true
  });

  for (let index = 0; index < pages.length; index++) {
    const page = pages[index];

    await waitForExamImages(page);

    if (index > 0) {
      pdf.addPage('a4', 'portrait');
    }

    const canvas = await html2canvas(page, {
      scale: 2,
      useCORS: true,
      allowTaint: false,
      backgroundColor: '#ffffff',
      logging: false,
      scrollX: 0,
      scrollY: 0,
      windowWidth: page.scrollWidth,
      windowHeight: page.scrollHeight
    });

    const imageData =
      canvas.toDataURL('image/jpeg', 0.96);

    pdf.addImage(
      imageData,
      'JPEG',
      0,
      0,
      210,
      297,
      undefined,
      'FAST'
    );
  }

  return pdf.output('blob');
}

function downloadPreviewBlob(blob, filename) {

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function renderMathJaxToImages(containerSelector) {
  const container = document.querySelector(containerSelector);
  if (!container) return;

  // Wait for MathJax to finish rendering equations
  if (window.MathJax && typeof window.MathJax.typesetPromise === 'function') {
    await window.MathJax.typesetPromise([container]);
  }
  // Find all MathJax elements and convert them to images
  const mathElements = container.querySelectorAll('mjx-container');
  for (const el of mathElements) {
    // Use dom-to-image to convert each equation to a PNG
    const dataUrl = await domtoimage.toPng(el, { bgcolor: '#fff' });
    // Create <img> element and replace the MathJax SVG
    const img = document.createElement('img');
    img.src = dataUrl;
    img.style.verticalAlign = 'middle';
    img.style.display = 'inline-block';
    img.style.maxHeight = '32px';
    el.parentNode.replaceChild(img, el);
  }
}

function getVisibleExamPageIndex() {
  const pages = Array.from(
    document.querySelectorAll(
      '#print-preview .exam-paginated-page'
    )
  );

  if (!pages.length) return 0;

  const viewportCenter =
    window.innerHeight / 2;

  let bestIndex = 0;
  let bestDistance = Infinity;

  pages.forEach((page, index) => {
    const rect =
      page.getBoundingClientRect();

    const pageCenter =

    const distance =
      Math.abs(pageCenter - viewportCenter);

      bestIndex = index;

  });

      String(settings.questionGap);
  }

  if (gapValue) {
    gapValue.textContent =
      `${settings.questionGap}px`;
  }

  if (marginSlider) {
    marginSlider.value =
      String(settings.margin);
  }

  if (marginValue) {
    marginValue.textContent =
      `${Number(settings.margin).toFixed(1)}cm`;
  }

  if (pageSelect) {
    pageSelect.value =
      String(window.__examCurrentPageIndex);
  }
}

function scrollToSelectedExamPage() {
  const targetPage =
    document.querySelector(
      '.exam-paginated-page' +
      `[data-page-index="` +
      `${window.__examCurrentPageIndex}"]`
    );

  if (!targetPage) return;

  const top =
    targetPage.getBoundingClientRect().top +
    window.pageYOffset -
    90;

  window.scrollTo({
    top,
    behavior: 'smooth'
  });
}

if (floatingSettingsBtn) {
  floatingSettingsBtn.onclick = function() {
    window.__examCurrentPageIndex =
      getVisibleExamPageIndex();

    if (pageSelect) {
      pageSelect.value =
        String(
          window.__examCurrentPageIndex
        );
    }

    updateSliderUIFromPage();

    if (settingsModal) {
      settingsModal.style.display = 'flex';
    }
  };
}

if (closeSettingsBtn) {
  closeSettingsBtn.onclick = function() {
    if (settingsModal) {
      settingsModal.style.display = 'none';
    }
  };
}

if (pageSelect) {
  pageSelect.addEventListener(
    'change',
    function() {
      window.__examCurrentPageIndex =
        Math.max(
          0,
          Number(this.value) || 0
        );

      updateSliderUIFromPage();
      scrollToSelectedExamPage();
    }
  );
}

function updateGap() {
  const settings =
    ensureExamPageSettings(
      window.__examCurrentPageIndex
    );

  settings.questionGap =
    Number(gapSlider?.value || 12);

  if (gapValue) {
    gapValue.textContent =
      `${settings.questionGap}px`;
  }

  const targetPage =
    document.querySelector(
      '.exam-paginated-page' +
      `[data-page-index="` +
      `${window.__examCurrentPageIndex}"]`
    );

  if (targetPage) {
    targetPage.style.setProperty(
      '--exam-question-gap',
      `${settings.questionGap}px`
    );

    applyExamQuestionGap(
      targetPage,
      settings
    );
  }
}

function updateMargin() {
  const settings =
    ensureExamPageSettings(
      window.__examCurrentPageIndex
    );

  settings.margin =
    Number(marginSlider?.value || 1.5);

  if (marginValue) {
    marginValue.textContent =
      `${settings.margin.toFixed(1)}cm`;
  }

  const targetPage =
    document.querySelector(
      '.exam-paginated-page' +
      `[data-page-index="` +
      `${window.__examCurrentPageIndex}"]`
    );

  if (targetPage) {
    targetPage.style.setProperty(
      '--exam-page-margin',
      `${settings.margin}cm`
    );
  }
}

let examRepaginateTimer = null;

function queueExamRepagination() {
  const lockedPageIndex =
    window.__examCurrentPageIndex;

  clearTimeout(examRepaginateTimer);

  examRepaginateTimer = setTimeout(
    async () => {
      await renderPrintPreview();
      await waitForPreviewReady();

      const pageCount =
        document.querySelectorAll(
          '#print-preview ' +
          '.exam-paginated-page'
        ).length;

      window.__examCurrentPageIndex =
        Math.min(
          lockedPageIndex,
          Math.max(0, pageCount - 1)
        );

      refreshExamPagePicker(pageCount);
      updateSliderUIFromPage();
    },
    350
  );
}

gapSlider?.addEventListener(
  'input',
  () => {
    updateGap();
    queueExamRepagination();
  }
);

marginSlider?.addEventListener(
  'input',
  () => {
    updateMargin();
    queueExamRepagination();
  }
);

// Set initial values after DOM loaded
window.addEventListener(
  'DOMContentLoaded',
  async () => {
    ensureSchoolState();

    const schoolBox =
      document.getElementById(
        'school-names-list'
      );

    if (schoolBox) {
      schoolBox.value =
        getSchoolNames().join('\n');
    }

    document
      .getElementById('apply-school-list-btn')
      ?.addEventListener('click', () => {
        syncSchoolNamesFromTextarea(true);
        renderPrintPreview();
        updateSchoolPreviewStatus();
      });

    document
      .getElementById('prev-school-btn')
      ?.addEventListener('click', () => {
        changeSchoolPreview(-1);
      });

    document
      .getElementById('next-school-btn')
      ?.addEventListener('click', () => {
        changeSchoolPreview(1);
      });

    document
      .getElementById('print-action-btn')
      ?.addEventListener(
        'click',
        handlePrintAction
      );

    updateSchoolPreviewStatus();

    await waitForPreviewReady();

    const pageCount =
      document.querySelectorAll(
        '#print-preview ' +
        '.exam-paginated-page'
      ).length;

    refreshExamPagePicker(pageCount);
    updateSliderUIFromPage();
  }
);
</script>
