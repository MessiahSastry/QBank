// SciMentra custom alert + confirm
(function setupSciMentraDialogs(){
  if (!document.getElementById('dlgAppAlert')) {
    const wrapper = document.createElement('div');
    wrapper.innerHTML = `
      <dialog id="dlgAppAlert" style="border:none;border-radius:16px;padding:0;max-width:420px;width:92vw;">
        <div style="background:#0f3d6b;color:#fff;padding:10px 14px;border-radius:16px 16px 0 0;font-weight:600;font-size:15px;text-align:left;">
          SciMentra
        </div>
        <div style="padding:14px 16px 10px 16px;font-size:14px;line-height:1.5;">
          <p id="appAlertText" style="margin:0 0 12px 0;"></p>
          <div style="text-align:right;margin-top:4px;">
            <button id="btnAppAlertOk"
                    style="background:#0f3d6b;color:#fff;border:none;border-radius:999px;padding:6px 16px;font-size:13px;font-weight:600;cursor:pointer;">
              OK
            </button>
          </div>
        </div>
      </dialog>
    `;
    const dialog = wrapper.firstElementChild;
    document.body.appendChild(dialog);

    const textEl = dialog.querySelector('#appAlertText');
    const okBtn  = dialog.querySelector('#btnAppAlertOk');

        function show(msg){
      if (textEl) textEl.textContent = msg;
      dialog.showModal();
    }

    if (okBtn) okBtn.onclick = () => dialog.close();

    window.appInfo = function(msg){
      return new Promise(resolve => {
        if (textEl) textEl.textContent = msg;

        const onClose = () => resolve(true);
        dialog.addEventListener('close', onClose, { once: true });

        if (okBtn) {
          okBtn.onclick = () => dialog.close();
        }

        dialog.showModal();
      });
    };

    window.alert = show;
  }

  if (!document.getElementById('dlgAppConfirm')) {
    const wrapper2 = document.createElement('div');
    wrapper2.innerHTML = `
      <dialog id="dlgAppConfirm" style="border:none;border-radius:16px;padding:0;max-width:420px;width:92vw;">
        <div style="background:#0f3d6b;color:#fff;padding:10px 14px;border-radius:16px 16px 0 0;font-weight:600;font-size:15px;text-align:left;">
          SciMentra
        </div>
        <div style="padding:14px 16px 10px 16px;font-size:14px;line-height:1.5;">
          <p id="appConfirmText" style="margin:0 0 12px 0;"></p>
          <div style="text-align:right;margin-top:4px;display:flex;justify-content:flex-end;gap:8px;">
            <button id="btnAppConfirmCancel"
                    style="background:#eef3f9;color:#35506b;border:none;border-radius:999px;padding:6px 16px;font-size:13px;font-weight:600;cursor:pointer;">
              Cancel
            </button>
            <button id="btnAppConfirmOk"
                    style="background:#0f3d6b;color:#fff;border:none;border-radius:999px;padding:6px 16px;font-size:13px;font-weight:600;cursor:pointer;">
              OK
            </button>
          </div>
        </div>
      </dialog>
    `;
    const dialog2 = wrapper2.firstElementChild;
    document.body.appendChild(dialog2);

    const textEl2 = dialog2.querySelector('#appConfirmText');
    const okBtn2 = dialog2.querySelector('#btnAppConfirmOk');
    const cancelBtn2 = dialog2.querySelector('#btnAppConfirmCancel');

   window.appConfirm = function(msg){
      return new Promise(resolve => {
        if (textEl2) textEl2.textContent = msg;
        dialog2.showModal();

        okBtn2.onclick = () => {
          dialog2.close();
          resolve(true);
        };

        cancelBtn2.onclick = () => {
          dialog2.close();
          resolve(false);
        };
      });
    };
  }

  if (!document.getElementById('dlgAppPrompt')) {
    const wrapper3 = document.createElement('div');
    wrapper3.innerHTML = `
      <dialog id="dlgAppPrompt" style="border:none;border-radius:16px;padding:0;max-width:420px;width:92vw;">
        <div style="background:#0f3d6b;color:#fff;padding:10px 14px;border-radius:16px 16px 0 0;font-weight:600;font-size:15px;text-align:left;">
          SciMentra
        </div>
        <div style="padding:14px 16px 10px 16px;font-size:14px;line-height:1.5;">
          <p id="appPromptText" style="margin:0 0 12px 0;"></p>
          <input id="appPromptInput" type="text"
                 style="width:100%;box-sizing:border-box;padding:10px 12px;border:1.3px solid #bcd6ef;border-radius:10px;font-size:14px;margin-bottom:12px;outline:none;">
          <div style="text-align:right;margin-top:4px;display:flex;justify-content:flex-end;gap:8px;">
            <button id="btnAppPromptCancel"
                    style="background:#eef3f9;color:#35506b;border:none;border-radius:999px;padding:6px 16px;font-size:13px;font-weight:600;cursor:pointer;">
              Cancel
            </button>
            <button id="btnAppPromptOk"
                    style="background:#0f3d6b;color:#fff;border:none;border-radius:999px;padding:6px 16px;font-size:13px;font-weight:600;cursor:pointer;">
              OK
            </button>
          </div>
        </div>
      </dialog>
    `;
    const dialog3 = wrapper3.firstElementChild;
    document.body.appendChild(dialog3);

    const textEl3 = dialog3.querySelector('#appPromptText');
    const inputEl3 = dialog3.querySelector('#appPromptInput');
    const okBtn3 = dialog3.querySelector('#btnAppPromptOk');
    const cancelBtn3 = dialog3.querySelector('#btnAppPromptCancel');

        window.appPrompt = function(msg, defaultValue = ''){
      return new Promise(resolve => {
        if (textEl3) textEl3.textContent = msg;
        if (inputEl3) inputEl3.value = defaultValue || '';
        dialog3.showModal();

        setTimeout(() => {
          if (inputEl3) {
            inputEl3.focus();
            inputEl3.select();
          }
        }, 0);

        okBtn3.onclick = () => {
          const val = inputEl3 ? inputEl3.value : '';
          dialog3.close();
          resolve(val);
        };

        cancelBtn3.onclick = () => {
          dialog3.close();
          resolve(null);
        };
      });
    };
  }

  if (!window.appSelectPdfMode) {
    window.appSelectPdfMode = function() {
      return new Promise(resolve => {
        document.querySelectorAll('.pdf-mode-dialog-overlay').forEach(el => el.remove());

        const overlay = document.createElement('div');
        overlay.className = 'pdf-mode-dialog-overlay';
        overlay.innerHTML = `
          <div style="
            position:fixed;top:0;left:0;width:100vw;height:100vh;
            background:rgba(0,0,0,0.18);z-index:100000;
            display:flex;align-items:center;justify-content:center;
            padding:16px;box-sizing:border-box;">
            
            <div style="
              background:#fff;border-radius:18px;overflow:hidden;
              width:100%;max-width:460px;
              box-shadow:0 8px 28px rgba(0,0,0,0.18);">
              
              <div style="
                background:#0f3d6b;color:#fff;padding:14px 18px;
                font-size:1.08em;font-weight:700;">
                SciMentra
              </div>

              <div style="padding:18px 18px 14px 18px;">
                <div style="font-size:1em;color:#1f2d3d;margin-bottom:14px;line-height:1.5;">
                  Choose PDF type
                </div>

                               <input type="hidden" id="pdf-mode-selected" value="worksheet">

                <div class="pdf-mode-card" data-value="worksheet" style="
                  display:flex;align-items:center;justify-content:space-between;
                  padding:14px 14px;margin-bottom:10px;
                  border:2px solid #1762a7;border-radius:14px;
                  cursor:pointer;background:#eef6ff;
                  transition:all 0.15s ease;box-shadow:0 4px 14px rgba(23,98,167,0.10);">
                  <span style="font-weight:700;color:#12416c;">Worksheet</span>
                  <span class="pdf-mode-tick" style="font-size:1.1em;color:#1762a7;font-weight:900;">✓</span>
                </div>

                <div class="pdf-mode-card" data-value="key" style="
                  display:flex;align-items:center;justify-content:space-between;
                  padding:14px 14px;margin-bottom:8px;
                  border:1.5px solid #cfe0f2;border-radius:14px;
                  cursor:pointer;background:#f9fcff;
                  transition:all 0.15s ease;">
                  <span style="font-weight:700;color:#12416c;">Key</span>
                  <span class="pdf-mode-tick" style="font-size:1.1em;color:transparent;font-weight:900;">✓</span>
                </div>
                               <div style="
                  display:flex;justify-content:flex-end;gap:10px;
                  margin-top:16px;">
                  <button type="button" id="pdf-mode-cancel-btn" style="
                    border:none;border-radius:999px;
                    padding:8px 18px;background:#eef3f9;color:#35506b;
                    font-weight:700;cursor:pointer;">
                    Cancel
                  </button>
                  <button type="button" id="pdf-mode-ok-btn" style="
                    border:none;border-radius:999px;
                    padding:8px 18px;background:#0f3d6b;color:#fff;
                    font-weight:700;cursor:pointer;">
                    OK
                  </button>
                </div>
              </div>
            </div>

function __renderKeyOptionsLayout(optionLines, hostNodeOrWidth) {
  if (!Array.isArray(optionLines) || optionLines.length === 0) return '';

      font-size:12pt;

        <span style="display:block;width:100%;white-space:nowrap;">${optionHtmlLines[1]}</span>
        <span style="display:block;width:100%;white-space:nowrap;">${optionHtmlLines[2]}</span>
        <span style="display:block;width:100%;white-space:nowrap;">${optionHtmlLines[3]}</span>
      </div>`;
  }

    .map(opt => `<div style="margin-bottom:3px;margin-left:2px;">${opt.replace(/\n/g, '<br>')}</div>`)

      const pageHeightPx = pageRect.height;

          width: pageWidthPx + 'px',

        const w = (r.width / pageWidthPx) * 210;
        const h = (r.height / pageHeightPx) * 297;

  const viewportCenter = window.innerHeight / 2;

  pages.forEach((page, index) => {
    const rect = page.getBoundingClientRect();

function createMultiDropdownHTML(id, options, label = 'All') {
  const opts = (options || []).map((opt, idx) => {
    const safe = String(opt).replace(/"/g,'&quot;');
    return `
      <label style="display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;">
        <input type="checkbox" class="${id}-chk" value="${safe}">
        <span>${safe}</span>
      </label>`;
  }).join('');

  return `
    <input type="hidden" id="${id}-values" value="">
    <div class="selected-option" id="${id}-chip">${label}</div>

        <button type="button" class="msel-done" data-target="${id}" style="background:#1762a7;border:1px solid #1762a7;color:#fff;border-radius:6px;padding:6px 10px;cursor:pointer;">Done</button>

function addMultiDropdownListener(dropdownId, onChange) {
  const dd = document.getElementById(dropdownId);
  const chip = dd.querySelector('.selected-option');
  const panel = dd.querySelector('.dropdown-options');
  const hidden = dd.querySelector('input[id$="-values"]');

  chip.addEventListener('click', (e) => {
    e.stopPropagation();
    dd.classList.toggle('open');
  });

  // prevent outside click handler from closing while interacting inside panel
  panel.addEventListener('click', (e) => {
    e.stopPropagation();

    const btn = e.target.closest('button');
    if (!btn) return;

    const targetId = btn.getAttribute('data-target');
    if (!targetId) return;

    const boxList = dd.querySelectorAll(`input.${targetId}-chk`);
    if (btn.classList.contains('msel-all')) {
      boxList.forEach(b => b.checked = true);
    } else if (btn.classList.contains('msel-clear')) {
      boxList.forEach(b => b.checked = false);
    } else if (btn.classList.contains('msel-done')) {
      dd.classList.remove('open'); // only close on Done
    }
    __updateMultiChip(dd, hidden, chip, onChange);
  });

  // ensure checkbox changes don’t bubble to document click
  panel.addEventListener('change', (e) => {
    e.stopPropagation();
    if (e.target && e.target.matches('input[type="checkbox"]')) {
      __updateMultiChip(dd, hidden, chip, onChange);
    }
  });
}

function __updateMultiChip(dd, hidden, chip, onChange) {
  // base id is like "qtype" from hidden.id = "qtype-values"
  const base = (hidden?.id || '').replace(/-values$/, '');
  const boxes = dd.querySelectorAll(`input.${base}-chk`);
  const selected = Array.from(boxes).filter(b => b.checked).map(b => b.value);

  hidden.value = selected.join('||'); // store as "A||B||C"
  if (selected.length === 0) {
    chip.textContent = 'All';
  } else if (selected.length <= 2) {
    chip.textContent = selected.join(', ');
  } else {
    chip.textContent = `${selected.length} selected`;
  }
  if (typeof onChange === 'function') onChange();
}

function getMultiSelected(idPrefix) {
  const el = document.getElementById(`${idPrefix}-values`);
  if (!el) return [];
  const raw = el.value || '';
  return raw ? raw.split('||').filter(Boolean) : [];
}

function autoLatexAll(str) {
      if (!str) return '';
      let match = str.match(/(\$[^\$]+\$)/g);
      if (match && match.length >= 2) {

        str = '$' + joined.replace(/\s*\+\s*/g, ' + ') + '$';
      }

  selType.addEventListener('change', toggleMCQBlock);

    if (__editPopupHistoryAdded) {

  popup.querySelector('#edit-save').onclick = async () => {
    const qType = selType.value;
    const qText = popup.querySelector('#edit-q-text').value.trim();
    const explanationText = popup.querySelector('#edit-q-explanation').value.trim();
    const marksRaw = popup.querySelector('#edit-q-marks').value.trim();
    const levelVal = selLevel.value || '';
    const boardVal = popup.querySelector('#edit-q-board').value.trim();
    const chapterVal = popup.querySelector('#edit-q-chapter').value.trim();
    const qNoRaw = popup.querySelector('#edit-q-number').value.trim();
    if (!qText) { alert("Question text is required."); return; }

    const __oldSub = String((data && data.subject) || '').trim();
    let __newSub = __oldSub;

    if (__oldSub === 'Math 1' || __oldSub === 'Math 2') __newSub = 'Math';
    if (__oldSub === 'Math 1 IIT' || __oldSub === 'Math 2 IIT') __newSub = 'Math IIT';

    const __oldSeed = __qbBuildNumberSeed(data, {
      subject: __oldSub
    });

    const __newMarksValue = marksRaw === '' ? '' : Number(marksRaw);
    const __newSeed = __qbBuildNumberSeed(data, {
      board: boardVal || '',
      subject: __newSub || __oldSub || '',
      chapter: chapterVal || '',
      mcqType: qType,
      type: qType,
      marks: __newMarksValue,
      difficulty: levelVal || '',
      level: levelVal || ''
    });

    const updateObj = {
      question: qText,
      difficulty: levelVal || firebase.firestore.FieldValue.delete(),
      board: boardVal || firebase.firestore.FieldValue.delete(),
      chapter: chapterVal || firebase.firestore.FieldValue.delete(),
      explanation: explanationText || firebase.firestore.FieldValue.delete(),
      sectionKey: __qbGetSectionKey(__newSeed),
      workbookShuffledOptions: firebase.firestore.FieldValue.delete(),
      workbookShuffledAnswer: firebase.firestore.FieldValue.delete(),
      workbookShuffleSavedAt: firebase.firestore.FieldValue.delete(),
    };

    if (__newSub && __newSub !== __oldSub) updateObj.subject = __newSub;

    if (marksRaw === '') {
      updateObj.marks = firebase.firestore.FieldValue.delete();
    } else {
      const m = Number(marksRaw);
      if (Number.isNaN(m) || m < 0) { alert("Marks must be a positive number."); return; }
      updateObj.marks = m;
    }

    if (qNoRaw === '') {
      updateObj.questionNumber = firebase.firestore.FieldValue.delete();
    } else {
      const qn = Number(qNoRaw);
      if (!Number.isInteger(qn) || qn < 1) { alert("Question No. must be a positive integer."); return; }
      updateObj.questionNumber = qn;
    }

    if (qType === 'Descriptive' || qType === 'Fill in the Blanks') {
      updateObj.type = qType;
      updateObj.mcqType = firebase.firestore.FieldValue.delete();
      updateObj.options = firebase.firestore.FieldValue.delete();
      updateObj.body = qText;
      updateObj.text = qText;
      updateObj.parsedAnswer = firebase.firestore.FieldValue.delete();
    } else {
      const optA = popup.querySelector('#edit-q-optA').value.trim();
      const optB = popup.querySelector('#edit-q-optB').value.trim();
      const optC = popup.querySelector('#edit-q-optC').value.trim();
      const optD = popup.querySelector('#edit-q-optD').value.trim();
      const ans = popup.querySelector('#edit-q-answer').value.trim();
      if (!optA || !optB || !optC || !optD || !ans) {
        alert("For MCQ, all four options and the answer are required.");
        return;
      }
      updateObj.type = qType;
      updateObj.mcqType = qType;
      updateObj.options = [optA, optB, optC, optD];
      updateObj.parsedAnswer = ans;
    }

    try {
      await questionsDb.collection('questions').doc(docId).update(updateObj);

      const __oldSectionKey = __qbGetSectionKey(__oldSeed);
      const __newSectionKey = __qbGetSectionKey(__newSeed);
      const __oldBoard = String(__oldSeed.board || '');
      const __newBoard = String(__newSeed.board || '');
      const __oldSubject2 = String(__oldSeed.subject || '');
      const __newSubject2 = String(__newSeed.subject || '');
      const __oldChapter = String(__oldSeed.chapter || '');
      const __newChapter = String(__newSeed.chapter || '');

      await __qbRenumberSectionQuestions(__oldSeed);

      if (
        __oldSectionKey !== __newSectionKey ||
        __oldBoard !== __newBoard ||
        __oldSubject2 !== __newSubject2 ||
        __oldChapter !== __newChapter
      ) {
        await __qbRenumberSectionQuestions(__newSeed);
      }

      if (__editPopupHistoryAdded) {
        history.back();
      } else {
        __closeEditPopupFromCode();
      }

      fetchAndDisplayQuestions();
    } catch (err) {
      alert("Failed to save: " + err.message);
    }
  };
}

function __qbGetSectionKey(data = {}) {
  const rawType = String(
    data.mcqType ||
    data.type ||
    (Array.isArray(data.options) && data.options.length === 4 ? 'MCQ (Single)' : 'Descriptive')
  ).trim();

  const level = String(data.difficulty || data.level || '').trim() || 'Level 1';
  const levelKey = level.replace(/\s+/g, '_').toUpperCase();

  if (rawType === 'MCQ (Single)') return `MCQ_SINGLE_${levelKey}`;
  if (rawType === 'MCQ (Multiple)') return `MCQ_MULTIPLE_${levelKey}`;
  if (rawType === 'Fill in the Blanks') return `FILL_BLANKS_${levelKey}`;
  if (rawType === 'Assertion and Reason (MCQ Single)') return `ASSERTION_REASON_${levelKey}`;

  const marks = Number(data.marks || 0);
  return `DESCRIPTIVE_${marks}_${levelKey}`;
}

function __qbSortDocsForNumbering(a, b) {
  const da = a.data ? a.data() : a;
  const db = b.data ? b.data() : b;

  const qa = Number(da.questionNumber || 999999);
  const qb = Number(db.questionNumber || 999999);
  if (qa !== qb) return qa - qb;

  const ca = da.createdAt && typeof da.createdAt.toMillis === 'function' ? da.createdAt.toMillis() : 0;
  const cb = db.createdAt && typeof db.createdAt.toMillis === 'function' ? db.createdAt.toMillis() : 0;
  if (ca !== cb) return ca - cb;

  const ta = String(da.question || da.body || da.text || '').trim();
  const tb = String(db.question || db.body || db.text || '').trim();
  return ta.localeCompare(tb);
}

function __qbBuildNumberSeed(data = {}, overrides = {}) {

    type: overrides.type ?? data.type ?? '',
    marks: overrides.marks ?? data.marks ?? '',
    difficulty: overrides.difficulty ?? data.difficulty ?? data.level ?? '',
    level: overrides.level ?? data.level ?? ''
  };
}

async function __qbRenumberSectionQuestions(seedData = {}) {
  const classVal = String(seedData.class || '').trim();
  const boardVal = String(seedData.board || '').trim();
  const subjectVal = String(seedData.subject || '').trim();
  const chapterVal = String(seedData.chapter || '').trim();
  const sectionKey = __qbGetSectionKey(seedData);

  if (!classVal || !boardVal || !subjectVal || !sectionKey) return;

  let query = questionsDb.collection('questions')
    .where('class', '==', classVal)
    .where('board', '==', boardVal)
    .where('subject', '==', subjectVal)
    .where('sectionKey', '==', sectionKey);

  const snap = await query.get();
  if (snap.empty) return;

  const docs = snap.docs
    .filter(doc => String((doc.data() || {}).chapter || '').trim() === chapterVal)
    .slice()
    .sort(__qbSortDocsForNumbering);

  if (!docs.length) return;

  const batch = questionsDb.batch();

  docs.forEach((doc, idx) => {
    batch.update(doc.ref, {
      sectionKey: sectionKey,
      questionNumber: idx + 1
    });

    if (window.__pdfQuestionDataMap && window.__pdfQuestionDataMap[doc.id]) {
      window.__pdfQuestionDataMap[doc.id] = {
        ...window.__pdfQuestionDataMap[doc.id],
        sectionKey: sectionKey,
        questionNumber: idx + 1
      };
    }
  });

  await batch.commit();
}

async function __qbBackfillAllQuestionNumbers() {
  if (!currentUser) {
    alert('User not ready. Please refresh and login again.');
    return;
  }

  const ok = await appConfirm(
    'This will permanently renumber all saved questions in Firestore by:\n\n' +
    'Class + Board + Subject + Chapter + Section + Level\n\n' +
    'Do you want to continue?'
  );
  if (!ok) return;

  try {
    alert('Loading all questions for backfill...');

    const snap = await questionsDb.collection('questions').get();

    if (snap.empty) {
      alert('No questions found.');
      return;
    }

    const groups = new Map();

    snap.docs.forEach(doc => {
      const data = doc.data() || {};

      const classVal = String(data.class || '').trim();
      const boardVal = String(data.board || '').trim();
      const subjectVal = String(data.subject || '').trim();
      const chapterVal = String(data.chapter || '').trim();
      const sectionKey = __qbGetSectionKey(data);

      const groupKey = `${classVal}|||${boardVal}|||${subjectVal}|||${chapterVal}|||${sectionKey}`;

      if (!groups.has(groupKey)) {
        groups.set(groupKey, {
          classVal,
          boardVal,
          subjectVal,
          chapterVal,
          sectionKey,
          docs: []
        });
      }

      groups.get(groupKey).docs.push(doc);
    });

    let batch = questionsDb.batch();
    let opCount = 0;
    let updatedCount = 0;
    let groupCount = 0;

    for (const [, group] of groups) {
      const docs = group.docs.slice().sort(__qbSortDocsForNumbering);

      for (let i = 0; i < docs.length; i++) {
        const doc = docs[i];
        const qNo = i + 1;

        batch.update(doc.ref, {
          sectionKey: group.sectionKey,
          questionNumber: qNo
        });

        opCount++;
        updatedCount++;

        if (window.__pdfQuestionDataMap && window.__pdfQuestionDataMap[doc.id]) {
          window.__pdfQuestionDataMap[doc.id] = {
            ...window.__pdfQuestionDataMap[doc.id],
            sectionKey: group.sectionKey,
            questionNumber: qNo
          };
        }

        if (opCount >= 400) {
          await batch.commit();
          batch = questionsDb.batch();
          opCount = 0;
        }
      }

      groupCount++;
    }

    if (opCount > 0) {
      await batch.commit();
    }

    alert(
      'Backfill completed successfully.\n\n' +
      'Groups updated: ' + groupCount + '\n' +
      'Questions updated: ' + updatedCount
    );

    await fetchAndDisplayQuestions();
  } catch (err) {
    console.error('BACKFILL FAILED', err);
    alert('Backfill failed: ' + err.message);
  }
}

function __qbParseAnswerLetters(answer) {
  const raw = String(answer || '').toUpperCase().trim();
  if (!raw) return [];

  const normalized = raw
    .replace(/OPTION\s+/g, '')
    .replace(/\bAND\b/g, ',')
    .replace(/&/g, ',')
    .replace(/\//g, ',')
    .replace(/[()]/g, '')
    .replace(/\s+/g, ' ')
    .trim();

  const matches = normalized.match(/[A-D](?=\s*[\),.\-]|\s|,|$)/g) || [];

  return Array.from(new Set(matches)).sort();
}

function __qbGetOriginalAnswer(data) {
  return String(
    (data && (data.parsedAnswer || data.answer || data.parsedAns || '')) || ''
  ).trim();
}

function __qbHasWorkbookShuffle(data) {
  return !!(
    data &&
    Array.isArray(data.workbookShuffledOptions) &&
    data.workbookShuffledOptions.length === 4 &&
    __qbParseAnswerLetters(data.workbookShuffledAnswer).length > 0
  );
}

function __qbGetWorkbookOptions(data) {
  if (__qbHasWorkbookShuffle(data)) {
    return (data.workbookShuffledOptions || []).slice();
  }
  return Array.isArray(data && data.options) ? data.options.slice() : [];
}

function __qbGetWorkbookAnswer(data) {
  if (__qbHasWorkbookShuffle(data)) {
    return String(data.workbookShuffledAnswer || '').trim();
  }
  return __qbGetOriginalAnswer(data);
}

function __qbPickWeighted(weights) {
  const entries = Object.entries(weights).filter(([, w]) => Number(w) > 0);
  const total = entries.reduce((sum, [, w]) => sum + w, 0);

  if (!entries.length || total <= 0) {
    return Object.keys(weights)[0] || 'A';
  }

  let r = Math.random() * total;
  for (const [key, weight] of entries) {
    r -= weight;
    if (r <= 0) return key;
  }
  return entries[entries.length - 1][0];
}

function __qbChooseSmartSingleLetter(history = [], counts = { A: 0, B: 0, C: 0, D: 0 }) {
  const letters = ['A', 'B', 'C', 'D'];
  const weights = { A: 1, B: 1, C: 1, D: 1 };
  const minCount = Math.min(...letters.map(letter => Number(counts[letter] || 0)));

  const last1 = history[history.length - 1] || null;
  const last2 = history[history.length - 2] || null;
  const last3 = history[history.length - 3] || null;

  letters.forEach(letter => {
    const used = Number(counts[letter] || 0);
    weights[letter] -= Math.max(0, used - minCount) * 0.22;

    if (last1 === letter) weights[letter] -= 0.18;             // allow doubles sometimes
    if (last1 === letter && last2 === letter) weights[letter] -= 0.90; // avoid triple streak

    if (last3 && last2 && last1 && last3 === last1 && last2 === letter) {
      weights[letter] -= 0.34; // avoid ABAB-style pattern
    }

    if (weights[letter] < 0.08) weights[letter] = 0.08;
  });

  return __qbPickWeighted(weights);
}

function __qbGetLetterCombos(size) {
  const letters = ['A', 'B', 'C', 'D'];
  const result = [];

  function walk(start, picked) {
    if (picked.length === size) {
      result.push(picked.join(', '));
      return;
    }
    for (let i = start; i < letters.length; i++) {
      walk(i + 1, [...picked, letters[i]]);
    }
  }

  if (size < 1 || size > 4) return [];
  walk(0, []);
  return result;
}

function __qbChooseSmartCombo(history = [], counts = {}, size = 2) {
  const combos = __qbGetLetterCombos(size);
  if (!combos.length) return '';

  const weights = {};
  combos.forEach(combo => { weights[combo] = 1; });

  const minCount = Math.min(...combos.map(combo => Number(counts[combo] || 0)));
  const last1 = history[history.length - 1] || null;
  const last2 = history[history.length - 2] || null;
  const last3 = history[history.length - 3] || null;

  combos.forEach(combo => {
    const used = Number(counts[combo] || 0);
    weights[combo] -= Math.max(0, used - minCount) * 0.24;

    if (last1 === combo) weights[combo] -= 0.24;
    if (last1 === combo && last2 === combo) weights[combo] -= 0.90;

    if (last3 && last2 && last1 && last3 === last1 && last2 === combo) {
      weights[combo] -= 0.34;
    }

    if (weights[combo] < 0.08) weights[combo] = 0.08;
  });

  return __qbPickWeighted(weights);
}

function __qbStripOptionLabel(opt) {
  return String(opt || '').replace(/^[A-D][).\-]\s*/, '').trim();
}

function __qbShuffleQuestionToTargets(data, targetLetters) {
  const originalOptions = Array.isArray(data && data.options) ? data.options.slice() : [];
  if (originalOptions.length !== 4) return null;

  const originalAnswerLetters = __qbParseAnswerLetters(__qbGetOriginalAnswer(data));
  if (!originalAnswerLetters.length) return null;
  if (targetLetters.length !== originalAnswerLetters.length) return null;

  const cleanOptions = originalOptions.map(__qbStripOptionLabel);
  const correctIndexes = originalAnswerLetters.map(letter => letter.charCodeAt(0) - 65);
  const correctTexts = cleanOptions.filter((_, idx) => correctIndexes.includes(idx));
  const wrongTexts = cleanOptions.filter((_, idx) => !correctIndexes.includes(idx));

  const shuffledCorrectTexts = __qbShuffleArray(correctTexts);
  const shuffledWrongTexts = __qbShuffleArray(wrongTexts);

  const targetIndexes = targetLetters.map(letter => letter.charCodeAt(0) - 65);
  const newOptions = ['', '', '', ''];

  let c = 0;
  let w = 0;

  for (let i = 0; i < 4; i++) {
    if (targetIndexes.includes(i)) {
      newOptions[i] = shuffledCorrectTexts[c++] || '';
    } else {
      newOptions[i] = shuffledWrongTexts[w++] || '';
    }
  }

  return {
    options: newOptions.map((text, i) => `${String.fromCharCode(65 + i)}) ${text}`),
    answer: targetLetters.join(', ')
  };
}

async function __qbEnsureWorkbookShuffleForQuestionNodes(questionNodes = []) {
  const rawEntries = (questionNodes || [])
    .map(node => {
      const id = node.getAttribute('data-id');
      const data = (window.__pdfQuestionDataMap && id) ? window.__pdfQuestionDataMap[id] : null;
      return { node, id, data };
    })
    .filter(entry =>
      entry.id &&
      entry.data &&
      Array.isArray(entry.data.options) &&
      entry.data.options.length === 4
    );

  const eligibleEntries = rawEntries.filter(entry => {
    if (__qbHasWorkbookShuffle(entry.data)) return true;
    return __qbParseAnswerLetters(__qbGetOriginalAnswer(entry.data)).length > 0;
  });

  const savedEntries = eligibleEntries.filter(entry => __qbHasWorkbookShuffle(entry.data));
  const unsavedEntries = eligibleEntries.filter(entry => !__qbHasWorkbookShuffle(entry.data));

     if (!eligibleEntries.length) {
    await appInfo('No MCQ questions with valid answer letters were found for workbook shuffle.');
    return { didSaveNew: false, savedCount: 0, newlySavedCount: 0 };
  }

  if (!unsavedEntries.length) {
    await appInfo(
      `All selected MCQ questions are already shuffled and saved.\n\n` +
      `Eligible MCQs: ${eligibleEntries.length}\n` +
      `Already shuffled: ${savedEntries.length}`
    );
    return { didSaveNew: false, savedCount: savedEntries.length, newlySavedCount: 0 };
  }

  if (!savedEntries.length) {
    await appInfo(
      `MCQ options are being shuffled and saved for this workbook.\n\n` +
      `Eligible MCQs: ${eligibleEntries.length}\n` +
      `To shuffle now: ${unsavedEntries.length}\n\n` +
      `Click OK to continue.`
    );
  } else {
    await appInfo(
      `Some questions are already shuffled.\n\n` +
      `Already shuffled: ${savedEntries.length}\n` +
      `Remaining to shuffle now: ${unsavedEntries.length}\n\n` +
      `Click OK to continue.`
    );
  }
  const singleHistory = [];
  const singleCounts = { A: 0, B: 0, C: 0, D: 0 };

  const comboHistory = [];
  const comboCounts = {};

  for (const entry of eligibleEntries) {
    const answerLetters = __qbParseAnswerLetters(__qbGetWorkbookAnswer(entry.data));

    if (!answerLetters.length) continue;

    if (__qbHasWorkbookShuffle(entry.data)) {
      if (answerLetters.length === 1) {
        const one = answerLetters[0];
        singleHistory.push(one);
        singleCounts[one] = Number(singleCounts[one] || 0) + 1;
      } else {
        const comboKey = answerLetters.join(', ');
        comboHistory.push(comboKey);
        comboCounts[comboKey] = Number(comboCounts[comboKey] || 0) + 1;
      }
    }
  }

  const saveTasks = [];

  for (const entry of eligibleEntries) {
    if (__qbHasWorkbookShuffle(entry.data)) continue;

    const originalLetters = __qbParseAnswerLetters(__qbGetOriginalAnswer(entry.data));
    if (!originalLetters.length) continue;

    let targetLetters = [];

    if (originalLetters.length === 1) {
      const chosen = __qbChooseSmartSingleLetter(singleHistory, singleCounts);
      targetLetters = [chosen];
      singleHistory.push(chosen);
      singleCounts[chosen] = Number(singleCounts[chosen] || 0) + 1;
    } else {
      const comboKey = __qbChooseSmartCombo(comboHistory, comboCounts, originalLetters.length);
      targetLetters = comboKey.split(',').map(x => x.trim()).filter(Boolean);

      if (!targetLetters.length) continue;

      comboHistory.push(comboKey);
      comboCounts[comboKey] = Number(comboCounts[comboKey] || 0) + 1;
    }

    const shuffled = __qbShuffleQuestionToTargets(entry.data, targetLetters);
    if (!shuffled) continue;

    saveTasks.push(
      questionsDb.collection('questions').doc(entry.id).update({
        workbookShuffledOptions: shuffled.options,
        workbookShuffledAnswer: shuffled.answer,
        workbookShuffleSavedAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        if (window.__pdfQuestionDataMap && window.__pdfQuestionDataMap[entry.id]) {
          window.__pdfQuestionDataMap[entry.id] = {
            ...window.__pdfQuestionDataMap[entry.id],
            workbookShuffledOptions: shuffled.options,
            workbookShuffledAnswer: shuffled.answer
          };
        }
      })
    );
  }

  await Promise.all(saveTasks);

  return {
    didSaveNew: saveTasks.length > 0,
    savedCount: savedEntries.length,
    newlySavedCount: saveTasks.length
  };
}

function __qbExtractSubtopicsLine(raw) {
  const src = String(raw || '').replace(/\r/g, '').trim();

  let match = src.match(/\(\s*SUBTOPICS?\s*:\s*([\s\S]*?)\)\s*$/i);

  if (!match) {
    match = src.match(/\bSUBTOPICS?\s*:\s*([\s\S]*)$/i);
  }

  let subtopics = match ? String(match[1] || '') : '';

  subtopics = subtopics
    .replace(/[•*]/g, '')
    .replace(/\n+/g, ' | ')
    .replace(/\s*[,;]\s*/g, ' | ')
    .replace(/\s*\|\s*/g, ' | ')
    .replace(/\s+/g, ' ')
    .replace(/\|\s*\|/g, '|')
    .replace(/^(\||-|:)+|(\||-|:)+$/g, '')
    .trim();

  return subtopics;
}

function __qbSplitChapterDisplay(raw) {
  const src = String(raw || '').replace(/\r/g, '').trim();

  if (!src) {
    return { mainTitle: 'UNSPECIFIED', assimilationTitle: '' };
  }

  // Remove inline "(SUBTOPICS: ...)" block if present
  let cleaned = src
    .replace(/\(\s*SUBTOPICS?\s*:[\s\S]*?\)\s*$/i, '')
    .replace(/\bSUBTOPICS?\s*:[\s\S]*$/i, '')
    .trim();

  const lines = cleaned
    .split('\n')
    .map(s => s.trim())
    .filter(Boolean)
    .filter(line => !/^[•*-]\s*/.test(line));

  let assimilationTitle = '';
  let mainTitle = '';

  const inlineAssimMatch = cleaned.match(/^(.*?)[\s:–-]+(Assimilation\s*\d+\b.*)$/i);

  if (inlineAssimMatch) {
    mainTitle = inlineAssimMatch[1].trim();
    assimilationTitle = inlineAssimMatch[2].trim();
  } else {
    const assimLine = lines.find(line => /^Assimilation\s*\d+\b/i.test(line));
    if (assimLine) {
      assimilationTitle = assimLine.match(/^Assimilation\s*\d+\b/i)?.[0] || assimLine;
    }

    mainTitle =
      lines.find(line =>
        !/^Assimilation\s*\d+\b/i.test(line) &&
        !/^SUBTOPICS?\s*:/i.test(line)
      ) || '';
  }

  mainTitle = mainTitle
    .replace(/\(\s*SUBTOPICS?\s*:[\s\S]*$/i, '')
    .replace(/\bSUBTOPICS?\s*:[\s\S]*$/i, '')
    .replace(/\s*[:\-]\s*$/, '')
    .trim();
  return {
    mainTitle: mainTitle || 'UNSPECIFIED',
    assimilationTitle: assimilationTitle || ''
  };
}

function __qbQuestionNumberWidth(qNum) {
  const text = String(qNum || '').trim();
  const len = text.length;

  if (len >= 5) return 60;   // example: Q108.
  if (len === 4) return 52;  // example: 108.
  if (len === 3) return 46;  // example: 99.
  return 36;                 // example: 1. / 25.
}

function __qbEscapeHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function __qbFormatOptionForPrint(opt, forceMathTheme = null) {
  const s = String(opt || '').trim();
  const m = s.match(/^([A-D]\))\s*(.*)$/);

  const __currentSubject = String(
    document.getElementById('subject-value')?.value ||
    document.getElementById('subject-dropdown')?.querySelector('.selected-option')?.textContent ||
    ''
  ).toLowerCase().trim();

  const __localIsMathTheme =
    typeof forceMathTheme === 'boolean'
      ? forceMathTheme
      : (
          __currentSubject === 'math' ||
          __currentSubject === 'mathematics' ||
          __currentSubject === 'math iit' ||
          __currentSubject === 'math 1' ||
          __currentSubject === 'math 2' ||
          __currentSubject === 'mathematics (mains)' ||
          __currentSubject === 'mathematics (advance)'
        );

  const __optColor = '#000000';

  if (!m) {
    return `<span style="color:${__optColor};font-weight:400;">${s}</span>`;
  }

  return `<span style="color:${__optColor};font-weight:600;">${m[1]}</span> <span style="color:${__optColor};font-weight:400;">${m[2]}</span>`;
}
function __qbNormalizeOptions(options) {
  if (!Array.isArray(options)) return [];
  return options.map((opt, i) => {
    const clean = String(opt || '').replace(/^[A-D][).]\s*/, '').trim();
    return `${String.fromCharCode(65 + i)}) ${clean}`;
  });
}

function __qbShuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function __qbShuffleQuestionOptions(questionObj) {
  if (!questionObj || !Array.isArray(questionObj.options) || questionObj.options.length !== 4) {
    return questionObj;
  }

  const rawOptions = questionObj.options.map(opt =>
    String(opt || '').replace(/^[A-D][).]\s*/, '').trim()
  );

  const originalAnswer = String(questionObj.answer || '').toUpperCase().replace(/\s+/g, '');
  const answerLetters = originalAnswer
    .split(',')
    .map(x => x.trim())
    .filter(x => /^[A-D]$/.test(x));

  const indexed = rawOptions.map((text, index) => ({
    oldLetter: String.fromCharCode(65 + index),
    text
  }));

  const shuffled = __qbShuffleArray(indexed);

  const newOptions = shuffled.map((item, idx) => {
    return `${String.fromCharCode(65 + idx)}) ${item.text}`;
  });

  const newAnswerLetters = shuffled
    .map((item, idx) => answerLetters.includes(item.oldLetter) ? String.fromCharCode(65 + idx) : null)
    .filter(Boolean);

  return {
    ...questionObj,
    options: newOptions,
    answer: newAnswerLetters.join(', ')
  };
}

async function __qbLoadTeacherSections() {
  const snap = await db.collection('sections')
    .where('createdBy', '==', currentUser.uid)
    .get();
  const sections = [];
  snap.forEach(doc => {
    const d = doc.data() || {};
    sections.push({
      id: doc.id,
      className: d.className || '',
      sectionName: d.sectionName || '',
      label: `${d.className || ''} - ${d.sectionName || ''}`
    });
  });

  sections.sort((a, b) => {
    const classCompare = String(a.className || '').localeCompare(String(b.className || ''));
    if (classCompare !== 0) return classCompare;
    return String(a.sectionName || '').localeCompare(String(b.sectionName || ''));
  });

  return sections;
}

          Select Questions Manually
        </button>

        <button id="quiz-mode-random" style="
          width:100%;padding:12px 14px;margin-bottom:14px;
          border:1.5px solid #0f8b6d;border-radius:10px;background:#fff;color:#0f8b6d;
          font-weight:700;cursor:pointer;">
          Randomly Choose by Count
        </button>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">
          <label style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.2px solid #d9e6f5;border-radius:10px;background:#f9fcff;cursor:pointer;text-align:left;">
            <input id="quiz-shuffle-question-order" type="checkbox">
            <span style="font-weight:600;color:#12416c;">Shuffle Question Order</span>
          </label>
          <label style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.2px solid #d9e6f5;border-radius:10px;background:#f9fcff;cursor:pointer;text-align:left;">
            <input id="quiz-shuffle-options" type="checkbox">
            <span style="font-weight:600;color:#12416c;">Shuffle MCQ Options</span>
          </label>
        </div>

        <button id="quiz-mode-cancel" style="
          width:100%;padding:11px 14px;
          border:none;border-radius:10px;background:#eef3f9;color:#35506b;
          font-weight:600;cursor:pointer;">
          Cancel
        </button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);

  const closeModal = () => modal.remove();

  document.getElementById('quiz-mode-cancel').onclick = function() {
    closeModal();
  };

 function __saveQuizModeSettings(mode, randomCount = null) {
    const shuffleQuestionEl = document.getElementById('quiz-shuffle-question-order');
    const shuffleOptionsEl = document.getElementById('quiz-shuffle-options');

    window.__quizSelectionMode = mode;
    window.__quizRandomCount = randomCount;
    window.__quizShuffleQuestionOrder = !!(shuffleQuestionEl && shuffleQuestionEl.checked);
    window.__quizShuffleOptions = !!(shuffleOptionsEl && shuffleOptionsEl.checked);
  }
  document.getElementById('quiz-mode-all').onclick = function() {
    closeModal();
    __saveQuizModeSettings('all', null);
    document.getElementById('quiz-spinner').style.display = 'flex';
    setTimeout(() => {
      document.getElementById('quiz-spinner').style.display = 'none';
      document.getElementById('create-quiz-btn').click();
    }, 100);
  };

  document.getElementById('quiz-mode-manual').onclick = function() {
    closeModal();
    __saveQuizModeSettings('manual', null);
    fetchAndDisplayQuestions();
    setTimeout(() => {
      alert('Now tick the questions you want, then click Create Practice Quiz again.');
    }, 250);
  };

  document.getElementById('quiz-mode-random').onclick = async function() {
    if (!totalDisplayed) {
      closeModal();
      alert('No questions are available to choose randomly.');
      return;
    }

    const raw = await appPrompt('How many questions do you want to choose randomly?\n\nAvailable: ' + totalDisplayed, '');
    if (raw === null) return;

    const count = Number(raw);
    if (!Number.isInteger(count) || count < 1) {
      alert('Please enter a valid positive number.');
      return;
    }
    if (count > totalDisplayed) {
      alert('You entered more than available questions.');
      return;
    }

    closeModal();
    __saveQuizModeSettings('random', count);
    document.getElementById('quiz-spinner').style.display = 'flex';
    setTimeout(() => {
      document.getElementById('quiz-spinner').style.display = 'none';
      document.getElementById('create-quiz-btn').click();
    }, 100);
  };
}

// --- Create Practice Quiz Button Handler ---
document.getElementById('create-quiz-btn').addEventListener('click', async function() {
  if (!window.__quizSelectionMode) {
    showQuizSelectionModePopup();
    return;
  }

  const spinner = document.getElementById('quiz-spinner');
  spinner.style.display = 'flex';

  try {
    const displayArea = document.getElementById('questions-display-area');
    const allNodes = Array.from(displayArea.querySelectorAll('.question-item'));
    let nodes = allNodes;

    if (window.__quizSelectionMode === 'manual') {
      nodes = allNodes.filter(item => {
        const cb = item.querySelector('.quiz-question-checkbox');
        return cb && cb.checked;
      });
    }

    if (window.__quizSelectionMode === 'random') {
      const shuffled = __qbShuffleArray(allNodes);
      nodes = shuffled.slice(0, Number(window.__quizRandomCount || 0));
    }

    if (window.__quizSelectionMode === 'all' && window.__quizShuffleQuestionOrder) {
      nodes = __qbShuffleArray(nodes);
    }
    if (window.__quizSelectionMode === 'manual' && window.__quizShuffleQuestionOrder) {
      nodes = __qbShuffleArray(nodes);
    }
    if (window.__quizSelectionMode === 'random' && window.__quizShuffleQuestionOrder) {
      nodes = __qbShuffleArray(nodes);
    }

    if (nodes.length < 1) {
      alert(
        window.__quizSelectionMode === 'manual'
          ? "Please select at least one question for this quiz!"
          : "No questions found for this quiz!"
      );
      window.__quizSelectionMode = null;
      window.__quizRandomCount = null;
      window.__quizShuffleQuestionOrder = false;
      window.__quizShuffleOptions = false;
      updateManualQuizToolbar();
      spinner.style.display = 'none';
      return;
    }

    const confirmMsg =
      window.__quizSelectionMode === 'manual'
        ? `Total available: ${allNodes.length}\nSelected: ${nodes.length}\n\nCreate quiz with selected questions?`
        : window.__quizSelectionMode === 'random'
          ? `Total available: ${allNodes.length}\nRandomly selected: ${nodes.length}\n\nCreate quiz now?`
          : `Total available: ${allNodes.length}\nSelected: ${nodes.length}\n\nCreate quiz with all displayed questions?`;

    if (!(await appConfirm(confirmMsg))) {
      spinner.style.display = 'none';
      return;
    }

    const questions = [];
    for (const item of nodes) {
      const docId = item.getAttribute('data-id');
      if (!docId) continue;

      const snap = await questionsDb.collection('questions').doc(docId).get();
      const data = snap.data() || {};

                 let qObj = {
        questionId: docId,
        question: data.question || data.body || data.text || '',
        options: __qbNormalizeOptions(__qbGetWorkbookOptions(data)),
        answer: __qbGetWorkbookAnswer(data),
        explanation: data.explanation || data.solution || data.explain || '',
        level: data.difficulty || data.level || '',
        marks: Number(data.marks || 0),
        chapter: data.chapter || '',
        type: data.mcqType || data.type || (Array.isArray(data.options) && data.options.length === 4 ? 'MCQ (Single)' : 'Descriptive'),
        board: data.board || '',
        subject: data.subject || '',
        image: data.image || '',
        originalQuestionNumber: data.questionNumber ?? null
      };
      if (window.__quizShuffleOptions) {
        qObj = __qbShuffleQuestionOptions(qObj);
      }

      questions.push(qObj);
    }

    if (!questions.length) {
      alert('No valid questions were prepared for this quiz.');
      spinner.style.display = 'none';
      return;
    }

    const classVal = document.getElementById('class-value').value || '';
    const boardVal = document.getElementById('board-value').value || '';
    const subjectVal = document.getElementById('subject-value').value || '';
    const chapterVal = (getMultiSelected('chapter').join(', ') || 'All');
    const levelVal = (getMultiSelected('level').join(', ') || 'Mixed');
    const qtypeVal = (getMultiSelected('qtype').join(', ') || 'All');
    const marksVal = (getMultiSelected('marks').join(', ') || 'All');

    const schoolName = await appPrompt("Enter School Name", "SciMentra");
    if (schoolName === null) {
      spinner.style.display = 'none';
      return;
    }
    const finalSchoolName = (schoolName || '').trim() || 'SciMentra';

    const quizTitleInput = await appPrompt("Enter Quiz Title", `${subjectVal} Practice Quiz`);
    if (quizTitleInput === null) {
      spinner.style.display = 'none';
      return;
    }
    const finalQuizTitle = (quizTitleInput || '').trim() || `${subjectVal} Practice Quiz`;

    const quizPayload = {
      createdBy: currentUser.uid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      schoolName: finalSchoolName,
      quizTitle: finalQuizTitle,
      class: classVal,
      board: boardVal,
      subject: subjectVal,
      chapter: chapterVal,
      level: levelVal,
      questionType: qtypeVal,
      marksFilter: marksVal,
      selectionMode: window.__quizSelectionMode || 'all',
      randomCount: window.__quizSelectionMode === 'random' ? Number(window.__quizRandomCount || 0) : null,
      shuffleQuestionOrder: !!window.__quizShuffleQuestionOrder,
      shuffleOptions: !!window.__quizShuffleOptions,
      totalAvailableBeforeSelection: allNodes.length,
      totalQuestions: questions.length,
      questions: questions,
      assignmentReady: true
    };

    const assignmentSettings = await __qbOpenAssignmentPopup(quizPayload);
    if (!assignmentSettings) {
      spinner.style.display = 'none';
      return;
    }

    const quizDoc = await db.collection('quizzes').add({
      ...quizPayload,
      quizStatus: assignmentSettings.quizStatus,
      startTime: assignmentSettings.startTime || null,
      endTime: assignmentSettings.endTime || null,
      durationMinutes: assignmentSettings.durationMinutes || null,
      attemptRule: assignmentSettings.attemptRule || 'single',
      allowLeaderboard: !!assignmentSettings.allowLeaderboard,
      autoSubmitEnabled: !!assignmentSettings.autoSubmitEnabled,
      assignedSectionIds: assignmentSettings.assignedSections.map(x => x.sectionId),
      assignedSections: assignmentSettings.assignedSections
    });

    const quizId = quizDoc.id;
    const assignmentLinks = [];

    for (const sec of assignmentSettings.assignedSections) {
      const assignmentDoc = await db.collection('quizAssignments').add({
        createdBy: currentUser.uid,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        quizId: quizId,
        schoolName: finalSchoolName,
        quizTitle: finalQuizTitle,
        class: classVal,
        board: boardVal,
        subject: subjectVal,
        chapter: chapterVal,
        level: levelVal,
        totalQuestions: questions.length,
        sectionId: sec.sectionId,
        className: sec.className,
        sectionName: sec.sectionName,
        quizStatus: assignmentSettings.quizStatus,
        startTime: assignmentSettings.startTime || null,
        endTime: assignmentSettings.endTime || null,
        durationMinutes: assignmentSettings.durationMinutes || null,
        attemptRule: assignmentSettings.attemptRule || 'single',
        allowLeaderboard: !!assignmentSettings.allowLeaderboard,
        autoSubmitEnabled: !!assignmentSettings.autoSubmitEnabled,
        isActive: assignmentSettings.quizStatus !== 'closed'
      });

      const assignmentId = assignmentDoc.id;
      const quizLink = `${window.location.origin}/QBank/quiz.html?quiz=${encodeURIComponent(quizId)}&assignment=${encodeURIComponent(assignmentId)}`;

      await assignmentDoc.update({
        assignmentLink: quizLink
      });

      assignmentLinks.push({
        assignmentId,
        className: sec.className,
        sectionName: sec.sectionName,
        link: quizLink
      });
    }

    __qbOpenShareModal({
      schoolName: finalSchoolName,
      quizTitle: finalQuizTitle,
      className: classVal,
      subjectName: subjectVal,
      chapterName: chapterVal,
      levelName: levelVal,
      totalQuestions: questions.length,
      assignmentLinks
    });

    if (window.__quizSelectionMode === 'manual') {
      document.querySelectorAll('.quiz-question-checkbox').forEach(cb => cb.checked = false);
    }

    window.__quizSelectionMode = null;
    window.__quizRandomCount = null;
    window.__quizShuffleQuestionOrder = false;
    window.__quizShuffleOptions = false;
    updateManualQuizToolbar();

  } catch (err) {
    alert("Quiz creation failed: " + err.message);
  }

  spinner.style.display = 'none';
});
  </script>

  <!-- Quiz Creation Spinner -->
  <div id="quiz-spinner" style="
    display:none; position:fixed; top:0; left:0; width:100vw; height:100vh;
    background:rgba(0, 0, 0, 0.15); z-index:9999; align-items:center; justify-content:center;">
    <div style="
      background:#fff; padding:32px 28px; border-radius:18px; box-shadow:0 4px 24px #0f3d6b25;
      display:flex; flex-direction:column; align-items:center;">
      <i class="fa fa-spinner fa-spin" style="font-size:2.6em;color:#1762a7;margin-bottom:12px;"></i>
      <span style="color:#1762a7;font-weight:bold;font-size:1.13em;">Creating Quiz... Please wait</span>
    </div>
  </div>
</body>
